tag: SG0000004W
kind: definition
title: Alterations
statement: An alteration is a proper dominant morphism $f \colon X' \to X$ of integral schemes that is finite over a nonempty open subset of $X$. The identity and a composite of alterations are alterations, and a proper morphism that is an isomorphism over a nonempty open subset is an alteration. A resolution of an integral scheme is an alteration.

notes: This is the definition of [dJ96, 2.20], except that the Lean definition does not ask for a Noetherian target. The Lean file is Singularity/Alteration of tamnd/singularity-lean#104, with Singularity.IsAlteration.id, Singularity.IsAlteration.comp, Singularity.IsAlteration.of_isIso_restrict and Singularity.IsResolution.isAlteration. The bridge Singularity.regularAlterationInDim_of_resolutionInDim says that resolution in dimension n gives regular alterations in dimension n.

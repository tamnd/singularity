notes: This is Volume 7, Section 3.6 of the handbook. The invariant omega is Volume 6, Definition 3.2.5, after [CP19, Definition 2.68]. The independence of the coordinates is [CP19, Remark 2.69] in this case. [CP19, Theorem 3.13] gives the non-increase of the invariant iota under condition (E). The node SG0000004R gives a blowup in a regular center at which omega goes up from 2 to 3, and condition (E) fails there.

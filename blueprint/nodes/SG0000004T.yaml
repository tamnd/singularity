tag: SG0000004T
kind: theorem
title: The log-Jacobian order is the invariant omega of Cossart-Piltant
statement: Let $k$ be perfect, $S = k[[u_1, \dots, u_n]]$, $E = \operatorname{div}(u_1 \cdots u_e)$ and $h = Z^p + f$ with $f$ clean and $m(x) = p$. Then $\omega(x) = \rho(f)$, the residual order of the log-Jacobian ideal of SG0000003F. So $\omega(x)$ depends only on $S$, $h$ and $E$. For $k$ algebraically closed, $\omega$ does not go up under a point blowup (SG0000003N) or under the blowup of a regular center that satisfies (H1) and (H2) (SG0000004Q), in each dimension and without condition (E).
sources:

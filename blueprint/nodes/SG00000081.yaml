tag: SG00000081
kind: lemma
title: A small completed local degree forces separability
statement: 'Let $k$ be a field of characteristic $p > 0$ and $R$ a normal local domain, essentially of finite type over $k$, with fraction field $K$. Let $K^*$ be the fraction field of the completion $R^*$. Let $L/K$ be a finite extension, $T$ the integral closure of $R$ in $L$, $\mathfrak{m}$ a maximal ideal of $T$, $S = T_{\mathfrak{m}}$, and $L^*$ the fraction field of the completion $S^*$. If $[L^* : K^*] < p$, then $L/K$ is separable.'

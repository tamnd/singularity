notes: 'Lemma 3.2 of research note 56. It is a standard lemma: the inseparable degree of $L/K$ divides each completed local degree. The proof writes $L \otimes_K K^*$ as the product of the fraction fields of the completions of the localizations of $T$, and shows that each factor has degree divisible by $[L : L_s]$, where $L_s$ is the separable closure of $K$ in $L$. It makes explicit the separability of $L/K$ that [Cut09] Theorem 14.4 uses without a statement: the discriminant in that proof is nonzero only if the generators are separable (note 62, Section 2.2). Handbook Volume 9, Section 3.21. Planned for Lean.'

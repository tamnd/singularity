tag: SG00000042
kind: theorem
title: Principalization in characteristic 0
statement: Let $X$ be a smooth variety over a field of characteristic 0, let $I \subseteq \mathcal{O}_X$ be an ideal sheaf that is nonzero on each irreducible component, and let $E$ be a divisor with simple normal crossings on $X$. Then there is a composite of blowups $\Pi \colon X_r \to \dots \to X_0 = X$ with smooth centers $Z_i \subseteq X_i$ such that each $Z_i$ has simple normal crossings with the sum $E_i$ of the strict transform of $E$ and the inverse images of the earlier centers, the image of each $Z_i$ in $X$ lies in the cosupport $V(I)$, and $\Pi^* I = \mathcal{O}_{X_r}(-G)$ for a divisor $G \ge 0$ supported on the exceptional divisors. In particular $\Pi^* I$ is locally principal and $\Pi$ is an isomorphism over $X \setminus V(I)$.

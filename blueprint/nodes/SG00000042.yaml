notes: 'Here $\Pi^* I$ is the inverse image ideal sheaf. The theorem with $E = \emptyset$ gives the first and the second forms of principalization, Volume 2, Theorems 1.1.5 and 1.1.6 of the handbook, and the theorem is the third form, Theorem 1.1.7. The proof is Theorem 3.3.11 of Volume 2: apply order reduction for marked ideals SG00000049 with the mark 1. The proof follows [Kol07, Chapter 3]. No Lean statement yet.'

notes: This is Corollary 3.17.12 of Volume 7 of the handbook (Section 3.17). So the analogues of Theorem 3.15.17 (SG00000067) and of Proposition 3.15.10 (SG00000064) are false for $n = 4$, and SG0000006Q is false. The runs lie on the strict transforms of $V(x)$, and Question 3.13.18 has a positive answer for them, since the corner curves $V(x_m, w_m, y_m)$ and $V(x_m, w_m, z_m)$ have $\nu^G \ge 1$. It is Corollary 5.4 of note 38 of the research notes, with the corrections of note 39. The result is not in Lean.

tag: SG0000006T
kind: counterexample
title: A corner run in four variables can keep rho with an infinite number of nonzero translations
statement: Let $p \ge 3$, $n = 4$, $\Delta = V(y) \cup V(z)$ and $g = x^2 y^{p-2} z^{p-2} + w y^p z^p$. Each word in the two charts with each chart an infinite number of times, with $a_m = 0$ and any $b_m \in K$, is a corner run in four variables with $\rho = 1$ at each point. If an infinite number of the $b_m$ are not $0$, the run has an infinite number of nonzero translations in each free coordinate system, and no point of the run is cylindrical. For $g = x^2 y^{p-2} z^{p-2} + x w y^p z^p$ with an infinite number of $b_m \ne 0$, neither $\partial_x g_m$ nor $\partial_w g_m$ is a monomial times a unit at any point, in the coordinates of the run.

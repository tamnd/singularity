notes: 'This is Proposition 6.4'' of the referee report in note 73 on research note 58. It holds for each $H$. The hypothesis is a second torus symmetry: $\delta$ commutes with the scaling of $v_1$. Without it, the chart $D_+(u)$ of the same blowup carries a family over $\mathbb{A}^1_{v_1''}$ of threefold foliations that degenerates at $v_1'' = 0$ to the normal linearization of $\delta$ along $V(v_1)$, and Posva''s theorems say nothing about families. Handbook Volume 9, Section 3.22. Not in Lean.'

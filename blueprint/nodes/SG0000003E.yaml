tag: SG0000003E
kind: definition
title: The log-Jacobian ideal
statement: Let $K$ be a field of characteristic $p > 0$, let $F \in K[x_1, \dots, x_n]$ and let $\Delta \subseteq \{1, \dots, n\}$. The log-Jacobian ideal of $F$ for the divisor $\prod_{i \in \Delta} x_i = 0$ is $\Theta(F) = (x_i \partial_i F \ (i \in \Delta), \ \partial_j F \ (j \notin \Delta))$. For each $h$, $\Theta(F + h^p) = \Theta(F)$.

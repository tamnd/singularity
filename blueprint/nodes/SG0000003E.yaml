notes: In Lean the ideal is Singularity.logJacobian. The ideal is the image of $F$ under the logarithmic derivations. It does not depend on the choice of $z$ in $z^p + F$. For a base of dimension 3 it is the ideal of the thesis of Cossart [Cos87]. The transformation law under blowups is in [Pos24, Appendix A], and it is SG0000003M. For a polynomial $u$ with $u(0) \ne 0$, $\Theta(u^p F)$ and $\Theta(F)$ have the same image in the local ring of $k[x]$ at the origin (Singularity.map_logJacobian_pow_mul_of_constantCoeff_ne_zero, tamnd/singularity-lean#200). This is part 2 of Lemma 3.6 of research note 03 for the units that are polynomials. The units of $K[[x]]$ that are not polynomials and the independence of the coordinates are not in Lean.

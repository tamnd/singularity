notes: In Lean the ideal is Singularity.logJacobian. The ideal is the image of $F$ under the logarithmic derivations. It does not depend on the choice of $z$ in $z^p + F$. For a base of dimension 3 it is the ideal of the thesis of Cossart [Cos87]. The transformation law under blowups is in [Pos24, Appendix A], and the library does not prove it yet.

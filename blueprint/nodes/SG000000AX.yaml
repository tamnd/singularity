tag: SG000000AX
kind: counterexample
title: 'A rank 2 valuation with value group Z^2 and d = 1 that is not of Knaf-Kuhlmann type'
statement: 'Let $k$ be algebraically closed of characteristic $p$ and $F = k(x_1, \dots, x_4)$. There is a valuation $\nu = v_1 \circ \bar v$ of $F$, trivial on $k$, with $\nu F = \mathbb{Z}^2$ lexicographic, $F\nu = k$ and $\mathrm{trdeg}(F v_1 / k) = 1$, that is not of KK type. One can take $F v_1 = \kappa = k(z, (1 + z)^{1/\ell} : \ell \text{ prime}, \ell \ne p) \subset k((z))$ and $\bar v$ the $z$-adic valuation.'
sources:
- paper: Kuh10c
  loc: 'Theorem 1.1'
uses:

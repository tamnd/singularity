tier: T2
route:
- R2
notes: 'This is Proposition 1.1 of the referee report in note 80. It shows that Proposition 2.1(b) of research note 76 is false without the hypothesis of SG000000AT. The field $\kappa$ is countably generated of transcendence degree 1 and is not finitely generated, because each prime $\ell \ne p$ divides a degree over $k(z)$. Theorem 1.1 of [Kuh10c] with $\rho = 1$, $\tau = 1$ and $n = 4$ gives $v_1$. If $F \subseteq F_0^c$ with $\nu|_{F_0}$ Abhyankar, the two Abhyankar inequalities for $v_1$ and $\bar v$ add up to the one for $\nu$, so $v_1|_{F_0}$ is Abhyankar and $F_0 v_1 = \kappa$ is finitely generated, a contradiction. The same method with $\tau = 2$ gives examples with $d = 2$. Local uniformization of these valuations is open (SG000000BD). Handbook Volume 9, Section 3.23. The result is not in Lean.'

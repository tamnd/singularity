tier: T6
route:
- R2
notes: 'This is $\mathrm{PILU}_4$, Definition 2.3 of research note 02. With SG0000001G it implies the affine form of local uniformization SG0000001H (note 02, Theorem 2.6), and SG000000BT shows that it is also necessary for resolution. The reduction from the local core of route V in note 77, Proposition 77.12, has a gap that the referee report in note 82 found, so this node does not use it. It is open. Handbook Volume 9, Section 3.24. The result is not in Lean.'

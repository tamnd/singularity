tag: SG000000BR
kind: conjecture
title: 'The purely inseparable step of local uniformization in dimension 4'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$. Let $A$ be a regular local ring, essentially of finite type over $k$, whose fraction field $L$ has transcendence degree 4 over $k$. Let $a \in A$ with $b = a^{1/p} \notin L$, and let $v$ be a valuation of $L(b)/k$ that dominates $A$. Then there is a regular local ring $A'' \subset L(b)$, essentially of finite type over $k$, with fraction field $L(b)$, dominated by $\mathcal{O}_v$, such that $A[b] \subseteq A''$.'
sources:
- paper: Tem13
  loc: 'Remark 1.3.5'

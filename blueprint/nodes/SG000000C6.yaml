notes: 'Proposition 83.13 of research note 83, with its remarks. The referee report in note 87 checked each case of Step 6 and confirms the proposition and Remark (1). Step 6 of the proof uses Claim A only through (A$^{\rm w}$). If $V_0$ in SG000000C5 is replaced by a toric resolution that keeps $D$ and $\sigma_0$, then (A$^{\rm w}$) holds and Claim A still fails. In SG000000C5 itself, with the choice $J = \mathcal{O}$ in Step 2, (A$^{\rm w}$) fails, because each such $\tilde U_2$ contains the generic point of $V(\sigma_0)$, whose closure contains the singular point $z$ over a regular point of $V_1$. Note 87 corrects Remark (2) of note 83 (Fix 8): this shows only that the sufficient condition (A$^{\rm w}$) fails. Whether Steps 5 and 6, run on SG000000C5 with some choices, still give a good model is open. The proposition still holds if $V_2$ is replaced by a normal modification on which the valuations of $L$ keep regular centers (SG000000CF), and Steps 2, 3 and 5 need only the weak form of SG000000BV (SG000000CC). Handbook Volume 9, Sections 3.24 and 3.25. The result is not in Lean.'

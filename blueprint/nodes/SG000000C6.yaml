notes: 'Proposition 83.13 of research note 83, with its remarks. This result is new in note 83, and a second referee has not read it yet. Step 6 of the proof uses Claim A only through (A$^{\rm w}$). If $V_0$ in SG000000C5 is replaced by a toric resolution that keeps $D$ and $\sigma_0$, then (A$^{\rm w}$) holds and Claim A still fails. In SG000000C5 itself (A$^{\rm w}$) fails, because each such $\tilde U_2$ contains the generic point of $V(\sigma_0)$, whose closure contains the singular point $z$ over a regular point of $V_1$. So no hypothesis on the principalization of Step 3 and no choice of $\tilde U_2$ make Steps 5 and 6 of the proof work in dimension 4. Handbook Volume 9, Section 3.24. The result is not in Lean.'

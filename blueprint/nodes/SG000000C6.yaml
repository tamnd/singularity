tag: SG000000C6
kind: theorem
title: 'The weakest form of Claim A that the patching proof needs'
statement: 'In the proof of SG000000C1, replace Claim A by the condition (A$^{\rm w}$): there is an open set $\tilde U_2$ with $L \subseteq \tilde U_2 \subseteq U_2 = \mathrm{Reg}\, V_2$ such that $\overline{\Phi \cap \tilde U_2} \cap \alpha^{-1}(\mathrm{Reg}\, V_1) \subseteq \tilde U_2$. Then SG000000BV and (A$^{\rm w}$), for some choice of the principalization in Step 3, give the conclusion of SG000000BQ for $(V_0, V_1, N)$. Claim A implies (A$^{\rm w}$), and (A$^{\rm w}$) does not imply Claim A.'

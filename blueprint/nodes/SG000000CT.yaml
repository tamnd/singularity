tag: SG000000CT
kind: theorem
title: 'The generic steps of Rule 61.9'' that keep omega'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. In the setting of SG000000CS, a generic step at a point with $K \ne \emptyset$ keeps $\omega$ only if the centre is the closed point, $K = \{k\}$ has one element, and the bottom face $\mathcal{F}$ is the vertex $\omega e_l$ of the third index $l$, with $h \ge 2$. Each other generic step at a point that is not a chart origin lowers $\omega$. A generic step over a curve with $\lambda \ne 0$, or over the closed point with two nonzero $\lambda_k$, reaches $\omega = 0$, after which SG0000009R applies.'

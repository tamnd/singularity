notes: 'This is Corollary 86.7 of research note 86. A divisorial centre has no point with $K \ne \emptyset$. For a curve $S = \{j, k\}$ with $\lambda_k \ne 0$ we have $K = S \setminus \{j\}$, and the same holds for the point with two nonzero $\lambda_k$, so part (1) of SG000000CS gives $\omega = 0$. The remaining case is part (2) of SG000000CS. In the lab of note 86, the $2430$ steps of the stored histories of the $81$ cut nodes of note 72 have $2$ generic steps away from chart origins that keep $\omega$, both of this type, and $18$ steps at which the generic image has a lower $\omega$ and a new preparation brings $\omega$ back to its old value. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Corollary 4.5.24. The result is not in Lean.'

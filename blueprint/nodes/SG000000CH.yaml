tag: SG000000CH
kind: theorem
title: 'Toric relative strong factorization for the cone sigma_0'
statement: 'Let $F$ be a field, $R = F[x,y,z]_{(x,y,z)}$, and $S_0$ the ring of SG000000C2, with $x = b c^2$, $y = a b c$ and $z = a^3 b$. Then $\mathrm{RSF}(R, S_0)$ of SG000000CG holds in its strong variant for $K = (x^3 y^3 z^2, x^4 y z^3, y^9, x^5 z^3)$, with torus-invariant centers. In terms of fans: 14 smooth star subdivisions at 2-faces of the octant, with the new rays $(0,1,1)$, $(0,1,2)$, $(1,1,1)$, $(0,1,3)$, $(1,1,0)$, $(2,1,0)$, $(1,1,2)$, $(2,2,3)$, $(2,1,1)$, $(1,2,4)$, $(2,3,6)$, $(2,3,5)$, $(3,2,2)$, $(4,3,3)$ in this order, give a regular fan $F_1$ with 24 maximal cones that refines the normal fan of $K$. The cone $\sigma_0$ is the union of 6 maximal cones of $F_1$, and this subfan is obtained from $\sigma_0$ by 5 smooth star subdivisions at 2-faces, with the new rays $(2,2,3)$, $(1,2,4)$, $(4,3,3)$, $(2,3,5)$ and $(2,3,6)$. Each of the 14 centers lies in the locus where $K$ is not invertible.'
sources:

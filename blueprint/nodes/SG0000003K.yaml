notes: One direction uses the Frobenius, $z^q + g = (z - h)^q + (g + h^q)$. The other direction evaluates at $z = h$. So the hypersurface $z^q + g$ has order $q$ along the center $z = h$, $I = 0$ if and only if $g + h^q \in I^q$.

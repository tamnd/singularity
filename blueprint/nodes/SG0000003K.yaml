tag: SG0000003K
kind: theorem
title: The lifting test for z^q + g
statement: Let $R$ be a commutative ring of characteristic $p > 0$, let $q = p^e$, let $I$ be an ideal of $R$ and let $g, h \in R$. Then $z^q + g \in (z - h, I)^q$ in $R[z]$ if and only if $g + h^q \in I^q$.
sources:
- paper: Cos87
- paper: Pos24

notes: 'This is Theorem 65.1 of research note 65, the referee report on note 61, with the correction of the slip that note 66 found and that the referee report in note 72 confirmed. After the translation $z'' \mapsto z'' + \gamma$ with $\operatorname{ord} \gamma = 2$, the rigid coefficients $b_{p+1+j} = \binom{p-1}{j} \gamma^j a''_{p+1}$ have the order $4p - 1 + 2j$, not $4p - 1 + j$ as note 65 wrote. So the least rigid slope at the new point is $\sigma^* = \frac{6p-5}{2p-1}$, which is larger than $\delta = \frac{2p+1}{p}$ because $2p^2 - 5p + 1 > 0$. The point stays in R1 and the conclusion is unchanged. For $p = 3$ the value of $\sigma^*$ is $\frac{13}{5}$. The theorem refutes part (a) of Conjecture 61.18 of note 61 for each odd $p$. Because $E$ has three components, the centre does not depend on any choice. Note 72 recomputed the theorem exactly for $p = 3, 5, 7$. Handbook Volume 7, Theorem 4.4.7. The result is not in Lean.'

notes: This is Proposition 3.17.3 of Volume 7 of the handbook (Section 3.17). The proof is the proof of Proposition 3.15.5, with the dominance lemma 3.15.4 applied to the exponents of the terms of $g_m$. It is Proposition 2.3 of note 38 of the research notes. The result is not in Lean.

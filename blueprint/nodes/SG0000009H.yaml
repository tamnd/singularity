notes: 'This is Theorem 3.19.11 of Volume 7 of the handbook (Section 3.19). It is Theorem 4.2 of note 69 of the research notes with the fixes 2 and 3 of the referee report 71. By SG0000006Z each corner run of $g$ is linear, so $(\alpha_0, \beta_0)$ and $J$ exist. Fix 2 puts the hypothesis at the restart point $P_J$: the same hypothesis on the cleaned $g \circ A$ at $P_N$ does not pass to $P_J$, as the example $y x w^2 + y z x^2 + x^3$ with one $z$-step and the translation $(1, 0)$ shows, since it gives the monomial $y z^2 w^2$. Under the hypothesis only the constant term is cleaned at each later point, and the coefficient $\alpha$ of $x''^2$ has only terms of nonzero class, so the proof of SG00000089 goes through with $I \subseteq \{1, 2, 3\}$ in place of $I \subseteq \{1, \dots, p - 1\}$. Fix 3 is the bound $d - 1 \le \rho$ for $d = 2$ through the class of $\alpha$, and the use of the cleaned function in the new coordinates. Conjecture L+ is not claimed: for $d = 2 = \rho$ the term with $w''_m$ can give a corner surface of order $1$. This happens for $d = 2 = \rho$. The cubic $y x^2 + y^2 z w + x^3$ of SG000000BK is in the class and has corner surfaces of order $1$. By SG000000BM, $\rho = 2$ in the class. The other linear runs of cubics in characteristic $2$ are the conjecture SG000000BN. Their initial form need not be a power of a line, by SG000000BJ, so the conjecture SG0000009J is false. The result is not in Lean.'

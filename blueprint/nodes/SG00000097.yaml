tag: SG00000097
kind: theorem
title: 'The critical set obstruction for all changes of coordinates when D = p in two variables'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $g \in k[[x, y]]$ with $\operatorname{ord} g = p$, let $h$ be the form of degree $p$ of $g$ with $\nabla h \ne 0$, and let $C \subset \mathbb{P}^1$ be the set of the zeros of $\nabla h$. Assume $|C| \ge 3$, and let $F = z^p + g$. Then for each automorphism $\Psi$ of $k[[x, y, z]]$ and each unit $u$ of $k[[x, y, z]]$, the series $u \cdot (F \circ \Psi)$ is Newton degenerate. Always $|C| \le p - 2$, so the hypothesis can hold only for $p \ge 5$.'
sources:
- paper: Newt

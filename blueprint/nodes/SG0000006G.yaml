tag: SG0000006G
kind: theorem
title: A corner run with free translations of mu x + F(x^p) has only a finite number of nonzero translations
statement: Let $n = 3$ and let $g = \mu x + F(x^p, y, z)$ be clean at $P_N$, with $\mu$ zero or a nonzero constant times a monomial in $y, z$ times a unit of $K[[y, z]]$, and $F \in K[[y, z]][[Y]]$. Then each corner run with free translations from $P_N$ has only a finite number of nonzero translations.

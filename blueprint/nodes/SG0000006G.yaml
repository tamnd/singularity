notes: This is Theorem 3.16.13 of Volume 7 of the handbook. The coordinate $x' = u x$ removes the unit of $\mu$, by Lemma 3.15.2 (SG00000063) and Lemma 3.16.12 (SG0000006F). If $F$ is constant, then $g \in K[[y, z]]$ and Proposition 3.13.26 (SG0000005W) gives $\rho = 0$ later. Otherwise Theorems 3.16.8, 3.16.9 and 3.16.10 cover all the tie sets. The proof is in notes 34 and 35 of the research notes, with the case analysis of Corollary F of note 36. The result is not in Lean.

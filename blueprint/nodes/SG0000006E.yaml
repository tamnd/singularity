notes: This is Theorem 3.16.10 of Volume 7 of the handbook, with Proposition 3.16.7 and Example 3.16.11. If the number is infinite, Lemma 3.16.4 (SG0000006B) gives $\mathcal{T} \setminus \{1\} \subseteq \{p, p^2, \dots\}$, so $\delta_m^k$ has no cross terms for $k \in \mathcal{T}$. Each term of the identity of Proposition 3.16.7 is a constant times $E N_{j+1}^k$ with $N_{j+1} = (y_{j+1} z_{j+1})^{-1}$. The exponent of $N_{j+1}$ is the sum of the two columns of a matrix of determinant $\pm 1$, so it is primitive, and distinct pairs $(j, k)$ give distinct monomials. So the right side has an infinite number of terms below $W$, and the left side has a finite number. This replaces the chain argument of Theorem C of note 34 of the research notes. The result is not in Lean. Lean proves that the vectors $n_{j+1}$ are primitive for each word of the two charts (Singularity.Translations.isCoprime_nVec) and that $k n = k' n'$ for primitive vectors and positive integers gives $k = k'$ and $n = n'$ (Singularity.Translations.nVec_smul_inj), from tamnd/singularity-lean#193. That $v(M_{j+1})$ increases strictly is not in Lean.

tag: SG0000006E
kind: theorem
title: If the tie set has the linear index and a power of p then a corner run of mu x + F(x^p) has only a finite number of nonzero translations
statement: Let $n = 3$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations, with the notation of Section 3.15 of Volume 7 of the handbook. Let $g = \mu x + F(x^p)$ be clean at $P_N$, with $\mu$ zero or a nonzero constant times a monomial in $y, z$, and $F(Y) = \sum_k B_k Y^k$ with $B_k \in K[[y, z]]$. Assume that $\mu \ne 0$. If $1 \in \mathcal{T}$ and $\mathcal{T} \ne \{1\}$, then the run has only a finite number of nonzero translations.

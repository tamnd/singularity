notes: The Lean example is the example of [HP19a, Section 3] in characteristic 2, $F = x^2 y^2 w^3 (w (x+y)^4 + x^{13})$ in the $x$-chart with $y \mapsto y + 1$. The residual order goes from 5 to 7, and Singularity.Examples.kangaroo_increase proves that 7 exceeds the bound 6 of the proof of Moh.

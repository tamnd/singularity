tag: SG0000003F
kind: theorem
title: The dichotomy for the log-Jacobian ideal
statement: Let $F \ne 0$ be clean, write $F = x^r G$ with $r_j = 0$ for $j \notin \Delta$ and $G$ not divisible by $x_i$ for $i \in \Delta$, and let $d = \operatorname{ord} G$. Then $\Theta(F) = x^r \widetilde\Theta(G)$ with $\widetilde\Theta(G) = (r_i G + x_i \partial_i G, \ \partial_j G)$, no $x_i$ with $i \in \Delta$ divides all of $\widetilde\Theta(G)$, and $\rho = \operatorname{ord} \widetilde\Theta(G)$ satisfies $d - 1 \le \rho \le d$.
sources:
- paper: Cos87
- paper: CP08

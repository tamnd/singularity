notes: The proof uses only the exponents of the monomials and the cleanness of $F$, so it holds for each number of variables. In Lean the ideal is Singularity.residualLogJacobian, the order $\rho$ is Singularity.logJacobianOrder, part 1 is Singularity.residualLogJacobian_not_le_span_X, and part 3 is Singularity.logJacobianOrder_add_one_eq_iff. The type $\tau = d - \rho$ is Singularity.logJacobianType, and for a clean $F$ the library proves $d = \rho + \tau$ (Singularity.residualOrderAlong_eq_logJacobianOrder_add_logJacobianType) and $\tau \in \{0, 1\}$ (Singularity.logJacobianType_eq_zero_or_eq_one), with the criteria Singularity.logJacobianType_eq_one_iff_pderiv and Singularity.logJacobianType_eq_zero_iff_pderiv (tamnd/singularity-lean#196). This is Corollary 3.8 and Definition 3.9 of research note 03 in fixed coordinates. For a change of coordinates of $k[x]$ with an inverse that is adapted to the divisor, the clean part keeps the exponents $r$ and $\rho$ (Singularity.logJacobianOrder_cleanPart_eq_of_adapted), and $\rho \le d \le \rho + 1$ in the new coordinates (Singularity.logJacobianOrder_le_residualOrderAlong_of_adapted, Singularity.residualOrderAlong_le_logJacobianOrder_add_one_of_adapted, tamnd/singularity-lean#204). The changes $x'_l = u_l x_l$ of the power series ring with a unit $u_l$ that is not a constant are not covered, so the bound $\rho \le d^{\max} \le \rho + 1$ over all regular systems of parameters is not in Lean.

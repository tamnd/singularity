tag: SG0000003C
kind: theorem
title: A chart of the blowup of a regular local ring is regular
statement: Let $(R, \mathfrak{m}, \kappa)$ be a regular local ring and let $x \in \mathfrak{m} \setminus \mathfrak{m}^2$. Then the chart $R[\mathfrak{m}/x]$, the subring of $R_x$ that the fractions $a/x$ with $a \in \mathfrak{m}$ generate over $R$, is a regular ring. If $x, y_1, \dots, y_d$ generate $\mathfrak{m}$ and $\dim R = d + 1$, then $R[\mathfrak{m}/x]/(x)$ is isomorphic to $\kappa[T_1, \dots, T_d]$.

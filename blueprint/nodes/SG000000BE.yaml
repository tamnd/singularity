tag: SG000000BE
kind: theorem
title: 'Rule 61.9'' terminates along the toric branches at multiplicity 2p'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. A toric branch of Rule 61.9'' is a sequence $\xi_0, \xi_1, \dots$ of points of multiplicity $2p$ with $E = \{0, 1, 2\}$ at $\xi_0$, in which $\xi_{n+1}$ is the origin of a chart of the blowup of the centre that the rule chooses at $\xi_n$, for any choice among tied centres, so that $E$ stays $\{0, 1, 2\}$, and in which the transform $z / x_j$ of the coordinate $z$ stays simultaneously prepared. Along a toric branch $\omega$ never increases, and each run of consecutive points with the same value $\omega > 0$ is finite. So each toric branch is finite: it reaches $\omega = 0$, after which SG0000009R applies, or it reaches a centre over which no chart origin has multiplicity $2p$. Each branch through chart origins of a germ with $a_p = a_{2p} = 0$ and $E = \{0, 1, 2\}$ is a toric branch.'

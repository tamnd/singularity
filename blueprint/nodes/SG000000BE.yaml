notes: 'This is Theorem 81.11 of research note 81, with Lemma 81.2 for the last claim. The proof uses the toric model: the points $u = \alpha / i$ of the monomials $x^\alpha$ of the $a_i$, and a step with centre $V(z, x_S)$ and chart $j \in S$ replaces $u_j$ by $\sum_{k \in S} u_k - 1$. These are the moves of the polyhedra game of Hironaka, with the fixed strategy of the rule, so the solution of the game by Spivakovsky does not apply directly. With the normalised points $v = u - \mu$ one has $\omega = \min |v|$. A step does not raise $\omega$, and a step that keeps $\omega$ fixes the bottom face $\mathcal{F}$ of the polyhedron, the part with $|v| = \omega$, and can only make it larger. This happens at most $(B\omega + 1)(B\omega + 2)/2$ times, with $B = \operatorname{lcm}(1, \dots, 2p)$. If $\mathcal{F}$ is not a vertex $\omega e_b$ on an axis, the run is finite by a count of $g_a + g_c - \omega$ or by a drop of $\delta$. If $\mathcal{F} = \{\omega e_b\}$, the projection $g \mapsto (g_a, g_c) / (\omega - g_b)$ gives a planar polyhedron with its own residual slope $\omega_2$, which does not increase, and the stage $\omega_2 > 0$ is finite. If $\omega_2 = 0$, the planar polyhedron is an orthant with a corner $c$, and the larger coordinate of $c$ does not increase, except in a last phase in which $\delta$ drops. For the last claim, if $a_p = 0$ or $a_{2p} = 0$, then by SG000000CP the translation $\nu$ is $0$ at each point of multiplicity $2p$ over the centre, no vertex is solvable, and $z$ stays prepared. At a chart origin the substitution is monomial and injective on the exponents of each $a_i$, so no monomials cancel. Note 81 stated the last claim with $a_p = a_{2p} = 0$, and research note 86 showed that one of the two conditions is sufficient. If $a_p \ne 0$ and $a_{2p} \ne 0$, a new preparation at a chart origin can be necessary (a control example of note 86), so the hypothesis that $z$ stays prepared is a real one. The lab of note 81 reproduced exactly in the toric model the $53$ cut nodes of note 72 with $E = \{0, 1, 2\}$, and it followed all their toric continuations, $2084$ nodes with $1027$ steps that keep $\omega$. Each monotone quantity of the proof behaved as the proof says. Research note 86, the referee report on note 81, checked the proof and found it correct, with one fix: after a step $P_k$ of the orthant regime the new $\mu_k = \sigma + \beta - 1$ can be $2$ or more, so the rule can take several divisorial steps, and $\mu_k$ is reduced modulo $1$. The proof uses only that each divisorial step lowers $\delta$ by $1$, so nothing else changes. Note 86 also recounted the lab data: the $2084$ nodes contain $566$ distinct states, and there are $613$ non-divisorial main steps with $\beta < 1$ (note 81 gave $675$). A germ-level check of note 86 found no new preparation and no cancellation at the $1330$ chart-origin steps of the continuations, so these continuations are branches of the rule. SG000000CR extends the result to each boundary $E$, and SG000000CV adds the generic steps at points that are not chart origins. Handbook Volume 7, Theorem 4.5.9. The result is not in Lean.'

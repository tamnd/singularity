notes: 'This is Theorem 81.11 of research note 81, with Lemma 81.2 for the last claim. The proof uses the toric model: the points $u = \alpha / i$ of the monomials $x^\alpha$ of the $a_i$, and a step with centre $V(z, x_S)$ and chart $j \in S$ replaces $u_j$ by $\sum_{k \in S} u_k - 1$. These are the moves of the polyhedra game of Hironaka, with the fixed strategy of the rule, so the solution of the game by Spivakovsky does not apply directly. With the normalised points $v = u - \mu$ one has $\omega = \min |v|$. A step does not raise $\omega$, and a step that keeps $\omega$ fixes the bottom face $\mathcal{F}$ of the polyhedron, the part with $|v| = \omega$, and can only make it larger. This happens at most $(B\omega + 1)(B\omega + 2)/2$ times, with $B = \operatorname{lcm}(1, \dots, 2p)$. If $\mathcal{F}$ is not a vertex $\omega e_b$ on an axis, the run is finite by a count of $g_a + g_c - \omega$ or by a drop of $\delta$. If $\mathcal{F} = \{\omega e_b\}$, the projection $g \mapsto (g_a, g_c) / (\omega - g_b)$ gives a planar polyhedron with its own residual slope $\omega_2$, which does not increase, and the stage $\omega_2 > 0$ is finite. If $\omega_2 = 0$, the planar polyhedron is an orthant with a corner $c$, and the larger coordinate of $c$ does not increase, except in a last phase in which $\delta$ drops. With $a_p = a_{2p} = 0$ each vertex is reached only by rigid coefficients, so it is not solvable, and $z$ stays prepared. The lab of note 81 reproduced exactly in the toric model the $53$ cut nodes of note 72 with $E = \{0, 1, 2\}$, and it followed all their toric continuations, $2084$ nodes with $1027$ steps that keep $\omega$. Each monotone quantity of the proof behaved as the proof says. Note 81 has no referee report yet. Handbook Volume 7, Theorem 4.5.9. The result is not in Lean.'

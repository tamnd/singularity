notes: This is Lemma 3.17.19 of Volume 7 of the handbook (Section 3.17). Part 1 is the proof of Lemma 3.13.14 (SG0000005T) with one derivation. Part 2 applies part 1 to a constant derivation $D$ with $D(\ell) = 1$ if $\ell \mid h$, and to $\partial_x$ or $\partial_w$ by the Euler identity if not. It is Lemmas 2.1 and 2.2 of note 40 of the research notes. Note 42 tested part 2 on 45000 random pairs over $\mathbb{F}_9$, $\mathbb{F}_{25}$ and $\mathbb{F}_{49}$ with no failure. The result is not in Lean.

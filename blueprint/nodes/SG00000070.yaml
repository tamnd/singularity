tag: SG00000070
kind: lemma
title: The order of G along a corner surface is bounded by the multiplicity of a line in the binary initial form
statement: Let $n = 4$, $\Delta = V(y) \cup V(z)$, $g = y^{r_y} z^{r_z} G$, and let $(X, W, y, z)$ be a regular system of parameters. (1) If $D$ is a derivation with $D(y) = D(z) = 0$, then $\nu^G_{V(X, z)} \le 1 + \operatorname{ord}_{V(X, z)}(D G)$. (2) If $\operatorname{in} G = h(x, w)$ is a nonzero binary form of degree $d$ with $1 \le d < p$, and $\ell$ is the part in $x, w$ of the linear part of $X$, then $\nu^G_{V(X, z)} \le \max(1, \operatorname{mult}_\ell h)$, where $\operatorname{mult}_\ell h$ is the largest $m$ with $\ell^m \mid h$. The same holds for $V(X, y)$.

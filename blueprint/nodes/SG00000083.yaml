tag: SG00000083
kind: theorem
title: Jung's method and patching give resolution of 4-folds for p > 24
statement: Let $k$ be an algebraically closed field of characteristic $p > 24$. Assume SG0000007W and SG0000007X. Then each variety of dimension 4 over $k$ has a resolution.
sources:

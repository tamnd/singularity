tag: SG00000086
kind: theorem
title: Resolution of hypersurfaces of bounded degree in large characteristic
statement: 'For all $n, d \ge 1$ there is a number $N(n, d)$ with this property. Let $k$ be an algebraically closed field of characteristic $p > N(n, d)$. Then each integral hypersurface $X \subset \mathbb{P}^{n+1}_k$ of degree at most $d$ has a resolution: a projective birational morphism $Y \to X$ with $Y$ regular.'

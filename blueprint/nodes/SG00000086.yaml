notes: Theorem 6.1 of research note 56, which is Theorem 9.4 of note 09. Note 62 checked the proof. The statement is folklore (spreading out from characteristic 0). The project found no written reference. The proof resolves the fibres over the generic points of the strata of characteristic 0 of the space of forms over $\mathbb{Z}$ (SG0000001P), spreads the resolution over a dense open set (EGA IV, Sections 8 and 9), uses noetherian induction on $\mathbb{P}^M_{\mathbb{Z}}$, and gets a finite set of bad primes by the theorem of Chevalley. The bound $N(n, d)$ is not effective. The resolution need not be an isomorphism over the regular locus. The same proof works for each bounded family. The bound depends on $d$, so the theorem does not give Target T. Handbook Volume 9, Section 3.21. Planned for Lean.

tag: SG0000004Q
kind: theorem
title: The residual order of the log-Jacobian ideal under a blowup in a regular center
statement: In the setting of SG0000004P, let $g \ne 0$ be clean with $g = x^r G$ as in SG0000003F, let $\rho = \operatorname{ord}_0 \widetilde\Theta(G)$, and assume (H1) $\operatorname{ord}_C \widetilde\Theta(G) = \rho$ and (H2) $\operatorname{ord}_C \widetilde\Theta_C(G) = \rho + 1$ or $\operatorname{ord}_0 \widetilde\Theta_C(G) = \rho$. Let $g'_c$ be the clean part of $g'$ for $\Delta'$. Then $g'_c \ne 0$ and $\rho(g'_c) \le \rho$.

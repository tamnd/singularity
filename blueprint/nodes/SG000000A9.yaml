notes: 'This is Theorem 3.4 of research note 58, with Lemma 3.1, Algorithm 3.2 and Lemma 3.3, in the form of the referee report in note 73. Note 73 adds two points: the stack is the canonical toric stack of $\Sigma$, which differs from the iterated weighted blowups by roots of order prime to $p$ along the new divisors, and this changes neither tameness nor regularity of the pullback; and the vector of each step has at least two nonzero entries, so each step is a genuine blowup. On the chart of a cone with generator matrix $B$, the saturated pullback of $\mathcal{F}_V$ is $\mathcal{F}_{\bar{B}^{-1} V}$. The algorithm stops because $\sum_\sigma K^{r - s(\sigma)}$, with $K > n$ and $s(\sigma)$ the number of generators in $V$ modulo $p$, goes down at each step. The weights must be reduced modulo $p$: for $p = 2$ the field $D_{(0, 0, 1, 2)}$ with the naive weights $(1, 2)$ gives a wild chart. The lab test A of notes 58 and 73 resolves all subspaces of $\mathbb{F}_p^4$ for $p = 2, 3, 5$; this is numerical evidence only. Handbook Volume 9, Section 3.22. Not in Lean.'

tag: SG000000A9
kind: theorem
title: Weighted blowups with weights less than p resolve the foliations of the maximal torus
statement: 'Let $V \subseteq \mathbb{F}_p^n$ and $\mathcal{F}_V$ be as in SG000000A8. There is a simplicial fan $\Sigma$ that subdivides $\mathbb{R}^n_{\ge 0}$, obtained by a finite sequence of stellar subdivisions, whose maximal cones all have a determinant prime to $p$, such that for the canonical smooth toric Deligne-Mumford stack $\mathcal{X}_\Sigma$ of $\Sigma$ in the lattice $\mathbb{Z}^n$ the morphism $f : \mathcal{X}_\Sigma \to \mathbb{A}^n$ is proper and birational, $\mathcal{X}_\Sigma$ is a regular tame stack, and $f^* \mathcal{F}_V$ is regular. Up to a root stack of order prime to $p$ along the new divisor, each subdivision is a weighted blowup in the coordinates of a chart with weights in $\{1, \dots, p - 1\}$. If $V = \mathbb{F}_p c$ has rank one and $c$ is not a multiple of a coordinate vector, one weighted blowup suffices, with the center $\{x_k = 0 : c_k \ne 0\}$ and weights in $\{1, \dots, p - 1\}$ that reduce modulo $p$ to a generator of $V$. If $p = 2$, then $\Sigma$ is a smooth fan and $\mathcal{X}_\Sigma$ is a regular toric variety.'

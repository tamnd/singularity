notes: 'This is Proposition 6.1 of research note 76, which the referee report in note 80 checks line by line, with Fix 12 on the degrees of the initial forms. In the handbook the proof uses Gauss valuations only and no graded ring: the term $(A_i + B_iT)\varphi(T)^i$ of $H(\vartheta + T)$ equals $A_iT^{ip} + B_iT^{ip+1}$ plus terms of larger value for $\gamma < 0$. The condition $\delta \le 0$ is needed in the Artin-Schreier case. The numerical check of note 76 is not evidence and is not used. Handbook Volume 9, Section 3.23. The result is not in Lean.'

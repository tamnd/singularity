tag: SG000000B7
kind: theorem
title: 'The distance to a defect subfield does not grow'
statement: 'Let $(E, \nu)$ be a rank 1 valued field of characteristic $p$ and $\vartheta$ an element of an immediate extension, transcendental over $E$, such that a cofinal pseudo-Cauchy sequence of $\vartheta$ in $E$ is of transcendental type. Let $\delta = \mathrm{dist}(\vartheta, E) < \infty$. Let $\varphi(X) = X^p$, or $\varphi(X) = X^p - X$ and $\delta \le 0$, and let $a = \varphi(\vartheta)$. Then $\nu(\vartheta - c) < \delta$ for each $c \in E(a)$ and $\mathrm{dist}(\vartheta, E(a)) = \delta$. So $E(\vartheta)/E(a)$ is immediate of degree $p$ with defect $p$. It is purely inseparable if $\varphi = X^p$, a dependent Artin-Schreier extension if $\varphi = X^p - X$ and $\delta < 0$, and an independent one if $\delta = 0$.'

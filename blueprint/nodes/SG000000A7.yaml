tag: SG000000A7
kind: definition
title: 1-foliations, additive and multiplicative singularities, and the quotient by a foliation
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$ and let $X$ be a normal variety over $k$. A 1-foliation on $X$ is a saturated subsheaf $\mathcal{F} \subset T_X$ that is closed under the Lie bracket and under $D \mapsto D^p$. Its rank is the generic rank of $\mathcal{F}$, and its corank is $\dim X$ minus the rank. It is regular at a point if $\mathcal{F}$ and $T_X / \mathcal{F}$ are free near the point, and $\operatorname{Sing} \mathcal{F}$ is the closed set where it is not regular. The quotient $X / \mathcal{F}$ has the same underlying space as $X$ and the sheaf of the functions $f$ with $D(f) = 0$ for each local section $D$ of $\mathcal{F}$. On a regular $X$ a rank one foliation is locally $\mathcal{O}_X \cdot D$ with $D = \sum_i f_i \partial_i$, $\gcd(f_i) = 1$ and $D^p = h D$ for a function $h$. It is additive if $D^p = 0$, and multiplicative at a point $q$ if $h(q) \ne 0$. If a torus $T$ acts on $X$, the foliation is $T$-invariant if $t \cdot \mathcal{F} = \mathcal{F}$ for each $t \in T$, where $(t \cdot D)(f) = t \cdot D(t^{-1} \cdot f)$.

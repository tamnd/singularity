notes: 'This is Definitions 1.1 and 1.2 of research note 58, which the referee report in note 73 checked against the sources. By the Jacobson correspondence [Pos23, Section 2.5], on a regular $X$ with function field $L$ the foliations of rank $r$ correspond to the fields $L^p \subseteq M \subseteq L$ with $[L : M] = p^r$, and $X / \mathcal{F}$ is the normalization of the Frobenius twist $X^{(p)}$ in $M$. So the normalization of a regular $B$ in $k(B)(g^{1/p})$, the purely inseparable cover $z^p = g$ of route R5, is the quotient of the regular variety $B^{(1/p)}$ by a foliation of corank one. A rank one foliation on a regular $n$-fold $Y$ gives $[k(Y / \mathcal{F}) : k(Y)^p] = p^{n-1}$, so in dimension 4 rank one and corank one are different problems. Posva proves the multiplicative normal form of his Theorem 1 on threefolds only in corank one [Pos24, Theorem 5.1.1]; the introduction of [Pos24] says this restriction. Handbook Volume 9, Section 3.22. Not in Lean.'

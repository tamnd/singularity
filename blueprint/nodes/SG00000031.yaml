tag: SG00000031
kind: theorem
title: The theorem of Hilbert and Serre
statement: Let $N = \bigoplus_{n \ge 0} N_n$ be a graded Noetherian module over an $R$-algebra that is generated by $r$ elements of degree $1$, and let each $N_n$ have finite length over $R$. Then $n \mapsto \ell_R(N_n)$ agrees for large $n$ with a polynomial of degree less than $r$.

notes: 'This is Lemma 6.2 of research note 76, which the referee report in note 80 confirms. The truncations of $\vartheta$ below $\delta - \epsilon$ are Laurent polynomials, and for $c \in C$ the difference $\vartheta - c$ still has support points that accumulate at $\delta$. The standard elements are $\vartheta_\delta = \sum_m t^{\gamma_m(\delta)}$ with $\gamma_m(\delta) = \delta + q_m\sqrt 2 - r_m$, where $r_m/q_m$ are the convergents $3/2, 17/12, 99/70, \dots$ of $\sqrt 2$ from above. Handbook Volume 9, Section 3.23. The result is not in Lean.'

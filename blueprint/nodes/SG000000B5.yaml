tag: SG000000B5
kind: lemma
title: 'Hahn series whose support accumulates at a point are not in the completion of an adapted pair'
statement: 'Let $\Gamma = \mathbb{Z} + \mathbb{Z}\sqrt 2$, $H = k((t^\Gamma))$ with the $t$-adic valuation and $K_2 = k(t, t^{\sqrt 2}) \subset H$. Then the completion $C$ of $K_2$ in $H$ is the set of series with finitely many support points below each bound. If $\vartheta \in H$ has support whose least accumulation point is $\delta$, then $\mathrm{dist}(\vartheta, K_2) = \mathrm{dist}(\vartheta, C) = \delta$, the supremum $\sup \nu(\vartheta - C)$ is not attained, and $\vartheta \notin C$.'
sources:
- paper: Kuh-book
uses:

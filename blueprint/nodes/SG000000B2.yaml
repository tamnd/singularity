tag: SG000000B2
kind: lemma
title: 'Sufficient conditions for the ball property'
statement: 'Let $(L, \nu)$ be a rank 1 valued field and $z$ transcendental over $L$ in an immediate extension. (a) If $z \in L^c$, then $z$ has the ball property over $L$. (b) If $z$ is the limit of a pseudo-Cauchy sequence in $L$ of transcendental type that is cofinal in $\nu(z - L)$, then $z$ has the ball property over $L$. (c) If $L^c$ is algebraically maximal and $z \notin L^c$, then each pseudo-Cauchy sequence in $L$ with limit $z$ that is cofinal in $\nu(z - L)$ is of transcendental type, so $z$ has the ball property over $L$.'

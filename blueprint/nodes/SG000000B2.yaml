notes: 'This is Lemma 4.1 of research note 76 with the strengthening of Fix 6 of the referee report in note 80: in (b), once $\min_{j \ge 1}(h_j + j\gamma_n) > h_0$, the ultrametric inequality gives the constant value $\nu(h(a)) = \nu(h(z))$ on a whole ball. Part (c) uses Theorem 3 of Kaplansky and a cofinality argument for a possible limit in $L^c$. Handbook Volume 9, Section 3.23. The result is not in Lean.'

tag: SG0000005R
kind: theorem
title: The corner curves of a two-chart origin run have the order of G at least rho
statement: Let $n = 3$ with the variables $x, y, z$, and let $P_N, P_{N+1}, \dots$ be an infinite run where each step is at the origin of the $y$-chart or of the $z$-chart and each chart occurs an infinite number of times. Then there is an $m_0$ such that for each $m \ge m_0$ the initial form of $G_m$ is $c \, x_m^{d_m}$ with $c \ne 0$, and the corner curves $V(x_m, y_m)$ and $V(x_m, z_m)$ have $\nu^G = d_m \ge \rho$. If also $p \nmid d_m$ and $\rho = d_m - 1$, then the forms of degree $\rho$ of $\widetilde\Theta(G_m)$ are the multiples of $x_m^{\rho}$.

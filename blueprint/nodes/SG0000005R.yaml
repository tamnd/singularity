notes: This is Theorem 3.13.20 of Volume 7 of the handbook, with Lemma 3.13.19. It gives a positive answer to Question 3.13.18 for these runs. The exponents of $y$ and $z$ at $P_m$ are given by two integer columns with the determinant $\pm 1$, and the cones that they span shrink to a ray with an irrational slope $\theta$. The monomial of $g_N$ with the least value of $(i + j) + \theta (i + k)$ and the largest exponent of $x$ gives the initial form of $G_m$ and the order along both corner curves for $m$ large. The proof is in note 26 of the research notes, with a computer test over $\mathbb{F}_2$ and $\mathbb{F}_3$. The result is not in Lean.

tag: SG00000080
kind: hypothesis
title: Resolution of log regular schemes
statement: Let $X$ be a log regular scheme in the sense of Kato. There is a log blowup $Y \to X$ such that $Y$ is regular, $Y \to X$ is projective, and $Y \to X$ is an isomorphism over the open set of $X$ where the log structure is trivial.

notes: This is Theorem 3.18.11 of Volume 7 of the handbook (Section 3.18). It is Theorem 3.2 of note 54 of the research notes (Statement D of note 52), refereed in note 63. The proof is an induction on $\deg f$ with the Taylor formula at $\Phi_m$ and SG0000008D for the tail. The hypothesis $\deg f < p$ is used only to make the factors in $\partial_X f^{[k, l]} = (k + 1) f^{[k + 1, l]}$ units. So Conjecture T of Remark 3.17.34 holds for the planar runs and the $f$ with $\deg f < p$. For a linear run the statement is false. For $\deg f \ge p$ the form (a) without the chain is SG00000090, from note 64 of the research notes, and the chain of part (c) is false in this degree (Example 3.18.28). The result is not in Lean.

tag: SG0000008E
kind: theorem
title: On a planar corner run a polynomial of degree less than p in the limits is not zero and its value is reached at a finite step
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty = (\varphi_\infty, \psi_\infty)$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational, and the completion $\hat H$ of $K(y_N, z_N)$ in it. The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Assume that the run is planar, and let $f \in \hat H[X, W]$ be nonzero with $\deg f < p$. Write $f^{[k, l]}$ for the Hasse derivatives and $\lambda_s(f) = \min_{k + l = s} v(f^{[k, l]}(\Phi_\infty))$. Then (a) $f(\Phi_\infty) \ne 0$, and if $\deg f \ge 1$, then $v(f(\Phi_\infty)) < \lambda_1(f) + 1 + \theta$; (b) $v(f(\Phi_\infty) - f(\Phi_m)) > v(f(\Phi_\infty))$ for $m$ large, so $v(f(\Phi_m)) = v(f(\Phi_\infty))$ for $m$ large; (c) $\lambda_{s-1}(f) < \lambda_s(f) + 1 + \theta$ for $1 \le s \le \deg f$, so $v(f(\Phi_\infty)) < v(f^{[k, l]}(\Phi_\infty)) + (k + l)(1 + \theta)$ for each $(k, l) \ne (0, 0)$ with $f^{[k, l]} \ne 0$.

notes: This is Theorem 3.16.8 of Volume 7 of the handbook, with Lemma 3.16.6 and Proposition 3.16.7. If the number is infinite, the identity $(V_m)_{<W} = -\mu\delta^{\mathrm{tw}}_m$ gives only a finite number of twisted translations. After the last one, put $C = \mu\varphi^{\mathrm{tw}}_{J+1}$ and $\tilde F = C + F$. If $\lim v(\tilde F(\Phi_m)) < W_1$, the criterion of Proposition 3.15.5 holds. If not, the bound of Lemma 3.16.3 puts all the monomials of the coefficients at one base point above the monomial $\mu M_m^{1-p} y_m z_m$, the dominance lemma applies to this fixed set, and $\rho = 0$ later. This is Theorem A of note 34 of the research notes, with the fixes of note 35. The result is not in Lean.

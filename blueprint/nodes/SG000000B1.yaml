notes: 'This is property (3) of Lemma 2.17 of [KK09]. Definition 1.4 of research note 76 (degree-one type) is a weaker form, and Fix 6 of the referee report in note 80 replaces it by this property, because Lemma 2.18 of [KK09], which SG000000B3 uses, assumes it. Handbook Volume 9, Section 3.23. The result is not in Lean.'

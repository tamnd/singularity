tag: SG000000B1
kind: definition
title: 'The ball property of an immediate transcendental element'
statement: 'Let $(L, \nu)$ be a rank 1 valued field and $z$ an element of an immediate extension of $L$, transcendental over $L$. A pseudo-Cauchy sequence $(d_n)$ in $L$ with limit $z$ is of transcendental type if for each $h \in L[X]$ the value $\nu(h(d_n))$ is constant for large $n$, and of algebraic type otherwise. The element $z$ has the ball property over $L$ if for each $h \in L[X]$ there are $\alpha$ and $a_0 \in L$ such that $\nu(h(a)) = \alpha$ for each $a \in L$ with $\nu(z - a) \ge \nu(z - a_0)$.'
sources:

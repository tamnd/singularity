notes: 'This is Lemma 6.1'' and Theorem 6.2'' of the referee report in note 73, which is the referee report on research note 58. In Problem 6.4 with $H = 0$ the equation $\psi(\alpha) = H \alpha$ is condition (1), so each $\alpha$ of the problem is an $\mathbb{F}_p$-combination of cofactors of invariant primes, and $\alpha$ is a connection form defined up to logarithmic derivatives of units. The proof of (1) implies (2) uses that $\delta + \alpha$ is a nilpotent $\ker\delta$-linear operator on the finite dimensional $\ker\delta$-space $K$, by Jacobson''s formula. This explains why the chart $z$ of SG000000AC has $\alpha = 0$ and the chart $x$ has $\alpha = 1 - Z^{p-1} W$: the trivializations differ. Handbook Volume 9, Section 3.22. Not in Lean.'

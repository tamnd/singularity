notes: This is Lemma 3.17.2 of Volume 7 of the handbook (Section 3.17). It is Lemma 3.15.2 with one more free coordinate. Part 3 follows from $\alpha x_m + \beta w_m = L_m(\alpha x_{m+1} + \beta w_{m+1} + \alpha a_m + \beta b_m)$. It is Lemma 2.2 of note 38 of the research notes. The result is not in Lean.

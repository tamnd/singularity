tag: SG0000006K
kind: lemma
title: Free coordinates in four variables keep the run and the order rho
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. A free coordinate system at $P_m$ is a pair $(x'', w'')$ such that $(x'', w'', y_m, z_m)$ is a regular system of parameters. (1) The ideal $\Theta(g) = (g_x, g_w, y g_y, z g_z)$, its monomial $x^r$ and $\rho$ do not depend on the free coordinate system, on a $p$-th power added to $g$, or on a factor $\varepsilon^p$ with $\varepsilon$ a unit. (2) A corner run in four variables from $P_m$ is a corner run in four variables in the coordinates $(x'', w'', y_m, z_m)$, with the same points, charts and $\rho$, and other translations. (3) If $(x'', w'') = (x_m, w_m) A^T$ with $A \in \mathrm{GL}_2(K)$, then the coordinates $(x_j, w_j) A^T$ at $P_j$ have the translations $(a_j, b_j) A^T$.

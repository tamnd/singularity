notes: 'This is Theorem 4.1 of research note 55, with the scope that research note 60 corrected. The changes $(\varphi, q)$ are the changes of the coordinates $x$, linear or not, together with the cleanings $z \mapsto z + q$. A unit $u$ and the change $z \mapsto u z$ do not change the initial forms up to a constant. The theorem does not cover the changes of all coordinates where the new $x$ depend on $z$. For these see SG0000008S ($D > p$), SG00000097 ($D = p$, $n = 2$), SG00000099 ($D = p$ and no line on $\{z^p + h = 0\}$) and SG0000008Z ($D = p$). If $h$ is not resonant, each torus critical point is on $h = 0$ by SG0000003H, so the interesting case is $p \mid D$. The result is not in Lean.'

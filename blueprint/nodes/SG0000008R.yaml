tag: SG0000008R
kind: theorem
title: 'The critical set obstruction for the changes of x and the cleanings'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $g \in k[[x_1, \dots, x_n]]$ with $\operatorname{ord} g = D$, let $h$ be the form of degree $D$ of $g$ with $\nabla h \ne 0$, and let $C \subset \mathbb{P}^{n-1}$ be the projective critical set $V(\partial_1 h, \dots, \partial_n h)$. Assume that $C$ is not contained in the union of $n$ hyperplanes with linearly independent equations. Then for each automorphism $\varphi$ of $k[[x]]$, each $q \in k[[x]]$ and each unit $u$ of $k[[x, z]]$, the series $u \cdot (z^p + g \circ \varphi + q^p)$ is Newton degenerate. Its initial form for the weight $(1, \dots, 1)$ has a critical point in the torus.'
sources:
- paper: Newt
uses:
- SG0000003G
- SG0000003H
tier: T2
route:

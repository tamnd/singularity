tag: SG0000007R
kind: theorem
title: The invariant nu of Cossart is at most the clean order
statement: Let $C$ be a regular center with normal crossings with the boundary $E$, let $\nu(C)$ be the order of the ideal $J(B, g, E)$ of Cossart at the generic point of $C$, and $d = \operatorname{ord}_C(g_c)$ in coordinates adapted to $C$ and $E$. If $d < p$, then $\nu(C) \le d$. So $\nu(C) \ge p$ implies that $C$ passes the lifting test.

tag: SG0000000Y
kind: theorem
title: The Abhyankar inequality
statement: For a valuation $\nu$ of a function field $K/k$, the rational rank plus the transcendence degree of the residue field is at most the transcendence degree of $K/k$.
sources:
- paper: Abh56
- paper: ZS2
lean:
  statement: Singularity.abhyankar_inequality
  proof: Singularity.abhyankar_inequality
tier: T2
notes: The Lean proof of tamnd/singularity-lean#63 is for a valuation subring $A$ of $K$ that contains $k$. The rational rank is the dimension of $\mathbb{Q} \otimes_\mathbb{Z} \Gamma$ over $\mathbb{Q}$, and the transcendence degrees are cardinals. The relative form for an extension of valued fields is `Singularity.abhyankar_inequality_relative`. The proof is the monomial argument of [ZS2, Chapter VI, Section 10]. In the case of equality, tamnd/singularity-lean#146 proves that the value group is free of finite rank (Volume 3, Corollary 2.2.4 of the handbook). The Lean names are `Singularity.IsAbhyankarValuation.free_valueGroup` and `Singularity.IsAbhyankarValuation.exists_basis_valueGroup`. tamnd/singularity-lean#153 proves that the residue field is finitely generated over $k$ (`Singularity.IsAbhyankarValuation.fg_residueField`). The proof uses the subfield $K_0 = k(x, y)$ on which the valuation is monomial. The residues of $K_0$ are in $k(\bar y)$, and the residue field is finite over $k(\bar y)$ (`Singularity.IsAbhyankarValuation.finiteDimensional_residueField`). tamnd/singularity-lean#156 proves that a divisorial valuation is discrete of rank 1. Its group of nonzero values is order isomorphic to $\mathbb{Z}$ (`Singularity.IsAbhyankarValuation.nonempty_orderMonoidIso_units_valueGroup`).

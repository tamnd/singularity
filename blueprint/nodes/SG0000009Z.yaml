tag: SG0000009Z
kind: theorem
title: No germ-local invariant of z^{p^3} + g in dimension at least 4 bounds the residual order and does not go up under point blowups
statement: 'Let $p$ be a prime, $q = p^3$, and let $n \ge 5$ if $p = 2$ and $n \ge 4$ if $p \ge 3$. Let $\mathcal G_{3,n}$ be the class of germs $(R, \Delta, g)$ with $R = K[[x_1, \dots, x_n]]$ over an algebraically closed field $K$ of characteristic $p$, $\Delta \subseteq \{1, \dots, n\}$ and $\operatorname{ord} g \ge q$. An invariant is a function $\iota$ of the germ $(R, \Delta, g)$ alone, with values in a well-ordered set $\Lambda$, that does not change under the changes of coordinates adapted to $\Delta$ and under $g \mapsto g + h^q$. Through the germs at points it is a function on the points of order $q$ of each hypersurface $z^q + g = 0$ over a smooth variety with a simple normal crossings divisor. Consider the properties: (N$_{pt}$) for each closed point $x$ of order $q$, each point of order $q$ over $x$ of the strict transform under the blowup of $x$ has $\iota'' \le \iota(x)$; (D'') for each $\lambda \in \Lambda$ the residual order $d$, in each adapted clean coordinate system, is bounded on the germs with $\iota = \lambda$. Then no invariant on $\mathcal G_{3,n}$ has the properties (N$_{pt}$) and (D''). In particular, no upper semicontinuous invariant on $\mathcal G_{3,n}$ with (D'') has $\iota'' \le \iota(x)$ under the blowups of all the regular permissible centres in its local top locus.'

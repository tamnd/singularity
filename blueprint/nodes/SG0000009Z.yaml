notes: 'This is Theorem 75.4 of research note 75 with Fixes 1, 2 and 3 of the referee report in note 78, that is, in the form of Proposition 78.2 of note 78. The input from [HP19a] is exactly this: for $e = 3$ there are polynomial germs $z^{p^3} + g$, in the variables $x, y, u, v, w$ for $p = 2$ (so $n = 5$) and $x, y, v, w$ for $p \ge 3$ (so $n = 4$), and infinite sequences of blowups whose centres are closed points of order $p^3$ of the strict transforms, at which the order stays $p^3$, along which the residual order of the cleaned equation for the exceptional divisor tends to infinity, by $2$ per pass for $p = 2$ and by $p(p - 1)/2$ per pass for $p \ge 3$. This is SG00000017. The maximal ideal of a point of order $q$ is always permissible. For a larger $n$ add a free variable $t$ that is never translated and never the chart variable: each blowup maps $t$ to $x_j t$, and $g$ and $d$ do not change. Proof: along such a sequence $\iota_0 \ge \iota_1 \ge \cdots$ by (N$_{pt}$). A non-increasing sequence in a well-ordered set is eventually constant, so $\iota_k = \lambda$ for $k \ge k_0$, and (D'') bounds $d_k$ for $k \ge k_0$, which contradicts $d_k \to \infty$. The second statement follows from part (2) of SG0000009Y. The property (D'') follows from the existence of a monotone $F : \Lambda \to \mathbb N$ with $d \le F(\iota)$, and so from each dichotomy with a bounded gap. It also holds for lexicographic invariants such as $(d, \rho_P)$ and $(\rho_P, \pm \delta)$. The theorem says nothing for $n \le 3$, so there is no conflict with the resolution of threefolds of Cossart and Piltant [CP19], nor with the positive results for surfaces of [HP19a] and [CJS20]. It says nothing about invariants that depend on the history of a resolution, such as the year counters of the algorithms of Hironaka type or the order of creation of the components of $E$, and nothing about a rule that picks larger centres: [HP19a] remark that larger centres are permissible and prevent the phenomenon. It disproves the stability claim of Moh [Moh87] for $e = 3$ in this form. Handbook Volume 7, Section 3.19. The result is not in Lean.'

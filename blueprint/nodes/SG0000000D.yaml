tag: SG0000000D
kind: theorem
title: Characteristic 0
statement: For each $n$, each variety of dimension at most $n$ over a field of characteristic 0 has a resolution. The proof applies Main Theorem I of resolutionorg/hironaka to the integral case and then applies the reduction to integral varieties SG0000001Y, which is proved. The theorem `Singularity.resolutionInDim_zero` keeps the form that takes the reduction as an argument.

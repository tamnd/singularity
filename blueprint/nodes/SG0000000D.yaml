tag: SG0000000D
kind: theorem
title: Characteristic 0
statement: For each $n$, each variety of dimension at most $n$ over a field of characteristic 0 has a resolution. The proof applies Main Theorem I of resolutionorg/hironaka to the integral case and takes the step from integral varieties to reduced varieties as a named hypothesis.

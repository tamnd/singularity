tag: SG00000094
kind: theorem
title: A corner run in four variables in the p-th powers of x and w is linear and has the initial form a power of a line
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Assume that $g \in K[[y, z]][x^p, w^p]$ and $\deg_{x, w} g \ge 1$. Then (1) $\rho(P_m) = d(P_m)$ at each point $P_m$ of the run; (2) the run is linear, so there are a $J$ and a linear free coordinate $x' = \alpha x_J + \beta w_J$ at $P_J$ whose translations are $0$ after $J$; (3) if the run has an infinite number of nonzero translations, then for $m$ large $\operatorname{in} G_m = c\, x_m'^{\,d}$ with $c \in K^*$ and $d = \rho$ a multiple of $p$, and the corner curves $V(x'_m, w'_m, y_m)$, $V(x'_m, w'_m, z_m)$ and the corner surfaces $V(x'_m, y_m)$, $V(x'_m, z_m)$ have $\nu^G = d = \rho$; (4) if the run has only a finite number of nonzero translations, it is an origin run from some point on. So the conjectures SG0000006Z and SG00000075 hold for the run, the initial form satisfies $\operatorname{in} G_m \in K[x'_m]$ for $m$ large in case 3, and SG00000071 holds in case 3.

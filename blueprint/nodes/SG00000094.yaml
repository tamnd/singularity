notes: This is Theorem 3.18.37 of Volume 7 of the handbook (Section 3.18). It is Theorem 6.1 of note 64 of the research notes, with Theorem 5.4 of that note for part 2, refereed in note 67, and with the fixes 4 and 5 of note 67. The hypotheses of SG0000005R are listed, and the form of Hypothesis H1 here is $\operatorname{in} G_m \in K[x'_m]$. Write $g = \sum_c y^{c_1} z^{c_2} F_c(x, w)^p$ with $c \ne 0$ in $\{0, \dots, p - 1\}^2$. Then nothing is cleaned along the run, and SG00000090 for the $F_c$ gives the drop criterion SG0000006M on a planar run. On a linear run the coefficients of the powers $x^{pk}$ become monomials times units, and the run is compared with a run in three variables at the origins of the charts, to which SG0000005R applies. In case 4, SG0000005Z gives SG0000006Z and SG00000075, and Example 3.17.22 shows that SG00000071 can fail. The result is not in Lean.

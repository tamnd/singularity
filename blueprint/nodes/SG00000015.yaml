notes: The stability claim of the same paper is false (HP19a). Expert question 5 of the spec asks for the exact bound that survives. The Lean Prop Singularity.moh_bound states the bound in the given coordinates. It is not proved, and it may need a hypothesis on the choice of the coordinates.

tag: SG00000015
kind: theorem
title: Moh's one-step bound
statement: Let $f = z^{p^e} + F$ with $F$ clean and $\operatorname{ord} F \ge p^e$. Under a point blowup at whose new origin the order of $f$ stays $p^e$, the residual order goes up by at most $p^{e-1}$.

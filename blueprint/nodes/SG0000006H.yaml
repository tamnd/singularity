tag: SG0000006H
kind: theorem
title: A corner run with free translations of a clean point in three variables has only a finite number of nonzero translations
statement: Let $n = 3$ and let $g \in K[[y, z]][x]$ be clean at $P_N$. Then each corner run with free translations from $P_N$ has only a finite number of nonzero translations. Let $J$ be the last index with $t_J \ne 0$, and let $J = N - 1$ if all $t_m$ are $0$. Then $P_{J+1}, P_{J+2}, \dots$ is a run of Theorem 3.13.20 in the coordinates of $P_{J+1}$. So for $m$ large both corner curves at $P_m$ have $\nu^G = d_m \ge \rho$, and Question 3.13.18 has a positive answer for this run.

notes: This is Theorem 3.16.14 of Volume 7 of the handbook. It answers the finiteness question of Section 3.15. If $g_x = 0$, Theorem 3.16.13 (SG0000006G) with $\mu = 0$ applies. If $g_x \ne 0$ and the number is infinite, Proposition 3.15.10 and Corollary 3.15.11 (SG00000064) give a late point with $g_m = \mu_m x'' + Q(x''^p, y_m, z_m)$. After the cleaning in $(x'', y_m, z_m)$, Lemma 3.15.2 (SG00000063) and Lemma 3.16.12 (SG0000006F) give a run of the class of Theorem 3.16.13 with an infinite number of nonzero translations, which is a contradiction. The end of the run is Theorem 3.13.20 (SG0000005R). The result does not prove the conjecture V of note 28, and $\rho$ need not drop (Example 3.15.18). The proof is in notes 34 to 37 of the research notes. The result is not in Lean.

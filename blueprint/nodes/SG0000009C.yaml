tag: SG0000009C
kind: theorem
title: 'Preparation of the top face of a weighted form in three variables'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $\omega \in \mathbb{Z}^3_{>0}$ with $\gcd 1$, and let $h \in k[x, y, w]$ be clean and $\omega$-homogeneous of degree $D$, with $\nabla h \ne 0$ and critical set $Z = \{\nabla h = 0\} \subset \mathbb{A}^3$. Some change of coordinates that preserves the weight, followed by the cleaning, makes the $\omega$-face free of torus critical points if and only if there is a graded automorphism $\psi$ with $\psi(Z) \subset \{x y w = 0\}$. Explicitly: (a) for $\omega = (1, 1, 1)$, the critical set $C \subset \mathbb{P}^2$ of $h$ lies on three lines with no common point; (b) for $\omega = (a, a, b)$ with $a, b \ge 2$ and $a \ne b$, the points of $Z$ with $w \ne 0$ and $(x, y) \ne 0$ have at most two images $(x : y)$; (c) for $\omega = (1, 1, m)$ with $m \ge 2$, there are a set $B \subset \mathbb{P}^1$ with $|B| \le 2$ and a binary form $c$ of degree $m$ such that each point of $Z$ with $(x, y) \ne 0$ and $(x : y) \notin B$ satisfies $w = c(x, y)$; (d) for $\omega = (1, m, m)$ with $m \ge 2$, $Z \cap \{x = 1\}$ lies on two lines with independent directions; (e) for $\omega = (a, b, b)$ with $2 \le a < b$ and $a \nmid b$, the points of $Z$ with $x \ne 0$ and $(y, w) \ne 0$ have at most two images $(y : w)$; (f) for $\omega = (1, m_1, m_2)$ with $1 < m_1 < m_2$, there are $s_0 \in k$ and a polynomial $P_1$ of degree at most $\lfloor m_2 / m_1 \rfloor$ with $Z \cap \{x = 1\} \subset \{y = s_0\} \cup \{w = P_1(y)\}$; (g) for three distinct entries, no entry being a nonnegative integer combination of the other two, $Z$ does not meet the torus.'

notes: 'This is Proposition 6.1 and Theorem 6.2 of research note 68, with the fixes of the referee report in note 70. The terms of higher $\omega$-weight play no role. Case (b) with $a > b$ and case (e) are the same weight type, and the two conditions agree. Case (a) is Theorem 4.1 of research note 55. The analogue in two variables for the weight $(1, m)$ is SG0000008T. The theorem is about the top face only. After a preparation of the top face, lower faces are often still degenerate, and an edge $x^a \psi(x^u)$ has a torus critical point if and only if $\psi$ has a multiple root, or in the resonant case $a \equiv \lambda u \bmod p$ if $\lambda \psi + T \psi''$ has a nonzero root or is zero (Lemma 6.3 of note 68, in the sense $\nabla f = 0$). The weights with three distinct entries with relations and smallest entry at least $2$, and $n \ge 4$, are open. Exact searches over finite fields for the type $(1, 1, m)$ agree with the criterion. This evidence is numerical and checks the group description, not many forms. The result is not in Lean.'

notes: 'Definition 85.6 of research note 85. $\mathrm{RSF}(R,S)$ implies local strong factorization along each valuation that dominates $S$: take the local ring of its center on $Y \times_Z \operatorname{Spec} S$. Whether local strong factorization for all these valuations implies $\mathrm{RSF}(R,S)$ is open; the local factorizations exist on finitely many patches of the Zariski-Riemann space, but they need not glue. $\mathrm{RSF}_3$ over the residue fields of curves is the local input of SG000000C9, which note 83 gave as local strong factorization. $\mathrm{RSF}_3$ is open in characteristic $p$, and in the toric case in general: it holds for $\sigma_0$ (SG000000CH) and for small cones (SG000000CK), and Oda''s conjecture implies the toric case (SG000000CM). Handbook Volume 9, Section 3.25. The result is not in Lean.'

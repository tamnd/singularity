tag: SG000000CG
kind: definition
title: 'Relative strong factorization RSF_3'
statement: 'Let $R \subseteq S$ be regular local rings of dimension 3 with the same fraction field, $S$ dominating $R$ and essentially of finite type over $R$. Say that $\mathrm{RSF}(R,S)$ holds if there are a composite $Y \to \operatorname{Spec} R$ of blowups along regular centers and a projective birational $Z \to \operatorname{Spec} R$ with a point $\zeta$ such that $\mathcal{O}_{Z,\zeta} = S$, such that $Y \to Z$ is a morphism over a neighborhood of $\zeta$ and $Y \times_Z \operatorname{Spec} S \to \operatorname{Spec} S$ is a composite of blowups along regular centers. For an ideal $K$ of $R$ with $K S$ invertible, the strong variant asks in addition that the centers of $Y \to \operatorname{Spec} R$ lie in the locus where the transform of $K$ is not invertible. $\mathrm{RSF}_3$ is the statement that $\mathrm{RSF}(R,S)$ holds for all such pairs.'
sources:
- paper: Kar03

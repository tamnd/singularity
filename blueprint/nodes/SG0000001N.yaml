tag: SG0000001N
kind: theorem
title: Temkin's $p$-alterations
statement: Each variety over a perfect field of characteristic $p$ has a regular alteration whose degree is a power of $p$.
sources:
- paper: Tem17
uses:
- SG0000001K
- SG0000001G
lean:
  statement: Singularity.exists_regular_p_alteration
tier: T7
route:
- R6
notes: The statement asks for a perfect field, but [Tem17] proves more. Each scheme of finite type over a quasi-excellent scheme of dimension at most 3 has a regular alteration whose degree has only primes that are not invertible on the scheme. In particular each variety over any field of characteristic p has a regular alteration of degree a power of p. The alteration is not proved to be Galois. Volume 8, Chapter 3 of the handbook gives the statements.

notes: 'This is Theorem 4.1 and Lemma 4.2 of research note 68, which the referee report in note 70 checked. The terms of higher order of $g$ can be arbitrary. The map $v \mapsto (v : c_v)$ with $c_v^p = -h(v)$ is a bijection from $C$ onto the singular set of $Q$. For a linear change $A$ that makes $(z^p + h) \circ A$ nondegenerate on all faces, the arc lemma (Lemma 2.1 of note 68) puts a coordinate subspace through each singular point into $A^{-1}(Q)$. With no line on $Q$ the singular points are coordinate points, so there are at most $n + 1$ of them. For $n = 2$ there is always a line condition to check, and SG00000097 is stronger. For $n = 3$ and $C$ contained in three lines with independent equations, a linear change of $x$ prepares the top face, also when $Q$ contains a line (Theorem 4.1 of note 55 and Proposition 4.3 of note 68). The open case is SG0000009E. The result is not in Lean.'

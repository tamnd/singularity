tag: SG00000099
kind: theorem
title: 'The critical set obstruction for all changes of coordinates when D = p and Q has no line'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $n \ge 2$, let $g \in k[[x_1, \dots, x_n]]$ with $\operatorname{ord} g = p$, let $h$ be the form of degree $p$ of $g$ with $\nabla h \ne 0$, and let $C \subset \mathbb{P}^{n-1}$ be the set of the zeros of $\nabla h$. Assume that the hypersurface $Q = \{z^p + h = 0\} \subset \mathbb{P}^n$ contains no line, and that $C$ is infinite or has at least $n + 2$ points. Then for each automorphism $\Psi$ of $k[[x, z]]$ and each unit $u$ of $k[[x, z]]$, the series $u \cdot ((z^p + g) \circ \Psi)$ is Newton degenerate. The hypersurface $Q$ contains a line if and only if there is a line $M \subset \mathbb{P}^{n-1}$ such that $h|_M$ is the $p$-th power of a linear form on $M$.'
sources:
- paper: Newt

tag: SG00000029
kind: theorem
title: Finiteness of the integral closure of a polynomial ring
statement: Let $k$ be a field, let $P = k[y_1, \dots, y_s]$ and let $L$ be a finite extension of $k(y_1, \dots, y_s)$. Then the integral closure of $P$ in $L$ is a finite $P$-module.

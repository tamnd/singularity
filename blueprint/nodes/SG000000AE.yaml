notes: 'This is Example 5.3 and Proposition 5.4 of research note 58, in the form of the referee report in note 73: the singular locus is exactly the four planes, and the last claim is an existence statement for each rank (the subtori of $T$ also act). The proof uses only the last three planes: two of them meet the third in a point, and they meet each other in a line, which is impossible for coordinate planes in four variables. With SG000000AC this is the no-go for toric methods on tori of rank $1$ to $3$ in track FO (tamnd/singularity#299). It is not a no-go for Problem 4.10 of note 04. Handbook Volume 9, Section 3.22. Not in Lean.'

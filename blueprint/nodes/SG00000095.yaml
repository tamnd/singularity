notes: This is Corollary 3.18.38 of Volume 7 of the handbook (Section 3.18). It is Corollary 6.2 of note 64 of the research notes, with the fix 6 of note 67, which is that the hypothesis of rank $2$ is not used, and the rank at most $1$ was SG0000006Y. The class is in $K[[y, z]][x^p, w^p]$ with $\deg_{x, w} g = p$, so SG00000094 applies, and $d = pk$ with $k \le 1$ and $d = \rho \ge 1$ gives $d = p$. So open question 2 of Section 3.17 has a positive answer for this class. The result is not in Lean.

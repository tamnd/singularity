notes: 'This is Proposition 78.3 of the referee report in note 78 on note 75. The finite sequences from $\gamma$ depend only on the germ, so $D^*$ is an invariant. It bounds $d$ by the empty sequence, and it does not go up because the sequences from a point over $x$ are among the sequences from $x$. By SG0000009W with $m = P$, the values of $d$ in different coordinates at one germ differ by at most $P$. Conversely, along a finite sequence $\iota$ does not go up, so $d \le F(\iota) \le F(\iota(\gamma))$. For $e = 2$ no sequence with $d \to \infty$ is known, and the existence of such an invariant is open: by this result it is equivalent to the finiteness of $D^*$, a uniform form of the bound SG00000015 of Moh. The weaker statement that $d$ is bounded along each infinite sequence is equivalent to the existence of an invariant with (N$_{pt}$) and (D'') only, and the two statements do not obviously agree, because the tree of point blowups has infinite branching, so the lemma of Konig does not apply. Handbook Volume 7, Section 3.19. The result is not in Lean.'

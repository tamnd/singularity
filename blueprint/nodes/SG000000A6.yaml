tag: SG000000A6
kind: theorem
title: An invariant that bounds the residual order and does not go up exists if and only if the residual order is bounded on the tree of point blowups
statement: 'Fix a prime $p$, $e \ge 1$, $q = p^e$ and $n$, and let $\mathcal G_{e,n}$ be the class of germs and the invariants as in SG0000009Z, with $q$ in place of $p^3$. For $\gamma \in \mathcal G_{e,n}$ let $D^*(\gamma) \in \mathbb N \cup \{\infty\}$ be the supremum of the residual order $d$, over all adapted clean coordinates, of all the germs obtained from $\gamma$ by finite sequences of blowups of closed points of order $q$ at which the order stays $q$, including the empty sequence. Then there is an invariant $\iota$ on $\mathcal G_{e,n}$ with (N$_{pt}$) and with a monotone $F : \Lambda \to \mathbb N$ such that $d \le F(\iota)$ if and only if $D^*$ is finite on each germ. In that case $D^*$ is such an invariant, with $F$ the identity, and $D^* \le F \circ \iota$ for each such pair $(\iota, F)$.'

tag: SG0000009E
kind: conjecture
title: 'Problem 5.15 in three or more variables: an induction on the residual order'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $n \ge 3$, and let $f = z^p + g$ with $g \in k[[x_1, \dots, x_n]]$ and residual order $\nu \ge 2$, the order of the part of $g$ without $p$-th power monomials. Then there is a finite sequence of weighted blowups such that at each step the largest residual order at the points of the strict transform over the origin drops. In particular, after a finite number of steps the strict transform is smooth at each point over the origin.'
sources:
- paper: Newt

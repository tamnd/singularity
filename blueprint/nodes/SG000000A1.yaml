tag: SG000000A1
kind: theorem
title: The first Hasse-Schmidt residual order does not go up but does not bound the residual order
statement: 'Let $p$, $n$ and $\mathcal G_{3,n}$ be as in SG0000009Z. The residual order $\rho_1$ of SG0000009V at the level $m = 1$ is an invariant on $\mathcal G_{3,n}$. It is upper semicontinuous, and it does not go up under the blowup of a closed point of order $q$, at each point of order $q$ over it. It does not have the property (D''), so for some value $\lambda$ the residual order $d$ is not bounded on the germs with $\rho_1 = \lambda$. So the hypothesis of domination in SG0000009Z cannot be removed.'
sources:

tag: SG0000009Y
kind: lemma
title: The residual order of the Hasse-Schmidt log-Jacobian ideal is upper semicontinuous
statement: 'Let $K$ be an algebraically closed field of characteristic $p > 0$, $q = p^e$, $1 \le m < q$, let $W$ be a smooth variety over $K$ with a simple normal crossings divisor $E$, and let $g \in \mathcal O(W)$. (1) The ideals $\Theta^{\le m}$ of SG0000009V, computed at each closed point in adapted coordinates, are the stalks of one coherent ideal sheaf $\mathcal T_m$, which does not change under $g \mapsto g + h^q$. Let $D$ be the largest effective divisor supported on $E$ with $\mathcal T_m \subseteq \mathcal O(-D)$. Then the residual order $\rho_m$ at a closed point $x$ is the order at $x$ of $\mathcal T_m \otimes \mathcal O(D)$, and $x \mapsto \rho_m(x)$ is the restriction to the closed points of an upper semicontinuous function on $W$. (2) Let $\iota$ be an upper semicontinuous function on a scheme with values in a well-ordered set. Then each point $x$ has an open neighbourhood $U$ with $\iota \le \iota(x)$ on $U$. So each closed point $x$ lies in the top locus of $\iota$ on $U$, and the blowup of a closed point is a blowup of a regular centre inside the local top locus.'

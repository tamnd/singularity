notes: 'This is Lemma 75.3 of research note 75 with the wording of Fix 6 of the referee report in note 78. Near each closed point there are etale coordinates adapted to $E$, and the ideal of the coefficients of $\tau(g)$ in the $s$-degrees $1, \dots, m$ does not depend on the adapted coordinates (note 45, Proposition 2.4), so the local ideals glue. The components of $E$ are smooth, so the valuation of $\mathcal T_m$ along a component $E_i$ equals the local exponent $\tilde r_i$ at each point of $E_i$. The order of a coherent ideal $\mathcal I$ is upper semicontinuous, because the set where it is at least $a$ is the zero set of the $D^{(\alpha)} \mathcal I$ with $|\alpha| < a$. For (2), let $\lambda^+$ be the least value above $\iota(x)$. The set where $\iota \ge \lambda^+$ is closed and does not contain $x$, and $U$ is its complement. Part (2) is about the local top locus at a closed point, not about the global top locus that an algorithm uses. Upper semicontinuity is not automatic for invariants built from Hasse-Schmidt derivations: the slope invariant of Benito and Villamayor is not upper semicontinuous in general [BenV13, Sections 1.5 and 4.1]. Handbook Volume 7, Section 3.19. The result is not in Lean.'

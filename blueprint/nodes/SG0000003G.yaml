notes: In characteristic 0 the criterion asks that each $g_\sigma = 0$ be smooth in the torus. In characteristic $p$ it asks that $g_\sigma$ have no torus critical point at all, because $\partial_z z^p = 0$. A vertex of the polyhedron in $p\mathbb{N}^n$ makes $z^p + g$ degenerate. The library proves the pointwise statement for each polynomial $h$, and the vertex statement. It does not define Newton nondegeneracy face by face, and it does not prove the toric resolution of Varchenko and Khovanskii.

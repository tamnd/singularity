tag: SG0000003G
kind: theorem
title: The Newton criterion for z^p + g
statement: Let $K$ be an algebraically closed field of characteristic $p > 0$ and let $g \in K[x_1, \dots, x_n]$ with $g(0) = 0$. Then $z^p + g$ is Newton nondegenerate if and only if, for each compact face $\sigma$ of the Newton polyhedron of $g$, the initial form $g_\sigma$ has no critical point in the torus. The key step is that $z^p + h$ is singular at a torus point $(v, c)$ if and only if $v$ is a critical point of $h$ and $c^p = -h(v)$.
sources:

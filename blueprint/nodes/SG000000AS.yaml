tag: SG000000AS
kind: definition
title: 'Valuations of Knaf-Kuhlmann type in dimension 4 with value group Z^2'
statement: 'Let $k$ be an algebraically closed field of characteristic $p$, $F/k$ a function field of transcendence degree 4 and $\nu$ a valuation of $F$, trivial on $k$, with $F\nu = k$ and $\nu F \cong \mathbb{Z}^2$. A projection is a transcendence basis $x_1, \dots, x_4$ of $F/k$ in $F$, with $K = k(x_1, \dots, x_4)$ and $K_i = k(x_1, \dots, x_i)$. If $\nu$ has rank 1, the pair $x_1, x_2$ is adapted if $\nu(x_1), \nu(x_2)$ is a basis of $\nu F$, and $C = K_2^c$ is the completion of $K_2$. The valuation $\nu$ is of Knaf-Kuhlmann type (KK type) if $F \subseteq F_0^c$ for a subfield $F_0$ such that $\nu|_{F_0}$ is an Abhyankar valuation. Here $F \subseteq F_0^c$ means that for each $a \in F$ and each $\alpha \in \nu F$ there is $b \in F_0$ with $\nu(a - b) \ge \alpha$.'
sources:

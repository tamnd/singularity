notes: 'This is Definition 1.3 of research note 76. The valuations of KK type have local uniformization by Theorem 1.5 of [KK09]. If $\nu F = \mathbb{Z}$ and $F\nu = k$, then $F$ lies in the completion of a rational function field in one variable (Corollary 3.10 of note 57), so $\nu$ is of KK type. Abhyankar valuations are of KK type with $F_0 = F$. So for a valuation with residue field $k$ in dimension 4, the value group $\mathbb{Z}^2$ is the first case that these two results do not cover. Handbook Volume 9, Section 3.23. The result is not in Lean.'

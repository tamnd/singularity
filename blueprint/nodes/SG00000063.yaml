notes: This is Lemma 3.15.2 of Volume 7 of the handbook, with Remark 3.15.3. The module of the logarithmic derivations does not depend on the free coordinate, and a change of the coordinate and the cleaning change $g$ by a $p$-th power. For the run, write $x'' = x u + f(y, z)$ with $u$ a unit. After a chart with the chart variable $L$, the function $x'' / L$ minus its value $t''$ at the new point is again a free coordinate, since its derivative in $x_1$ at the point is $u(0)$. The claim of note 30 that the new coordinate is $x_1$ times a unit is false, with the counterexample $u = 1 + y$, $t = 1$ and the $y$-chart. The fix and the proof of the second claim are in note 33 of the research notes. The result is not in Lean.

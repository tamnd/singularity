tag: SG00000063
kind: lemma
title: The residual order of the log-Jacobian ideal does not depend on the free coordinate
statement: Let $n = 3$, $\Delta = \{V(y), V(z)\}$, and let $g$ be clean with $\Theta(g) = (g_x, y g_y, z g_z) = x^r \widetilde\Theta(G)$. Then $\Theta(g + h^p) = \Theta(g)$, $x^r$ is the largest monomial in $y, z$ that divides $\Theta(g)$, and $\rho = \operatorname{ord} \widetilde\Theta(G)$. These do not change if $x$ is replaced by any $x''$ such that $(x'', y, z)$ is a regular system of parameters, or if $g$ is multiplied by $\varepsilon^p$ with $\varepsilon$ a unit. A corner run with free translations from $P_m$ is a corner run with free translations in the coordinates $(x'', y_m, z_m)$ for each such $x''$, with the same points and the same $\rho$.

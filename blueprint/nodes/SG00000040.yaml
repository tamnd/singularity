notes: This is the second form of resolution in [Kol07, Chapter 3]. Kollár deduces it from the functorial principalization SG00000043 together with a compatibility with closed embeddings. A morphism with these properties is a resolution in the sense of SG00000004, so the theorem is stronger than SG0000001P for integral quasi-projective varieties. Volume 2, Theorem 1.1.3 of the handbook. No Lean statement yet.

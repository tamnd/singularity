tag: SG00000040
kind: theorem
title: Strong resolution in characteristic 0
statement: Let $X$ be an integral quasi-projective variety over a field $k$ of characteristic 0. Then there is a projective birational morphism $\Pi \colon X' \to X$ such that $X'$ is smooth, $\Pi$ is an isomorphism over the regular locus of $X$, and $\Pi^{-1}(\operatorname{Sing}(X))$ is a divisor with simple normal crossings on $X'$.
sources:
- paper: Hir64
- paper: Kol07

notes: This is Lemma 3.18.15 of Volume 7 of the handbook (Section 3.18). It is Lemma 5.1 of note 52 of the research notes, checked again in note 54, Part A. The series $x'' = (g_m - A_{00}) / \mu$ is a free coordinate, the point is cylindrical, and SG0000006V reduces the run to a corner run with free translations of $\mu' x'' + B'_0$, which SG00000066 (Theorem 3.15.16) excludes. The result is not in Lean.

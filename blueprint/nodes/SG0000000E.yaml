tag: SG0000000E
kind: theorem
title: The bridge to formal-conjectures
statement: 'Let $X$ be an integral variety over a perfect field $k$ and let $\pi : Y \to X$ be a resolution in the sense of the project. Then $\pi$ is a resolution in the sense of google-deepmind/formal-conjectures: $Y$ is integral and smooth over $k$, and $\pi$ is proper and birational over $X$. Thus the statement of the project in dimension $n$ implies the statement `resolution_of_singularities` of formal-conjectures in dimension $n$. The converse is not a formal consequence, because a resolution of formal-conjectures need not be an isomorphism over the whole regular locus.'

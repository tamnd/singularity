notes: This is Lemma 3.18.9 of Volume 7 of the handbook (Section 3.18). It is Lemma 4.1 of note 52 of the research notes (the statement T1 of note 50), checked again in note 54, Part A. Write $\beta / \alpha = c + u'$ with $c \in K$ and $v(u') > 0$. Then $\varphi_\infty + c \psi_\infty$ has an infinite number of terms below $1 + \theta$ by the planarity for $(1, c)$, and $u' \psi_\infty$ and $\gamma / \alpha$ have only a finite number. No theory of Kaplansky type in two variables is used. The result is not in Lean.

tag: SG0000000V
kind: definition
title: Simple normal crossings
statement: A divisor on a regular scheme has simple normal crossings when its components are regular and meet transversally.
sources:
- paper: SNC
lean:
  statement: Singularity.IsSncDivisor
tier: T1
notes: The Lean definition of tamnd/singularity-lean#61 follows Stacks tag 0BI9. At each point, the stalk of the divisor is generated by the product of some members of a regular system of parameters. On a regular Noetherian scheme this is the same as the statement above. The Lean result `Singularity.isSncDivisor_of_codim_one` proves that a regular closed subscheme of codimension 1 of a regular scheme is a divisor with simple normal crossings.

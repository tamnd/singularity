notes: 'This is Lemma 6.1 and Proposition 6.2 of research note 58, with the scope of the referee report in note 73: a linear $\mathbb{G}_m$-action with all weights at least $1$ and prime to $p$. Weights of mixed sign or zero, weights divisible by $p$ and actions that are not linear are not covered. The proof uses Jacobson''s formula $(\delta + a)^p = \delta^p + a^p + \delta^{p-1}(a)$. The reduction lives on the chart $\mathbb{A}^4$ above $[\mathbb{A}^4 / \mu_{w_i}]$, so a resolution of the chart problem must be $\mu_{w_i}$-equivariant and must glue across the charts. Handbook Volume 9, Section 3.22. Not in Lean.'

tag: SG000000AF
kind: theorem
title: The G_m case after one weighted blowup
statement: Let $\mathbb{G}_m$ act linearly on $\mathbb{A}^4$ with weights $w_i \ge 1$ prime to $p$, and let $\mathcal{F}$ be a $\mathbb{G}_m$-invariant rank one foliation. Blow up the origin with the weights $w$, and take the chart $D_+(x_i)$ with coordinates $u$, $x_i = u^{w_i}$, and $v = (v_j)_{j \ne i}$. On this chart the pullback is generated either by $\partial_u$ or by $D' = \alpha(v) u \partial_u + \delta$, with $\delta = \sum_j b_j(v) \partial_{v_j}$ and $\gcd(\alpha, b_1, b_2, b_3) = 1$. In the second case $p$-closure is equivalent to $\delta^p = H \delta$ and $\alpha^p + \delta^{p-1}(\alpha) = H \alpha$ for one $H \in k[v]$, and $\operatorname{Sing} = (\{u = 0\} \times Z(\delta)) \cup (\mathbb{A}^1 \times (Z(\delta) \cap V(\alpha)))$, where $Z(\delta) = V(b_1, b_2, b_3)$.

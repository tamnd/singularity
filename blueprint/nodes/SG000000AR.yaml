notes: This is Proposition 6.6 of the referee report in note 73 on research note 58. The proof is Hochschild's formula $(g E)^p = g^p E^p + (g E)^{p-1}(g) E$. In SG000000AC, $d = p - 1$ and $\delta(\alpha) = 0$ in the chart $x$, which gives $H = \alpha^{p-1}$ again. So the case $H = 0$ of Problem 6.4 is the one that additive invariant foliations of degree divisible by $p$ produce, together with the untwisted charts. Handbook Volume 9, Section 3.22. Not in Lean.

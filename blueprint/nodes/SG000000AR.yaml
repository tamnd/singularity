tag: SG000000AR
kind: theorem
title: Where the case H = 0 of Problem 6.4 comes from
statement: Let $D$ be an additive foliation on $\mathbb{A}^4$, homogeneous of degree $d$ for a linear $\mathbb{G}_m$-action with positive weights prime to $p$, and assume that on the chart $D_+(x_i)$ of the weighted blowup of the origin the pullback is $u^d D'$ with $D' = \alpha u \partial_u + \delta$ saturated and $D'^p = H D'$. Put $c_0 = 1$ and $c_{k+1} = \delta(c_k) + d (k + 1) \alpha c_k$. Then $H = -c_{p-1}$. In particular $p \mid d$ implies $H = 0$, and $\delta(\alpha) = 0$ implies $H = d^{p-1} \alpha^{p-1}$.
sources:

tag: SG000000AK
kind: conjecture
title: The equivariant gluing of the chart by chart resolutions
statement: Let $\mathcal{F}$ be as in SG000000AF, and assume $\alpha = 0$ on each chart of the weighted blowup of the origin where the pullback is not generated by $\partial_u$. Then there is a proper birational morphism from a regular tame Deligne-Mumford stack (a regular variety if $p = 2$) to the weighted blowup on which the pullback of $\mathcal{F}$ is regular. In other words, the chart by chart resolutions of SG000000AH can be chosen $\mu_{w_i}$-equivariant and compatible on the overlaps of the charts.

notes: This is the open statement 2 of the referee report in note 73. Posva's Remark 5.1.5 shows that it is a real issue, since his methods are not functorial for etale morphisms. The first test case is SG000000AC, where $D$ has the two first integrals $z$ and $w$ and the singular locus of the chart foliation is a smooth curve. It is not known whether the statement is true. Handbook Volume 9, Section 3.22.

tag: SG0000000J
kind: theorem
title: A regular local ring is a domain
statement: A regular local ring is an integral domain. The proof is by induction on the dimension. The inductive step divides by an element of $\mathfrak{m} \setminus \mathfrak{m}^2$ that is in no minimal prime ideal.

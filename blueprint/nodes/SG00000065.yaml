tag: SG00000065
kind: theorem
title: If the dominant index is 1 then only a finite number of nonzero translations have y^b M_{j+1} not a p-th power
statement: Let $g \in K[[y, z]][x]$ be clean at $P_N$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations with an infinite number of nonzero translations. Assume that the dominant index of Kaplansky of $g$ and the sequence of the translations is $1$, for example that $\deg_x g < p$. Let $y^b$ be the leading monomial of $g_x(\varphi_\infty)$. Then only a finite number of the $t_j \ne 0$ have $y^b M_{j+1}$ not a $p$-th power.

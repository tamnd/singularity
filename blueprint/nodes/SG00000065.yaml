notes: This is Theorem 3.15.12 of Volume 7 of the handbook, with Lemma 3.15.9. The proof works in the Hahn field $K((t^{\mathbb{Z} + \theta \mathbb{Z}}))$, where $\varphi_\infty$ is defined. With $W = \beta_1 + 1 + \theta$, the Taylor expansion of $g$ at $\varphi_\infty$ shows that the cleaning of $g(\varphi_m)$ is $-c_b \sum_{j \ge m} t_j (y^b M_{j+1})^\natural$ modulo terms of value at least $W$. The left side has only a finite number of monomials below $W$. The proof of part 3 in note 30 compares the terms with the wrong number, and note 33 of the research notes gives the correct proof. The case of a dominant index larger than $1$ is open, with a partial result in Remark 3.15.13. The result is not in Lean.

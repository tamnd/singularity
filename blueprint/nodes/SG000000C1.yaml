tag: SG000000C1
kind: theorem
title: 'Principalization and Fac_3^L give the fundamental theorem in dimension 4'
statement: 'Assume SG000000BV. Let $(V_0, V_1, N)$ be as in SG000000BQ, and assume that $\mathrm{Fac}_3^L$ of SG000000BZ holds for this triple. Then the conclusion of SG000000BQ holds for $(V_0, V_1, N)$. In particular $\mathrm{Fac}_3$ implies SG000000BQ, and if $V_1$ is regular, then SG000000BV alone gives the conclusion for the triple.'

notes: 'Theorem 77.8 of research note 77, in the form of Proposition 83.11 of note 83 that the referee report in note 82 asks for. The proof is the proof of [Cut09] Theorem 15.1 in dimension 4 with a corrected case analysis. Cutkosky applies Abhyankar''s theorem at $\eta_1$ without a check that $\eta_1$ is regular; the repair is Claim A in the form that each component of the fundamental locus $\Phi$ of $V_2 \dashrightarrow V_3$ that meets $L$ lies in $\alpha^{-1}(\mathrm{Sing}\, V_1)$. The cases of Claim A are: $\eta_1$ singular, $d = 0$, $d = 1$ (this uses $\mathrm{Fac}_3^L$) and $d = 2$ (SG000000BY). Both hypotheses on factorization are false in general (SG000000C4, SG000000C5), so the theorem does not give SG000000BQ. Steps 2, 3 and 5 of the proof need only the weak form of SG000000BV (SG000000CC), and $V_2$ can be replaced by a normal modification on which the valuations of $L$ keep regular centers (SG000000CF). Handbook Volume 9, Section 3.24. The result is not in Lean.'

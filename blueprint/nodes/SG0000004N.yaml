notes: The proof uses the theorem of Lucas. If $\beta$ is not divisible by $q$, put $\alpha_i = \beta_i \bmod q$. Then $\alpha \ne 0$, $\alpha_i < q$ and $\binom{\beta}{\alpha} \equiv 1 \pmod p$, so $D^\alpha$ sees the monomial $x^\beta$. The first derivatives give only the case $e = 1$. The log-Jacobian ideal of SG0000003E uses only the first derivatives, so it sees the $p$-th powers but not the $q$-th powers for $e \ge 2$. The example $x^p y^p$ is killed by each derivation, but $D^{(p, 0)}$ sends it to $y^p$. The linearity is Singularity.Algebra.MvHasse.hasseDeriv_expand_mul, the first claim of Volume 1, Theorem 6.3.6 of the handbook (tamnd/singularity-lean#91).

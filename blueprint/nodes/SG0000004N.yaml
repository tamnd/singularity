tag: SG0000004N
kind: theorem
title: The test for q-th powers by the Hasse-Schmidt derivatives
statement: Let $R$ be a commutative ring of characteristic $p > 0$, let $q = p^e$ and let $f \in R[x_1, \dots, x_n]$. Then $f$ is a polynomial in $x_1^q, \dots, x_n^q$ if and only if $D^\alpha f = 0$ for each multi-index $\alpha \ne 0$ with $\alpha_i < q$ for each $i$. For such $\alpha$, the operator $D^\alpha$ is linear over the polynomials in $x_1^q, \dots, x_n^q$.

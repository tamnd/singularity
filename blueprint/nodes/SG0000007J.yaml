tag: SG0000007J
kind: lemma
title: The chart of a lifted base blowup
statement: Let $R$ be a commutative ring of characteristic $p > 0$, $q = p^e$, $I$ an ideal, $g, h \in R$ with $g + h^q \in I^q$, let $\varphi \colon R \to A$ be a ring homomorphism and $x \in A$ with $\varphi(I) A \subseteq (x)$. Then there is $g'' \in A$ with $\varphi(g + h^q) = x^q g''$, and the substitution $z = h + x z''$ sends $z^q + g$ to $x^q (z''^q + g'')$.
sources:

tag: SG0000005F
kind: theorem
title: The kangaroo path conjecture holds if the codimension at the start is at most 1
statement: In the setting of SG0000004Z, let $\rho = \rho(g)$ be finite. If $\rho = 0$, then $\tau_\rho(g) = 0$. If $\rho \ge 1$ and $g$ is in the first case, then $\tau_\rho(g) \ge 1$. Thus the conclusion of SG0000005D holds for each kangaroo path with $\tau_\rho(P_0) \le 1$.

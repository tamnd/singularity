notes: A form $F$ of positive degree with $T(F) = K^n$ is $0$. For each $i$, the substitution $s \mapsto x_i$, $x_i \mapsto 0$ in the identity $F(x + s e_i) = F(x)$ gives $F = F|_{x_i = 0}$, so no monomial of $F$ contains $x_i$. This argument holds over each field, also over a finite field. In the first case $\Theta_0(g)$ has an element $x^r \psi$ of order $|r| + \rho$, so $\operatorname{ord} \psi = \rho$, and the part of degree $\rho$ of $\psi$ is a nonzero form of positive degree. So a counterexample to SG0000005D must have $\tau_\rho(P_0) \ge 2$, and SG0000005G is one.

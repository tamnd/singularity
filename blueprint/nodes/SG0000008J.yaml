notes: This is Theorem 3.18.16 of Volume 7 of the handbook (Section 3.18). It is Theorem 5.3 of note 52 of the research notes, checked again in note 54, Part A. The two derivatives of $g_m$ have the form of SG0000008F, and SG0000008H gives the contradiction. It is the case $\deg_{x, w} g = 2$ of SG0000008K. The result is not in Lean.

notes: 'This is Proposition 81.13 of research note 81. By SG0000009M there is a step of the rule, with a forced centre, at which $\omega$ goes from $1$ to $\frac{p+1}{p}$, for each odd $p$. At this step $(\omega, s)$ goes up for each $s$. SG0000009K gives a second family, with $\omega$ from $\frac{p+3}{2(p+1)}$ to $\frac{p+2}{2p}$. Both rises happen at points that are not chart origins and need a new preparation of $z$, as Corollary 61.12 of note 61 predicts. So a proof of SG0000009T for $\omega > 0$ must bound the rises of $\omega$, or use an invariant in which $\omega$ is not the first entry. On the toric branches the pair of SG000000BF works. Handbook Volume 7, Proposition 4.5.14. The result is not in Lean.'

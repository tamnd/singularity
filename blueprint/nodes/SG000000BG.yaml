tag: SG000000BG
kind: theorem
title: 'No lexicographic pair that starts with omega decreases at each step of Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. For each odd $p$ there is no function $s$ of the point, with values in a totally ordered set, such that $(\omega, s)$ decreases strictly in the lexicographic order at each step of Rule 61.9'' from a point of multiplicity $2p$ to a point of multiplicity $2p$ over the chosen centre.'

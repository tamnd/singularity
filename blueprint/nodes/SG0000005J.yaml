tag: SG0000005J
kind: counterexample
title: A run at an isolated point of the locus of rho does not end
statement: Over $\mathbb{F}_2$ in the variables $x, y, z$, let $\Delta = \{x, z\}$ and $g_k = x^{5+3k} y^2 z^3 + x^{10+3k} y^3 z^2$ for $k \ge 0$. Then $G = y^2 z + x^5 y^3$ at each point $P_k = (\Delta, g_k)$, $\rho = 3$ at the origin, and the origin of the $x$-chart of $P_k$ is $P_{k+1}$. So the run does not end. The origin is an isolated point of the locus where $\rho \ge 3$, and $\rho = 2$ at the other points of the $x$-axis. The order of $G$ is 3 along the $x$-axis.
sources:

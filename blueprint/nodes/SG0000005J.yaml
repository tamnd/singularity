notes: The generators of $\widetilde\Theta(G)$ are $e_x = e_z = y^2 z$ and $\partial_y G = x^5 y^2$, so $\widetilde\Theta(G) = (y^2 z, x^5 y^2)$. So the form of the hypothesis on runs with $\widetilde\Theta(G)$ in place of $G$ is false, and the centers must come from the locus of the order of $G$. The Lean proof is symbolic in $k$, and `Singularity.CurveRuns.logJacobianOrder_localPoint_isolatedPoint` proves that $\rho = 2$ at the point $(1, 0, 0)$. The Lean file does not prove that the origin is isolated in the locus, because that statement is over an algebraically closed field. This is Example 3.12.4 of Volume 7 of the handbook, and the test `inv39.py` found it.

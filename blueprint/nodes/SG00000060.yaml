tag: SG00000060
kind: theorem
title: Each origin run with an infinite number of corner steps has corner curves with the order of G at least rho
statement: Let $n \ge 3$, and let $P_0, P_1, \dots$ be an infinite origin run with $\rho \ge 1$ at each point and an infinite number of corner steps. Then the set $L$ of the letters that occur an infinite number of times has $2 \le |L| \le n - 1$. For each $m$ large enough there are $|L|$ regular coordinate curves at $P_m$, each in a component of $\Delta_m$, with $\nu^G = d_m \ge \rho$. So Question 3.13.18 of Volume 7 has a positive answer for each origin run, in each dimension $n \ge 3$.

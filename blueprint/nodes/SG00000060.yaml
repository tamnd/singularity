notes: This is Corollary 3.14.8 of Volume 7 of the handbook. A run has an infinite number of corner steps if and only if at least two letters occur an infinite number of times, and SG0000005Y shows that at most $n - 1$ letters do. SG0000005Z applies from a point after the last step with a letter not in $L$ and after the first step of each letter of $L$. For $n = 3$, $|L| = 2$, and the corollary is Theorem 3.13.20 (SG0000005R) after a change of the names of the variables. The answer is for origin runs only. The runs with translations are open, except for the class of SG0000005W. The result is not in Lean.

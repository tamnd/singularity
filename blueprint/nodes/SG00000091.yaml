notes: This is Corollary 3.18.27 of Volume 7 of the handbook (Section 3.18). It is Corollary 3.2 of note 64 of the research notes, refereed in note 67. It is part (c) of SG00000090. It is the two-variable analogue of the statement of Kaplansky that the dominant index of Lemma 3.15.8, part 2, is a power of $p$, but the proof uses only the induction of SG00000090. The result is not in Lean.

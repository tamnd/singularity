tag: SG00000068
kind: example
title: A corner run of x^2 y^(p-2) z^(p-2) keeps rho equal to 1
statement: Let $p \ge 3$, $n = 3$, $\Delta = \{y, z\}$ and $g = x^2 y^{p-2} z^{p-2}$, so $g = x^2 y z$ for $p = 3$. The origin of the $y$-chart and the origin of the $z$-chart send $g$ to $g$, and $\rho = 1$ at each point. So each sequence of the two charts at the origin in which both charts occur an infinite number of times is a corner run with free translations, with all translations $0$, $\rho = 1$ and $\deg_x g = 2 < p$.

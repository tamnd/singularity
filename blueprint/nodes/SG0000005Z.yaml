notes: This is Theorem 3.14.7 of Volume 7 of the handbook, with Lemma 3.14.3, Proposition 3.14.4 and Lemma 3.14.6. It is the Theorem 2 and Proposition 3.5 of note 31 of the research notes with the statement of note 32. With $\sigma(e)$ the sum of the exponents of the variables of $U$ and $q_t(e) = (k - 1) e_t + \sigma(e) - p$, the exponent of $x_s$ at $P_m$ is $(q(e) \cdot c_s - \sigma(e) + p)/(k - 1)$. SG0000005X shows that no nonzero integer vector is orthogonal to a vector of the limit cone, so the cone is one ray $\omega$. The monomials with the least value of $q \cdot \omega$ and the largest $\sigma$ give $h$. The dichotomy SG0000003F gives $d_m \in \{\rho, \rho + 1\}$. For $n = 3$ and $k = 2$ this is Theorem 3.13.20 (SG0000005R). The case $|U| \ge 2$ of the directrix and the runs with translations are open. Note 32 checks the theorem on $14530$ random runs for $(n, k)$ equal to $(3, 2)$, $(4, 2)$, $(4, 3)$, $(5, 3)$ and $(5, 4)$, with no failure. The result is not in Lean. The Lean file Singularity/Invariant/OriginRunsCorner.lean (tamnd/singularity-lean#183) proves parts 1 to 3 when the inequalities of Lemma 3.14.6 are given as a hypothesis (Singularity.OriginRuns.CornerIneq). Singularity.OriginRuns.originRun_divisorExponent_eq gives the divisor exponents, originRun_ord_residualFactor gives the degree d_m, originRun_orderGAlong_corner gives the order of G along each corner curve, and originRun_logJacobianOrder_le_orderGAlong gives that this order is at least rho. The limit argument of Proposition 3.14.4, the existence of m_0, the initial form h and parts 4 and 5 are not in Lean, so the node has no lean field.

tag: SG0000005Z
kind: theorem
title: The corner curves of an origin run with k charts have the order of G at least rho
statement: Let $P_N, P_{N+1}, \dots$ be an origin run in $n$ variables, let $L$ be a set of $k$ letters with $2 \le k \le n - 1$, and assume that each step has a letter in $L$, that each letter of $L$ occurs an infinite number of times, and that $L \subseteq \Delta_N$. Let $U$ be the other coordinates. Then the cones of the exponent columns shrink to one ray with positive and rationally independent entries. There is an $m_0$ such that for each $m \ge m_0$ the initial form of $G_m$ is a nonzero form $h$ in the variables of $U$ of a degree $d_m \in \{\rho(P_m), \rho(P_m) + 1\}$, and for each $t \in L$ the curve $C_t$, the zero set of $x_U$ and of the $x_s$ with $s \in L$ and $s \ne t$, lies in a component of $\Delta_m$ and has $\nu^G_{C_t}(P_m) = d_m$. If $U = \{u\}$ and $\rho(P_m) = d_m - 1$, the forms of degree $\rho$ of $\widetilde\Theta(G_m)$ are the multiples of $x_u^\rho$. For $m$ large the coordinate strata between the curves and $V(x_U)$ have an explicit order of $G$, and it is less than $d_m$ unless the monomials of the least value have one value of $\sigma$.

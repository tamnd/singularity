tag: SG000000C2
kind: theorem
title: 'A regular toric cone that toric monoidal transforms do not reach'
statement: 'Let $F$ be a field, $R = F[x,y,z]_{(x,y,z)}$, and let $\sigma_0 \subset \mathbb{R}^3_{\ge 0}$ be the cone spanned by $(0,1,3)$, $(1,1,1)$ and $(2,1,0)$. Then $\sigma_0$ is regular, the local ring $S_0$ of $F[\sigma_0^\vee \cap \mathbb{Z}^3]$ at its maximal monomial ideal birationally dominates $R$, and for none of the torus-invariant regular primes $P$ of $R$ of height at least 2 is $P S_0$ principal. So $S_0$ is not an iterated monoidal transform of $R$ with torus-invariant centers.'
sources:
- paper: Ful93
uses:

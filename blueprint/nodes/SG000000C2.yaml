notes: 'Proposition 77.11 of research note 77, confirmed in note 82. The determinant is $-1$. For a monomial ideal, $P S_0$ is principal if and only if one generator has the least weight on each generator of $\sigma_0$, and this fails for $(x,y)$, $(x,z)$, $(y,z)$ and $(x,y,z)$. Computation 77.11'' (rerun in note 82 with independent code) counts the regular cones in the octant with entries at most $B$ that toric star subdivisions do not reach: none for $B = 2$ (337 cones), 144 of 2515 for $B = 3$, and 900 of 8860 for $B = 4$. Handbook Volume 9, Section 3.24. The result is not in Lean.'

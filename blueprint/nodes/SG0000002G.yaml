tag: SG0000002G
kind: theorem
title: The maximal ideal of a regular local ring is generated by a regular sequence
statement: Let $(R, \mathfrak{m})$ be a regular local ring of dimension $d$. Then there is a regular sequence $x_1, \dots, x_d$ in $R$ that generates $\mathfrak{m}$. Thus a regular local ring is a Cohen-Macaulay ring.

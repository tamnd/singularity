notes: This is Lemma 3.16.4 of Volume 7 of the handbook. Put $G = F^{[p^a]}$. By Lucas, $G^{[i - p^a]} = s F^{[i]} \ne 0$. Lemma 3.16.3 (SG0000006A) gives $D(v(M_m)) > 0$ for the affine function $D(\gamma) = \beta_{pi} + p(i - p^a)\gamma - \beta_{p^{a+1}}$, which has a positive slope, and $v(M_m) < 1 + \theta$. So $D(1 + \theta) > 0$. This is the strong form of Lemma 3 of note 34, from note 35 of the research notes, and note 37 checked it a second time. Theorem D of note 36 is a second proof of the consequence on $\mathcal{T}$ (Remark 3.16.15). The result is not in Lean. Lean proves the binomial facts that the proofs use, $\binom{p^a s}{p^a} \equiv s \pmod p$ (Singularity.Translations.choose_pow_mul_pow_modEq) and $\binom{p^e}{l} = 0$ in characteristic $p$ for $0 < l < p^e$ (Singularity.Translations.choose_prime_pow_eq_zero), and the lemma of Lucas type of Remark 3.16.15, that $\sum_{i \in I} c_i ((U + Z)^i - U^i)$ is constant if and only if each $i \in I$ is a power of $p$ (Singularity.Translations.lucasPoly_isConstant_iff), from tamnd/singularity-lean#193.

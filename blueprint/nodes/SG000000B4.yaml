notes: 'This is Corollary 4.3 of research note 76, which the referee report in note 80 confirms. By SG000000B2(c) and SG000000AZ(b), $x_3$ has the ball property over $K_2$; in each case $x_4$ has it over $K_3$ by SG000000B2(a) or (c). Then SG000000B3 and SG000000B0 apply. Class (i) contains valuations that are not of KK type (SG000000B6). The method is the method of [KK09], Lemma 3.9 with Corollary 3.6; what is new is the classes and the explicit member. Handbook Volume 9, Section 3.23. The result is not in Lean.'

tag: SG000000B4
kind: theorem
title: 'Problem V7 for three classes of rank 1 valuations with value group Z^2'
statement: 'Let $\nu$ be as in SG000000AS with rank 1, and let $K$ be a projection with $x_1, x_2$ adapted and $F \subseteq K^h$. Assume one of the following: (i) $x_3 \in C$; (ii) $x_4 \in K_3^c$; (iii) $K_3^c$ is algebraically maximal. Then $(F, \nu)$ has local uniformization in the strong form.'

notes: Here $r = (0, 1, 1)$ and $G_0 = x^2 y^2 + x^2 z^2 + x^4 z$. The generators of $\widetilde\Theta(G_0)$ are $e_y = G_0$, $e_z = x^2 y^2 + x^2 z^2$ and $\partial_x G_0 = 0$, and the part of degree 4 of $G_0$ is $F_0 = x^2 (y + z)^2$. By SG0000005E, $T_\rho(P_0) = T(F_0) = \{a_x = 0, a_y = a_z\}$. At $P_1$, $g_1 = y^4 G_1$ with $G_1 = x^2 z^3 + x^4 y + x^4 y z^2$, the element $e_y$ has order 5, and the only form of degree 4 is $\operatorname{in}(\partial_z G_1) = x^2 z^2$. At $P_2$, $g_2 = y^7 G_2$ with $G_2 = x^4 + x^2 z^3 + x^4 y^2 z^2$, and $e_y = G_2$ has the initial form $x^4$, so $T_\rho(P_2) = \{a_x = 0\}$. The form $x^2 z^2$ of the free derivative $\partial_z G_2$ does not count in the first case, so $\widetilde\tau(P_2) = 2$ but $\tau_\rho(P_2) = 1$. This agrees with SG0000005B. The example was checked by hand and by the test `kverify.py`, and the test `tau35.py` found a longer form with three points of the second case. The Lean proof is over $\mathbb{F}_2$, with the variables $x, y, z$ as the indices $0, 1, 2$ of `Fin 3`. It computes $g_1$ and $g_2$, it gets the cases from the orders 6, 9 and 11 of the tangent ideals, and it uses SG0000005E for the bounds $\tau_\rho(P_0) \ge 2$ and $\tau_\rho(P_2) \le 1$.

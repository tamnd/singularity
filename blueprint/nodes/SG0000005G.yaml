tag: SG0000005G
kind: counterexample
title: A kangaroo path where the codimension of the directrix goes down from 2 to 1
statement: Over a field of characteristic 2 in the variables $x, y, z$, let $g_0 = x^2 y^3 z + x^2 y z^3 + x^4 y z^2$ and $\Delta = \{y, z\}$. Then $P_0$ is in the first case with $\rho = 4$ and $\tau_\rho(P_0) = 2$. At the point of the $y$-chart with $t_x = 0$ and $t_z = 1$, the new point $P_1$ is in the second case with $\rho = 4$ and $\tau_\rho(P_1) = 2$, and the component $z = 0$ leaves. At the origin of the $y$-chart of $P_1$, the new point $P_2$ is in the first case with $\rho = 4$ and $\tau_\rho(P_2) = 1$. So $P_0, P_1, P_2$ is a kangaroo path with $\tau_\rho(P_2) < \tau_\rho(P_0)$, and SG0000005D is false.

tag: SG0000000M
kind: theorem
title: Finiteness of normalization
statement: Let $k$ be a field and let $A$ be a domain that is a finitely generated $k$-algebra. Then the integral closure of $A$ in its field of fractions is a finite $A$-module. Thus the normalization of a variety is finite over it.

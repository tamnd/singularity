notes: 'This is Lemma 4.1 and Corollary 4.2 of research note 58, with the sentence that the referee report in note 73 adds to the saturation step: over the points with $x_j \ne 0$ for $j \ne i$, the chart is locally $x_i = s^m$ with $p \nmid m$, which is etale off $s = 0$, so the only possible common factor of the pulled back coefficients is a power of $s$. Handbook Volume 9, Section 3.22. Not in Lean.'

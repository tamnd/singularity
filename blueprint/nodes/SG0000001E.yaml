notes: The Lean statement of tamnd/singularity-lean#69 and tamnd/singularity-lean#70 uses the affine form of local uniformization (Singularity.HasLocalUniformization). For each finite subset of the valuation ring, there is a finitely generated k-subalgebra A of K with fraction field K that contains the set and is contained in the valuation ring, such that the localization of A at the center is a regular local ring. Volume 3, Proposition 4.1.6 of the handbook proves that this form is equivalent to the form with proper birational morphisms. The statement is not proved. The statement is the form of Knaf-Kuhlmann, with the residue field separably generated over k. The theorem gives a smooth center, and the statement asks only for a regular center. The divisorial case is proved in tamnd/singularity-lean#81 (Singularity.hasLocalUniformization_of_divisorial). The same pull request also proves the case where trdeg K/k is at most the transcendence degree of the residue field plus one (Singularity.hasLocalUniformization_of_trdeg_le_trdeg_residueField_add_one). The proof uses the fact that the valuation ring is then essentially of finite type over k, and thus a regular local ring in the Noetherian sense. This method does not work for an Abhyankar valuation of rational rank 2 or more, because the valuation ring is then not Noetherian. Volume 3, Proposition 4.1.8 of the handbook gives the text.

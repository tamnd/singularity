notes: The Lean statement of tamnd/singularity-lean#69 and tamnd/singularity-lean#70 uses the affine form of local uniformization (Singularity.HasLocalUniformization). For each finite subset of the valuation ring, there is a finitely generated k-subalgebra A of K with fraction field K that contains the set and is contained in the valuation ring, such that the localization of A at the center is a regular local ring. Volume 3, Proposition 4.1.6 of the handbook proves that this form is equivalent to the form with proper birational morphisms. The statement is not proved. The statement is the form of Knaf-Kuhlmann, with the residue field separably generated over k. [Cut20] removes the condition of separability on the residue field, so the theorem holds for each Abhyankar valuation of a function field over any field. The theorem gives a smooth center, and the statement asks only for a regular center. The divisorial case is proved in tamnd/singularity-lean#81 (Singularity.hasLocalUniformization_of_divisorial). The same pull request also proves the case where trdeg K/k is at most the transcendence degree of the residue field plus one (Singularity.hasLocalUniformization_of_trdeg_le_trdeg_residueField_add_one). The proof uses the fact that the valuation ring is then essentially of finite type over k, and thus a regular local ring in the Noetherian sense. This method does not work for an Abhyankar valuation of rational rank 2 or more, because the valuation ring is then not Noetherian. Volume 3, Proposition 4.1.8 of the handbook gives the text. tamnd/singularity-lean#121 proves the case of the theorem of Knaf-Kuhlmann without ramification, defect and splitting (Singularity.hasLocalUniformization_of_monomial_of_finrank_residueField_eq). Let k, K_0 and K be fields with k in K_0 in K and K finite over K_0, and let v be a valuation of K with restriction v_0 to K_0. Assume that v_0 is trivial on a subfield k(y) of K_0, that v_0 is a monomial valuation of K_0 over k(y), and that the residue extension of v over v_0 is separable and its degree is the degree of K over K_0. Then v has local uniformization over k. The proof uses the monomial case (SG0000004D), the existence of an étale generator in the case of one extension (SG0000004Y), and the lifting theorem (SG0000004C). tamnd/singularity-lean#138 proves the choice of the subfield for an Abhyankar valuation (Singularity.IsAbhyankarValuation.exists_isMonomialValuation_comap). Let r be the rational rank of the value group and t the transcendence degree of the residue field. Take r nonzero elements x whose values are linearly independent over the integers, and t elements y of the valuation ring whose residues are algebraically independent over k. Then x and y are algebraically independent, K is finite over K_0 = k(x, y), and the restriction to K_0 is trivial on k(y) and monomial over k(y). So an Abhyankar valuation has local uniformization if its residue extension over K_0 is separable of degree equal to the degree of K over K_0 (Singularity.hasLocalUniformization_of_isAbhyankarValuation_of_finrank_residueField_eq). The values of the x are not shown to be a basis of the value group, because the freeness of the value group (Volume 3, Corollary 2.2.4) is not in the library. The general case needs the stability theorem of Kuhlmann and the henselization, so Singularity.localUniformization_abhyankar has no Lean proof.

tag: SG0000005S
kind: example
title: Blowups of corner curves alone do not resolve
statement: Let $n = 3$, $\Delta = \{y, z\}$ and $g = x^a y^b z^c$ with $a \ge 2$, $p \nmid a$ and $a + b \ge p$. Then $\rho = a - 1$ and $d = a$. The corner curve $V(x, y)$ has $\nu^G = a \ge \rho$ and satisfies the conditions (H1) and (H2) of a permissible center. After its blowup, the only point over the origin with the same $\rho$ is the origin of the $y$-chart, where $g' = x'^a y^{a + b - p} z^c$. The same holds for $V(x, z)$. If $a > p$, the exponents $b$ and $c$ do not decrease, so a sequence of blowups of corner curves can go on for ever with $\rho = a - 1$. If $a < p$, each blowup makes $b$ or $c$ smaller by $p - a$. After a finite number of steps $a + b < p$ and $a + c < p$, no corner curve is a permissible center, and $\rho = a - 1$ still holds. In both cases the blowups of corner curves alone do not give $\rho = 0$.

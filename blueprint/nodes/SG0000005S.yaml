tag: SG0000005S
kind: example
title: Blowups of corner curves alone can keep rho for ever
statement: Let $n = 3$, $\Delta = \{y, z\}$ and $g = x^a y^b z^c$ with $a \ge 2$, $p \nmid a$ and $a + b \ge p$. Then $\rho = a - 1$ and $d = a$. The corner curve $V(x, y)$ has $\nu^G = a \ge \rho$ and satisfies the conditions (H1) and (H2) of a permissible center. After its blowup, the only point over the origin with the same $\rho$ is the origin of the $y$-chart, where $g' = x'^a y^{a + b - p} z^c$. The same holds for $V(x, z)$. So each sequence of blowups of corner curves keeps $\rho = a - 1$ for ever.
sources:

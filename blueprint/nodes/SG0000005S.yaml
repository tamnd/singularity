notes: This is Example 3.13.21 of Volume 7 of the handbook. The surface $V(x)$ has $\nu^G = a \ge \rho$, and its blowup gives $\rho = 0$. In Example 3.13.15 (SG0000005M) the corner curves work and no surface works. So the centers must come from the whole locus where $\nu^G \ge \rho$. The proof is in note 26 of the research notes. It is a direct computation and does not use Theorem 3.13.20 (SG0000005R). The Lean file Singularity/Invariant/LogJacobianCornerCurves.lean proves the example. It proves $\rho = a - 1$ (Singularity.CornerCurves.logJacobianOrder_curvePoly), $\nu^G = a$ along the corner curves (orderGAlong_curvePoly_xy and orderGAlong_curvePoly_xz), the conditions (H1) and (H2) (curvePoly_H1 and curvePoly_H2, first case of (H2)), and Theorem 3.4.5 for the charts (logJacobianOrder_cleanPart_le_curve_xy and logJacobianOrder_cleanPart_le_curve_xz). For $a > p$ it proves the infinite run (curveRun_of_charts). For $a < p$, curveRun_end proves that a run of corner curves stops after at most $(b + c)/(p - a)$ steps at a point where $g$ is not in $I_C^p$ for each corner curve $C$, with $\rho = a - 1$ at each point.

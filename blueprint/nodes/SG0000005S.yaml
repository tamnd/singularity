notes: This is Example 3.13.21 of Volume 7 of the handbook. The surface $V(x)$ has $\nu^G = a \ge \rho$, and its blowup gives $\rho = 0$. In Example 3.13.15 (SG0000005M) the corner curves work and no surface works. So the centers must come from the whole locus where $\nu^G \ge \rho$. The proof is in note 26 of the research notes. The Lean file Singularity/Invariant/LogJacobianCornerCurves.lean proves $\rho = a - 1$ (Singularity.CornerCurves.logJacobianOrder_curvePoly), $\nu^G = a$ along the two corner curves (orderGAlong_curvePoly_xy and orderGAlong_curvePoly_xz), the chart computation at the origin of the $y$-chart and the $z$-chart (centerRhoStep_curvePoint_y and centerRhoStep_curvePoint_z), and the infinite run for $a > p$ (curveRun_of_charts). It also proves that $\rho = 0$ at the other points over the center. The conditions (H1) and (H2) and the case $a < p$ are not in Lean.

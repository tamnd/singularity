notes: This is Example 3.13.21 of Volume 7 of the handbook. The surface $V(x)$ has $\nu^G = a \ge \rho$, and its blowup gives $\rho = 0$. In Example 3.13.15 (SG0000005M) the corner curves work and no surface works. So the centers must come from the whole locus where $\nu^G \ge \rho$. The proof is in note 26 of the research notes. The result is not in Lean.

tag: SG00000077
kind: lemma
title: For a point in the p-th powers of the free coordinates a step that keeps rho needs p-th powers of the letter
statement: Let $n = 4$, $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x^p, w^p]$ be clean with $\rho \ge 1$. If a $y$-step keeps $\rho$, then each monomial of $\operatorname{in} G$ has its exponent of $y$ divisible by $p$. The same holds for $z$ and a $z$-step.

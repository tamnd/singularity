notes: This is Lemma 3.17.26 of Volume 7 of the handbook (Section 3.17). Here $G_x = G_w = 0$, so the point has type $0$, and Theorem 3.7.1, part 1, applies to $r_y G + y G_y$ and $r_z G + z G_z$. It is Lemma 3.2 of note 40 of the research notes. The result is not in Lean.

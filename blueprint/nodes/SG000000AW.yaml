tag: SG000000AW
kind: theorem
title: 'Rank 2: local uniformization of the coarsening gives local uniformization of the valuation'
statement: 'Let $\nu = v_1 \circ \bar v$ be as in SG000000AT. If $v_1$ has local uniformization in the strong form, then $\nu$ has local uniformization in the strong form. In particular, $\nu$ has local uniformization in the strong form for each $d \in \{1, 2, 3\}$ if $\kappa = F v_1$ is finitely generated over $k$.'

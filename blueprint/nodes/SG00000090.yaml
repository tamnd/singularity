notes: This is Theorem 3.18.26 of Volume 7 of the handbook (Section 3.18). It is Theorem 3.1 of note 64 of the research notes, refereed in note 67, which found no gap. It extends SG0000008E to each degree, but without the chain of part (c) of SG0000008E, which is false in degree at least $p$ (Example 3.18.28). The proof is an induction on $\deg f$. Each Taylor term at $\Phi_m$ that is not of $p$-power order is compared with the term of $p$-power order below it, by Lucas' theorem. The terms of order $p^e$ are additive in the tail, and their germs are counted as in SG0000008D, with a lemma that separates the germs of different orders. No theory of Kaplansky type in two variables is used. For a linear run the statement is false. The result is not in Lean.

tag: SG00000090
kind: theorem
title: On a planar corner run a polynomial of any degree in the limits is not zero and its value is less than each shifted value of its derivatives
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty = (\varphi_\infty, \psi_\infty)$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational, and the completion $\hat H$ of $K(y_N, z_N)$ in it. The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Assume that the run is planar, and let $f \in \hat H[X, W]$ be nonzero, of any degree. Write $f^{[k, l]}$ for the Hasse derivatives, $\beta_{kl}(f) = v(f^{[k, l]}(\Phi_\infty))$ with $v(0) = \infty$, $\Lambda(f) = \min_{(k, l) \ne (0, 0)} (\beta_{kl}(f) + (k + l)(1 + \theta))$, and $\Lambda_e(f) = \min(\beta_{p^e 0}(f), \beta_{0 p^e}(f)) + p^e (1 + \theta)$ for $e \ge 0$. Then (a) $f(\Phi_\infty) \ne 0$ and $v(f(\Phi_\infty)) < \Lambda(f)$, that is, $v(f(\Phi_\infty)) < v(f^{[k, l]}(\Phi_\infty)) + (k + l)(1 + \theta)$ for each $(k, l) \ne (0, 0)$ with $f^{[k, l]} \ne 0$; (b) $v(f(\Phi_\infty) - f(\Phi_m)) > v(f(\Phi_\infty))$ for $m$ large, so $f(\Phi_m)$ and $f(\Phi_\infty)$ have the same term of least value for $m$ large; (c) $\Lambda(f) = \min_{e \ge 0} \Lambda_e(f)$, and $\beta_{kl}(f) + (k + l)(1 + \theta) > \Lambda(f)$ for each $(k, l) \ne (0, 0)$ that is not of the form $(p^e, 0)$ or $(0, p^e)$. In particular Conjecture T of Remark 3.17.34 holds for the planar runs.

notes: 'This is Theorem 10.1 of research note 55, with the notation that research note 60 corrected (the exponent vector is $\mu$, not $m$). It is Theorem 5.11 of research note 05 in each characteristic. The proof uses only the Jacobian criterion and the properness of $\pi$. The components of $F = 0$ in the coordinate hyperplanes become boundary divisors. A version is standard in characteristic 0 (Varchenko, Oka), and for characteristic $p$ there is work of Aroca, Gomez-Morales and Mourtada. The result is not in Lean.'

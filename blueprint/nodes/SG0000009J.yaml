tag: SG0000009J
kind: conjecture
title: Hypothesis H1 and Conjecture L-circle for all linear corner runs of cubics in characteristic 2
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Let $p = 2$ and $\deg_{x, w} g = 3$, and assume that an infinite number of the translations are not $0$. Let $(\alpha_0, \beta_0) \ne (0, 0)$ in $K^2$ and $J \ge N$ with $\alpha_0 a_j + \beta_0 b_j = 0$ for $j \ge J$, let $(x', w')$ be a linear free coordinate system with $x' = \alpha_0 x + \beta_0 w$, and let $(x'_m, w'_m)$ be its transforms. Then for $m$ large, $\operatorname{in} G_m = c\, x_m'^{\,d}$ with $c \in K^*$ and $d \in \{\rho, \rho + 1\}$, and the corner curves $V(x'_m, w'_m, y_m)$ and $V(x'_m, w'_m, z_m)$ have $\nu^G \ge \rho$.

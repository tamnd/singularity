notes: This was Conjecture 3.19.14 of Volume 7 of the handbook (Section 3.19) in the earlier editions. Theorem 3.19.14 (SG000000BJ) now replaces it. It is Conjecture 4.4 of note 69 of the research notes. Note 79 of the research notes, confirmed by the referee report in note 84, found the counterexample $g = x^2 w$ with the word $y z y z \dots$. The run is linear, keeps $\rho = 2$, has an infinite number of nonzero translations of $w$, and $\operatorname{in} G_m = x_m^2 w_m$ is not a power of a line. Only the clause on the initial form is false. The corrected form is SG000000BN, and the form for each $g$ is SG000000BP. It is the first case of the conjecture SG00000075 that stays open after SG0000006Z. SG0000009H proves it when the function of $P_J$ in the coordinates $(x', w')$ has no $x'^2 w'$, $w'^2$ or $w'^3$. The first open case has $x'^2 w'$ but not $w'^2$ and $w'^3$. Then the coefficient of $x_m'^2$ is the tower $\alpha + \sum_j b_j \operatorname{cl}(\beta M_{j+1})$, which is not a constant term, so the criterion of Lemma 3.18.3 does not bound its terms. The leaf checks of note 69 over $\mathbb{F}_2$ and $\mathbb{F}_4$ found the claim in all $3239$ linear leaves, with $d = \rho$ in $2818$ of them and $d = \rho + 1$ in $421$. The dives are finite and the fields are finite, so this was not a proof. The leaf checks did not see the counterexample, since its translations must avoid the points where $M_{j+1}$ has a class that is not $0$.

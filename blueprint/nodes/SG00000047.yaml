notes: This is Volume 2, Theorem 3.2.4 (going down and going up) and Corollary 3.2.5 of the handbook. The coefficient ideal is the one of [Vil89] and [EH02]. Kollár prefers other ideals, which are both D-balanced and MC-invariant [Kol07, Chapter 3]. The theorem reduces the dimension by one. No Lean statement yet.

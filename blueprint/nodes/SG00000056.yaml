tag: SG00000056
kind: theorem
title: The codimension of the directrix does not go down from the first case if no component of the divisor leaves
statement: In the setting of SG00000055, assume that $\rho(g'_c) = \rho(g)$, that the old point is in the first case, and that no component of $\Delta$ leaves, that is, $t_i = 0$ for each $i \in \Delta$ with $i \ne j$. Then $\tau_\rho(g'_c) \ge \tau_\rho(g)$. There is no hypothesis on $p$.

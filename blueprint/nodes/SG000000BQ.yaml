notes: 'This is $\mathrm{Fund}_4$, Definition 77.6 of research note 77. In dimension 3 it is [Cut09] Theorem 15.1, with $N$ restricted to the valuations with residue field $k$, and the patching step of [CP19] Section 4.1. In characteristic 0 it follows from the theorem of Hironaka by the converse part of SG000000BS. The referee report in note 82 found no proof in positive characteristic in dimension 4, and no proof by patching in any characteristic. By SG000000BT it is the global half of resolution of 4-folds. It is open. Handbook Volume 9, Section 3.24. The result is not in Lean.'

tag: SG000000BQ
kind: conjecture
title: 'Zariski''s fundamental theorem in dimension 4'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$ and let $K$ be a function field of transcendence degree 4 over $k$. Let $V_0$ and $V_1$ be normal projective models of $K$, and let $N$ be the set of valuations of $K/k$ whose center on $V_0$ or on $V_1$ is a regular point. Then there is a normal projective model $W$ of $K$, with birational morphisms $W \to V_0$ and $W \to V_1$, such that each $v \in N$ has a regular center on $W$.'
sources:

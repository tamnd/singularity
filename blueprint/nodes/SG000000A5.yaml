tag: SG000000A5
kind: theorem
title: Each Hasse-Schmidt residual order of level at least 2 goes up under some point blowup
statement: 'Let $K$ be an algebraically closed field of characteristic $p > 0$, $q = p^e \ge 3$ and $2 \le m < q$. Let $R = K[[x, y]]$ with the boundary $\{x\}$ and $g = x^{q+1} y^m + x^{q+2}$. Then $g$ is clean, $\operatorname{ord} g \ge q$, $\Theta^{\le m}(g) = (x^{q+1})$ and $\rho_m(g) = 0$. At the origin of the $y$-chart, with the boundary $\{x, y\}$, $\Theta'' = x^{q+1} y^2 (y^{m-1}, x)$ and $\rho''_m = 1$.'
sources:
- paper: HP19a
uses:
- SG0000009V
- SG000000A2
tier: T4
route:

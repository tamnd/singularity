notes: This is Conjecture 3.17.24 of Volume 7 of the handbook (Section 3.17). It is the conjecture L° of note 40 of the research notes, in the words of note 42. It implies a positive answer to Question 3.13.18 for these runs. It holds for the origin runs by Theorem 3.14.7 (SG0000005Z), at the cylindrical points of SG0000006W, for the runs of SG0000006R, and for SG00000072 and SG00000073. It holds for each corner run that is not planar with $\deg_{x, w} g < p$ (SG0000008A), and so for each corner run with $\deg_{x, w} g < p$ (SG0000008M), also in case 2 of SG0000007E. It is open for $\deg_{x, w} g \ge p$, so the node stays a conjecture. A form for $k \ge 3$ letters is open.

tag: SG000000CR
kind: theorem
title: 'The toric model of Rule 61.9'' terminates at chart origins for each boundary'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. The toric model with boundary $E$ acts on pairs $(U, E)$, where $U \subset \mathbb{Q}^3_{\ge 0}$ is finite and $E \subseteq \{0, 1, 2\}$. Its invariants are $\delta_S = \min_{u \in U} \sum_{k \in S} u_k$, $\mu_k = \delta_{\{k\}}$, $\delta = \delta_{\{0,1,2\}}$ and $\omega = \delta - \sum_{k \in E} \mu_k$, and its centre is the centre of Rule 61.9'' read from these invariants, with a divisorial step at each $k$ with $\mu_k \ge 1$. A step with centre $V(z, x_S)$ and chart $j \in S$ replaces each $u$ by $u''$ with $u''_j = \sum_{k \in S} u_k - 1$ and $u''_k = u_k$ for $k \ne j$, and the new boundary is $E \cup \{j\}$. For each $E$, in this model $\omega$ never increases and each run with $\omega$ constant is finite. So each sequence of the rule through chart origins, in the coordinates of the charts, along which $z$ stays simultaneously prepared, is finite.'

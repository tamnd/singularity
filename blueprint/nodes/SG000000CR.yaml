notes: 'This is Theorem 86.4 of research note 86, and it answers open statement 2 of note 81. Put $v_k = u_k - \mu_k$ for $k \in E$ and $v_k = u_k$ for $k \notin E$, so $\omega = \min |v|$. At a chart origin a step is again $T(v)_j = v_S - \omega$ and $T(v)_k = v_k$, whether $j$ was in $E$ or not, and the stages of the proof of SG000000BE go through with $\mu_k$ read as $0$ for $k \notin E$. A divisorial step at $k \notin E$ puts $k$ into $E$ and lowers $\omega$ by $\mu_k \ge 1$. In the case of an axis vertex $\omega e_b$ the number $\beta = \omega + [b \in E]\mu_b$ is constant, since $b$ is never the chart. A free coordinate $k$ enters $E$ at the first step in the chart of $x_k$. The lab of note 86 ran all $81$ cut nodes of note 72, $28$ of them with $E \ne \{0, 1, 2\}$: $2148$ nodes, $1045$ steps that keep $\omega$, longest run with $\omega$ constant $8$, and no violation of a monotone quantity of the proof. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Theorem 4.5.21. The result is not in Lean.'

notes: This is Conjecture 3.17.18 of Volume 7 of the handbook (Section 3.17). It is the conjecture L of note 38 of the research notes. It holds for the runs of SG0000006R, in the class of SG0000006X, at the cylindrical points of SG0000006W, and for each corner run with $\deg_{x, w} g < p$ (SG0000008M, from notes 50, 52 and 54 of the research notes). By SG0000008N it holds for a run if and only if the run is not planar. It is open for $\deg_{x, w} g \ge p$, so the node stays a conjecture. The runs of SG0000006T show that it cannot be replaced by the finiteness of all translations. Alone it does not give Question 3.13.18, and the form with the corner curves is SG00000075.

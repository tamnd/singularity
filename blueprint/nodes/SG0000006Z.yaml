notes: This is Corollary 3.19.7 of Volume 7 of the handbook (Section 3.19), which proves Conjecture 3.17.18 (Section 3.17) for each clean $g \in K[[y, z]][x, w]$. It was the conjecture L of note 38 of the research notes. It is Corollary 4.2 of the referee report 71, confirmed in note 74. For $\deg_{x, w} g = 0$ there is no run (SG0000006M). Otherwise the run is not planar by SG00000096, so it is linear, and by SG0000008N a linear run satisfies the statement in each free coordinate system. Before, it was known for the runs of SG0000006R, in the class of SG0000006X, at the cylindrical points of SG0000006W, for $\deg_{x, w} g < p$ (SG0000008M), for $\deg_{x, w} g = p$, under the condition (C) and in $K[[y, z]][x^p, w^p]$ (SG00000093). The statement is only for polynomials in $x, w$. For a power series in $x, w$ and for $g \in K[[x, y, z]]$ it is open. The runs of SG0000006T show that it cannot be replaced by the finiteness of all translations. Alone it does not give Question 3.13.18. The form with the corner curves is SG00000075, which stays open. The result is not in Lean.

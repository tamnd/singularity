notes: This is Volume 5, Lemma 2.1.4 and Theorem 2.1.5 of the handbook. A monomial valuation is an Abhyankar valuation with residue field $k$. Corollary 2.1.6 gives the same result over the ground field $k(y_1, \dots, y_t)$, and this is the form that the proof of SG0000001E uses. The charts $k[u_1, \dots, u_r]$ are smooth affine toric charts. tamnd/singularity-lean#110 and tamnd/singularity-lean#111 prove the node in Lean, in each characteristic and for value groups of each rank. The lattice lemma is Singularity.latticeLemma, for a basis of an ordered group isomorphic to $\mathbb{Z}^r$. A monomial valuation has local uniformization (Singularity.hasLocalUniformization_of_isMonomialValuation). The Lean statement is the last claim of the node. The claim on the charts $k[u_1, \dots, u_r]$ is in the proof of Singularity.hasLocalUniformization_of_isMonomialValuation_of_lattice, and it is not a separate Lean statement. A monomial valuation is an Abhyankar valuation (Singularity.IsMonomialValuation.isAbhyankarValuation). tamnd/singularity-lean#113 proves that the value group is free on the values of the $x_i$ (Singularity.IsMonomialValuation.valueGroupBasis) and that the residue field is $k$ (Singularity.IsMonomialValuation.residueFieldEquiv). It also proves Corollary 2.1.6 in the form over $k$ (Singularity.hasLocalUniformization_of_isMonomialValuation_adjoin): if $v$ is monomial over $k(y_1, \dots, y_t) \subseteq \mathcal{O}_v$, then $v$ has local uniformization over $k$.

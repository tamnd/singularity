notes: 'This is Hypothesis 2.2.5 of Volume 8 of the handbook, the only consequence of the moduli that the proof of SG0000001K uses. Proposition 2.2.6 of Volume 8 proves it from SG0000004H, with the argument of [dJ96, 4.17]: take a component of the scheme of level structures, and the closure of the graph of the map to $\overline{M}$. Volume 8, Chapter 4 proposes it as the named hypothesis of the first Lean form of SG0000001K (open question Q-08). No Lean statement yet.'

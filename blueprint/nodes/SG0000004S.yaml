tag: SG0000004S
kind: theorem
title: The end case of the log-Jacobian ideal
statement: Let $g \ne 0$ be clean with $g = x^r G$ as in SG0000003F. Then $\rho(g) = 0$ if and only if $G(0) \ne 0$ and $p \nmid r_i$ for some $i \in \Delta$ (type 0), or $G(0) = 0$ and $\partial_j G(0) \ne 0$ for some $j \notin \Delta$ (type 1). Over $K[[x]]$ with $K$ algebraically closed, a change of the coordinates adapted to $E$ then gives $g = x^r$ in type 0 and $g = x^r x_j$ in type 1, so $z^p + g$ is a binomial equation.
sources:

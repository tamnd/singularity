tag: SG00000085
kind: theorem
title: Jung's method for a 4-fold with a projection of local degree less than p
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$ and $X$ a normal projective 4-fold over $k$. Suppose that there is a finite surjective morphism $\pi \colon X \to W$ onto a regular projective 4-fold $W$ such that, at each point $x \in X$, the degree of the fraction field of $\mathcal{O}_{X,x}^*$ over the fraction field of $\mathcal{O}_{W,\pi(x)}^*$ is less than $p$. Suppose also that the branch divisor $B$ of $\pi$ has an embedded resolution $W' \to W$ by blowups in regular centers whose total transform is a divisor with simple normal crossings. Then $X$ has a resolution $Y \to X$ that is projective and birational.

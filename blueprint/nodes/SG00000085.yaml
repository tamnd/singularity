notes: Theorem 4.1 of research note 56, checked in note 62. It is the standard toroidal argument of Jung, with the precise hypothesis (TP) on the local degrees. The proof normalizes $W'$ in $k(X)$, shows that the local degrees do not go up and that the cover is tame along the total transform of $B$, applies SG0000007Z to see that $X'$ is formally the quotient $k[[z_1, \dots, z_4]]^G$ by a diagonal group of order prime to $p$, so log regular (Kato, [S]), and applies SG00000080. SG00000084 shows that (TP) can fail for each linear projection of a smooth 4-fold, while some of these projections are tame. Whether (TP) can be replaced by tameness of $\pi$ along $B$ is open. Handbook Volume 9, Section 3.21. Planned for Lean.

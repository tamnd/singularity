notes: This is Hypothesis 3.13.12 of Volume 7 of the handbook, and Hypothesis H4' of milestone S7.18 (tamnd/singularity#245). The order along $Z$ is the intrinsic order of the clean part of $g$ along $Z$, minus the entries of $r$ for the components of $\Delta$ that contain $Z$. The case $\rho = 0$ is excluded, because $g = x^{p+1} y^{p+1}$ with $\Delta = \{x, y\}$ has $\rho = 0$ and the corner charts keep it. In two variables the form with a regular curve not in $\Delta$ holds. In three variables a curve is not enough. For example, $g = x^p y z$ with $\Delta = \{y, z\}$ has a run that takes the $y$-chart and the $z$-chart in turn, and it lies on the surface $x = 0$. The example of [CP19, Example 3.18], $g = x_2^p x_3^p x_4 + x_1^p x_3$ with $\Delta = \{1, 2\}$, has runs along transcendental arcs in the plane $x_1 = x_3 = 0$, so the subvariety $Z$ can be needed in place of the arc. The open step is a run with infinitely many corner steps (Lemma C of note 20 of the research notes). If the conjecture holds, a run at an isolated point of the locus of the order of $G$ ends.

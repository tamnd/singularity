tag: SG0000005K
kind: conjecture
title: Each infinite run where rho stays lies in a subvariety of the locus of the order of G
statement: Let $P_0, P_1, \dots$ be an infinite run of point blowups where $\rho \ge 1$ stays. Then from some index on, the points lie on the strict transforms of a regular formal subvariety $Z$ of positive dimension, and the order of $G$ along $Z$ is at least $\rho$.

tag: SG00000064
kind: theorem
title: In a corner run with an infinite number of nonzero translations the derivative in x is a monomial times a unit
statement: Let $g \in K[[y, z]][x]$ be clean at $P_N$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations with an infinite number of nonzero translations. If $g_x \ne 0$, then there is an $m_0$ such that for each $m \ge m_0$ the derivative $\partial_x g_m$ is $\mu_m \varepsilon_m$, with $\mu_m$ a nonzero constant times a monomial in $y_m, z_m$ and $\varepsilon_m$ a unit. In a new free coordinate $x''$ at $P_m$, $g_m = \mu_m x'' + Q(x''^p, y_m, z_m)$.

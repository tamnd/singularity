notes: This is Proposition 3.15.10 and Corollary 3.15.11 of Volume 7 of the handbook, with Lemma 3.15.8. By Proposition 3.15.7 (SG00000062) the values of $g_x$ and of its Hasse derivatives at the sequence of the translations are constant, and the value of $g_x$ is less than the values of the other coefficients of $g_x(\varphi_m + M_m X)$. The dominance argument of Lemma 3.13.19 (SG0000005R), in the form of Lemma 3.15.4, then makes the image of the least monomial divide all the other monomials at each later point. The proof is in note 30 of the research notes, with the full proof in note 33. The result is not in Lean.

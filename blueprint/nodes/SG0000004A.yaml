tag: SG0000004A
kind: theorem
title: Abhyankar's theorem on quadratic sequences
statement: Let $R$ be a regular local ring of dimension 2, essentially of finite type over a field, and let $v$ be a valuation of $K = \operatorname{Frac} R$ that dominates $R$. Let $R_0 = R$. While $R_n$ has dimension 2, let $R_{n+1}$ be the quadratic transform of $R_n$ along $v$, the local ring at the center of $v$ of the chart $R_n[y/x]$, where $x, y$ is a regular system of parameters of $R_n$ with $v(x) \le v(y)$. If $R_n$ has dimension 1, the sequence stops, and $R_n = \mathcal{O}_v$. Then $\mathcal{O}_v = \bigcup_n R_n$.
sources:

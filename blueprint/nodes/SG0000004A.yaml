notes: Abhyankar proved the theorem for each regular local ring of dimension 2 [Abh56]. Volume 5, Theorem 1.2.6 of the handbook proves the case essentially of finite type, with intersection numbers and the inequality of Noether. Each quadratic transform is again regular by SG0000003C. No Lean statement yet. A Lean proof needs intersection numbers and the branch formula, which are not in Mathlib.

notes: This is Proposition 3.17.8 of Volume 7 of the handbook (Section 3.17). A term $c\, x^i w^l y^A z^B$ of $F$ gives, after division by $M_m^2 Y$, monomials with the exponent at least $E_m(A - p + 2, B - p + 2) + (i + l' - 2) e_m$, which is divisible by $y_m z_m$. If $a_j \ne 0$, then $G$ becomes $(x + a_j)^2 + R$, a unit. It is Proposition 5.1 of note 38 of the research notes, with the converse of note 39. Note 38 tested it at 9000 points and note 39 at 15200 points. The result is not in Lean.

tag: SG0000006R
kind: theorem
title: The points x squared times y to the p minus 2 times z to the p minus 2 plus higher terms keep rho equal to 1 with any translations in w
statement: Let $p \ge 3$, $n = 4$, $\Delta = V(y) \cup V(z)$, $Y = y^{p-2} z^{p-2}$, and let $F \in K[[y, z]][x, w]$ have each monomial divisible by $y^p z^p$, such that $g = x^2 Y + F$ is clean. Then a sequence of steps from $P_N$, with each chart an infinite number of times, is a corner run in four variables with $\rho \ge 1$ if and only if $a_m = 0$ for each $m$. Then $\rho = 1$ at each point, with any $b_m \in K$. The function of $P_m$ is $y_m^{p-2} z_m^{p-2} (x^2 + R)$ up to a $p$-th power monomial, with $R \in (y_m z_m)$, and $\nu^G \ge 1$ along $V(x_m, y_m)$ and $V(x_m, z_m)$.

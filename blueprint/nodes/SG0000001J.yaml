notes: In dimension 4 this is open. Expert question 6 asks whether it is a separate problem. The Lean statement of tamnd/singularity-lean#69 is for characteristic p. Its hypothesis is local uniformization in the affine form (Singularity.HasLocalUniformization) in each transcendence degree at most 4, because a variety of dimension 4 can have components of smaller dimension. Local uniformization is known in transcendence degree at most 3, so this hypothesis is the same as the conjecture SG0000001H. The statement is open. By SG000000BS the step from local uniformization to resolution is exactly SG000000BQ, the fundamental theorem in dimension 4, which is open (Handbook Volume 9, Section 3.24).

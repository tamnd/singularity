tag: SG0000001J
kind: conjecture
title: Patching in dimension 4
statement: Let k be a field of characteristic p > 0. If each valuation of a function field over k of transcendence degree at most 4 has local uniformization, then each variety of dimension at most 4 over k has a resolution.

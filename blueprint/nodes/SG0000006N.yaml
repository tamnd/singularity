tag: SG0000006N
kind: theorem
title: Each direction of the translations of a corner run in four variables is of transcendental type
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let the run be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). For $\lambda = (\alpha, \beta) \ne 0$ put $t^\lambda_j = \alpha a_j + \beta b_j$, the translation of the free coordinate $\alpha x + \beta w$. If an infinite number of the $t^\lambda_j$ are not $0$, then the values of $\alpha \varphi_m + \beta \psi_m$ just after these translations form a pseudo Cauchy sequence of transcendental type over $\hat H$, $H = K(y_N, z_N)$, and $\alpha \varphi_\infty + \beta \psi_\infty$ is transcendental over $\hat H$.

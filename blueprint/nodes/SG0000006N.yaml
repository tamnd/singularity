notes: This is Proposition 3.17.4 of Volume 7 of the handbook (Section 3.17). The proof of Proposition 3.15.7 uses only the sequence $\sum_j t_j M_{j+1}$ with $t_j \in K$ and the monomials of the run, which has the two letters $y, z$. So the value group stays $\mathbb{Z} + \theta \mathbb{Z}$ of rational rank $2$ for $k = 2$ and each $n$, and the proof applies to $t^\lambda_j$. The transcendence is the first step of Remark 3.16.15. The pair $(\varphi_\infty, \psi_\infty)$ is not treated, and the conjecture T of note 38 on the pair is open. It is Proposition 3.1 of note 38 of the research notes. The result is not in Lean.

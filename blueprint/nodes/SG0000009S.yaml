notes: 'This is Proposition 72.1 of the referee report in note 72 on note 66. The germ $57$ of the lab family pert651 of note 66 is $f_{9,5}$. On its branch $\omega = \frac{22}{15}$ from depth $0$ to depth $35$, the values $(\delta, \mu_1)$ repeat with period $5$, and the monomial $x_0^7 x_1^e x_2 z$ loses one power of $x_1$ in each period. So the branch is a long run with a hidden decreasing quantity, the gap $\frac{e-2}{5}$ between the slope of this monomial and $\delta$, and not a cycle. SG000000BH gives this gap a form in the polyhedron: it is $\omega(h - 1)$ for the planar polyhedron of the proof of SG000000BE. The proof uses that $a_5$ does not depend on $z$, by the rigid layer. That the other points over each centre have a smaller $\omega$, and that the runs of length $5(e - 2)$ are the longest from $f_{e,g}$, are computations, not proofs. For $e \ge 9$ the curve $V(z, x_1, x_2)$ becomes $\omega$-constant at the first step. The computed longest runs from $f_{e,200}$ are at most $35$ for $e \le 40$. Handbook Volume 7, Proposition 4.4.14. The result is not in Lean.'

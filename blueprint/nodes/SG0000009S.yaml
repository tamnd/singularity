tag: SG0000009S
kind: theorem
title: 'A period-5 mechanism for long omega-constant runs of Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $p = 3$, $E = \{0, 1, 2\}$ and, for integers $e, g \ge 2$, $f_{e,g} = (z^3 + x_1 x_2^5)^2 + x_0^7 x_1^e x_2 z + x_0^7 x_1^g x_2^6$. (a) At the origin $\delta = 2$, $\mu = (0, \frac13, \frac15)$ and $\omega = \frac{22}{15}$. (b) If $e \ge 3$, the five blowups with the centres point, $V(x_1)$, point, point, $V(x_1)$, each followed by the origin of the chart of $x_1$, take $f_{e,g}$ to $f_{e-1,g+9}$, and $\omega = \frac{22}{15}$ at each of the five points. (c) If $3 \le e \le 8$, these five centres are the centres of Rule 61.9'' in each choice of base coordinates. If $e = 2$, the next point blowup gives $\omega = \frac75$ at the origin of the chart of $x_1$. So from $f_{e,g}$ with $3 \le e \le 8$ the rule has an $\omega$-constant branch of length $5(e - 2)$ on which the germ does not repeat, and the branch ends with a drop of $\omega$.'

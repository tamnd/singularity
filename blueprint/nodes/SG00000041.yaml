tag: SG00000041
kind: theorem
title: Embedded resolution in characteristic 0
statement: Let $Y$ be a smooth variety over a field of characteristic 0 and let $X \subseteq Y$ be a reduced closed subscheme. Then there is a finite sequence of blowups $Y_r \to \dots \to Y_0 = Y$, each in a permissible center for the strict transform $X_i$ of $X$, such that $X_r$ is regular, the union $E_r$ of the exceptional divisors is a divisor with simple normal crossings on $Y_r$, and $X_r$ has normal crossings with $E_r$.
sources:

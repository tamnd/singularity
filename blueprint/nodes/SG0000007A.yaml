notes: This is Theorem 3.17.29 of Volume 7 of the handbook (Section 3.17). The class of part 1 is kept by the steps, and each of its points has type $0$, so SG00000078 applies at the first change of letter. Part 2 uses SG00000077 at the first step. Part 2 is the first case of rank $2$ of SG0000006Y. The case of rank $2$ with $\rho \ge p$ in general is open. It is Theorem 3.5 of note 40 of the research notes, with the remark of note 42. The result is not in Lean.

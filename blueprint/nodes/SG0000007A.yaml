tag: SG0000007A
kind: theorem
title: Two classes of points in the p-th powers of the free coordinates have no corner run
statement: Let $n = 4$ and $\Delta = V(y) \cup V(z)$. (1) If $g \in K[[y, z]][x^p, w^p]$ is clean with $\operatorname{ord} g \ge p$ and $1 \le \rho < p$, then no corner run in four variables from $g$ keeps $\rho$, and in fact no step that changes the letter keeps $\rho$. (2) If $g = y^{pA} z^{pB} (y x^p + z w^p + B_0)$ is clean with $\operatorname{ord} g \ge p$, $A, B \ge 0$ and $B_0 \in K[[y, z]]$, then no corner run in four variables from $g$ keeps $\rho \ge 1$.

tag: SG000000AG
kind: hypothesis
title: Posva's resolution of 1-foliations on threefolds
statement: 'Let $X$ be a normal threefold over an algebraically closed field $k$ of characteristic $p > 0$, and let $\mathcal{F}$ be a 1-foliation on $X$. (1) If $\mathcal{F}$ has corank one, there is a projective birational morphism $f : X'' \to X$ with $X''$ regular such that $f^* \mathcal{F}$ has at worst multiplicative singularities. (2) If $p > 2$ and $\mathcal{F}$ has corank two, there is a proper birational morphism $f : \mathcal{Y}'' \to X$ with $\mathcal{Y}''$ a regular tame Deligne-Mumford stack such that $f^* \mathcal{F}$ is regular. (3) If $p = 2$, there is a projective birational morphism $f : X'' \to X$ with $X''$ a regular threefold such that $f^* \mathcal{F}$ is regular; here $k$ perfect is enough.'
sources:
- paper: Pos24
  loc: Theorems 5.1.1, 5.2.1 and 5.3.1, Remarks 5.1.5 and 5.2.2

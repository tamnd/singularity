notes: Parts 1, 2 and 3 are [Pos24, Theorems 5.1.1, 5.2.1 and 5.3.1], as the referee report in note 73 checked from the source. A rank one foliation on a threefold has corank two, so part 2 is the case that SG000000AH uses. By [Pos24, Remark 5.2.2], for corank two on a regular variety (not a stack) Posva can lift the multiplicative generators to a resolution when $\operatorname{Sing} f^* \mathcal{F}$ is a regular curve, and does not know the answer otherwise. By [Pos24, Remark 5.1.5], the methods are not functorial for etale morphisms and do not extend to stacks. These are published theorems that the project has not proved. Not in Lean. Handbook Volume 9, Section 3.22.

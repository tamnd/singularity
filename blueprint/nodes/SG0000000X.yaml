tag: SG0000000X
kind: theorem
title: The Zariski-Riemann space is quasi-compact
statement: The space of valuation rings of a function field $K/k$ that contain $k$, with the Zariski topology, is quasi-compact.
sources:
- paper: ZS2
lean:
  statement: Singularity.ZariskiRiemann.compactSpace
  proof: Singularity.ZariskiRiemann.compactSpace
tier: T2
notes: The Lean proof of tamnd/singularity-lean#64 is for a ring $A$ with a homomorphism to a field $K$, and the space of the valuation subrings of $K$ that contain the image of $A$. The topology is generated by the sets of the valuation subrings that contain a given finite set. The proof shows that each ultrafilter converges, in place of the theorem of Tychonoff.

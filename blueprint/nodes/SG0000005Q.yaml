tag: SG0000005Q
kind: example
title: A run of point blowups that takes the corners keeps a log-Jacobian ideal with two generators
statement: Let $p$ be a prime, $n = 3$ with the variables $x, y, z$, $\Delta = \{y, z\}$ and $g = y^a z^b (x^p + y^m z^l)$, with $(a, b, m, l) = (1, 1, p + 1, p)$ at the start. The origin of the $y$-chart sends $(a, b, m, l)$ to $(a + b, b, m + l - p, l)$, and the origin of the $z$-chart sends it to $(a, a + b, m, m + l - p)$. Along each sequence of the two charts, $a l - b m \equiv -1 \pmod p$, the point is clean, the log-Jacobian ideal of $G = x^p + y^m z^l$ is $(x^p, y^m z^l)$, and $\rho = p$. So each sequence of the two charts is an infinite run with distinct points, and for each series $h$ the variable $x$ does not divide $g + h^p$.
sources:
- paper: CJS20
uses:

notes: This is the computation in the proof of Example 3.13.15 of Volume 7 of the handbook, and SG0000005M uses it. The Lean file stores a point as $(a, b, \mu, \lambda)$ with $m = \mu + p$ and $l = \lambda + p$, and the invariant is $b \mu = a \lambda + 1$ (`Singularity.CornerRuns.CornerData.IsGood`). The congruence is `Singularity.CornerRuns.cornerSeq_modEq`, the point is clean by `Singularity.CornerRuns.isClean_cornerPoly`, the ideal is `Singularity.CornerRuns.residualLogJacobian_cornerG`, the steps are `Singularity.CornerRuns.rhoStep_cornerPoint_y` and `Singularity.CornerRuns.rhoStep_cornerPoint_z`, and the claim on $x$ is `Singularity.CornerRuns.not_X_dvd_cornerPoly_add_pow`. The run where the charts alternate is `Singularity.CornerRuns.cornerRun`. The library has no order along a formal subvariety, so the claim of SG0000005M on subvarieties is not in Lean.

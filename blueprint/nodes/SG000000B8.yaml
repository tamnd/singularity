notes: 'This is Example 6.3 of research note 76, which the referee report in note 80 confirms. Note 57 had such examples only with value groups that are not finitely generated. A defect in one projection is no obstruction, because the projection $(x_1, x_2, w, \vartheta)$ of $F$ is in class (i) of SG000000B4. So these are test cases for Problem V6, and none of them triggers the no-go condition of issue tamnd/singularity#298. Handbook Volume 9, Section 3.23. The result is not in Lean.'

notes: 'This is Theorem 2.8 of research note 55, the weight form of Theorem 5.3 of research note 05, with the corrections of research note 60. Lean proves it for each perfect reduced ring $K$ of characteristic $p$ (Singularity.newtonNondegenerate_purelyInseparable_iff, tamnd/singularity-lean#208). The Lean definition is Singularity.NewtonNondegenerate, Definition 2.1 of note 55. The direction from the right side to the left side does not need a perfect $K$ (Singularity.newtonNondegenerate_purelyInseparable_of_forall). The hypothesis that $K$ is perfect is necessary for the other direction (SG0000008Q). Over an algebraically closed field the weights give the compact faces of the Newton polyhedron (Lemma 2.2 of note 55), so this is the face form SG0000003G. Lemma 2.2 is not in Lean.'

tag: SG0000008P
kind: theorem
title: 'The Newton criterion for z^p + g in the weight form'
statement: 'Let $K$ be a perfect field of characteristic $p > 0$ and let $g \in K[x_1, \dots, x_n]$ with $g \ne 0$ and $g(0) = 0$. A polynomial $F$ is Newton nondegenerate over $K$ if, for each weight $W$ with all entries positive, the initial form $\operatorname{in}_W F$ has no singular point in the torus. Then $z^p + g$ is Newton nondegenerate over $K$ if and only if, for each weight $w \in \mathbb{Z}^n_{>0}$, the initial form $\operatorname{in}_w g$ has no critical point in $(K^*)^n$.'
sources:
- paper: Newt
uses:
- SG0000003G
lean:

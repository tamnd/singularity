notes: Handbook Volume 7, Theorem 4.3.6. Research note 43, Theorem 43.4, with the corrections of note 47. The normality of $C$ puts the $p$-th root of $-g|_C$ in $\mathcal{O}(C)$, so the imperfect residue field at the generic point is no obstruction. Planned for Lean.

tag: SG0000007N
kind: theorem
title: The lifting test is generic equimultiplicity
statement: 'Let $R$ be a regular noetherian ring of characteristic $p$, $g \in R$, $X = V(z^p + g)$, and $C = V(P)$ an irreducible regular closed subscheme. The following are equivalent: (a) $g + h^p \in P^p$ for some $h \in R$; (b) $X$ has multiplicity $p$ at the point over the generic point of $C$; (c) $X$ has multiplicity $p$ at each point over $C$. Then $h$ is unique modulo $P$, $C'' = V(z - h, P)$ is the reduced inverse image of $C$, $X$ is normally flat along $C''$, and the blowup of $X$ along $C''$ is permissible. Globally there is a unique $b \in \mathcal{O}(C)$ with $b^p = -g|_C$.'

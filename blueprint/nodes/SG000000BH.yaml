notes: 'This is Section 81.6 of research note 81, which answers open statement 2 of the referee report in note 72 for this family. The run of SG0000009S is a toric branch in the sense of SG000000BE, in the orthant regime of its proof, with $\beta = \mu_2 + \omega = \frac53 \ge 1$, where each point blowup lowers $h$. Each point blowup is in the chart of $x_1$ and sends $c_1$ to $c_0 + c_1 - 1 = c_1 - \frac{1}{22}$, so $h$ drops by $\frac{3}{22}$ in each period, as the change $e \mapsto e - 1$ needs. For $e = 8$ the values of $h$ are $\frac{20}{11}, \frac{39}{22}, \frac{19}{11}, \dots$. For germ $57 = f_{9,5}$ the second point matters at first: there $m_t = \frac34$ and the planar residual slope is $\omega_2 = \frac14$, so the branch starts in the stage $\omega_2 > 0$ of the proof. The script run57.py of note 81 reproduces the run lengths of note 72 in the toric model, for example $41$ for $f_{9,5}$. Research note 86, the referee report on note 81, recomputed the normalised generators, the corner, the drop of $\frac{1}{22}$ and the identity $\omega (h - 1) = \frac{e-2}{5}$, and found them correct. Its independent code gives the same run lengths for $15$ values of $(e, g)$, also with the generic steps of SG000000CS. At depth $28$ of the history of germ $57$ there is a step at a point that is not a chart origin, and SG000000CS describes it: it lowers $H$ from $\frac52$ to $h - 1 = 2$, and the branch ends one step later. Handbook Volume 7, Proposition 4.5.11. The result is not in Lean.'

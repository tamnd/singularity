tag: SG000000BH
kind: theorem
title: 'The hidden decreasing quantity on the period-5 runs of Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $p = 3$, $E = \{0, 1, 2\}$ and $f_{e,g} = (z^3 + x_1 x_2^5)^2 + x_0^7 x_1^e x_2 z + x_0^7 x_1^g x_2^6$ as in SG0000009S. The normalised points $u - \mu$ of the monomials are $A = (0, 0, \frac{22}{15})$, $(\frac75, \frac{3e-5}{15}, 0)$ and $(\frac76, \frac{g-2}{6}, \frac45)$, so the bottom face is the vertex $A = \omega e_2$. The projection $v \mapsto (v_0, v_1) / (\omega - v_2)$ sends the last two points to $(\frac{21}{22}, \frac{3e-5}{22})$ and $(\frac74, \frac{g-2}{4})$. If $11g \ge 6e + 12$, the second point lies in the orthant of the first, and the planar polyhedron is the orthant at $c = (\frac{21}{22}, \frac{3e-5}{22})$, and the quantity $h - 1 = \frac{3(e-2)}{22}$, with $h = c_0 + c_1$, drops by exactly $\frac{1}{22}$ at each point blowup of the period of SG0000009S and is unchanged by the divisorial steps. The gap $\frac{e-2}{5}$ of SG0000009S is $\omega (h - 1)$, and the run ends when $h$ reaches $1$.'

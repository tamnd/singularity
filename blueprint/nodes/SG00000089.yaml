notes: This is Theorem 3.18.6 of Volume 7 of the handbook (Section 3.18). It is Theorem 4.1 of note 50 of the research notes, with Proposition 3.1 and Lemma 3.2 of that note, and with the two fixes of note 52 (the translations of $x$ stay $0$ after the change of $w$, and the monomial factor of $g_m$ is the largest monomial that divides it). Note 52 checked the proof, and note 54, Part A, checked it again. The linearity makes the part in $x$ rigid, and the part in $w$ is a sequence in one variable, so Section 3.15 applies. The result is not in Lean.

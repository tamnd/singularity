notes: 'This is the hypothesis (W) of Corollary 3.2 of the referee report in note 73, stated there for the $p + 1$ multiplicative points of SG000000AC, where the weights are $(1, p - 1, p - 1, p - 1)$. Note 73 expects a short proof: the weighted filtration depends only on the coordinates modulo terms of large weight, and the formal case is SG000000A9. The missing step is that regularity of the saturated pullback can be checked after completion at the points over $q$. It is open. Handbook Volume 9, Section 3.22.'

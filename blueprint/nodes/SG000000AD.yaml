tag: SG000000AD
kind: conjecture
title: One weighted blowup at a multiplicative point in truncated coordinates
statement: Let $q$ be a closed point of a regular 4-fold $Y$ over an algebraically closed field of characteristic $p$, and let $\mathcal{F}$ be a rank one foliation that is singular and multiplicative at $q$, with formal normal form $\sum_i \lambda_i t_i \partial_{t_i}$, $\lambda \in \mathbb{F}_p^4$. Let $y_1, \dots, y_4$ be polynomial coordinates at $q$ with $y_i \equiv t_i$ modulo $\mathfrak{m}_q^p$. Then the weighted blowup of $q$ in the coordinates $y$, with the weights the lifts in $\{1, \dots, p - 1\}$ of $\lambda$ (after a common factor in $\mathbb{F}_p^\times$ that makes them nonzero where possible), makes $\mathcal{F}$ regular over $q$.

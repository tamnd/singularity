tag: SG0000001A
kind: theorem
title: Curves
statement: 'For each $p$, each variety of dimension at most 1 has a resolution: the normalization. The integral case is SG0000002C, and it is proved. The general case follows from it with the reduction to integral varieties SG0000001Y. Until the reduction is proved in Lean, the theorem `Singularity.Curves.resolutionInDim_one_of_reductionToIntegral` takes it as a hypothesis.'

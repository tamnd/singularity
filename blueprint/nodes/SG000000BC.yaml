tier: T2
route:
- R2
notes: 'This is Problem 7.2 of research note 76. It is open. By SG000000B0 and SG000000B3 a positive answer proves Problem V7 for rank 1 valuations with value group $\mathbb{Z}^2$. If every projection of defect 1 is in case (B) (a cofinal pseudo-Cauchy sequence of $x_4$ of algebraic type), then $K_3^h$ has an immediate algebraic extension of degree $p^e$ (Proposition 5.1 of note 76). Family T (SG000000B9) is the first test. Handbook Volume 9, Section 3.23. The result is not in Lean.'

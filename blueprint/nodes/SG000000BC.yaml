tag: SG000000BC
kind: conjecture
title: 'Problem 7.2: a good projection'
statement: 'Let $\nu$ be a rank 1 valuation of a function field $F$ of transcendence degree 4 over $k$ with $\nu F \cong \mathbb{Z}^2$, $F\nu = k$ and $F \subseteq K^h$ for a projection $K$. Then there is a projection $K'' = k(x_1'', \dots, x_4'')$ with $F \subseteq K''^h$, with $x_1'', x_2''$ adapted, such that $x_3''$ has the ball property over $K_2''$ and $x_4''$ has the ball property over $K_3''$.'
sources:
- paper: KK09

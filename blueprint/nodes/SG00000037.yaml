tag: SG00000037
kind: theorem
title: A regular local ring has multiplicity one
statement: Let $(R, \mathfrak{m})$ be a regular local ring of dimension $d$. Then $\ell(R/\mathfrak{m}^{n+1}) = \binom{n+d}{d}$ for each $n \ge 0$, and the multiplicity $e_d(\mathfrak{m}, R)$ is $1$.

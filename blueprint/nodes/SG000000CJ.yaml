tag: SG000000CJ
kind: theorem
title: 'The toric counterexample to Claim A is repaired near the bad curve'
statement: 'Let $(V_0, V_1)$ be the toric pair of SG000000C5, with $V_2 = V_0$ and $\Gamma = V(\{0\} \times \sigma_0)$. Let $V_2''$ be obtained from $V_2$ by the 5 stars on the side of $\sigma_0$ of SG000000CH, lifted to $\{0\} \times \mathbb{Z}^3$, and let $W_1''$ be a toric resolution, by star subdivisions that keep regular cones, of the common refinement of the fan of $V_1$ with the 14 stars of SG000000CH lifted to the face $\tau_1$ and the fan of $V_2''$, restricted over $U_1 = \mathrm{Reg}\, V_1$. Then (a) $V_2'' \to V_2$ satisfies SG000000CF and $W_1''$ is a valid choice in Step 3; (b) the strict transforms of $\Gamma$ are not in the new fundamental locus $\Phi''$; (c) each component of $\Phi''$ that meets the preimage of $\Gamma$ lies over $p_1$ or over the regular point $p_1''$, and the ones over $p_1''$ do not meet $L''$; (d) with $\tilde U_2''$ chosen as in Step 5, no point of $\overline{\Phi'' \cap \tilde U_2''} \cap \alpha''^{-1}(U_1)$ lies over $\Gamma$. So the failure of (A$^{\rm w}$) in SG000000C5 at the point $z$ does not occur on $V_2''$.'

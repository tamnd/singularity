notes: 'Proposition 85.8 of research note 85, given the computation SG000000CH and standard toric facts. The stars subdivide $D$ into the regular cones $\langle \kappa, r \rangle$ and $D''$ into the cones $\langle \kappa, r'' \rangle$ of determinant $\pm 2$, for the 6 cones $\kappa$ of SG000000CH in $\sigma_0$. Each cone $\{0\} \times \kappa$ is a cone of both fans, so it is kept by the resolution, and a toric map is defined near the generic point of an orbit if and only if its cone is in the finer fan. Not shown: (A$^{\rm w}$) for the components of $\Phi''$ away from the preimage of $\Gamma$, since the stars at faces of $\sigma_0$ also subdivide other cones of $V_2$. This is open. So the method of SG000000C6 is not blocked by SG000000C5 once SG000000CF is used. The result is new in note 85, and a referee has not read it yet. Handbook Volume 9, Section 3.25. The result is not in Lean.'

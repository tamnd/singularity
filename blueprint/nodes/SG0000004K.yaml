notes: This is [dJ96, Proposition 3.6], Volume 8, Theorem 2.1.8 of the handbook. A semistable curve is a flat proper morphism of finite presentation whose geometric fibres are connected curves with at most ordinary double points [dJ96, 2.21 and 2.22]. At a singular point the complete local ring is $A[[u, v]]/(uv - h)$, and explicit blowups resolve it. De Jong uses the theorem over a trait [dJ96, 6.16]. Over a field he uses only its first step, so SG0000001K does not use this node. No Lean statement yet.

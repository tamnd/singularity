tag: SG0000004K
kind: theorem
title: De Jong's regular model of a semistable curve
statement: Let $S$ be an excellent regular scheme, let $D \subseteq S$ be a divisor with strict normal crossings, and let $f \colon X \to S$ be a split semistable curve that is smooth over $S \setminus D$. Then there is a projective modification $\varphi \colon X_1 \to X$ with center in $\operatorname{Sing}(X)$ such that the composition $X_1 \to S$ is a split semistable curve that is smooth over $S \setminus D$, and $X_1$ is regular.
sources:

tag: SG0000005E
kind: lemma
title: In the first case the directrix of the log-Jacobian order is the directrix of the forms E_i F
statement: In the setting of SG0000004Z, let $g = x^r G$ be in the first case, and let $F$ be the part of degree $\rho$ of $G$. For $i \in \Delta$ put $E_i F = r_i F + x_i \partial_i F$. Then $T_\rho(g) = \bigcap_{i \in \Delta} T(E_i F)$.
sources:

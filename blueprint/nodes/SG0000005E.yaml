notes: The generators $e_i = r_i G + x_i \partial_i G$ of $\widetilde\Theta_0(G)$ have order at least $\rho$ with the part $E_i F$ of degree $\rho$, and the generators $x_a \partial_l G$ with $l \notin \Delta$ have order at least $\rho + 1$. So in the first case the part of degree $\rho$ of each element of the definition of $T_\rho(g)$ is a linear combination of the $E_i F$, and each $E_i F \ne 0$ is such a part. The lemma needs no hypothesis on the field and no hypothesis that $g$ is clean. If $g$ is clean, the decomposition of $F$ by the characters $\chi(\alpha) = (r_i + \alpha_i \bmod p)_{i \in \Delta}$ gives $E_i F = \sum_\chi \chi_i F_\chi$, so $T_\rho(g)$ contains the joint directrix of the $F_\chi$.

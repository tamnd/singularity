notes: 'This is Proposition 5.4(b) of research note 55 in the form that research note 60 corrected (Proposition 3.2 of note 60). The first form said that $h$ is preparable if and only if the set $Z$ of torus orbits of critical points has at most one point. This is false. The change $y \mapsto \beta y + \gamma x^m$ moves the critical point $s = 0$ on the axis $y = 0$, which is not in $Z$, into the torus. The counterexample is $p = 3$, $w = (1, 2)$ and $h = x^4 y^4 + x^2 y^5$, with $Z = \{1\}$ and $Z_0 = \{0, 1\}$ (Counterexample 5.4a of note 55). Note 60 checked all the weight preserving changes over $\mathbb{F}_3$ by computer. The cases $w = (1, 1)$ and $w_1, w_2 \ge 2$ are parts (a) and (c) of the proposition. The counterexample resists also the changes that do not preserve the weight, and each change of all coordinates (SG0000009B, from research note 68). The analogue in three variables is SG0000009C. The result is not in Lean.'

tag: SG0000008T
kind: theorem
title: 'Preparation in two variables for the weight (1, m)'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $m \ge 2$, and let $h \in k[x, y]$ be weighted homogeneous of degree $D$ for the weight $(1, m)$ with $\nabla h \ne 0$. The weight preserving changes of coordinates are $x \mapsto \alpha x$, $y \mapsto \beta y + \gamma x^m$, and they act on $s = y / x^m$ by $s \mapsto (\beta s + \gamma) / \alpha^m$. Let $Z_0 \subset \mathbb{A}^1$ be the set of the values of $s$ at the critical points of $h$ with $x \ne 0$. Then a weight preserving change makes $\operatorname{in}_{(1,m)} h$ free of critical points in the torus if and only if $|Z_0| \le 1$. If $p \mid D$ and $h$ is clean, then $0 \in Z_0$ if and only if $h$ has no monomial $x^{D-m} y$.'
sources:
- paper: Newt

notes: Handbook Volume 7, Theorem 4.1.3, in the Lucas form. Research note 10, Lemma 10.3. The Lean proof uses the theorem of Lucas for the binomial coefficients. Over a perfect field, the coefficient can be made zero (Singularity.Portfolio.exists_lucas_tschirnhausen_eq_zero).

tag: SG0000007F
kind: lemma
title: The Lucas form of the Tschirnhausen coefficient
statement: Let $R$ be a commutative ring of characteristic $p > 0$ and let $f \in R[z]$ be monic of degree $m = p^e m_0$ with $p \nmid m_0$. Write $a_i$ for the coefficient of $z^{m-i}$ in $f$ and $a'_i$ for the coefficient of $z^{m-i}$ in $f(z + c)$, $c \in R$. Then $a'_{p^e} = a_{p^e} + m_0 c^{p^e} + \sum_{0 < j < p^e} \binom{m-j}{p^e-j} a_j c^{p^e-j}$.
sources:

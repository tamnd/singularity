tag: SG00000014
kind: definition
title: The characteristic polyhedron
statement: Hironaka's characteristic polyhedron of a hypersurface singularity, the intersection over all coordinate choices of the projected Newton polyhedra.
sources:
- paper: Hir67
- paper: CJSch19
uses:
- SG00000011
lean:
  statement: Singularity.charPolyhedron
tier: T4
route:
- R1
notes: The Lean definition is in tamnd/singularity-lean#76, for a polynomial in z over the power series ring k[[x]] with the coordinates x fixed. The library proves that the polyhedron is convex and stable under the orthant, that it does not change under a translation of z by an element of the maximal ideal, and one direction of the vertex criterion of Hironaka (a solvable vertex is not in the polyhedron). tamnd/singularity-lean#83 proves the case f = z^q + F with q = p^e and F clean, that is, with no exponent in qN^n. Then no vertex is solvable, the polyhedron for the coordinate z is the polyhedron for all choices of z, and for a polynomial F it is (1/q) times the Newton polyhedron of F (Singularity.charPolyhedron_X_pow_add_C_eq_smul_newtonPolyhedron and Singularity.charPolyhedron_X_pow_add_C_of_clean). The library does not prove the converse of the criterion for a general f, that some choice of z attains the polyhedron in general, that the polyhedron has finitely many vertices, or the result over a general regular local ring.

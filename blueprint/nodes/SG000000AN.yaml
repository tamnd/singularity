tag: SG000000AN
kind: theorem
title: Problem 6.4 with H = 0 is untwisted off an invariant divisor
statement: Let $R$, $\delta$, $\alpha$ and $D'$ be as in SG000000AM, with $\psi(\alpha) = 0$, and let $s \in R \setminus \{0\}$ with $\delta(s) = -\alpha s$. On $\mathbb{A}^1_u \times D(s)$ the $\mathbb{G}_m$-equivariant automorphism $(u, v) \mapsto (u s, v)$ turns $D'$ into the product field $\delta$, with no $u' \partial_{u'}$ term. Hence the singularities of $D'$ outside $\mathbb{A}^1 \times V(s)$ are those of the untwisted case $\alpha = 0$, and the twisted part of Problem 6.4 with $H = 0$ lies over $Z(\delta) \cap V(s)$, where $V(s)$ is $\delta$-invariant.

notes: This is Lemma 3.17.25 of Volume 7 of the handbook (Section 3.17). Type $0$ and $d < p$ give $\operatorname{in} G \in K[y, z]$. The elements $r_y G + y G_y$ and $r_z G + z G_z$ of $\widetilde\Theta_0(G)$ and Theorem 3.7.1, part 1 (SG0000004X), with the chart vector $(a, b, 1, 0)$ kill each monomial with a positive exponent of $y$, by the cleanness. It is Lemma 3.1 of note 40 of the research notes. The result is not in Lean.

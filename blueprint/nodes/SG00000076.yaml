tag: SG00000076
kind: lemma
title: At a point of type 0 with rho less than p a step that keeps rho fixes the initial form
statement: Let $n = 4$, $\Delta = V(y) \cup V(z)$, let $g = y^{r_y} z^{r_z} G$ be clean with $\operatorname{ord} g \ge p$, and assume that the point has type $0$ with $1 \le \rho = d < p$. If a $y$-step with any translation keeps $\rho$, then $\operatorname{in} G = c z^d$ with $c \ne 0$. If a $z$-step keeps $\rho$, then $\operatorname{in} G = c y^d$.
sources:

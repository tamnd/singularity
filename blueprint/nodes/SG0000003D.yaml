tag: SG0000003D
kind: theorem
title: The blowup of a regular curve on a regular surface is an isomorphism
statement: Let $(R, \mathfrak{m})$ be a regular local ring and let $P$ be an ideal such that $R/P$ is a regular local ring and $\dim R/P + 1 = \dim R$. Then $P = (x)$ for an element $x \in \mathfrak{m} \setminus \mathfrak{m}^2$, and the map from $R$ to the chart $R[P/x]$, the subring of $R_x$ that the fractions $a/x$ with $a \in P$ generate over $R$, is an isomorphism. The case $\dim R = 2$ is a regular curve on a regular surface.

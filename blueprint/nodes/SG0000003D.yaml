notes: The first part is [Mat, Theorem 14.2] and Stacks tag 00NQ, in Lean `Singularity.Algebra.exists_eq_span_singleton_of_isRegularLocalRing_quotient`. The Lean result is for the chart. Since $P$ is principal, this one chart covers the blowup, but the Proj of the Rees algebra is not formalized. A regular local ring is a UFD [Mat, Theorem 20.3], so on a regular surface each curve, regular or not, is a Cartier divisor, and its blowup is an isomorphism. The result here does not use that theorem, and it also gives that the generator is a part of a regular system of parameters. Thus the centers of the resolution of surfaces are points. A blowup along a regular curve changes the scheme only in dimension 3 and more, where the curve has codimension at least 2.

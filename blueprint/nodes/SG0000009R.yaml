notes: 'This is Theorem 66.6 of research note 66, which the referee report in note 72 checked step by step, with three fixes of wording: the quantifier is over the centre chosen at $\xi_n$, Step 2 can cite Proposition 61.10 of note 61, and at a point that is not rational the field $k$ is replaced by the residue field, which is perfect. At a simultaneously prepared $z$ the polyhedron is the orthant $\hat\mu + \mathbb{R}^3_{\ge 0}$ with $\hat\mu = \sum_{k \in E} \mu_k e_k$, the centre is $V(z, x_S)$ with $S \subseteq E$ and minimal, the transform is again an orthant with no cancellation and no re-preparation, and $\delta$ drops by $1 - \sum_{k \in S \setminus (T \cup \{j\})} \mu_k > 0$. Each value of $\delta$ lies in $\frac1B \mathbb{Z}$, because it has the form $n/i$ with $1 \le i \le 2p$. This proves the case $\omega = 0$ of the conjecture SG0000009T in its strong form. The lab of note 66 checked it on $2075$ germs and $30461$ nodes, and note 72 checked it again with independent code and random changes of the base coordinates, with no failure. Handbook Volume 7, Theorem 4.4.13. The result is not in Lean.'

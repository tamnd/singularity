tag: SG0000009R
kind: theorem
title: 'Rule 61.9'' terminates at the points with omega = 0'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $\xi_0$ be a point of multiplicity $2p$ with $\omega(\xi_0) = 0$, and let $\xi_0, \xi_1, \dots$ be a sequence in which $\xi_{n+1}$ is a point of multiplicity $2p$ over the centre that Rule 61.9'' chooses at $\xi_n$, for each choice of base coordinates adapted to the boundary and each tie-break. Then $\omega(\xi_n) = 0$ for each $n$, and $\delta(\xi_{n+1}) \le \delta(\xi_n) - \frac1B$ with $B = \operatorname{lcm}(1, \dots, 2p)$. So the sequence has at most $B(\delta(\xi_0) - 1) + 1$ points.'

notes: 'This is Lemma 86.6 of research note 86, with Definition 86.5. A monomial $x^\alpha$ of $a_i$, divided by $x_j^i$, becomes $x_j^{\alpha_S - i} \prod_{k \in K} (\lambda_k + y_k)^{\alpha_k} \prod_l x_l^{\alpha_l}$, whose lowest term has the coefficient $\prod_{k \in K} \lambda_k^{\alpha_k} \ne 0$. So the new polyhedron lies in $\pi(U) + \mathbb{R}^3_{\ge 0}$, and it is equal to it when no vertex cancels. The new slopes are $\mu''''_j = \delta_S - 1$, $\mu''''_k = 0$ for $k \in K$ and $\mu''''_l = \mu_l$ otherwise, and $|T_N(v)| = |v| + v_{S \setminus (K \cup \{j\})} - \omega$. For (2), $|v| + v_l - 2\omega = w(s + t - 2)$ with $w = \omega - v_l$. For (3), $T_N$ keeps $w$, and it sends $(s, t)$ to $(s + t - 1, 0)$. The step of germ $57$ at depth $28$ of the cut histories of note 72 is a generic step of type (2), with $\mathcal{F} = \{\omega e_1\}$, $h = 3$ and $\omega = \frac{2}{15}$ before and after. Section 81.8 of note 81 said wrongly that no quantity of note 81 is defined at this step. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Lemma 4.5.23. The result is not in Lean.'

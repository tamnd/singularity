tag: SG000000CS
kind: lemma
title: 'The generic step of Rule 61.9'' at a point that is not a chart origin'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $z$ be simultaneously prepared at $\xi$, let $U$ be the set of the points $\alpha / i$ for the monomials $x^\alpha$ of the $a_i$, and put $v_k = u_k - \mu_k$ for $k \in E$ and $v_k = u_k$ for $k \notin E$. Let $\mathcal{F}$ be the face where $|v| = \omega$ of the convex hull of the $v$ plus $\mathbb{R}^3_{\ge 0}$. Let $V(z, x_S)$ be a permissible centre with $\omega(\eta_S) = \omega$ or $S = \{0, 1, 2\}$, let $j \in S$, and let $\xi''$ be the rational point $x''_k = \lambda_k$ ($k \in S \setminus \{j\}$), $z / x_j = 0$ of the chart of $x_j$, with $K = \{k : \lambda_k \ne 0\} \ne \emptyset$. Let $\pi(u)_j = \sum_{k \in S} u_k - 1$, $\pi(u)_k = 0$ for $k \in K$ and $\pi(u)_l = u_l$ otherwise. The step is generic if, for each vertex $\pi(u)$ of $\pi(U) + \mathbb{R}^3_{\ge 0}$, the lowest terms of the monomials of $a_i$ with this image do not cancel, and $z / x_j$ is simultaneously prepared at $\xi''$. For a generic step: the new boundary is $\{j\} \cup (E \setminus K)$; the new normalised points are the images under the affine map $T_N(v)_j = v_S - \omega$, $T_N(v)_k = 0$ for $k \in K$, $T_N(v)_l = v_l$ otherwise; and $\omega(\xi'') = \min_v (|v| + v_{S \setminus (K \cup \{j\})}) - \omega \le \omega(\xi)$. (1) If $K = S \setminus \{j\}$, then $\omega(\xi'') = 0$. (2) If $S = \{j, k, l\}$ and $K = \{k\}$, then $\omega(\xi'') = \omega(\xi)$ if and only if $\mathcal{F} = \{\omega e_l\}$ and $h \ge 2$, where $h$ is the least value of $s + t$ on the points $(s, t) = (v_j, v_k) / (\omega - v_l)$ with $v_l < \omega$. Then the new bottom face is $\{\omega e_l\}$ if $h > 2$ and is larger if $h = 2$. (3) If moreover $h > 2$, the new projected polyhedron is the orthant $(h - 1, 0) + \mathbb{R}^2_{\ge 0}$.'

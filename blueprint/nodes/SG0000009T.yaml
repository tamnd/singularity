tag: SG0000009T
kind: conjecture
title: 'Rule 61.9'' terminates at the points of multiplicity 2p with omega > 0'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $\xi_0$ be a closed point of multiplicity $m = 2p$ with $\omega(\xi_0) > 0$. For each choice of base coordinates adapted to the boundary at each step, each choice among tied candidates in the steps of Rule 61.9'', and each sequence $\xi_0, \xi_1, \dots$ of closed points of multiplicity $m$, each over the centre chosen at the previous one, the sequence is finite.'

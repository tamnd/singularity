notes: 'This is Conjecture 65.2 of research note 65, the strong form, in the case $\omega > 0$ that is left open after SG0000009R proves the case $\omega = 0$. It is part (b) of Problem 10.2 of research note 10 for $m = 2p$ (tamnd/singularity#287), and it is open. The weak form fixes the tie-break of the code of note 61. Since $\omega$ can go up under the centre of the rule (SG0000009K, SG0000009M), $\omega$ alone is not a decreasing invariant, and no correction by a flag works (SG0000009Q). Computational evidence from the referee report in note 72 for $p = 3$ on the family pert651: the reproduction of the search of note 66 has $81$ nodes with $\omega > 0$ cut at depth $30$, from the germs $57$, $63$ and $42$. From $80$ of them every branch of the rule, with all ties, ends, with no cycle and no node at the new depth limit. One subtree, from germ $57$ with $\omega = \frac{8}{15}$ and $\delta = \frac{12}{5}$, hit the time limit after $110$ nodes. Research note 81 reports that its rerun finished, with $446$ nodes, no cycle and no node at the depth limit, so all $81$ subtrees end. The longest $\omega$-constant run found has $41$ steps, with $\omega = \frac{22}{15}$, and it ends (SG0000009S). A wider search for $p = 3$ saw $74212$ nodes and a search for $p = 5$ saw $18488$ nodes, with no cycle. The searches follow only rational points over $\mathbb{F}_p$. This is not a proof. SG000000BE and SG000000BF prove the conjecture for the toric branches, where $E = \{0, 1, 2\}$, each point is a chart origin and $z$ stays prepared. By SG000000BG no lexicographic pair that starts with $\omega$ can prove the general case. Research note 86, the referee report on note 81, followed the rule itself, at the germ level and at all rational points over $\mathbb{F}_3$, from all $81$ cut nodes: all $81$ subtrees end, with no rise of $\omega$, exactly for each subtree. SG000000CR extends the toric result to each boundary $E$, SG000000CV adds the generic steps at points that are not chart origins, and SG000000CW proves the conjecture for the branches without cancellation of germs with $a_p = 0$ or $a_{2p} = 0$. By SG000000CX the remaining cases are the steps at which a vertex cancels and the steps at which the generic image has a solvable vertex for the weight $(1, 1, 1)$, as at germ $63$ at depth $23$. Handbook Volume 7, Conjecture 4.4.6.'

notes: This is Proposition 3.18.14 of Volume 7 of the handbook (Section 3.18). It is Proposition 4.1 of note 54 of the research notes, refereed in note 63. All the terms of the Taylor expansion at $\Phi_{m_1}$ go into one set at the base point $P_{m_1 + 1}$, and the dominance lemma 3.15.4 applies. The result is not in Lean.

notes: 'This is Example 66.4 of research note 66. The referee report in note 72 confirmed it and proved more: the centre is forced in each choice of base coordinates adapted to $E$, because $a_2$ does not depend on $z$ (since $a_1 = 0$ and $\binom62 \equiv 0 \pmod 3$), the curve $V(z, x_1'', x_2)$ is not permissible for each free coordinate $x_1''$, and the curve $V(z, x_0, x_1'')$ is not $\omega$-constant. The same transition from R1 to R2 with $\omega$ constant occurs for $p = 5$ in the lab. Handbook Volume 7, Example 4.4.11. The result is not in Lean.'

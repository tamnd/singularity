tag: SG0000006P
kind: lemma
title: The finiteness of the translations of a corner run does not depend on the free coordinates
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let the run be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). If there are a $J$ and a free coordinate system at $P_J$ in which the translations are $0$ from some point on, then only a finite number of the $(a_j, b_j)$ are nonzero. If the translations of one free coordinate $x' = \alpha_0 x_J + \beta_0 w_J + \gamma(y_J, z_J)$ are $0$ from some point on, then $\alpha_0 a_j + \beta_0 b_j = 0$ for $j$ large.

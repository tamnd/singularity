notes: This is Lemma 3.17.6 of Volume 7 of the handbook (Section 3.17). The points lie on the strict transforms of a regular graph $x_J = \alpha(y_J, z_J)$, so $v(\alpha - \varphi^{(J)}_m) > v(M^{(J)}_m)$ for each $m$, and $\alpha$ would have an infinite number of terms below $1 + \theta$, against Lemma 3.15.6, part 2. It is Lemma R1 of note 39 of the research notes, the referee report on note 38. The result is not in Lean.

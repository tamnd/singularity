tag: SG00000058
kind: counterexample
title: The full codimension can go down from the first case
statement: In the setting of SG00000057, the hypothesis that the old point is in the second case is necessary. Over $\mathbb{F}_2$ in the variables $x, y, z$, let $g = y z^2 + x z$ and $\Delta = \{x, z\}$. Then $\rho(g) = 1$, the point is in the first case, $\tau_\rho(g) = 1$ and $\widetilde\tau(g) = 2$. At the origin of the $y$-chart, $g' = g$ and $\Delta' = \{x, y, z\}$. The new point has $\rho(g'_c) = 1$, it is in the first case, $\tau_\rho(g'_c) = 1$ and $\widetilde\tau(g'_c) = 1$.

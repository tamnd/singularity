notes: Here $r = (0, 0, 1)$ and $G = y z + x$, with $d = 1$. The generators of $\widetilde\Theta(G)$ are $x$, $G + z \partial_z G = x$ and $\partial_y G = z$, and $\widetilde\Theta_0(G)$ is generated by $x$ and the elements $x_k z$. So $T_\rho(g) = \{w_x = 0\}$ and $\widetilde T(g)$ is the line of $e_y$. At the new point $y \in \Delta'$, and the generators of $\widetilde\Theta(G')$ are $x$, $y z$ and $x$. The weak transform $z$ of $\partial_y G$ is not in $\widetilde\Theta(G')$, because $\partial_y$ becomes $y \partial_y$. No component of $\Delta$ leaves, and the vector $e_y$ of the chart is in $\widetilde T(g)$. The test of SG00000057 found 2,105 steps from the first case where $\widetilde\tau$ goes down. The Lean library proves the example over $\mathbb{F}_2$ in `Singularity/Invariant/LogJacobianFullDirectrix.lean`. `Singularity.fullDirectrixExample_hyp` gives the data, `Singularity.fullDirectrixExample_rho` gives $\rho = \rho' = 1$, `Singularity.fullDirectrixExample_cases` gives the two cases, and `Singularity.fullDirectrixExample_finrank` gives the dimensions.

tag: SG00000011
kind: definition
title: Newton polyhedron
statement: The Newton polyhedron of a power series, as a rational polyhedron in the positive orthant.
sources:
- paper: Newt
lean:
  statement: Singularity.newtonPolyhedron
tier: T3
notes: The Lean definition is for polynomials. Singularity.newtonPolyhedron_mul_subset proves that the polyhedron of a product is in the Minkowski sum, and Singularity.isLeast_sum_newtonPolyhedron proves that the order is the least total degree on the polyhedron.

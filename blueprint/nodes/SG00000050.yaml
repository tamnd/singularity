tag: SG00000050
kind: theorem
title: The codimension of the directrix of the log-Jacobian order does not go down from the first case to the first case
statement: In the setting of SG0000004Z, write $g = x^r G$, let $d = \operatorname{ord} G$ and $F = \operatorname{in}(G)$. Assume that $\rho(g'_c) = \rho(g)$, that both points are in the first case, that is, $\operatorname{ord} \widetilde\Theta_0(G) = \rho$ and $\operatorname{ord} \widetilde\Theta_0(G') = \rho$, and that $|r| + d$ is not $0$ in the base field. Then $\rho = d$, and $\tau_\rho(g'_c) \ge \tau_\rho(g)$.

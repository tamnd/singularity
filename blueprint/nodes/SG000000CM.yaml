notes: 'Proposition 85.10 of research note 85. Cut $\tau$ by the three facet hyperplanes of $\sigma$ and resolve by stars that keep regular cones, to get a regular fan $\Delta$ with support $\tau$ and $\sigma \in \Delta$. Apply the conjecture to $\Delta$ and $\{\tau\}$. Along the stars from $\Delta$ the cones in $\sigma$ always form a subfan with support $\sigma$, and a star at a cone in $\sigma$ acts on it as a star. Oda''s conjecture is open in dimension 3 [AKMW02, Section 0.5], [AT19]; [DSK11] proves special cases. So toric $\mathrm{RSF}_3$ in general is open. The relative form for one cone in the octant is weaker than the conjecture, and SG000000CK suggests that it can be proved directly. The result is new in note 85, and a referee has not read it yet. Handbook Volume 9, Section 3.25. The result is not in Lean.'

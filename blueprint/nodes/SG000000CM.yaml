tag: SG000000CM
kind: theorem
title: 'Oda''s strong factorization conjecture implies toric RSF_3'
statement: 'Assume Oda''s strong factorization conjecture in dimension 3 for regular fans whose support is a convex cone: two such fans with the same support have a common refinement that is reached from each of them by smooth star subdivisions. Then for each regular cone $\sigma$ contained in a regular 3-cone $\tau$ there is a fan $F$, obtained from $\tau$ by smooth star subdivisions, such that the cones of $F$ in $\sigma$ form a fan that is obtained from $\sigma$ by smooth star subdivisions. In particular $\mathrm{RSF}(R, S_\sigma)$ of SG000000CG holds for each regular cone $\sigma$ in the octant.'

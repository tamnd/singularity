notes: This is Theorem 3.19.17 and Corollary 3.19.18 of Volume 7 of the handbook (Section 3.19). It is Theorem 3.3 and Corollary 3.4 of note 79 of the research notes, which the referee report in note 84 confirmed. The constant terms $b_j y_N^p z_N^{p-1} M_{j+1}$ that the translations create are $p$-th powers, so the cleaning removes them. Along $V(x', z_m)$ the coefficient of $z_m^{r_z + p - 1}$ of $g + h^p$ contains $y_m^{r_y + p - 1} w_m$, which no $p$-th power cancels, and the case of a coordinate $w - \sigma$ is similar. SG00000071 was already false for origin runs (SG00000072, SG00000073). It holds for $\deg_{x, w} g < p$ and for $g \in K[[y, z]][x^p, w^p]$, and these results do not change. L° and Hypothesis H1 hold for this run. Note 84 checked the run with a literal blowing up step for $p = 2, 3, 5, 7$, four words and $40$ steps, with random free coordinates; the largest order on the corner surfaces was $p - 1$. The result is not in Lean.

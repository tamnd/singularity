tag: SG0000000K
kind: theorem
title: The regular locus is open
statement: Let $k$ be a field, possibly imperfect. Let $X$ be a scheme that is locally of finite type over $k$. Then the regular locus of $X$ is open in $X$.
sources:
- paper: EGA4-7

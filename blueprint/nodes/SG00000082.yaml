tag: SG00000082
kind: theorem
title: Jung's method gives local uniformization of 4-folds for p > 24
statement: Let $k$ be an algebraically closed field of characteristic $p > 24$, and assume SG0000007W. Let $L$ be a function field of transcendence degree 4 over $k$ and $V$ a valuation ring of $L$ that contains $k$. Then there is a regular local ring $A$, essentially of finite type over $k$, with fraction field $L$ and dominated by $V$.

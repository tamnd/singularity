tag: SG000000C0
kind: lemma
title: 'Fac_3 forces direct factorization of 3-dimensional regular local rings'
statement: 'Assume that $\mathrm{Fac}_3$ of SG000000BZ holds for $(U, K)$. Then each regular local ring $S = \mathcal{O}_{Z,\zeta}$, with $\zeta$ as in $\mathrm{Fac}_3$, is an iterated monoidal transform of $R = \mathcal{O}_{U,\alpha(\zeta)}$: there is a chain $R = T_0 \subset T_1 \subset \dots \subset T_r = S$, dominated by $S$, where $T_{i+1}$ is a localization of the blowup of $\operatorname{Spec} T_i$ along a prime $P$ with $T_i / P$ regular. Conversely, each regular local ring $S$, essentially of finite type over $R$, that birationally dominates $R$ is $\mathcal{O}_{Z,\zeta}$ for some ideal $K$ and some $\zeta \in \mathrm{Reg}\, Z$.'
sources:
- paper: Cut09
  loc: 'proof of Theorem 15.1'
uses:
- SG000000BZ

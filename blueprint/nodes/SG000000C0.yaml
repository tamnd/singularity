tier: T2
route:
- R2
notes: 'Lemma 77.10 of research note 77, confirmed in note 82. A valuation that dominates $S$ goes through the blowups of $\sigma$ localized at $\alpha(\zeta)$, and this gives the chain. For the converse, $S$ is the local ring of a normalized blowup of $\operatorname{Spec} R$, which spreads out to a neighborhood and extends by SG000000BX. Research note 83 corrects the remark after the lemma in note 77: the statement that $\mathrm{Fac}_3$ forces is direct factorization, not strong factorization. Direct factorization implies strong factorization, which implies weak factorization. Handbook Volume 9, Section 3.24. The result is not in Lean.'

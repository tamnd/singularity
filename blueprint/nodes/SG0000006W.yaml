tag: SG0000006W
kind: theorem
title: A cylindrical point with a polynomial in the free coordinate satisfies the conjectures L and L+ and answers Question 3.13.18
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_m$ be a point of a corner run in four variables, cylindrical as in SG0000006V with $f \in K[[y_m, z_m]][x']$. Then only a finite number of the $t'_j$ are nonzero. For $j$ large the corner surfaces $V(x'_j, y_j)$ and $V(x'_j, z_j)$ and the corner curves $V(x'_j, w'_j, y_j)$ and $V(x'_j, w'_j, z_j)$ have $\nu^G = d_j \ge \rho$. So the conjectures SG0000006Z, SG00000071 and SG00000075 hold for the run, and Question 3.13.18 has a positive answer for it.

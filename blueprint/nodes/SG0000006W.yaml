notes: This is Corollary 3.17.14 of Volume 7 of the handbook (Section 3.17). The finiteness for the run of $f$ is Theorem 3.16.14 (SG0000006H), and the end of the run is Theorem 3.13.20 (SG0000005R). The function does not depend on $w'_j$, so the order along the surfaces and the curves is the order along the corner curves in three variables. It is Corollary 6.2 of note 39 of the research notes, where it depended on Corollary F of note 36. Theorem 3.16.14 removes this hypothesis. The result is not in Lean.

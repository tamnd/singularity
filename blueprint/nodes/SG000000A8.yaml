tag: SG000000A8
kind: theorem
title: The p-closed foliations on A^n that are invariant under the maximal torus
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$, let $A = k[x_1, \dots, x_n]$ with fraction field $K$, and let $T = \mathbb{G}_m^n$ act diagonally on $\mathbb{A}^n$. For $c \in k^n$ put $D_c = \sum_i c_i x_i \partial_i$. For a subspace $V \subseteq \mathbb{F}_p^n$ of dimension $r$ put $\mathcal{F}_V = (V \otimes_{\mathbb{F}_p} K) \cap T_{\mathbb{A}^n}$, where $V \otimes K$ lies in $T_{\mathbb{A}^n} \otimes K$ through the basis $x_i \partial_i$. Then $\mathcal{F}_V$ is a $T$-invariant 1-foliation of rank $r$, generated by the $\partial_j$ with $e_j \in V$ and the $D_c$ with $c \in V$, and each $T$-invariant 1-foliation on $\mathbb{A}^n$ is $\mathcal{F}_V$ for exactly one $V$. These generators have the normal form of Posva's Theorem 1 in the global coordinates. The foliation $\mathcal{F}_V$ is regular on $\mathbb{A}^n$ if and only if $V$ is spanned by coordinate vectors.

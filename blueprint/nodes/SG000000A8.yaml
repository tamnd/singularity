notes: 'This is Theorem 2.3, Remark 2.4 and Proposition 2.5 of research note 58, which the referee report in note 73 checked. The key step (Lemma 2.2 of note 58) says that a subspace $W \subseteq k^n$ with $W^{[p]} \subseteq W$ is spanned by vectors of $\mathbb{F}_p^n$, because Frobenius fixes the reduced row echelon basis. A free basis is $\{\partial_j : j \in J\} \cup \{D_c : c \in V, c_J = 0\}$ with $J = \{j : e_j \in V\}$. So Problem 4.9 of note 04 (Posva''s Theorem 1 in dimension 4) is trivial for this class, and the content of Problem 4.10 is regularity. Handbook Volume 9, Section 3.22. Not in Lean.'

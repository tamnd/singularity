tag: SG0000005C
kind: example
title: The codimension of the directrix goes down at the last step of a kangaroo path
statement: Over $\mathbb{F}_2$ in the variables $x, y, z$, let $g = x^3 z + x z^3 + x^4 y z$ and $\Delta = \{x, z\}$. Then $\rho = 2$, the point $P_0$ is in the first case, and $\tau_\rho(P_0) = 1$. At the point of the $x$-chart with $t_y = t_z = 1$, the new point $P_1$ is in the second case with $\rho = 2$ and $\tau_\rho(P_1) = 2$, and the component $z = 0$ leaves. At the origin of the $y$-chart of $P_1$, the new point $P_2$ is in the first case with $\rho = 2$, $\tau_\rho(P_2) = 1$ and $\widetilde\tau(P_2) = 2$. The directrices $T_\rho(P_0) = \{a_x = a_z\}$ and $T_\rho(P_2) = \{a_x = 0\}$ are different.

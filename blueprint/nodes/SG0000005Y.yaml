notes: This is Theorem 3.14.5 of Volume 7 of the handbook, the Theorem 1 of note 31 of the research notes with the statement of note 32. The step map is injective and keeps the componentwise order, so the minimal vectors at $P_m$ are images of vectors of $V$, and $V$ is finite by Dickson's lemma. $G_m$ is a unit if and only if one minimal vector is below all the others, that is, no pair of minimal vectors has a negative entry and a positive entry in its difference. SG0000005X bounds the number of windows for each such pair. When $\Delta$ has all coordinates and $G$ is a unit, the clean monomial $x^r$ has an entry $r_i$ that $p$ does not divide, so $\rho = 0$. For $n = 3$ the theorem shows that an origin run with $\rho \ge 1$ uses at most two charts from some point on. Note 32 checks the bound by a full search of the words for $n = 3$ and $n = 4$, with no failure. The result is not in Lean.

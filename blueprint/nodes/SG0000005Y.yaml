tag: SG0000005Y
kind: theorem
title: An origin run that uses all charts reaches rho equal to 0 after a bounded number of windows
statement: Let $n \ge 2$, and let $P_N, P_{N+1}, \dots$ be an origin run. Let $P_M$ be a point such that each of the $n$ letters occurs among the steps from $P_N$ to $P_M$. Let $V$ be the set of the minimal exponent vectors of $g_M$, and let $W$ be $0$ or the largest value of $\Phi(e - e') - 1$ for $e, e'$ in $V$ with $e - e'$ not $\ge 0$ and not $\le 0$. If $G_m$ is a unit for some $m \ge M$, then $G$ is a unit and $\rho = 0$ at $P_m$ and at each later point. If the steps after $P_M$ contain $W + 1$ disjoint windows, each with all $n$ letters, then $\rho = 0$ at the end of the last window. So in an origin run with $\rho \ge 1$ at each point, at least one letter occurs only a finite number of times.

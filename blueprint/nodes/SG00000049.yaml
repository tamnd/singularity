tag: SG00000049
kind: theorem
title: Order reduction for marked ideals
statement: Let $X$ be a smooth variety over a field of characteristic 0, let $E$ be a divisor with simple normal crossings and an ordered index set, let $m \ge 1$, and let $I$ be an ideal sheaf that is nonzero on each irreducible component of $X$. Then there is a blowup sequence of order at least $m$ for $(I, m)$ with $\operatorname{cosupp}(I_r, m) = \emptyset$. If $I$ is a monomial ideal $\mathcal{O}_X(-\sum_D a_D D)$, with $D$ over the components of $E$, the centers can be taken as intersections of components of the transforms of $E$.
sources:
- paper: Kol07
- paper: Wlo05

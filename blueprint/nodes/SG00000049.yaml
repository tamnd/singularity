tier: T8
notes: Volume 2 of the handbook proves the theorem by induction on $n = \dim X$. The case $n = 0$ is trivial. Order reduction for ideals in dimension $n$ implies the theorem in dimension $n$ (Theorem 3.3.10), with the monomial case (Theorem 3.3.8) and the split $I = M(I) \cdot N(I)$ into the monomial and the nonmonomial part (Lemma 3.3.7). The node states only the existence of the sequence. The step SG00000048 in the next dimension needs the functorial form, which is compatible with smooth morphisms and does not depend on choices. Volume 2 cites the functorial form from [Kol07] and does not prove it, so this node and SG00000048 close the induction only with that citation. The proof follows [Kol07, Chapter 3], Section Order reduction for marked ideals. No Lean statement yet.

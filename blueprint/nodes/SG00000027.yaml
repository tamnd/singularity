tag: SG00000027
kind: theorem
title: The normalization of an affine curve in characteristic 0
statement: Let $k$ be a field of characteristic 0 and let $A$ be a domain of dimension at most 1 that is a finitely generated $k$-algebra. Then the normalization of $A$ is a Dedekind domain. In particular, each of its local rings is regular.

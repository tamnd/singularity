tag: SG00000062
kind: theorem
title: The translations of a corner run give a pseudo Cauchy sequence of transcendental type
statement: Let $n = 3$, and let $P_N, P_{N+1}, \dots$ be a sequence of points where $V(y)$ and $V(z)$ are in $\Delta$ and $V(x)$ is not, each step is the $y$-chart or the $z$-chart followed by a translation $t_m \in K$ in $x$, and each chart occurs an infinite number of times. Let $v$ be the monomial valuation of the irrational ray of the run on $H = K(y_N, z_N)$, let $\hat H$ be the completion, let $j_1 < j_2 < \cdots$ be the indices with $t_j \ne 0$, and put $a_i = \varphi_{j_i + 1}$. If an infinite number of the $t_j$ are not $0$, then $(a_i)$ is a pseudo Cauchy sequence of transcendental type over $\hat H$. So for each $f \in \hat H[X]$ the value $v(f(a_i))$ is constant for $i$ large.

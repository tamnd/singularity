notes: This is Proposition 3.15.7 of Volume 7 of the handbook, with Lemma 3.15.6. The sequence has no limit in $\hat H$, since each element of $\hat H$ has only a finite number of terms below each value in the Hahn field $K((t^{\mathbb{Z} + \theta \mathbb{Z}}))$ and a limit would contain all the terms $t_j M_{j+1}$. The valuation is an Abhyankar valuation, so the henselization $H^h$ is defectless by the generalized stability theorem of Kuhlmann [Kuh10, Theorem 1.1], and a henselian defectless field is algebraically maximal. A density argument moves a polynomial over $\hat H$ to a polynomial over $H$ with the same values at the $a_i$. A theorem of Kaplansky (Maximal fields with valuations, Duke Math. J. 9 (1942)) then gives a limit in $H^h$, which is contained in $\hat H$. The proof is in note 30 of the research notes, with the density argument of the referee report in note 33. The result is not in Lean.

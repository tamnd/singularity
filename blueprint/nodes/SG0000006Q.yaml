tag: SG0000006Q
kind: conjecture
title: Each corner run in four variables has only a finite number of nonzero translations
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Then each corner run in four variables from $P_N$, with two letters $y, z$ and translations $(a_m, b_m) \in K^2$, has only a finite number of nonzero translations. This is false. SG0000006T is a counterexample.
sources:
- paper: CJS20

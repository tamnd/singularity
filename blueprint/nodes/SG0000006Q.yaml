notes: 'This is Question 3.17.7 of Volume 7 of the handbook (Section 3.17). The Notes of Section 3.14 asked it, as the analogue for $n = 4$ and $k = 2$ of the finiteness for $n = 3$ (SG0000006H). The answer is negative: SG0000006T gives runs with $\rho = 1$ and an infinite number of nonzero translations in each free coordinate system, also for points with $\deg_{x, w} g = 2 < p$. Question 3.13.18 is not refuted by this, and the corrected forms are SG0000006Z and SG00000075. The status stays open until a Lean proof of the negation exists.'

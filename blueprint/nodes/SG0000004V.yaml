notes: The Lean file is Singularity/Invariant/Tschirnhausen.lean of tamnd/singularity-lean#98. The other Lean names are Singularity.tschirnhausen_transformation, Singularity.eq_zero_of_le_ord_translate and Singularity.le_ord_translate_zMonic_iff. The hypothesis that $m$ is a unit is necessary. The example of Narasimhan (SG00000018) is in this form with $m = 2$ in characteristic 2, and it has a point of order 2 with $z = 1$ (Singularity.not_tschirnhausen_charTwo). This node is the case where $m$ is a unit. It is not the reduction of Cossart-Piltant to $z^p + g$, which is about the case $p \mid m$.

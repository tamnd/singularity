tag: SG0000004V
kind: theorem
title: The lemma of Tschirnhausen
statement: Let $f = z^m + \sum_{i < m} a_i(x) z^i$ with $m$ a unit in the ring of coefficients. The change $z \mapsto z - a_{m-1}/m$ gives $a_{m-1} = 0$. For $f$ in this form, each point where $f$ has order at least $m$ lies on the hypersurface $z = 0$. Over a field with $m \ne 0$, let $f$ have order $m$ at the origin, and let a chart of the point blowup give a weak transform $f'$ of order at least $m$ at the origin of the chart. Then the chart is an $x_j$-chart with translation 0 for $z$, and $f'$ is again of this form.

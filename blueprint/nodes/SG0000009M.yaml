notes: 'This is Theorem 66.3 of research note 66, which the referee report in note 72 checked by hand for $p = 3$ and by independent exact code for $p = 3, 5, 7$, with the values $\frac43$, $\frac65$ and $\frac87$ at the new point and $\omega \le 1$ at each other point of multiplicity $2p$ over $\xi$. One sentence of the proof is corrected by note 72: by the theorem of Lucas, $\binom{2p-2}{p-1} \equiv 0$, so the rigid coefficient $b_{p+1}$ is $0$. The least rigid slope is attained at $j = 2p - 3$, where it is $\frac{6p-4}{2p-1}$, so the conclusion does not change. The mechanism is the one of SG0000009K: the re-preparation at the new point removes the $p$-th power $\lambda^{p-1} x_0^p x_1''^p$ from $F$ and leaves a term of order $2p + 1$ that is linear in the new free variable, and $\mu_0$ jumps to $1$. Handbook Volume 7, Theorem 4.4.8. The result is not in Lean.'

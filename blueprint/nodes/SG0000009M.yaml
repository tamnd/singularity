tag: SG0000009M
kind: counterexample
title: 'A jump of omega by 1/p under the centre of Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $E = \{0, 2\}$, $F = x_0 x_1^p x_2^{p-1}$ and $f = (z^p + F)^2 + x_0^{2p} x_1 x_2^2 z^{2p-2} + x_0^2 x_1^{p+1} x_2^{4p+2}$. Then $f$ is reduced, the origin $\xi$ has multiplicity $2p$ and lies in R1, $\delta = 2$, $\mu = (\frac1p, \frac12, \frac{p-1}{p})$ and $\omega(\xi) = 1$. For each choice of base coordinates adapted to $E$ and each tie-break, Rule 61.9'' blows up the point $\xi$. For $\lambda \in k^*$, the point $x_1'' = 0$, $x_2'' = \lambda$ of the chart of $x_0$ has multiplicity $2p$, lies in R1, has $E'' = \{0\}$ and has $\omega = \frac{p+1}{p}$. So $\omega$ goes up by $\frac1p$ under the centre of the rule.'

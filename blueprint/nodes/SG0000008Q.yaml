tag: SG0000008Q
kind: counterexample
title: 'The Newton criterion for z^p + g needs a perfect field'
statement: 'Let $K = \mathbb{F}_p(t)$, $n = 1$ and $g = t x^p$. Then $z^p + t x^p$ is Newton nondegenerate over $K$, but each point of $K^*$ is a critical point of each initial form $\operatorname{in}_w g = t x^p$. So the equivalence of SG0000008P fails over a field that is not perfect.'
sources:

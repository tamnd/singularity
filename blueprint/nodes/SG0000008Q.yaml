notes: 'This is Example 2.9 of research note 55, from Section 2 of research note 60. The initial forms of $z^p + t x^p$ are $z^p$, $t x^p$ and $z^p + t x^p$. A singular point of the last one in the torus needs $(z/x)^p = -t$, and $t$ is not a $p$-th power in $K$. Over the algebraic closure of $K$ the polynomial is degenerate. Lean proves the example (Singularity.newtonNondegenerate_ratFunc_example, with Singularity.newtonNondegenerate_purelyInseparable_monomial and Singularity.ratFunc_pow_ne_neg_X, tamnd/singularity-lean#208).'

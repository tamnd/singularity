tag: SG00000087
kind: lemma
title: The Hasse derivative test for an element of order one
statement: Let $k$ be a field of characteristic $p > 0$, let $I \subseteq k[[x_1, \dots, x_n]]$ be an ideal of order $e \ge 1$, and let $\mathrm{in}_e(I)$ be the $k$-span of the parts of degree $e$ of the elements of $I$. Let $\Delta^{e-1}(I)$ be the ideal generated by the Hasse derivatives $D^{(\alpha)} F$ with $F \in I$ and $|\alpha| \le e - 1$. Then $\Delta^{e-1}(I)$ contains an element of order 1 if and only if $\mathrm{in}_e(I) \not\subseteq k[x_1^p, \dots, x_n^p]$. In particular this is the case if $p \nmid e$.

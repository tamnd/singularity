notes: Lemma 7.1 of research note 56. It is a standard lemma. The linear part of $D^{(\alpha)} F$ with $|\alpha| = e - 1$ is $\sum_j (\alpha_j + 1) c_{\alpha + e_j} x_j$, where the $c_\beta$ are the coefficients of the part of degree $e$ of $F$. The criterion depends only on $\mathrm{in}_e(I)$, so a completion or an extension of $k$ does not change it. Handbook Volume 9, Section 3.21. Planned for Lean.

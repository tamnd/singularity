notes: The Lean statement of tamnd/singularity-lean#69 and tamnd/singularity-lean#70 uses the affine form of local uniformization (Singularity.HasLocalUniformization). For each finite subset of the valuation ring, there is a finitely generated k-subalgebra A of K with fraction field K that contains the set and is contained in the valuation ring, such that the localization of A at the center is a regular local ring. Volume 3, Proposition 4.1.6 of the handbook proves that this form is equivalent to the form with proper birational morphisms. The statement is not proved. The statement is for each prime p, and it is open.

notes: This is Conjecture 3.19.22 of Volume 7 of the handbook (Section 3.19). It is Conjecture 5.2 of note 79 of the research notes. By SG0000006Z each corner run of $g$ is linear. The claim holds for $\deg_{x, w} g < p$ (SG0000008M) and for $g \in K[[y, z]][x^p, w^p]$ (SG00000094), and it contains SG000000BN. The stronger form $\operatorname{in} G_m \in K[x'_m]$ is false for $\deg_{x, w} g \ge p + 1$ by SG000000BJ, and Conjecture L+ is false for these runs by SG000000BK. It is open.

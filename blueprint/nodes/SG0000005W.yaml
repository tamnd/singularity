notes: This is Theorem 3.13.27 and Corollary 3.13.28 of Volume 7 of the handbook, with Lemmas 3.13.24 and 3.13.25 and Proposition 3.13.26. The proof uses the monomial valuation of the irrational ray of the chart sequence. In this class no step needs a cleaning, and an infinite number of nonzero translations gives a point where the value of $g$ at $x = \varphi_m$ is less than the value of the coefficient of $x^p$, so $\rho$ drops to $0$. The corollary applies Theorem 3.13.20 (SG0000005R) at the point after the last translation. The proofs are in notes 27, 28 and 29 of the research notes, with a computer test. The result is not in Lean. The case of a general $g$ is open, because the cleaning can remove the least term.

tag: SG0000005W
kind: theorem
title: A corner run of B1 x^p + B0 with free translations has only a finite number of nonzero translations
statement: Let $n = 3$ and let $g = B_1(y, z) x^p + B_0(y, z)$ with $B_0, B_1 \in K[[y, z]]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a run where $V(y)$ and $V(z)$ are in $\Delta$ and $V(x)$ is not, each step is the $y$-chart or the $z$-chart followed by a translation in $x$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point. Then only a finite number of the translations are not $0$, and for $m$ large both corner curves at $P_m$ have $\nu^G \ge \rho$.
sources:

tag: SG00000022
kind: theorem
title: Regular local rings of dimension 1
statement: Let $R$ be a Noetherian local domain of dimension 1. Then $R$ is regular if and only if $R$ is a discrete valuation ring, and if and only if $R$ is integrally closed.

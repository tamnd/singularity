notes: This is Example 3.13.15 of Volume 7 of the handbook, and it shows that SG0000005K is false. Write $g = y^a z^b (x^p + y^m z^l)$. The $y$-chart sends $(a, b, m, l)$ to $(a + b, b, m + l - p, l)$ and the $z$-chart sends it to $(a, a + b, m, m + l - p)$, and both keep $a l - b m \equiv -1 \pmod p$. So the point stays clean, and $\widetilde\Theta(G) = (x^p, y^m z^l)$. The bound of the order of $G$ along $Z$ by the order of $\widetilde\Theta(G)$ along $Z$ plus 1 (Lemma 3.13.14) puts $x$ and $y$ or $z$ in the prime ideal of $Z$, and the run leaves the strict transforms of the planes $y = 0$ and $z = 0$. The corner curves $V(x, y)$ and $V(x, z)$ have the order $\rho$, but the run follows neither of them. Remark 3.13.16 gives a run of the same type in the second case with $g = x^{p+1} y z + y^{p+3} z^{p+2}$. The test `check_cex.py` of note 24 of the research notes checks the data for $p = 2, 3, 5, 7$. The run, the invariant, the clean point and the ideal are proved in Lean as SG0000005Q. The bound of Lemma 3.13.14 and the claim on subvarieties are proved in Lean for the coordinate subvarieties and polynomial $h$, as SG0000005T and `Singularity.CornerRuns.cornerRun_orderGAlong_lt`. The general claim on formal subvarieties is not in Lean.

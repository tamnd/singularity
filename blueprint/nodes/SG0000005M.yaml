tag: SG0000005M
kind: counterexample
title: A corner run lies on no subvariety of the locus of the order of G
statement: Let $p$ be a prime, $n = 3$ with the variables $x, y, z$, $\Delta = \{y, z\}$ and $g = x^p y z + y^{p+2} z^{p+1}$. Let $P_0, P_1, \dots$ be a sequence of the $y$-chart and the $z$-chart at the origin that uses each chart an infinite number of times. Then each $P_k$ has $\rho = d = \sigma = p$ and $\tau_\rho = 1$, so the sequence is an infinite run in the first case. For each $N$ and each regular formal subvariety $Z$ of positive dimension at $P_N$ such that $P_k$ is on the strict transform of $Z$ for each $k \ge N$, the order of $G$ along $Z$ is less than $\rho$. The same holds for $n \ge 4$ with more variables that are not in $\Delta$.
sources:
- paper: CJS20
uses:

notes: 'This is Example 75.8 of research note 75, which the referee report in note 78 checked by hand and by independent code. The nonzero generators of $\Theta^{\le 2}(g)$ are $x^6 y^3$ (from $\beta = e_y, 2 e_x, 2 e_y$), $x^4 y^8$ (from $\gamma = e_w$) and $x^4 y^4$ (from $\gamma = 2 e_w$). After the blowup the three monomials have the odd logarithmic coefficients $\binom51$, $\binom22$ and $\binom11$ of order at most $2$. Note 78 also found that $\rho_3$ and $\rho_4$ go from $1$ to $2$, and that the origin of the $w$-chart is the only rational point of order $8$ over the origin. Here $m = 2$ is a level strictly between $1$ and $P$. Handbook Volume 7, Section 3.19. The example is not in Lean.'

tag: SG000000A4
kind: example
title: An intermediate Hasse-Schmidt residual order goes up for q = 8
statement: 'Let $K$ be an algebraically closed field of characteristic $2$, $q = 8$, $P = 4$, $R = K[[x, y, w]]$ with the boundary $\{x, y\}$, and $g = x^4 y^8 w + x^4 y^4 w^2 + x^6 y^3$. Then $\Theta^{\le 2}(g) = x^4 y^3 (x^2, y^5, y)$ and $\rho_2 = 1$. At the origin of the $w$-chart, $g'' = x^4 y^8 w^5 + x^4 y^4 w^2 + x^6 y^3 w$ with the boundary $\{x, y, w\}$, $\Theta'' = x^4 y^3 w (y^5 w^4, y w, x^2)$ and $\rho''_2 = 2$. Meanwhile $\rho_1 = 2$ and $d = 2$ do not change.'
sources:
- paper: HP19a

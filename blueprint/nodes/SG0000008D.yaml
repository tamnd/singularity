notes: This is Lemma 3.18.10 of Volume 7 of the handbook (Section 3.18). It is Lemma 3.1 of note 54 of the research notes, refereed in note 63. The proof is the proof of SG0000008C for the tail of the run, and it uses only that the coefficients are of finite type. This is what makes the induction of SG0000008E work. The result is not in Lean.

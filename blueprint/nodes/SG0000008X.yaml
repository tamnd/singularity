notes: 'This is Theorem 11.2 of research note 55, which research note 60 checked. In the $x$-chart the strict transform is $z''^p + h(1, t)$, a curve times a line. For $z^5 + x^4 y + x y^4$ the three critical directions give $e = 2$, so one weighted blowup and three toric modifications resolve it, while no change $(\varphi, q)$ makes it nondegenerate (SG0000008R). If $g$ has terms of higher order, the strict transform is not a product. The residual order still drops at each point over the origin when $n = 2$, and for $n \ge 3$ outside the points over the directions $v$ with $\partial_v h \equiv 0$ (SG0000009D, from research note 68). Also no change of all coordinates makes $z^5 + x^4 y + x y^4$ nondegenerate (SG00000097). The result is not in Lean.'

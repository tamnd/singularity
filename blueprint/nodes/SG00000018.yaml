tag: SG00000018
kind: counterexample
title: Maximal contact fails in characteristic $p$
statement: Let $K$ be a field of characteristic 2 and let $f = x^2 + y z^3 + z w^3 + y^7 w$. The curve $(t^{32}, t^7, t^{19}, t^{15})$ is in the locus of order 2 of $f$, and no formal power series of order 1 vanishes on it. Thus no smooth hypersurface germ at the origin, also no formal one, contains the points of order 2 of $f$, and $f$ has no hypersurface of maximal contact at the origin, also locally in the étale topology.
sources:
- paper: Nar83

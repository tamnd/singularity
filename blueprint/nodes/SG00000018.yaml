- SG00000013
lean:
  statement: Singularity.Examples.narasimhan
  proof: Singularity.Examples.narasimhan
tier: T4
notes: The Lean proof shows that $f$ and its partial derivatives vanish on the curve, and that each $h$ in $K[[x, y, z, w]]$ with $h(\gamma(t)) = 0$ has order at least 2 (Singularity.Examples.two_le_order_of_subst_eq_zero). The step from the formal statement to the étale statement uses that an étale local ring and the local ring have the same completion, and it is not in Lean.

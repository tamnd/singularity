tag: SG0000007G
kind: lemma
title: The inseparable layer is rigid, Lucas form
statement: Let $R$ be a commutative ring of characteristic $p > 0$ and let $f \in R[z]$ have degree $m = p^e m_0$ with $p \nmid m_0$. With $a_i$ and $a'_i$ as in the Lucas form of the Tschirnhausen coefficient, for $0 < i < p^e$ and $c \in R$, $a'_i = a_i + \sum_{0 < j < i} \binom{m-j}{i-j} a_j c^{i-j}$. In particular, if $a_1 = \dots = a_{i-1} = 0$, then $a'_i = a_i$.

notes: This is Theorem 3.17.27 of Volume 7 of the handbook (Section 3.17). By SG00000076, $\operatorname{in} G = c z^d$, so $G'_c \equiv c z'^d$ modulo $y$, $P'$ has type $0$, and SG00000076 at $P'$ for the $z$-step needs $\operatorname{in} G'_c = c'' y^d$. It is Theorem 3.3 of note 40 of the research notes. The result is not in Lean.

tag: SG00000078
kind: theorem
title: At a point of type 0 with rho less than p no corner run can change the letter
statement: Let $n = 4$, $\Delta = V(y) \cup V(z)$, and let $P$ be a clean point with $\operatorname{ord} g \ge p$ of type $0$ with $1 \le \rho = d < p$. Then a $y$-step from $P$ to $P'$ followed by a $z$-step from $P'$, both keeping $\rho$, is not possible. The same holds with $y$ and $z$ exchanged.
sources:

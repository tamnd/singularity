notes: This is Theorem 3.17.15 of Volume 7 of the handbook (Section 3.17). Part 1 is the dominance lemma 3.15.4 on the union of the supports of $\gamma_1$ and $\gamma_2$. Part 2 reduces to Theorem 3.15.16 (SG00000066). Part 3 is SG0000006W. For $\deg_T \Phi < p$ and for $\Phi = B_1 T^p + B_0$, part 3 also follows from Theorem 3.15.17 and Theorem 3.13.27. It is Theorem 7.1 of note 38 of the research notes, with the fixes of note 39. Note 38 tagged part 3 for a general $\Phi$ as conditional on note 36; Theorem 3.16.14 makes it unconditional. The result is not in Lean.

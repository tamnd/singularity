tag: SG0000005V
kind: theorem
title: A long stretch of corner charts with no translation ends at a corner curve with the order of G at least rho
statement: Let $n = 3$, and let $P_j, \dots, P_m$ be a stretch of a run where each step is at the origin of the $y$-chart or of the $z$-chart, with $V(y)$ and $V(z)$ in $\Delta$. Let $c_1$ and $c_2$ be the columns of the exponents from $P_j$ to $P_m$, and assume that the monomials of $g_j$ satisfy the two inequalities of Lemma 3.13.19 for $c_1$ and $c_2$. Then at $P_m$ the initial form of $G_m$ is a monomial $c \, x_m^{d_m}$, and the corner curves $V(x_m, y_m)$ and $V(x_m, z_m)$ have $\nu^G = d_m \ge \rho$.
sources:

notes: This is Corollary 3.13.23 of Volume 7 of the handbook. The proof of SG0000005R uses Lemma 3.13.19 only through its two inequalities, and the run need not be infinite. By Lemma 3.13.19 the inequalities hold for each long enough stretch where both charts occur often enough, so the corollary gives a positive answer to Question 3.13.18 at the end of such a stretch, also if the run has translations before or after it. The case where the stretches between the translations stay short is open. Note 27 of the research notes has the proof and a computer test of 759 branches with translations. The result is not in Lean.

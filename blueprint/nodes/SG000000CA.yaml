notes: 'Theorem 87.4 of the referee report in note 87, with the normal form of Lemma 87.1. Here $L_l = \{l, i\}$, $k_0 = k$, and the least $n$ with $x_m^n / x_i \in S$ is $k_1 = k + 1$, so a center with $\operatorname{ord} \varphi = k$ is not torus-invariant after any admissible change of parameters. In the completion, $\hat R_1 = F[[X, W, Z]]$ maps to $F[[a,b,c]]$ by $X = b^p c^k$, $Z = a^r b^s c$ and $W = a b c U - \lambda a^E b^{F_b}$, with $U$ a unit and $\lambda \ne 0$. The proof shows that no regular prime $Q$ of $R_1$ of height 2 or 3 has $Q S$ principal: such a $Q S$ is generated by a monomial times a unit, and six cases, by the generator that is not in the plane of the linear parts of $Q$, each give a contradiction. For the cone $\langle (0,1,3), (1,2,2), (3,4,1) \rangle$ of note 83, $(p,k,r,s) = (1,3,3,2)$, the center $(x, y + z^3)$ is the case $\varphi = -z^3$, and $W = a b (c + a^8 b^4)$ (Remark 87.5). The result is new in note 87, and a second referee has not read it yet. Handbook Volume 9, Section 3.25. The result is not in Lean.'

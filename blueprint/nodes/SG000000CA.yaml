tag: SG000000CA
kind: theorem
title: 'A dead chart: a monoidal transform of R after which S has no next center'
statement: 'Let $F$ be a field, and let $R \subseteq S$ be regular local rings of dimension 3 with the same fraction field, $S$ dominating $R$, with regular systems of parameters $x = (x_1, x_2, x_3)$ of $R$ and $(a, b, c)$ of $S$ that form a toric pair in the sense of research note 83, Definition 83.1. Assume that for distinct indices $l, i, m$ one has $x_l = b^p c^k$, $x_i = a b^{p+1} c^{k+1}$ and $x_m = a^r b^s c$, with $k \ge 2$, $r \ge 1$, $(r,s) \ne (1,1)$, $E = kr \ge 2$ and $F_b = ks - p \ge 2$. Let $P$ be a prime of $R$ of height 2 with $R/P$ regular and $P S$ principal, so that $P \hat R = (x_l - \psi(x_m), x_i - \varphi(x_m))$ with $\psi, \varphi \in F[[x_m]]$, and assume $\operatorname{ord} \varphi = k$. Let $R_1$ be the monoidal transform of $R$ along $P$ that $S$ dominates. Then $R_1 \ne S$, and $S$ dominates no monoidal transform $R_2 \ne R_1$ of $R_1$ along any regular center.'
sources:

tag: SG000000A2
kind: theorem
title: The Hasse-Schmidt residual order goes up only at points that are unbalanced in each adapted coordinate system
statement: 'In the setting of SG0000009V, let $g$ be clean with $\operatorname{ord} g \ge q$ and let $1 \le m < q$. Blow up the origin. If $\rho''_m > \rho_m$ at some point over the origin, then $g$ is unbalanced at the level $m$ in each adapted coordinate system.'

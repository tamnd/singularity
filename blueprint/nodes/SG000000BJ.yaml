notes: 'This is Theorem 3.19.14 of Volume 7 of the handbook (Section 3.19), which replaces Conjecture 3.19.14. It is Theorem 3.1 and Corollary 3.2 of note 79 of the research notes, which the referee report in note 84 confirmed with Fix 3 (the explicit family of higher degree). The terms $b_j Y M_m^p M_{j+1} x_m^p$ that the translations create are $p$-th powers, so the cleaning removes them. The run contradicts only the clause on the initial form of SG0000009J: $d = \rho + 1$ and the corner curves have $\nu^G \ge \rho$. Proposition 3.17.30 (SG0000007B) is stated for $d < p$ and stays true; the example shows that it does not extend to $d = p + 1$. Note 84 checked the run with a literal blowing up step for $p = 2, 3, 5, 7$, four words and $40$ steps. The result is not in Lean.'

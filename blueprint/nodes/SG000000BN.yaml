notes: This is Conjecture 3.19.21 of Volume 7 of the handbook (Section 3.19). It is Conjecture 4.4' of note 79 of the research notes, the corrected form of Conjecture 4.4 of note 69 (SG0000009J), which SG000000BJ shows to be false. The corner surfaces are not part of the statement, since SG000000BK gives a run of a cubic with corner surfaces of order $1 < \rho$. By SG000000BM the list of forms and $\rho = 2$ hold at the points before a nonzero translation when the initial form there is binary. SG0000009H proves the claim when the function of $P_J$ has no monomial $x'^2 w'$, $w'^2$ or $w'^3$. The tests of notes 79 and 84 found no counterexample. It is open.

tag: SG000000BN
kind: conjecture
title: The initial forms and the corner curves of the linear corner runs of cubics in characteristic 2
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$. Let $p = 2$, let $g \in K[[y, z]][x, w]$ be clean with $\deg_{x, w} g = 3$, and let $P_N, P_{N+1}, \dots$ be a corner run in four variables of $g$ with an infinite number of nonzero translations. A corner run in four variables is a sequence $P_N, P_{N+1}, \dots$ in which each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, $\operatorname{ord} \ge p$ at each point, and $\rho \ge 1$ is the same at each point. Let $(x', w')$ be adapted coordinates, a linear free coordinate system at a point $P_J$ such that the translations of $x'$ are $0$ after $J$. Then for $m$ large, $\operatorname{in} G_m$ is one of $c\, x_m'^2$, $c\, x_m'^3$ and $x_m'^2 (c\, x'_m + c' w'_m)$ with $c$ or $c'$ not $0$, $\rho = 2$, and the corner curves $V(x'_m, w'_m, y_m)$ and $V(x'_m, w'_m, z_m)$ have $\nu^G \ge \rho$.

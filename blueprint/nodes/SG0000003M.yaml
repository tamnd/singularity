notes: The formula holds at each point of the exceptional divisor, translated or not. At a translated point the unit $x_j + t_j$ absorbs the derivation that is not logarithmic. For a base of dimension 3 this is in the thesis of Cossart. The Lean library does not prove it yet. It is an item of tamnd/singularity#106.

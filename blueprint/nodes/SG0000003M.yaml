tag: SG0000003M
kind: theorem
title: The transformation law of the log-Jacobian ideal under a point blowup
statement: Let $K$ be an algebraically closed field of characteristic $p > 0$, let $g \in K[x_1, \dots, x_n]$ with $\operatorname{ord} g \ge p$, and let $\pi$ be the $x_1$-chart of the blowup of the origin with the translations $t$. Put $g' = x_1^{-p} \pi(g)$ and $\Delta' = \{1\} \cup \{i \in \Delta \mid i \ne 1, t_i = 0\}$. Then, in $K[[x]]$, the log-Jacobian ideal of $g'$ for $\Delta'$ is $x_1^{-p} \pi(\Theta_0(g))$, where $\Theta_0(g) = (x_i \partial_i g \ (i \in \Delta)) + \mathfrak{m} (\partial_j g \ (j \notin \Delta))$.

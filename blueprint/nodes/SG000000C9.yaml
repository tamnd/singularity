tag: SG000000C9
kind: conjecture
title: 'Patching along curves'
statement: 'Let $\alpha \colon V_2 \to V_1$ and $\beta \colon V_3 \to V_1$ be projective birational morphisms of normal 4-folds, with $\beta^{-1}(\mathrm{Reg}\, V_1)$ regular, and let $\Gamma \subseteq V_2$ be an irreducible curve in the fundamental locus of $V_2 \dashrightarrow V_3$ such that $\alpha(\Gamma)$ is a curve that meets $\mathrm{Sing}\, V_1$. Then there are projective birational $V_2'' \to V_2$, a composite of blowups along regular centers over $\mathrm{Reg}\, V_2$ near $\alpha^{-1}(\mathrm{Sing}\, V_1)$, and $V_3'' \to V_3$, a composite of blowups along regular centers over $\beta^{-1}(\mathrm{Reg}\, V_1)$, both isomorphisms off a neighborhood of $\Gamma$, such that $V_2'' \dashrightarrow V_3''$ is a morphism near the generic point of $\Gamma$.'
sources:
- paper: CP19
  loc: 'Section 4.1'
- paper: Kar03

notes: 'Problem 83.P2 of research note 83. A positive answer removes $\Gamma$ from the fundamental locus and keeps the centers of the valuations in $N$ regular. Whether finitely many such steps, with SG000000BV, reach the condition (A$^{\rm w}$) of SG000000C6 is part of the problem. The modification of $V_2$ is allowed by SG000000CF. Note 83 named local strong factorization in dimension 3 over $\kappa(\Gamma)$ as the local input. Research note 85 corrects this: one modification near the generic point of $\Gamma$ must serve all valuations at the same time, so the local input is the relative strong factorization $\mathrm{RSF}_3$ of SG000000CG, which implies local strong factorization; the converse is open. In the toric case of SG000000C5 the problem is solved near $\Gamma$ (SG000000CH and SG000000CJ). Note 85 splits the general problem into (N1) $\mathrm{RSF}_3$ at the generic point of $\Gamma$, (N2) closures of the centers that stay regular at the points of $L$, (N3) no new bad components near the special points of $\bar\Gamma$, (N4) termination of the alternating blowups, and (N5) the weak form of SG000000BV at closed points. It is open. Handbook Volume 9, Sections 3.24 and 3.25. The result is not in Lean.'

tier: T6
route:
- R2
notes: 'Problem 83.P2 of research note 83. A positive answer removes $\Gamma$ from the fundamental locus and keeps the centers of the valuations in $N$ regular. Whether finitely many such steps, with SG000000BV, reach the condition (A$^{\rm w}$) of SG000000C6 is part of the problem. The local input at the generic point of $\Gamma$ is local strong factorization in dimension 3 over $\kappa(\Gamma)$, open in characteristic $p$. The new global difficulty is the termination of the alternating blowups along $\Gamma$ near its points over $\mathrm{Sing}\, V_1$. It is open. Handbook Volume 9, Section 3.24. The result is not in Lean.'

tag: SG0000008Z
kind: conjecture
title: 'The critical set obstruction for all changes of coordinates when D = p'
statement: 'Let $k$, $g$, $D$, $h$ and $C$ be as in SG0000008R, and assume $D = p$. Assume that $C$ is not contained in the union of $n$ hyperplanes with linearly independent equations, and let $F = z^p + g$. Then for each automorphism $\Psi$ of $k[[x, z]]$ and each unit $u$ of $k[[x, z]]$, the series $u \cdot (F \circ \Psi)$ is Newton degenerate.'
sources:
- paper: Newt

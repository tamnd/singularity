notes: 'This is Lemma 7.1 and test family T of research note 76 with Fix 8 (the polynomial is $X^p - X + y_3$, not $X - X^p + y_3$), Fix 9 (item 4: the degree is $p^2$ and the extension is not purely inseparable) and Fix 10 of the referee report in note 80. A generic choice of $(c_m)$ exists by a countability argument, and the choice $c_m = 1$ for each $m$ is not allowed, because it gives $\zeta = t\vartheta$. Whether $K$ has local uniformization is open (SG000000BB). Handbook Volume 9, Section 3.23. The result is not in Lean.'

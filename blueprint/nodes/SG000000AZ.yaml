notes: 'This is Lemma 3.1 of research note 76 with the proof of (c) repaired by Lemma 2.1 of the referee report in note 80 (SG000000AY). For (c), if $F \subseteq F_0^c$ with $F_0$ Abhyankar, choose $y_1, y_2 \in F_0$ whose values are a basis; then $F_0 \subseteq k(y)^h$ by the stability theorem, so $F \subseteq C_y$ and SG000000AY gives $C_y = C$. The original proof assumed that $F_0 K_2$ is finite over $K_2$, which can fail. Handbook Volume 9, Section 3.23. The result is not in Lean.'

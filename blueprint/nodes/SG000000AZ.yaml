tag: SG000000AZ
kind: lemma
title: 'Rank 1 with value group Z^2: defect, the completion of an adapted pair, and Knaf-Kuhlmann type'
statement: 'Let $\nu$ be as in SG000000AS with rank 1 and let $K$ be a projection with $x_1, x_2$ adapted. (a) $F/K$ is immediate and its defect is $[F^h : K^h]$, so the defect is 1 if and only if $F \subseteq K^h$. (b) $C = K_2^c$ is defectless and algebraically maximal. (c) $\nu$ is of KK type if and only if $F \subseteq C$.'

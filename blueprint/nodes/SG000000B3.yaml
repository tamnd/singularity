tag: SG000000B3
kind: theorem
title: 'Towers with the ball property have local uniformization and local monomialization'
statement: 'Let $\nu$ be a rank 1 valuation of $K = k(x_1, x_2, x_3, x_4)$, trivial on $k$, with $K\nu = k$ and $\nu K \cong \mathbb{Z}^2$, and with $x_1, x_2$ adapted. If $x_3$ has the ball property over $K_2$ and $x_4$ has the ball property over $K_3$, then $(K, \nu)$ has local uniformization in the strong form and local monomialization: for each finite $Z \subset \mathcal{O}_\nu \setminus \{0\}$ there is a regular local ring $R$ of $K$, essentially of finite type over $k$ and dominated by $\nu$, with a regular system of parameters $u_1, u_2, y_3, y_4$ such that $\nu(u_1), \nu(u_2)$ is a basis of $\nu K$ and each $z \in Z$ is $u_1^a u_2^b$ times a unit of $R$, with $a, b \ge 0$.'
sources:

notes: 'This is Theorem 4.2 of research note 76 with Fix 6 of the referee report in note 80: the hypothesis is the ball property, because the distinctness of the Taylor values (Lemma 2.18 of [KK09]) needs it. The proof is an induction on $i$ with the substitution $Y = (x_i - d)/N$ and $R_i = R_{i-1}[Y]_{(\mathfrak m, Y - \lambda)}$. In the handbook the quotients are put into the finite set of the induction, so no extra Perron transform is needed. The rings are not localizations of polynomial rings in general, so the polynomial form of ELU(4) of note 57 is not claimed. Handbook Volume 9, Section 3.23. The result is not in Lean.'

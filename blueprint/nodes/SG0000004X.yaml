tag: SG0000004X
kind: theorem
title: The points where the log-Jacobian order stays lie in a directrix
statement: In the setting of SG0000003N, write $g = x^r G$, let $\rho = \rho(g)$ and let $\sigma$ be the order of the ideal $\widetilde\Theta_0(G)$ with $\Theta_0(g) = x^r \widetilde\Theta_0(G)$, so $\sigma \in \{\rho, \rho + 1\}$. Let $v$ be the vector of the chart, and assume that $\rho(g'_c) = \rho$. If $\sigma = \rho$, then $v$ lies in the directrix of $\operatorname{in}(h)$ for each $h \in \widetilde\Theta_0(G)$ of order $\rho$. If $\sigma = \rho + 1$, then $v$ lies in the directrix of $\operatorname{in}(h)$ for each $h \in \widetilde\Theta(G)$ of order $\rho$. So if these directrices meet only in $0$, then $\rho$ goes down at each point of the exceptional divisor. If $\rho = d$ and $p \nmid |r| + d$, then $v$ lies in the directrix of $\operatorname{in}(G)$.

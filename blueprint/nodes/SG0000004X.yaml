notes: This is Volume 7, Section 3.7 of the handbook, the analogue for the log-Jacobian order of the theorem of Hironaka SG0000003B on the points where the order stays. The first case is false with $\widetilde\Theta(G)$ in the place of $\widetilde\Theta_0(G)$. For $p = 3$, $g = x^3 (y^2 + x)$ and $E = V(x)$, the order $\rho = 1$ stays at the origin of the $y$-chart, but $v = (0, 1)$ is not in the directrix of $\partial_y G = 2y$. The theorem gives a place for the points where $\rho$ stays. It does not say that $\rho$ goes down after finitely many blowups. The Lean proof is not yet merged.

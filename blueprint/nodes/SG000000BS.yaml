tag: SG000000BS
kind: theorem
title: 'Resolution of 4-folds is local uniformization plus the fundamental theorem'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$. Suppose that for each function field $K$ of transcendence degree 4 over $k$ and each valuation $v$ of $K/k$ there is a regular local ring $A \subset K$, essentially of finite type over $k$, with fraction field $K$, dominated by $\mathcal{O}_v$. Assume SG000000BQ. Then each variety $X$ of dimension 4 over $k$ has a projective birational morphism $X'' \to X$ with $X''$ regular. Conversely, if each variety of dimension 4 over $k$ has such a morphism, then SG000000BQ holds, and each valuation of a function field of transcendence degree 4 has local uniformization in the affine form with a finite set.'

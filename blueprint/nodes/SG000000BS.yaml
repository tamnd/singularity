notes: 'This is Theorem 77.1(a) of research note 77, which the referee report in note 82 checked step by step. Proof: local uniformization gives a normal projective model $W_v$ with a regular center for each $v$; quasi-compactness (SG0000000X) gives finitely many of them; repeated use of SG000000BQ gives a regular projective model; Chow''s lemma and SG000000BQ with $V_1$ regular then resolve $X$. For the converse, resolve the normalized closure of the graph, and for the finite set $S$ resolve a projective closure of $\operatorname{Spec} k[S \cup S_0]$. The premise is the premise of SG0000007X, so SG0000007X follows from SG000000BQ. Note 82 calls the theorem a reformulation, not a reduction: the global input is exactly SG000000BQ. Handbook Volume 9, Section 3.24. The result is not in Lean.'

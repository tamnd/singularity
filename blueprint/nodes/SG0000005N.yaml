notes: This is Example 3.13.10 of Volume 7 of the handbook. Here $r = (0, a, b)$, $G = x^p$ and $\widetilde\Theta(G) = (x^p)$. The Lean proof is over `ZMod p`. The step lemmas are `Singularity.SurfaceRuns.rhoStep_surfacePoint_y` and `Singularity.SurfaceRuns.rhoStep_surfacePoint_z`, the run where the charts alternate is `Singularity.SurfaceRuns.surfaceRun`, and the case $p = 2$ is `Singularity.SurfaceRuns.surfaceRun_two`. The Lean file does not prove that the run follows no formal curve. That claim is Lemmas 3.13.4 and 3.13.5 of the handbook.

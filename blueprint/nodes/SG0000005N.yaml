tag: SG0000005N
kind: example
title: A run of point blowups that takes the corners lies on a surface
statement: Let $p$ be a prime, $n = 3$ with the variables $x, y, z$, $\Delta = \{y, z\}$ and $g = x^p y^a z^b$ with $\gcd(a, b) = 1$. The origin of the $y$-chart sends $g$ to $x^p y^{a+b} z^b$, the origin of the $z$-chart sends it to $x^p y^a z^{a+b}$, and $\rho = p$ at each point. So from $(a, b) = (1, 1)$ each sequence of the two charts is an infinite run with $\rho = p$ and distinct points. The run that takes the two charts in turn follows no formal curve, and each point of the run is on the strict transform of the surface $x = 0$, along which the order of $G$ is $p$.

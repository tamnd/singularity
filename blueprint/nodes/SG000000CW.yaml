tag: SG000000CW
kind: theorem
title: 'Rule 61.9'' terminates on germs with a_p = 0 or a_2p = 0 along branches without cancellation'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Suppose that $a_p = 0$ or $a_{2p} = 0$. Let $\xi_0, \xi_1, \dots$ be a sequence of Rule 61.9'' through rational points of multiplicity $2p$, in the coordinates of the charts, for any choice among tied centres, such that at each step to a point that is not a chart origin no vertex of the image polyhedron $\pi(U) + \mathbb{R}^3_{\ge 0}$ of SG000000CS cancels. Then the sequence is finite. So SG0000009T holds for these sequences.'

notes: 'This is Corollary 86.10 of research note 86. By SG000000CP the translation $\nu$ is $0$ and $z$ stays simultaneously prepared at each point, and at a chart origin no two monomials of one coefficient go to the same monomial. So the sequence is a branch of the extended model of SG000000CV. Cancellations of vertices do occur away from chart origins. The lab of note 86 found $74$ in $37161$ steps of the rule trees of $60$ random germs with $a_3 = 0$ ($p = 3$, truncated germs). On the branch of germ $52$ of the run with $a_6 = 0$, computed without truncation, there are $12$ cancellations (steps $6$ to $22$), $\omega = \frac13$ stays constant from step $7$ to step $79$, and at step $80$ the multiplicity drops and the branch ends. The truncated computation of this branch continues past this end, so truncated runs are evidence and not a check. So the sequences with cancellations are not covered, and whether they end is open. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Corollary 4.5.29. The result is not in Lean.'

notes: This is Volume 5, Theorem 1.3.4 and the first part of Lemma 1.3.3 of the handbook. The idea to lift along an extension that is unramified at the valuation is the idea of Zariski [Zar40]. The lifting holds in each characteristic and each dimension. The handbook uses the theorem for surfaces in characteristic 0 and for Abhyankar valuations (SG0000001E). The existence of an étale generator is the node SG0000004Y. tamnd/singularity-lean#116 proves the node. The definition of an étale generator is Singularity.IsEtaleGenerator. The first part of Lemma 1.3.3 is Singularity.IsEtaleGenerator.centerSubring_closure_eq, and the lemma of Euler (Lemma 1.3.1) is Singularity.aeval_derivative_minpoly_mul_mem_adjoin. The regularity step is Singularity.isRegularLocalRing_localization_adjoinRoot. If P is monic, P' is not in the prime Q, and A is regular at the prime under Q, then A[X]/(P) is regular at Q.

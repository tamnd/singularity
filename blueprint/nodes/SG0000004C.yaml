notes: This is Volume 5, Theorem 1.3.4 and Lemma 1.3.3 of the handbook. The idea to lift along an extension that is unramified at the valuation is the idea of Zariski [Zar40]. The lifting holds in each characteristic and each dimension. The existence of the generator uses the henselization [Kuh-book]. The handbook uses the theorem for surfaces in characteristic 0 and for Abhyankar valuations (SG0000001E). No Lean statement yet.

tag: SG0000004C
kind: theorem
title: Lifting local uniformization along an étale generator
statement: 'Let $K/k$ be a function field, let $K_0$ be a subfield with $k \subseteq K_0$ and $[K : K_0]$ finite, let $v$ be a valuation of $K/k$ and let $v_0$ be its restriction to $K_0$. An étale generator of $K/K_0$ at $v$ is an element $z \in \mathcal{O}_v$ with $K = K_0(z)$ such that the minimal polynomial $P$ of $z$ over $K_0$ has coefficients in $\mathcal{O}_{v_0}$ and $P''(z)$ is a unit of $\mathcal{O}_v$. If there is an étale generator of $K/K_0$ at $v$ and $v_0$ has local uniformization as a valuation of $K_0/k$, then $v$ has local uniformization as a valuation of $K/k$. If $v$ is not trivial, the ramification index of $v$ over $v_0$ is 1, the residue field extension is separable and the defect is 1, then there is an étale generator of $K/K_0$ at $v$.'

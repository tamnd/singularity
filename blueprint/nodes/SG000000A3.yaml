tag: SG000000A3
kind: example
title: The top Hasse-Schmidt residual order goes up for q = 4
statement: 'Let $K$ be an algebraically closed field of characteristic $2$, $q = 4$, $P = 2$, $R = K[[x, y]]$ with the boundary $\{x\}$, and $g = x^5 + x^4 y^2$. Then $g$ is clean, $r = (4, 0)$, $G = x + y^2$ and $d = 1$. The ideal of SG0000009V is $\Theta^{\le 2}(g) = (x^4)$, so $\rho_2 = 0$, with $\rho_{(0)} = 1$, $\rho_{(2)} = 0$, $\sigma = 1 = d$ and $\delta = 1$, and $g$ is unbalanced. At the origin of the $y$-chart, $g'' = x^5 y + x^4 y^2$ with the boundary $\{x, y\}$, $\Theta'' = x^4 y (x, y)$ and $\rho''_2 = 1 = \rho_2 + \delta$, while $d'' = 1$.'
sources:
- paper: HP19a

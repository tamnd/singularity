notes: 'This is Example 75.7 of research note 75, which the referee report in note 78 checked by hand and by independent code. The nonzero generators of $\Theta^{\le 2}(g)$ are $\Phi_{e_x, 0}(x^5) = x^5$ and $\Phi_{0, 2 e_y}(x^4 y^2) = x^4$, because $\binom51$ and $\binom22$ are odd and $\binom41$, $\binom42$, $\binom52$ and $\binom21$ are even. After the blowup each variable is a boundary variable, and both monomials have an odd logarithmic coefficient of order at most $2$, namely $\binom51$ and $\binom22$. So the bound $\rho_m + \delta$ of SG0000009X is attained. No sequence with $d \to \infty$ is known for $e = 2$. SG000000A5 extends the example to each $p$. Handbook Volume 7, Section 3.19. The example is not in Lean.'

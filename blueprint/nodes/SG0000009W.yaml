tag: SG0000009W
kind: lemma
title: The weighted order of the graded pieces is the residual order at the top digit levels
statement: 'In the setting of SG0000009V, let $g \ne 0$ be clean and let $P \le m < q$. Then, in each adapted coordinate system in which $g$ is clean, $\tilde r = r$, $\rho_{(c)} + c \ge d$ for each $c$, and $\sigma = d$. So $\varepsilon_c \ge 0$ for each $c$, some $c$ has $\varepsilon_c = 0$, and $\rho_m \le d \le \rho_m + m$.'

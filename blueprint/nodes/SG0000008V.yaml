notes: 'This is Proposition 11.1 of research note 55 in the form that research note 60 corrected (Proposition 4.2 of note 60). The first form said that these points are the singular points of the strict transform on the open orbit. This is false. For $p = 3$ and $f = z^3 + x^2 y + x y^2 + y^4$, the strict transform in the chart $y = x t$, $z = x z''$ is $z''^3 + t + t^2 + x t^4$. It is smooth at $(x, t, z'') = (0, 1, 1)$ but tangent to $E_W = \{x = 0\}$ there (Example 11.1a of note 55). So a measure of the defect after a weighted blowup must count the points that are not transverse. The result is not in Lean.'

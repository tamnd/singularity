tag: SG0000008V
kind: theorem
title: 'A weighted blowup localizes the degenerate faces of z^p + g'
statement: 'Let $f = z^p + g$, let $w$ be a weight with all entries positive, let $m = m_w(g) \ge 1$, let $\sigma$ be the face of $w$, and let $W = (p w, m)$, divided by the gcd. In each regular fan that contains the ray of $W$ and refines the normal fan of the Newton polyhedron of $f$, the points of the open orbit of the divisor $E_W$ where the strict transform is singular or not transverse to $E_W$ correspond to the torus orbits of the torus critical points $v$ of $g_\sigma$ with $g_\sigma(v) \ne 0$. If $g = g_\sigma$, these points are singular points of the strict transform.'
sources:

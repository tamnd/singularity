tag: SG0000005P
kind: example
title: The run of Cossart and Piltant follows a curve in a plane of the locus
statement: Over $\mathbb{F}_2$ in the variables $x_1, x_2, x_3, x_4$, let $\Delta = \{x_1, x_2\}$ and $g_k = x_2^k (x_2^2 x_3^2 x_4 + x_1^2 x_3)$ for $k \ge 0$. The origin of the $x_2$-chart sends $g_k$ to $g_{k+1}$, and $\rho = 2$ at each point. So the run of point blowups does not end. If $2$ divides $k + 1$, the point of the $x_2$-chart with $x_4 = 1$ also gives $g_{k+1}$, since the cleaning removes the extra square. So a run can follow the curve $x_1 = x_3 = 0$, $x_4 = \varphi(x_2)$ for a series $\varphi$ that is transcendental, and the Zariski closure of the curve is the plane $x_1 = x_3 = 0$.

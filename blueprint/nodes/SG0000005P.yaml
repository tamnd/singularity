notes: This is Example 3.13.11 of Volume 7 of the handbook, and Example 3.18 of [CP19] in the coordinates of the handbook. The handbook gives the example for each prime $p$, and the Lean proof is for $p = 2$. The step at the origin is `Singularity.SurfaceRuns.rhoStep_cpPoint`, and the step with the translation is `Singularity.SurfaceRuns.rhoStep_cpPoint_translate`. The Lean file does not prove that the curve is transcendental, which uses the theorem of Christol [Chr79], or the facts on the locus and the residual order at the generic point of the plane.

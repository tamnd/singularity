tag: SG000000C8
kind: conjecture
title: 'Regular reachability of regular cones is toric reachability'
statement: 'Let $F$ be a field, $R = F[x,y,z]_{(x,y,z)}$, and for a regular cone $\sigma \subseteq \mathbb{R}^3_{\ge 0}$ let $S_\sigma$ be the local ring of $F[\sigma^\vee \cap \mathbb{Z}^3]$ at its maximal monomial ideal. If $S_\sigma$ is an iterated monoidal transform of $R$ with arbitrary regular centers, then $\sigma$ is reached from $\mathbb{R}^3_{\ge 0}$ by smooth star subdivisions at 2-faces or at the cone.'
sources:
- paper: Ful93
uses:
- SG000000C2
- SG000000C3
tier: T3
route:
- R2
notes: 'Problem 83.P1'' of research note 83, stated in one direction. The converse is clear. Theorem 83.8 of note 83 reduces the question to a game on toric pairs; the referee report in note 87 adds the last step of its proof, that the final ring is $S$ by faithful flatness of the completion. Computation 83.9 of note 83 checks a sufficient condition (H) for the statement: for entries at most 3 all 144 cones that toric subdivisions do not reach are settled, and for entries at most 4, 768 of the 900 are settled. The referee report in note 87 confirms these counts with independent code; for entries at most 4 the hypothesis $|L_l| = 3$ of the point blowup occurs at 54 failing states, in 7 of the 22 classes that are left. Note 87 settles 6 of these classes, 36 cones, by the dead chart SG000000CA (SG000000CB). So for entries at most 4, 804 of the 900 cones are settled, all of them not reachable with regular centers, and 96 cones in 16 classes are open; an example is $\langle (0,1,3), (1,1,2), (4,3,4) \rangle$. The question is open in both forms. Note 85 makes it less important: the patching along curves needs only the relative strong factorization SG000000CG, not direct reachability. Handbook Volume 9, Sections 3.24 and 3.25. The result is not in Lean.'

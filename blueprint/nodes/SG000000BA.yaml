notes: 'This is Proposition 7.1 of the referee report in note 80. Part (b) uses $x_4 = \vartheta + \varepsilon$ with $\varepsilon \in M^h = L^h$ and the density of $L$ in $L^h$. The Artin-Schreier shape of key polynomial reduces in the same way to the coset components of $\vartheta$. Key polynomials of other shapes and of degree $p^e$ with $e \ge 2$ are not treated. Handbook Volume 9, Section 3.23. The result is not in Lean.'

tag: SG000000BD
kind: conjecture
title: 'Local uniformization of a discrete valuation with a residue field that is not finitely generated'
statement: 'Let $\nu = v_1 \circ \bar v$ be a rank 2 valuation of a function field $F$ of transcendence degree 4 over $k$, with $\nu F = \mathbb{Z}^2$ and $F\nu = k$, such that $\kappa = F v_1$ has transcendence degree $d \in \{1, 2\}$ and is not finitely generated over $k$. Then $v_1$ has local uniformization in the strong form, and so $\nu$ has local uniformization by SG000000AW.'
sources:

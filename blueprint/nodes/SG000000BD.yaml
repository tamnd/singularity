notes: 'This is open statement 1 of the referee report in note 80. Theorem 1.5 of [KK09] does not apply, because $v_1$ is not of KK type, and the examples of SG000000AX show that the case is not empty. With SG000000AT and SG000000AW it is the only open part of Problem V7 in rank 2 with value group $\mathbb{Z}^2$. Handbook Volume 9, Section 3.23. The result is not in Lean.'

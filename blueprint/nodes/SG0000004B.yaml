tag: SG0000004B
kind: theorem
title: Local uniformization of surfaces with a regular model
statement: Let $k$ be a field of any characteristic, let $K/k$ be a function field of transcendence degree 2, and let $v$ be a valuation of $K/k$. Assume that there is an affine model $A \subseteq \mathcal{O}_v$ of $K/k$ whose local ring at the center of $v$ is regular. Then $v$ has local uniformization. In particular each valuation of the field $k(x, y)$ of rational functions over $k$ has local uniformization.
sources:

notes: This is Volume 5, Corollaries 1.2.7 and 1.2.8 of the handbook. The proof follows the quadratic sequence SG0000004A on affine models. It holds also for valuations with a defect. In characteristic $p$ the difficulty of surfaces is the passage from $k(x, y)$ to a finite extension. Local uniformization is in the affine form of Volume 3, Proposition 4.1.6, the form of `Singularity.HasLocalUniformization`. No Lean statement yet.

notes: The proof uses part 1 of the dichotomy SG0000003F at the new point and the order of the weak transform SG0000003A. It does not use the number of variables. The corollary is Moh's bound SG00000015 for $q = p$ at each point. The residual order goes up only when $\rho$ stays the same and the type changes from 0 to 1, as at the kangaroo point of $x^3 y + x y^3$ in characteristic 2. The Lean library proves the theorem and the corollary for polynomials (tamnd/singularity-lean#93). The Lean proof stays in $k[x]$ and replaces unique factorization in $K[[x]]$ with divisibility by monomials. Corollary 3.14 of research note 03, that $d' = d + 1$ forces $\rho' = \rho = d$, type $0$ before and type $1$ after, is Singularity.kangaroo_type_switch (tamnd/singularity-lean#199), with $d'$ in the coordinates of the chart.

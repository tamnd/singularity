tag: SG0000003N
kind: theorem
title: The residual order of the log-Jacobian ideal does not go up under a point blowup
statement: In the setting of SG0000003M, let $g \ne 0$ be clean with $\operatorname{ord} g \ge p$, and let $g'_c$ be the clean part of $g'$ for $\Delta'$. Then $g'_c \ne 0$ and $\rho(g'_c) \le \rho(g)$. So the residual orders satisfy $d' \le \rho(g'_c) + 1 \le \rho(g) + 1 \le d + 1$.

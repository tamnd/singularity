notes: This is Corollary 3.18.36 of Volume 7 of the handbook (Section 3.18). It is Corollary 5.5 of note 64 of the research notes, with the fix 3 of note 67, which is that the case $\deg_{x, w} g < p$ satisfies (C), so SG00000092 covers it. For $\deg_{x, w} g = 0$ there is no run by SG0000006M. Otherwise the run is not planar by SG00000092 or, for $g \in K[[y, z]][x^p, w^p]$, by Theorem 3.18.35, which is part 2 of SG00000094. By SG0000008N a run that is not planar satisfies SG0000006Z. This gives Conjecture L for $\deg_{x, w} g = p$, but not the conjecture SG00000075 or Hypothesis SG0000007D in this degree. SG0000006Z extends the linearity and Conjecture L to each clean $g \in K[[y, z]][x, w]$. The result is not in Lean.

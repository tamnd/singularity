tag: SG00000093
kind: theorem
title: Each corner run in four variables of degree at most p, or under the condition (C), or in the p-th powers of x and w, is linear
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Condition (C) says that for each $e \ge 1$ the Hasse derivatives $g^{[p^e, 0]}$ and $g^{[0, p^e]}$ in the variables $(x, w)$ are in $K[[y, z]]$, that is, they do not depend on $x$ and $w$. Assume that $\deg_{x, w} g \le p$, or that $g$ satisfies (C), or that $g \in K[[y, z]][x^p, w^p]$. Then the run is linear, and the conjecture SG0000006Z holds for it. By SG0000008N the same holds in each free coordinate system.

tag: SG00000046
kind: theorem
title: The restriction theorem
statement: Let $X$ be a smooth variety over a field of characteristic 0, let $S \subseteq X$ be a smooth hypersurface, and let $(I, m)$ be a marked ideal with $m \ge 1$. Let $X_r \to \dots \to X_0 = X$ be a blowup sequence of order at least $m$ for $(I, m)$ whose centers $Z_i$ lie in the birational transforms $S_i$ of $S$ and have codimension at least 2 in $X_i$. For $0 \le j \le m - 1$ let $J^{(j)}_i$ be the $i$th transform of the marked ideal $(D^j(I), m - j)$ and let $T^{(j)}_i = J^{(j)}_i \cdot \mathcal{O}_{S_i}$. Then $S_{i+1} \to S_i$ is the blowup of $S_i$ along $Z_i$, the $T^{(j)}_i$ are the successive transforms of $(D^j(I) \cdot \mathcal{O}_S, m - j)$ on $S$, and $S_i \cap \operatorname{cosupp}(I_i, m) = \bigcap_{j=0}^{m-1} \operatorname{cosupp}(T^{(j)}_i, m - j)$.
sources:

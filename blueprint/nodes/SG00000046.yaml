notes: This is Volume 2, Theorem 3.1.3 of the handbook, the going-up step of [Kol07, Chapter 3], Section Restriction of derivatives and going up, in a form for the family of all derivative ideals. Here $\operatorname{cosupp}(I, m)$ is the set of the closed points where $I$ has order at least $m$, and the transform of a marked ideal $(A, a)$ under the blowup of $Z$ with exceptional divisor $F$ is $(\mathcal{O}(aF) \cdot \pi^* A, a)$. The proof divides by factorials, so it needs characteristic 0. No Lean statement yet.

tier: T8
notes: This is the fourth and strongest form of principalization in [Kol07, Chapter 3], Volume 2, Theorem 1.1.8 of the handbook. The functorial forms of the steps of order reduction, SG00000048 and SG00000049, give the rule. Kollár takes the idea of the uniqueness argument from [Wlo05]. The compatibility with smooth morphisms lets the local sequences glue. No Lean statement yet.

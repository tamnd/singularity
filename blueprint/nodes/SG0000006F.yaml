tag: SG0000006F
kind: lemma
title: A change of the free coordinate keeps an infinite number of nonzero translations
statement: Let $n = 3$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations, with the notation of Section 3.15 of Volume 7 of the handbook. Assume that an infinite number of the $t_j$ are not $0$, and let $x''$ be a free coordinate at a point $P_b$ of the run. Then the run from $P_b$, which is a corner run with free translations in the coordinates $(x'', y_b, z_b)$, also has an infinite number of nonzero translations in these coordinates.
sources:

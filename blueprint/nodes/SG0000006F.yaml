notes: This is Lemma 3.16.12 of Volume 7 of the handbook. Write $x'' = u(x_b - \zeta)$ by Weierstrass preparation. If the new run has only a finite number of nonzero translations, then $\xi = \varphi_b + M_b\zeta \in \hat H$ satisfies $v(a_\ell - \xi) = \gamma_\ell$ for $\ell$ large, so it is a limit in $\hat H$ of the sequence of the translations, and this contradicts Proposition 3.15.7 (SG00000062). This is Lemma N of note 34 of the research notes. The result is not in Lean.

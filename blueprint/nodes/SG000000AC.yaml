tag: SG000000AC
kind: example
title: An additive foliation invariant under G_m with no toric resolution
statement: 'Let $D = (x^p - z^{p-1} w) \partial_x + (y^p - z w^{p-1}) \partial_y$ on $\mathbb{A}^4_{x, y, z, w}$ over an algebraically closed field of characteristic $p$. Then $\mathcal{F} = A \cdot D$ is a rank one foliation with $D^p = 0$, invariant under $\mathbb{G}_m$ with the weights $(1, 1, 1, 1)$, and $\operatorname{Sing} \mathcal{F}$ is the cone over the rational curve $\{(s : s^{p-1} : 1 : s^p)\} \subset \mathbb{P}^3$ of degree $p$. In no coordinate system on $\mathbb{A}^4$ does $\mathcal{F}$ have a toric resolution. After the blowup of the origin, the pullback is singular along the strict transform $S$ of the cone and at the $p + 1$ points of $\mathbb{P}^1(\mathbb{F}_p) \subset \{z = w = 0\}$ in the exceptional $\mathbb{P}^3$. These points lie in the charts $x$ and $y$. In the chart $x$, with $x = u$, $y = u Y$, $z = u Z$, $w = u W$, the pullback is generated by $D'' = \alpha u \partial_u + \delta$ with $\alpha = 1 - Z^{p-1} W$, $D''^p = \alpha^{p-1} D''$, and at each of the points $D''$ is multiplicative with linear part $\operatorname{diag}(1, -1, -1, -1)$.'

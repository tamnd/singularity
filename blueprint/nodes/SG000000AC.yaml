notes: This is Example 5.1 and Proposition 5.2 of research note 58, with the gap that the referee report in note 73 found and Proposition 3.1 of note 73. Note 58 treats only the charts $z$ and $w$, where the pullback is a product of a line with an additive threefold foliation (in the chart $z$, $\alpha = 0$ and $\delta = (X^p - W) \partial_X + (Y^p - W^{p-1}) \partial_Y$). It is not proved that the example has a resolution, and it is not proved that it is not a counterexample to Problem 4.10 of note 04. A resolution needs SG000000AD at the $p + 1$ points and the gluing of SG000000AK along $S$. The machine checks of notes 58 and 73 for $p = 2, 3, 5, 7$ are numerical evidence only. Handbook Volume 9, Section 3.22. Not in Lean.

tag: SG000000C5
kind: counterexample
title: 'A toric pair of 4-folds on which Claim A and Fac_3^L fail'
statement: 'Let $k$ be a field and $N = \mathbb{Z}^4$ with coordinates $(t,x,y,z)$. Let $V_1$ be the toric variety of the complete fan with the rays $f = (2,1,1,1)$, $e_x$, $e_y$, $e_z$, $v_5 = (-1,-1,-1,-1)$. It is the weighted projective space $\mathbb{P}(1,1,1,1,2)$, and its only singular point $p_1$ is the fixed point of $C = \langle f, e_x, e_y, e_z \rangle$, of type $\frac12(1,1,1,1)$ (multiplicity 2, Gorenstein). Let $V_0 \to V_1$ be the toric variety of the common refinement of the fan of $V_1$ and the pullback of the normal fan of $K = (x^3 y^3 z^2, x^4 y z^3, y^9, x^5 z^3)$, star subdivided at $r = (1,1,1,1)$ and $r'' = (-2,1,1,1)$. Then the cone $\{0\} \times \sigma_0$ of SG000000C2 is a face of exactly two 4-cones, $D = \langle \sigma_0, r \rangle$, of determinant $\pm 1$, and $D'' = \langle \sigma_0, r'' \rangle$, of determinant $\pm 2$. Take $V_2 = V_0$ in Step 2 of the proof of SG000000C1 (the choice $J = \mathcal{O}$). (a) For each principalization in Step 3 the generic point $\eta_2$ of the curve $V(\sigma_0)$ lies in the fundamental locus $\Phi$, the component of $\Phi$ through it maps onto a curve ($d = 1$), meets $L$, and is not contained in $\alpha^{-1}(\mathrm{Sing}\, V_1)$. So Claim A and $\mathrm{Fac}_3^L$ of SG000000BZ fail, over each field, and Claim A fails also for each other choice in Step 2. (b) With the choice $J = \mathcal{O}$, the condition (A$^{\rm w}$) of SG000000C6 fails for each principalization in Step 3 and each $\tilde U_2$. (c) SG000000BQ holds for this pair by toric resolution.'

notes: 'Construction 83.12 and Theorem 83.12 of research note 83, with Fixes 3 to 7 of the referee report in note 87, which checked each cone with independent scripts. Note 83 calls $V_1$ a fake weighted projective space and $p_1$ a point of index 2. Note 87 corrects this: $f + e_x + e_y + e_z + 2 v_5 = 0$, the five rays generate $\mathbb{Z}^4$, so $V_1 = \mathbb{P}(1,1,1,1,2)$; $\det C = 2$ with regular proper faces, $N / \mathbb{Z} C \cong \mathbb{Z}/2$ is generated by $r$, whose coordinates in the basis of $C$ are $(\frac12, \frac12, \frac12, \frac12)$, and $m = (-1,1,1,1)$ has $\langle m, v \rangle = 1$ on the four rays of $C$, so $p_1$ is Gorenstein. The cone $D_0 = C \cap \pi^{-1}(\sigma_0)$ has 6 rays and $D_0'' = C'' \cap \pi^{-1}(\sigma_0)$ has 4 rays. The point $\pi(r) = \pi(r'') = (1,1,1)$ is the ray $g_2$ of $\sigma_0$, so $r$ lies in the relative interior of the 2-face $\langle f, (0, g_2) \rangle$ of $D_0$ and $r''$ in that of $\langle (-1,0,0,0), (0, g_2) \rangle$ of $D_0''$. Since $\{0\} \times \sigma_0$ is a facet of $D_0$ that does not contain $r$, the only new 4-cone of the star subdivision at $r$ that contains it is $D$, and the same holds for $r''$ and $D''$. The monomial valuation of weight $w = (1,4,4,5)$, the sum of the generators of $D$, has coordinates $(\frac12, \frac72, \frac72, \frac92)$ in $C$, so its center is the regular point $p_2$ of $D$ on $V_0$ and $p_1$ on $V_1$, and it lies in $N$. The local ring at $\eta_2$ is $S_0$ over $k(t)$, so SG000000C3 shows that no principalization is a local isomorphism there. In (a), $d = 2$ is excluded by SG000000BY and $d = 0$ because $\alpha(\eta_2)$ is the generic point of a curve; Step 2 does not change $V_0$ near $\eta_2$. In (b), the other end $z$ of the curve, the fixed point of $D''$, is singular and maps to a regular point of $V_1$; another choice in Step 2 can blow up over $z$, and for such choices (b) is open. Note 87 confirms (a), (b) for $J = \mathcal{O}$, and (c). The failure in (b) is the failure of a sufficient condition; it does not show that Steps 5 and 6 of the proof give a bad model (SG000000C6). With a modification of $V_2$ along the curve (SG000000CF) and the toric relative strong factorization SG000000CH, the failure of (b) near the curve goes away (SG000000CJ). With $\sigma_0$ replaced by one of the 36 cones of SG000000CB, the same construction gives more examples. Handbook Volume 9, Sections 3.24 and 3.25. The result is not in Lean.'

notes: 'Construction 83.12 and Theorem 83.12 of research note 83. This result is new in note 83, and a second referee has not read it yet. The scripts of note 83 check each number exactly: $f + e_x + e_y + e_z + 2 v_5 = 0$, $\det C = 2$ with regular proper faces, $r$ has coordinates $(\frac12, \frac12, \frac12, \frac12)$ in the basis of $C$, and $r''$ has coordinates $(3,3,3,2)$ in the basis of $C'' = \langle e_x, e_y, e_z, v_5 \rangle$. The monomial valuation of weight $w = (1,4,4,5)$, the sum of the generators of $D$, has coordinates $(\frac12, \frac72, \frac72, \frac92)$ in $C$, so its center is the regular point $p_2$ of $D$ on $V_0$ and $p_1$ on $V_1$, and it lies in $N$. The local ring at the generic point of $V(\sigma_0)$ is $S_0$ over $k(t)$, so SG000000C3 shows that no principalization is a local isomorphism there. The other end $z$ of the curve, the fixed point of $D''$, is singular and maps to a regular point of $V_1$. Handbook Volume 9, Section 3.24. The result is not in Lean.'

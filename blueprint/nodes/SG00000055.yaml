tag: SG00000055
kind: theorem
title: The first case of the log-Jacobian order is stable if the order stays and no component of the divisor leaves
statement: In the setting of SG0000004Z, write $g = x^r G$ and let $d = \operatorname{ord} G$. For $i \in \Delta$ let $e_i = r_i G + x_i \partial_i G$, let $\Phi_i$ be its homogeneous part of degree $d$, and let $R$ be the set of the $i \in \Delta$ with $\Phi_i \ne 0$. A component $i \in \Delta$ with $i \ne j$ leaves in the chart in the direction $j$ if $t_i \ne 0$. Assume that $\rho(g'_c) = \rho(g)$ and that the old point is in the first case. Assume that $R$ contains an index $i \ne j$ that does not leave, or that $R = \{j\}$. Then the new point is in the first case. In particular, this holds if no component of $\Delta$ leaves. There is no hypothesis on $p$.

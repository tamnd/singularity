tag: SG0000007S
kind: theorem
title: The surface centers of Cossart and the lifting test
statement: Let $D = V(u)$ be a regular surface with $d = \operatorname{ord}_D(g_c) < p$. If $u$ is an equation of a component of $E$, then $\nu(D) = 0$. Otherwise $\nu(D) \le \max(0, d - 1)$. So a failing surface center of the algorithm of Cossart is not in $E$ and has $1 \le \nu \le p - 2$, and for $p = 2$ every surface center passes the test.

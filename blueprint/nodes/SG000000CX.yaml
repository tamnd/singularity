tag: SG000000CX
kind: theorem
title: 'A rise of omega away from a chart origin needs a solvable vertex of the generic image'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. In the setting of SG000000CS, let $\xi''$ be a rational point over a centre of the rule with $K \ne \emptyset$ and $z / x_j = 0$ at $\xi''$, and assume that no vertex of the image polyhedron $\pi(U) + \mathbb{R}^3_{\ge 0}$ cancels. Let $\omega''''$ be the value of $\omega$ read from the image polyhedron with the boundary $\{j\} \cup (E \setminus K)$, so that $\omega'''' \le \omega(\xi)$. If the vertex of $z / x_j$ for the weight $(1, 1, 1)$ is not solvable at $\xi''$, then $\omega(\xi'') \le \omega''''$. So if $\omega(\xi'') > \omega''''$, then the slope $\delta''''$ of the image polyhedron is an integer, each point $u$ of the image with $|u| = \delta''''$ comes from $a_p$ or $a_{2p}$, and the new coefficients $b_i$ satisfy $\operatorname{in} b_{2p} = (\frac12 \operatorname{in} b_p)^2$. Over a curve with $\lambda \ne 0$, or over the closed point with two nonzero $\lambda_k$, either $\omega(\xi'') = 0$, or $\delta''''$ is an integer and this vertex is solvable.'

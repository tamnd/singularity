notes: 'This is Proposition 86.11 and Corollary 86.12 of research note 86. If the vertex is not solvable, then $\delta(\xi'') = \delta_{z''}(\xi'')$ by the vertex criterion of note 61, and $\mu''_k \ge \mu_k(z'')$, so $\omega(\xi'') \le \omega_{z''}(\xi'') = \omega''''$, and SG000000CS gives $\omega'''' \le \omega(\xi)$. So outside the extended model of SG000000CV two events remain: a vertex cancels, or the generic image has a solvable vertex for $(1, 1, 1)$. The rises of SG0000009K and SG0000009M are of the second kind. So are the two steps of germ $63$ at depth $23$ of the cut histories of note 72: the generic image has $\omega'''' = \frac12 < \frac23$, the vertex for $(1, 1, 1)$ is solvable with $C = x_0 x_2$, and the translation $z'' \mapsto z'' - x_0 x_2$ raises $\omega$ back to $\frac23$, while $\delta$ goes from $2$ to $\frac{13}{6}$ and the bottom face shrinks from an edge to the vertex $\omega e_2$. A bound on the number of such steps, or a quantity that drops at them, is open. In the lab of note 86 all $38$ new preparations after a generic step ($20$ in the histories and $18$ in their continuations) have $\omega(\xi'') \le \omega(\xi)$. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Proposition 4.5.30. The result is not in Lean.'

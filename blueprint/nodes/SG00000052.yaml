tag: SG00000052
kind: theorem
title: The first case of the log-Jacobian order is stable if the order stays and p does not divide the sum
statement: In the setting of SG0000004Z, write $g = x^r G$ and let $d = \operatorname{ord} G$. Assume that $\rho(g'_c) = \rho(g)$, that the old point is in the first case, that is, $\operatorname{ord} \widetilde\Theta_0(G) = \rho$, and that $|r| + d$ is not $0$ in the base field. Then the new point is in the first case, that is, $\operatorname{ord} \widetilde\Theta_0(G') = \rho(g'_c)$.

notes: The Euler element $e = |r| G + \sum_k x_k \partial_k G$ is in $\widetilde\Theta_0(G)$ and has the initial form $(|r| + d) F \ne 0$, so $\rho = d$. The chart sends $x^r e$ to $x_j^p \, x_j \partial_j g'$, and $x_j \partial_j$ is a logarithmic derivation for the new divisor, so $x_j \partial_j g' \in \Theta'_0(g'_c)$. This element is $u \, x^b e'$, with a unit $u$, the weak transform $e'$ of order at most $d$, and $b \le r'$ by the proof of SG0000003N. So $|r'| + \operatorname{ord} \widetilde\Theta_0(G') \le |b| + d \le |r'| + d$, and $\operatorname{ord} \widetilde\Theta_0(G') \le d = \rho(g'_c)$. The other inequality holds always. If $|r| + d$ is $0$ in the base field, the new point can be in the second case. A random test of sequences of at most four point blowups for $(p, n) = (2, 3), (2, 4)$ and $(3, 3)$ found 5,961, 1,403 and 2,288 steps from the first case with $p \nmid |r| + d$, and the new point is in the first case at each of them. It found 501, 123 and 63 steps from the first case with $p \mid |r| + d$ to the second case. The Lean proof is for polynomials. It assumes $\rho = d$ in the place of the first case at the old point, as in SG00000050, and the main step is `idealOrd_logJacobianTangent_cleanPart_le_of_pointChart_eq`, the bound $|r'| + d$ from an exact transport.

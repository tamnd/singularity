notes: 'This is $\mathrm{Princ}_4$ of research note 77, Definition 77.3. In dimension 3 it is [Cut09] Theorem 1.3 and [CP19] Proposition 4.4. In characteristic 0 it is SG00000042. The referee report in note 82 records that it is not known to follow from resolution of 4-folds, so a proof of SG000000BQ through it can use a hypothesis that is stronger than the goal. The known method, order reduction of weak transforms as in [Cut09] Theorem 5.6, contains the multiplicity drop problem for 3-folds. It is open. Handbook Volume 9, Section 3.24. The result is not in Lean.'

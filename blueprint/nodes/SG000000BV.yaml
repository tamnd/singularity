tag: SG000000BV
kind: conjecture
title: 'Principalization of ideals on regular 4-folds'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $U$ be a regular quasi-projective variety of dimension 4 over $k$, and let $I \subseteq \mathcal{O}_U$ be a nonzero coherent ideal. Then there is a sequence $U_r \to \dots \to U_0 = U$ of blowups along regular centers $C_i$, each contained in the locus where $I \mathcal{O}_{U_i}$ is not invertible, such that $I \mathcal{O}_{U_r}$ is invertible.'

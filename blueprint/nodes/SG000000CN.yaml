tag: SG000000CN
kind: theorem
title: 'Local strong factorization in dimension 3 for valuations of rank 1 and rational rank 3'
statement: 'Let $k$ be a field of any characteristic. Let $R \subseteq S$ be regular local rings of dimension 3, essentially of finite type over $k$, with the same fraction field $K$ and $S$ dominating $R$. Let $\nu$ be a valuation of $K$ that dominates $S$, with value group of rank 1 and rational rank 3. Then there is a regular local ring $T$, dominated by $\nu$, that is an iterated monoidal transform along $\nu$ of $R$ and also of $S$.'

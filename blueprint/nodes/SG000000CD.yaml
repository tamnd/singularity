tag: SG000000CD
kind: theorem
title: 'Weak principalization in dimension 4 reduces to ideals with cosupport in an snc divisor'
statement: 'Assume $\mathrm{Princ}_4^{\rm w}$ of SG000000CC for all pairs $(U'', I'''')$ of a regular quasi-projective 4-fold $U''$ and a nonzero coherent ideal $I''''$ whose cosupport lies in a divisor of $U''$ with simple normal crossings. Then $\mathrm{Princ}_4^{\rm w}$ holds.'
sources:

notes: 'This is Theorem 6.3 of research note 55, with the scope that research note 60 corrected. The fixed points of the Frobenius semilinear map $\Phi(x) = (C(x)^2, B(x)^2, A(x)^2)$ form an $\mathbb{F}_2$-structure of $k^3$ by Lang''s theorem in the form of Katz, and they are critical points of $h$. Three lines with independent equations cover at most six of the seven points. Then SG0000008R gives the changes $(\varphi, q)$ and SG0000008S gives all changes of coordinates, since $D = 4 > 2 = p$. The example is $h = x y w (x + y + w)$ (Example 6.4 of note 55). Its critical set is $\mathbb{P}^2(\mathbb{F}_2)$, $h$ is nondegenerate in the classical sense, and only the whole triangle of the Newton polyhedron is degenerate. The result is not in Lean.'

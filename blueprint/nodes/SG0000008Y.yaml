tag: SG0000008Y
kind: theorem
title: 'The Fano obstruction in characteristic 2'
statement: 'Let $k$ be an algebraically closed field of characteristic $2$, and let $h = x_1 x_2 A^2 + x_1 x_3 B^2 + x_2 x_3 C^2$ be a clean quartic form in three variables, with linear forms $A$, $B$, $C$ that are linearly independent. Then the projective critical set of $h$ contains the seven points of a Fano plane, and it is not contained in the union of three lines with independent equations. So for each $g \in k[[x_1, x_2, x_3]]$ with lowest form $h$, no automorphism of $k[[x, z]]$ and no unit makes $z^2 + g$ Newton nondegenerate. Also $h$ has a torus critical point where $h \ne 0$.'
sources:

tag: SG0000005H
kind: example
title: A run of point blowups along a curve does not end
statement: Over $\mathbb{F}_2$ in the variables $x, y, z$, let $\Delta = \{y\}$ and $g_k = x^4 y^{2k+1} + x^2 y^{3k+1} z^3$ for $k \ge 0$. Then $\rho = 4$ at each point $P_k = (\Delta, g_k)$, and the origin of the $y$-chart of $P_k$ is $P_{k+1}$. So the run of point blowups at the origin keeps $\rho = 4$ and does not end. The order is 4 at each point of the curve $x = z = 0$.
sources:

notes: Here $G_k = x^4 + x^2 y^k z^3$. The chart sends $g_k$ to $y^2 g_{k+1}$, and $g_{k+1}$ is clean. The center is the point of the strict transform of the curve $x = z = 0$, so a point blowup does not separate the curve from the locus where the order is $\rho$. The Lean proof is symbolic in $k$, and `Singularity.CurveRuns.logJacobianOrder_localPoint_curvePoint` proves that $\rho = 4$ at the point $(0, 1, 0)$ of the curve. This is Example 3.12.2 of Volume 7 of the handbook.

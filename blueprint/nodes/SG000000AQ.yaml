notes: This is Example 6.5 of the referee report in note 73 on research note 58. It satisfies the hypothesis of SG000000AP with $\lambda = v_2$ and $e$ replaced by $p - e$. The script `lab_ex.py` of note 73 checks it for $p = 2, 3, 5, 7$ and each $e$, which is numerical evidence only. Note 73 does not decide whether the twist is trivial in the local ring at the origin. Handbook Volume 9, Section 3.22. Not in Lean.

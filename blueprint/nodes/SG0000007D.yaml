tag: SG0000007D
kind: theorem
title: In a corner run in four variables of degree less than p the initial form is eventually binary
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Assume $\deg_{x, w} g < p$, and let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Then $\operatorname{in} G_m \in K[x_m, w_m]$ for $m$ large.
sources:

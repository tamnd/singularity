notes: This is Hypothesis 3.17.32 of Volume 7 of the handbook (Section 3.17). It is the hypothesis H1 of note 40 of the research notes. For a run with only a finite number of nonzero translations it holds by Theorem 3.14.7 (SG0000005Z), and SG00000079 gives type $1$ at the points before a change of letter. It was stated as a hypothesis in note 40. It is now proved by SG0000008M (Corollary 3.18.18, from note 54 of the research notes, refereed in note 63). A run that is not planar satisfies it by SG0000008A, and there is no planar run by SG0000008K. The statement is only for $\deg_{x, w} g < p$. For $g \in K[[y, z]][x^p, w^p]$ the claim holds in the form $\operatorname{in} G_m \in K[x'_m]$ for $m$ large (SG00000094 and SG00000095). For the other $g$ with $\deg_{x, w} g \ge p$ the same claim is open. The result is not in Lean.

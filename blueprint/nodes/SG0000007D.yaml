notes: This is Hypothesis 3.17.32 of Volume 7 of the handbook (Section 3.17). It is the hypothesis H1 of note 40 of the research notes. For a run with only a finite number of nonzero translations it holds by Theorem 3.14.7 (SG0000005Z), so it is open only for the runs with an infinite number of nonzero translations. It held in all the tests of notes 40 and 42. SG00000079 gives type $1$ at the points before a change of letter, which is a first step.

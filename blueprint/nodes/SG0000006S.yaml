tag: SG0000006S
kind: lemma
title: Two points of the family x squared Y plus F are not cylindrical at any point of the run
statement: Let $p \ge 3$, $Y = y^{p-2} z^{p-2}$, and let $g = x^2 Y + w y^p z^p$ or $g = x^2 Y + x w y^p z^p$, with $n = 4$ and $\Delta = V(y) \cup V(z)$. At each point $P_m$ of a corner run in four variables of $g$ there is no free coordinate system $(x'', w'')$ such that the function of $P_m$ is, up to a $p$-th power and a factor $\varepsilon^p$ with $\varepsilon$ a unit, a series in $x'', y_m, z_m$.
sources:
- paper: CJS20
uses:

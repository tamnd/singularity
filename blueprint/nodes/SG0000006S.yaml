notes: This is Lemma 3.17.11 of Volume 7 of the handbook (Section 3.17). The proof applies the derivation $D = \partial / \partial w''$, which kills $y_m$, $z_m$ and the $p$-th powers, to $x^2 + R$, and finds that both coefficients of $D$ in $\partial_x, \partial_w$ vanish at the point. The letters $y_m, z_m$ are fixed; a change of the letters by units is not treated. It is Lemma 5.5 of note 38 of the research notes. The result is not in Lean.

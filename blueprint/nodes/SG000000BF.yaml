notes: 'This is Corollary 81.12 of research note 81. Each point has finitely many successors in the toric model, and by SG000000BE the tree of the continuations that keep $\omega$ has no infinite branch, so it is finite by the lemma of König, and $\ell < \infty$. If a step keeps $\omega$, each such run from the new point gives a run from the old point that is one step longer, so $\ell$ drops. The function $\ell$ is defined by the search itself. The proof of SG000000BE gives the explicit quantities behind it, stage by stage: the number of lattice points of the bottom face, then $\omega_2$, then $s(g) - m_s$ and $m_s + m_t$, then the larger coordinate $H$ of the corner, then $\mu_a$ or $c_a$, and $\delta$ for the divisorial steps and the last phase. By SG000000BG no such pair can work for all steps of the rule. Note 81 has no referee report yet. Handbook Volume 7, Corollary 4.5.10. The result is not in Lean.'

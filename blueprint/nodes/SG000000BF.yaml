tag: SG000000BF
kind: theorem
title: 'A lexicographic invariant (omega, l) for the toric branches of Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Take the toric branches of Rule 61.9'' as in SG000000BE. For a point $\xi$ of a toric branch with $\omega(\xi) > 0$, let $\ell(\xi)$ be the supremum of the lengths of the toric branches from $\xi$ on which $\omega$ stays equal to $\omega(\xi)$, over all choices among tied centres and all chart origins. Then $\ell(\xi)$ is finite, and at each step $\xi \to \xi''$ of a toric branch with $\omega(\xi) > 0$, either $\omega(\xi'') < \omega(\xi)$, or $\omega(\xi'') = \omega(\xi)$ and $\ell(\xi'') < \ell(\xi)$. So the pair $(\omega, \ell)$ decreases strictly in the lexicographic order. This proves SG0000009T for toric branches, in particular for the branches through chart origins of each germ with $a_p = a_{2p} = 0$ and $E = \{0, 1, 2\}$.'

tag: SG0000007H
kind: theorem
title: The order of z^q + g along a lifted center
statement: Let $R$ be a commutative ring of characteristic $p > 0$, let $q = p^e$, let $I \ne R$ be an ideal, let $g, h \in R$ and $J = (z - h) + I R[z]$. Then $z^q + g \in J^n$ if and only if $n \le q$ and $g + h^q \in I^n$. In particular $z^q + g \in J^q \setminus J^{q+1}$ if and only if $g + h^q \in I^q$. The powers are ordinary powers.

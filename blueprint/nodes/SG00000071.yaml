tag: SG00000071
kind: conjecture
title: Each corner run in four variables has corner surfaces with the order of G at least rho
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Then there are a $J$ and a free coordinate system $(x', w')$ at $P_J$ such that the translations of $x'$ are $0$ after $J$, and for $m$ large the corner surfaces $V(x'_m, y_m)$ and $V(x'_m, z_m)$ have $\nu^G(P_m) \ge \rho$. This is false. SG00000072 is a counterexample.
sources:

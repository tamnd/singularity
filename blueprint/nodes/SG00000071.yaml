notes: This is Conjecture 3.17.20 of Volume 7 of the handbook (Section 3.17). It is the conjecture L+ of note 39 of the research notes. Note 40 found the counterexample SG00000072, and note 42 found a second one, SG00000073, where the initial form is a power of a line. It holds at the cylindrical points of SG0000006W, and for the corner runs with $\deg_{x, w} g < p$ and an infinite number of nonzero translations (SG00000089 and SG0000008M). The corrected form is SG00000075. The status stays open until a Lean proof of the negation exists.

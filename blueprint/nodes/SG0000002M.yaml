tag: SG0000002M
kind: theorem
title: The converse of the theorem of Serre
statement: Let $(R, \mathfrak{m}, \kappa)$ be a Noetherian local ring. If $\operatorname{pd}_R \kappa < \infty$, then $R$ is a regular local ring. With SG0000002K, a Noetherian local ring is regular if and only if its residue field has finite projective dimension.

notes: This is Theorem 3.18.34 of Volume 7 of the handbook (Section 3.18). It is Theorem 5.3 of note 64 of the research notes, with Proposition 4.1, Lemmas 4.2 and 4.3, Theorem 5.1 and Corollary 5.2 of that note, refereed in note 67. A planar run needs $\Lambda_0 \ge \Lambda_+$, else the derivative in $x$ dominates all the other coefficients and the point is cylindrical, so SG0000006V and SG00000066 end the run. It also needs that $\operatorname{cl} g(\Phi_\infty)$ has no term below $\Lambda$, else the drop criterion SG0000006M ends the run. Under (C) the least term of the coefficients of $x^{p^e}$ and $w^{p^e}$ has a nonzero class, since $g$ is clean, and its germ gives such a term. It extends SG0000008K from $\deg_{x, w} g < p$ to (C). The result is not in Lean.

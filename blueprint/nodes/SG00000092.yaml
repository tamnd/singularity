tag: SG00000092
kind: theorem
title: There is no planar corner run in four variables under the condition (C) on the derivatives of p-power order
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Condition (C) says that for each $e \ge 1$ the Hasse derivatives $g^{[p^e, 0]}$ and $g^{[0, p^e]}$ in the variables $(x, w)$ are in $K[[y, z]]$, that is, they do not depend on $x$ and $w$. Assume that $\deg_{x, w} g \ge 1$ and that $g$ satisfies (C). Then the run is not planar. Condition (C) holds if $\deg_{x, w} g \le p$, and if $g = \sum_{e \ge 1} (\alpha_e x^{p^e} + \beta_e w^{p^e}) + h$ with $\alpha_e, \beta_e \in K[[y, z]]$ and $\deg_{x, w} h < p$, in particular for $g = B_1 x^p + B_2 w^p + \alpha x + \beta w + B_0$.

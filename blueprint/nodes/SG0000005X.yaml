tag: SG0000005X
kind: lemma
title: A potential for the difference of two exponent vectors along an origin run
statement: Let $\delta \in \mathbb{Z}^k$, let $P$ be the sum of the positive entries of $\delta$, let $Q$ be the sum of the absolute values of the negative entries, and let $\Phi(\delta) = \min(P, Q)$. A step with the letter $j$ replaces $\delta_j$ by $\delta_1 + \dots + \delta_k$. Then $\Phi$ does not go up under a step. If $\delta \ge 0$ or $\delta \le 0$, then the same holds after each step. If $W_1, \dots, W_w$ are disjoint windows of consecutive steps, each with all $k$ letters, and $\delta$ has a negative entry and a positive entry at the end of $W_w$, then $w \le \Phi(\delta_0) - 1$.

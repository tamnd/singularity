notes: This is Lemma 3.14.2 of Volume 7 of the handbook, the Lemma Y of note 31 of the research notes. An origin step with the letter $j$ changes each exponent vector $e$ by $e_j \mapsto |e| - p$, so the difference of two exponent vectors changes by the rule of the lemma. If the sum $S$ of the entries is positive, then a step at a negative entry makes $Q$ smaller and a step at another entry keeps $Q$, and the case $S \le 0$ is the same. In a window where $\Phi$ does not change, no step is at an entry that is negative at the start, so a window with all letters makes $\Phi$ smaller. It replaces the angle and the primitive vector of the proof of Theorem 3.13.20 (SG0000005R), which work only for two letters. Note 32 checks the lemma by an exhaustive test for $k = 2, 3, 4$ in a box and by a full search of the words to the depth $10$, with no failure. The bound is reached for $\Phi(\delta_0) = 1, 2, 3$. The result is not in Lean. The Lean file Singularity/Invariant/OriginRuns.lean (tamnd/singularity-lean#179) proves the lemma. Singularity.OriginRuns.phi_diffStep_le proves that a step does not make the potential larger, nonneg_diffStep and nonpos_diffStep prove that the signs stay, and length_add_one_le_phi proves the bound on the number of windows.

tag: SG0000004M
kind: theorem
title: The order at a point by the Hasse-Schmidt derivatives
statement: Let $R$ be a commutative ring, let $f \in R[x_1, \dots, x_n]$, let $a \in R^n$ and let $d \ge 0$. Then $f(x + a)$ has order at least $d$ at the origin if and only if $(D^\alpha f)(a) = 0$ for each multi-index $\alpha$ with $|\alpha| < d$.
sources:

notes: This is Volume 7, Proposition 1.1.4 of the handbook. The proof is the Taylor formula $f(x + a) = \sum_\alpha (D^\alpha f)(a) \, x^\alpha$. In characteristic $p$ the first derivatives do not find the order, because each derivation kills $x^p$. The Hasse-Schmidt derivatives find it in each characteristic. The case $a = 0$ is Singularity.Algebra.MvHasse.le_ord_iff_hasseDeriv (tamnd/singularity-lean#91).

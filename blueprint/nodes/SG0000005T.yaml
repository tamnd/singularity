notes: This is Lemma 3.13.14 of Volume 7 of the handbook for a coordinate subvariety and with $h$ a polynomial. The handbook states the lemma for each regular formal subvariety and with $h$ a formal series, and that form is not in Lean. The order along $Z$ is defined in `Singularity/Invariant/OrderAlong.lean` (tamnd/singularity-lean#173), where `le_ordAlong_iff_mem_pow` proves that the order is the largest $m$ with $f$ is in the $m$-th power of the ideal of $Z$. The consequence `Singularity.CornerRuns.cornerRun_orderGAlong_lt` proves part 2 of Example 3.13.15 (SG0000005M) for the coordinate subvarieties.

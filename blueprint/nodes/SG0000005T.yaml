tag: SG0000005T
kind: lemma
title: The order of G along a coordinate subvariety is at most the order of the log-Jacobian ideal plus one
statement: Let $K$ be a field of characteristic $p$, let $g$ be a polynomial in $x_1, \dots, x_n$ over $K$, let $\Delta$ be a set of the variables, and write $g = x^r G$ as in Theorem 3.1.4. Let $Z$ be the zero set of the $x_i$ with $i \in S$, for a set $S$ of the indices. Let $\nu^G_Z$ be the supremum over the polynomials $h$ of the order of $g + h^p$ along $Z$, minus the sum of $r_i$ for $i \in \Delta \cap S$. Then $\nu^G_Z \le \operatorname{ord}_Z \widetilde\Theta(G) + 1$.
sources:
- paper: CJS20

tag: SG0000007B
kind: theorem
title: A binary initial form of degree less than p allows a nonzero translation only if it is a power of a line
statement: Let $n = 4$, $\Delta = V(y) \cup V(z)$, let $g = y^{r_y} z^{r_z} G$ be clean with $\operatorname{ord} g \ge p$, and let $\operatorname{in} G = h(x, w)$ be a binary form of degree $d$ with $2 \le d < p$. If a $y$-step or a $z$-step with the translation $u = (a, b) \ne 0$ keeps $\rho$, then $h = c \ell^d$ with $\ell = b x - a w$, so $\ell(u) = 0$.

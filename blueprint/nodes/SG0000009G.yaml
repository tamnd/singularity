notes: This is Lemma 3.19.2 of Volume 7 of the handbook (Section 3.19). It is Lemma 2.1 of note 74 of the research notes, which is Lemma 4.0 of the referee report 71 together with the general form of Lemmas 2.2 and 2.3 of note 69. Part 1 holds because the cleaning removes only monomials with $p \mid k$, whose derivative in $x$ is $0$, and by the chain rule. In part 3 the power of $M$ in each term is $-p + (k + l) - (k + l - p^e) = p^e - p$. In part 4 the terms with $p \mid k$ and $p \mid l$ have only terms of nonzero class, since $\Delta\varphi_m^{k - p^e} \Delta\psi_m^l$ is then a $p$-th power and the Frobenius acts termwise on Hahn series. The two powers of $M$ correct Remark 3.5 of note 69, which used $M^{-1}$ for each $p$ and dropped $M^{p^e - p}$, and which is false. Notes 71 and 74 checked the identities by exact computation for $p = 2, 3, 5, 7$, with negative controls that see the two wrong powers. The result is not in Lean.

tag: SG0000009G
kind: lemma
title: The derivatives of the function of a later point of a corner run at its limit, with the powers of M
statement: 'Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational. Put $\delta_m = v(y_m z_m)$ and $\Delta_m = \Phi_\infty - \Phi_m = (\Delta\varphi_m, \Delta\psi_m)$. For $m \ge N$ let $g^{(m)} = M_m^{-p} \operatorname{cl} g(\varphi_m + M_m x_m, \psi_m + M_m w_m)$ be the function of $P_m$ (Lemma 3.17.1), where $\operatorname{cl}$ removes the monomials $x_m^k w_m^l y_m^a z_m^b$ with all four exponents divisible by $p$. The class of a Laurent monomial in $y_N, z_N$ is its vector of exponents modulo $p$. For $A \in \mathbb{K}$, $\operatorname{cl} A$ is the sum of the terms of $A$ of nonzero class, and $\operatorname{cl}_0 A = A - \operatorname{cl} A$. Write $g^{[k, l]}$ for the Hasse derivatives in $(X, W)$, $M = M_m$ and $\Phi^{(m)}_\infty = \Delta_m / M_m$. Then for each prime $p$, each $m \ge N$ and each $e \ge 1$: (1) $\partial_{x_m} g^{(m)}(\Phi^{(m)}_\infty) = M^{1 - p} g_X(\Phi_\infty)$ and $\partial_{w_m} g^{(m)}(\Phi^{(m)}_\infty) = M^{1 - p} g_W(\Phi_\infty)$; (2) $\operatorname{cl} g^{(m)}(\Phi^{(m)}_\infty) = M^{-p} \operatorname{cl} g(\Phi_\infty)$; (3) $(g^{(m)})^{[p^e, 0]}(\Phi^{(m)}_\infty) = M^{p^e - p} \sum_{k, l} \binom{k}{p^e} [g^{[k, l]}(\Phi_m)]'' \Delta\varphi_m^{k - p^e} \Delta\psi_m^l$, where $[A]'' = \operatorname{cl} A$ if $p \mid k$ and $p \mid l$, and $[A]'' = A$ otherwise, and the same holds for $[0, p^e]$ with $\binom{l}{p^e}$ and $\Delta\varphi_m^k \Delta\psi_m^{l - p^e}$; (4) let $S^e_1$ be the set of the $(k, l)$ with $g^{[k, l]} \ne 0$, $k$ and $l$ not both divisible by $p$, and $\binom{k}{p^e} \not\equiv 0 \pmod p$, and let $S^e_2$ be the same set with $\binom{l}{p^e}$. Then each pair in $S^e_1 \cup S^e_2$ has $k + l \ge p^e$ and is not $(1, 0)$ or $(0, 1)$, and each term of class $0$ of the two elements of (3) has a value at least $(p^e - p) v(M_m) + \min_{(k, l) \in S^e_1 \cup S^e_2} (v(g^{[k, l]}(\Phi_m)) + (k + l - p^e) v(M_{m+1}))$, with $\min \emptyset = \infty$.'

notes: This is Corollary 3.17.28 of Volume 7 of the handbook (Section 3.17). The point $P_{m+1}$ reached by the step can have type $0$. It is Corollary 3.4 of note 40 of the research notes, in the words of note 42. The result is not in Lean.

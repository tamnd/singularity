tag: SG00000066
kind: theorem
title: No corner run with free translations of mu x + B0 keeps rho at least 1
statement: Let $n = 3$ and let $g = \mu x + B_0$ be clean at $P_N$, with $\mu$ a nonzero constant times a monomial in $y, z$ and $B_0 \in K[[y, z]]$. Then no corner run with free translations from $P_N$ keeps $\rho \ge 1$. The same holds for $g = \mu \varepsilon^p x + B_0$ with $\varepsilon \in K[[y, z]]$ a unit.

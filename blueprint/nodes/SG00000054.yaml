tag: SG00000054
kind: counterexample
title: The new point can be in the second case if p divides the sum
statement: In the setting of SG00000052, the hypothesis that $|r| + d$ is not $0$ in the base field is necessary. Over $\mathbb{F}_3$ in the variables $x, y, z$, let $g = x^3 y^2 z^3 + 2 x^2 y^3 z$ and $\Delta = \{x, z\}$, so $|r| + d = 6$. Then $\rho(g) = 3$, the point is in the first case, and $\tau_\rho(g) = 1$. At the point of the $x$-chart with $t_y = 0$ and $t_z = 1$, the new point has $\rho(g'_c) = 3$, it is in the second case, and $\tau_\rho(g'_c) = 2$.
sources:
- paper: Hir67
uses:

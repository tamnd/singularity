tag: SG00000017
kind: counterexample
title: The Hauser-Perlega cycle
statement: Let $K$ be an algebraically closed field of characteristic $p$. There is a purely inseparable equation $z^{p^3} + F(x_1, \dots, x_n)$ and an infinite sequence of point blowups along which the order of the strict transforms stays $p^3$ and the residual order tends to infinity. It disproves the stability theorem of Moh for $e \ge 3$.

tag: SG000000BM
kind: theorem
title: The binary initial forms at a point before a nonzero translation, in each degree
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$. Let $g = y^{r_y} z^{r_z} G$ be clean with $\operatorname{ord} g \ge p$ and $\rho \ge 1$, and let $h = \operatorname{in} G \in K[x, w]$ be a binary form of degree $d \ge 2$. Assume that a $y$-step or a $z$-step with the translation $u = (a, b) \ne 0$ keeps $\rho$. Let $\ell = b x - a w$ and let $m$ be a linear form with $m(u) = 1$, and write $h$ as a polynomial in $\ell, m$. If $\rho = d$, then $h = c\, \ell^d$ with $c \ne 0$ and $p \mid d$. If $\rho = d - 1$, then $h = c\, \ell^d + c' \ell^{d-1} m + H$, where each monomial $\ell^i m^j$ of $H$ has $j \ge 2$, $p \mid i$ and $p \mid j$, and $p \mid d - 1$ if $c' \ne 0$. For $d < p$ this gives $h = c\, \ell^d$.

notes: 'This is Proposition 3.19.19 and Corollary 3.19.20 of Volume 7 of the handbook (Section 3.19). It is Proposition 4.1 of note 79 of the research notes, with the Fixes 4 and 5 of the referee report in note 84: the change to $(\ell, m)$ is applied to the form $h$ without a new cleaning, and $d \ge 2$. The proof uses the directrix condition of Theorem 3.7.1 at the point (SG0000004X): the chart vector of the step is in the directrix of $h$ if $\rho = d$, and in the directrices of $h_x$ and $h_w$ if $\rho = d - 1$. It contains SG0000007B. The form $x^p (\lambda x + w)$ of SG000000BJ shows that the list is sharp for $d = p + 1$. For $p = 2$ and $\deg_{x, w} g = 3$ the list is $c\, x^2$, $c\, x^3$ and $x^2 (c x + c'' w)$, with $\rho = 2$. Note 84 tested it at about $26000$ points for $p = 2, 3, 5$ and found no exception. The result is not in Lean.'

notes: Input (A1) of research note 56. [Cut09] states it for each $d$, and its proof at the end of Section 12 normalizes the model of Albanese and keeps the bound $d!$. This bound is the only source of the number $24 = 4!$ in Target T. It is not known to be sharp. Handbook Volume 9, Section 3.21. Not in Lean.

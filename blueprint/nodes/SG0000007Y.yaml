tag: SG0000007Y
kind: hypothesis
title: Albanese's bound on multiplicities
statement: Let $k$ be an algebraically closed field and $K/k$ a function field of transcendence degree $d$. There is a normal projective variety $V$ over $k$ with function field $K$ such that $e(\mathcal{O}_{V,q}) \le d!$ for each point $q \in V$.
sources:

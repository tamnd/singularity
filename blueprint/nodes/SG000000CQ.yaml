notes: 'This is Corollary 86.2 of research note 86. A divisorial step does not raise $\omega$, and at $\omega = 0$ SG0000009R applies. A main step of the rule blows up a centre along which $\omega$ is constant: the point, or a curve with $\omega(\eta_S) = \omega$. By SG000000CP the vertex of $z'' = z / x_j$ for the weight $(1, 1, 1)$ is not solvable at each point $\xi''$ over the centre, so $\delta(\xi'') = \delta_{z''}(\xi'')$, and Proposition 61.11 and Corollary 61.12 of note 61 give $\omega(\xi'') \le \omega_{z''}(\xi'') \le \omega(\xi)$. So the rises of $\omega$ of SG0000009K and SG0000009M need $a_p \ne 0$ and $a_{2p} \ne 0$. In the rule trees of the lab of note 86 for $120$ random germs with $a_3 = 0$ or $a_6 = 0$ ($p = 3$, truncated germs), no step raised $\omega$. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Corollary 4.5.18. The result is not in Lean.'

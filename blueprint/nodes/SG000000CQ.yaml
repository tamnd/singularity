tag: SG000000CQ
kind: theorem
title: 'Omega never goes up on germs with a_p = 0 or a_2p = 0 under Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Suppose that $a_p = 0$ or $a_{2p} = 0$. Then $\omega(\xi_{n+1}) \le \omega(\xi_n)$ at each step of each sequence $\xi_0, \xi_1, \dots$ of Rule 61.9'' through points of multiplicity $2p$, for each choice among tied centres and each choice of points.'

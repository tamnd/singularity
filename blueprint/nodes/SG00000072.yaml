notes: This is Theorem 3.17.21 of Volume 7 of the handbook (Section 3.17). So Question 3.13.18 and Question 3.13.13 have a positive answer here, and the run is a cycle of the kind of Remark 3.12.3. It is Theorem 2.3 of note 40 of the research notes, with the fix of note 42. Note 42 checked it over $\mathbb{F}_5$, $\mathbb{F}_{25}$, $\mathbb{F}_{49}$, $\mathbb{F}_{121}$ and $\mathbb{F}_{125}$, with nonlinear free coordinates. The result is not in Lean.

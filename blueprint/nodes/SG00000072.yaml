tag: SG00000072
kind: counterexample
title: The point x w (x + w) y^(p-3) z^(p-3) has a corner run with no corner surface of order at least rho
statement: Let $p \ge 5$, $n = 4$, $\Delta = V(y) \cup V(z)$ and $g = x w (x + w) y^{p-3} z^{p-3}$. Then $g$ is clean, $G = x w (x + w)$, $d = 3$ and $\rho = 2$. The $y$-chart and the $z$-chart at the origin send $g$ to $g$, and the translation $0$ is the only one that keeps $\rho$. So each word in the two charts with each chart an infinite number of times is a corner run in four variables with all translations $0$. Each free coordinate $X$ at each point of the run has $\nu^G \le 1$ on $V(X, y)$ and on $V(X, z)$, whatever its translations. So SG00000071 is false. The corner curves $V(x, w, y)$ and $V(x, w, z)$ and the surface $V(x, w)$ have $\nu^G = 3 \ge \rho$.

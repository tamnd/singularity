tag: SG000000B0
kind: theorem
title: 'Local uniformization goes up from a projection to a subfield of its henselization'
statement: 'Let $(F, \nu)$ be a valued function field over $k$ with $F\nu = k$, and let $K \subseteq F$ be a subfield with $F/K$ finite and $F \subseteq K^h$. If $(K, \nu)$ has local uniformization in the strong form, then $(F, \nu)$ has local uniformization in the strong form.'
sources:
- paper: KK09
  loc: 'Lemma 3.7 and Corollary 3.6'

tag: SG0000006J
kind: lemma
title: The closed form of the transform of a corner run in four variables
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point), with $x_m = L_m (x_{m+1} + a_m)$, $w_m = L_m (w_{m+1} + b_m)$, $M_N = 1$, $M_{m+1} = M_m L_m$, $\varphi_{m+1} = \varphi_m + a_m M_{m+1}$ and $\psi_{m+1} = \psi_m + b_m M_{m+1}$. Then $x_N = \varphi_m + M_m x_m$ and $w_N = \psi_m + M_m w_m$, the function of $P_m$ is $M_m^{-p} g_m$ with $g_m = \operatorname{cl} g(\varphi_m + M_m x_m, \psi_m + M_m w_m)$, and $g_m = \sum A_{kl} x_m^k w_m^l$ over the $(k, l)$ not both divisible by $p$ plus $\sum \operatorname{cl}(A_{kl}) x_m^k w_m^l$ over the others, with $A_{kl} = M_m^{k + l} g^{[k, l]}(\varphi_m, \psi_m) \in K[[y_m, z_m]]$. Also $\partial_{x_m} g_m = M_m g_x(\varphi_m + M_m x_m, \psi_m + M_m w_m)$, and the same for $w$.

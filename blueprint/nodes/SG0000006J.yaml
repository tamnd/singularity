notes: This is Lemma 3.17.1 of Volume 7 of the handbook (Section 3.17). It is Lemma 3.15.1 with two free coordinates, which are multiplied by the same chart variable $L_m$. The proof is by induction, with the facts that the cleaning commutes with the substitution and that a monomial with an exponent of $x$ or $w$ not divisible by $p$ is not a $p$-th power. It is Lemma 2.1 of note 38 of the research notes, and note 39 checked it on 500 random cases with no mismatch. The result is not in Lean.

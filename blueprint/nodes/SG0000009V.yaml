notes: 'This is Definition 2.2 of research note 45, refereed in note 48, with the excess and the imbalance of note 75, Section 2, as the referee report in note 78 checked them. The ideal $\Theta^{\le m}(g)$ depends only on $(R, \Delta, g)$ and not on the adapted coordinates (note 45, Proposition 2.4), and $\Theta^{\le m}(g + h^q) = \Theta^{\le m}(g)$ for each $h \in R$ because $\tau(h^q) = h^q + (\tau(h) - h)^q$ and $m < q$ (note 45, Proposition 2.5). So $\tilde r$ and $\rho_m$ are invariants of the germ. The graded pieces, $\sigma$, $\varepsilon_c$, $\delta$ and the balanced condition are defined in fixed coordinates and can depend on them. For $m = 1$ the ideal is the log-Jacobian ideal SG0000003E of any $g_0$ with $g - g_0 \in R^p$. The residual order $d$ is the one of [HP19a], Section 2. Handbook Volume 7, Section 3.19. The definition is not in Lean.'

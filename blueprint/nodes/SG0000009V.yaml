tag: SG0000009V
kind: definition
title: The Hasse-Schmidt log-Jacobian ideals of z^q + g, their graded pieces and the imbalance
statement: 'Let $K$ be an algebraically closed field of characteristic $p > 0$, let $q = p^e$ with $e \ge 1$, $P = p^{e-1}$, $R = K[[x_1, \dots, x_n]]$, and let $\Delta \subseteq \{1, \dots, n\}$ be the boundary indices, and let $\Delta^c = \{1, \dots, n\} \setminus \Delta$ be the free indices. The logarithmic Taylor map is the continuous homomorphism $\tau : R \to R[[s_1, \dots, s_n]]$ with $\tau(x_i) = x_i(1 + s_i)$ for $i \in \Delta$ and $\tau(x_j) = x_j + s_j$ for $j \in \Delta^c$. For $g \in R$ write $\tau(g) = \sum_{\beta \in \mathbb N^\Delta, \gamma \in \mathbb N^{\Delta^c}} \Phi_{\beta,\gamma}(g) s_\Delta^\beta s_{\Delta^c}^\gamma$. Then $\Phi_{\beta,\gamma} = x^\beta D^{(\beta)} D^{(\gamma)}$ and $\Phi_{\beta,\gamma}(x^a) = \binom{a_\Delta}{\beta} \binom{a_{\Delta^c}}{\gamma} x^{a - \gamma}$. For $1 \le m < q$ the Hasse-Schmidt log-Jacobian ideal $\Theta^{\le m}(g)$ is the ideal of the $\Phi_{\beta,\gamma}(g)$ with $0 < |\beta| + |\gamma| \le m$. Let $x^{\tilde r}$ be the largest monomial in the boundary variables that divides it. The residual order $\rho_m$ is the order of $x^{-\tilde r} \Theta^{\le m}(g)$. In fixed adapted coordinates, the graded piece $\Theta_{(c)}$ is the ideal of the generators with $|\gamma| = c$, $\rho_{(c)} = \operatorname{ord} x^{-\tilde r} \Theta_{(c)}$ (with $\rho_{(c)} = \infty$ if $\Theta_{(c)} = 0$) and $\sigma = \min_c (\rho_{(c)} + c)$, so that $\rho_m = \min_c \rho_{(c)}$. Let $g$ be clean, that is, no monomial of $g$ has all its exponents divisible by $q$, and write $g = x^r G$ with $x^r$ the largest monomial in the boundary variables that divides $g$ and $d = \operatorname{ord} G$, the residual order. The excess of the piece $c$ is $\varepsilon_c = \rho_{(c)} + c - d$, and the imbalance of $g$ is $\delta = \min_c ((\rho_{(c)} - \rho_m) + \varepsilon_c)$. The germ is balanced at level $m$ in the given coordinates if some $c$ minimizes both $\rho_{(c)}$ and $\rho_{(c)} + c$.'

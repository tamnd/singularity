notes: 'This is Lemma 86.1 of research note 86. It replaces the hypothesis $a_p = a_{2p} = 0$ of Lemma 81.2 of note 81 by one of the two conditions, and it holds at each point over the centre, not only at chart origins. Proof: if the point $x'' = 0$, $z'' = \nu$ of the strict transform $f'' = z''^{2p} + \sum a''_i z''^{2p-i}$ has multiplicity $2p$, then $f''(0, z'') = (z'' - \nu)^{2p}$. Its coefficient of $z''^p$ is $\binom{2p}{p}(-\nu)^p = 2(-\nu)^p$, by the theorem of Lucas, and its constant term is $\nu^{2p}$. So $a''_p = 0$ or $a''_{2p} = 0$ gives $\nu = 0$. With $\nu = 0$ the new coefficients are $a''_i = \sigma^*(a_i) / x_j^i$ for the substitution $\sigma^*$ of the chart, so $a_i = 0$ gives $a''_i = 0$. A solvable vertex has $\operatorname{in}_w a_p = 2C^p \ne 0$ and $\operatorname{in}_w a_{2p} = C^{2p} \ne 0$ (Lemma 61.3 of note 61), so no vertex is solvable. With $a_{2p} = 0$ the germ is $z$ times a polynomial, so the case of interest is $a_p = 0$. A control example of note 86 with $a_3 \ne 0$ and $a_6 \ne 0$ needs a new preparation at a chart origin, so the hypothesis of SG000000BE that $z$ stays prepared is a real one. The lab of note 86 ($p = 3$) followed the full rule trees, at all rational points and with all ties, of $60$ random germs with $a_3 = 0$ and $60$ with $a_6 = 0$, to depth $25$ and $60$ with the truncation of the terms of $a_i$ of degree above $20i$, and found no translation and no $\nu \ne 0$. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Lemma 4.5.16. The result is not in Lean.'

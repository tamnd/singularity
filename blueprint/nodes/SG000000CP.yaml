tag: SG000000CP
kind: lemma
title: 'Rigid germs stay prepared at each point under Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Suppose that $a_p = 0$ or $a_{2p} = 0$. Let $\xi_0, \xi_1, \dots$ be a sequence of Rule 61.9'' through points of multiplicity $2p$, for each choice among tied centres and each choice of points, not only chart origins. Let $z_0$ be a simultaneously prepared coordinate at $\xi_0$, and let $z_{n+1} = z_n / x_j$ in the chart of $x_j$ that contains $\xi_{n+1}$. Then: (1) each point of multiplicity $2p$ over the centre at $\xi_n$ lies on $z_n / x_j = 0$, so no translation $z_{n+1} = z_n / x_j - \nu$ with $\nu \ne 0$ occurs; (2) the coefficient $a_p$ of $f$ in $z_n$ stays $0$ if $a_p = 0$ at $\xi_0$, and the same holds for $a_{2p}$; (3) at each $\xi_n$ the vertex of $z_n$ is not solvable for any weight, so $z_n$ is simultaneously prepared and the rule never changes $z$.'

notes: This is Lemma 3.16.1 of Volume 7 of the handbook. The substitution $x_N = \varphi_m + M_m x_m$ is in the maximal ideal, so Taylor's formula holds for power series in $x$. The set $S$ of the dominance lemma (Lemma 3.15.4) can be infinite, and the proof of Proposition 3.15.5 gives $\pi(P^{\mathrm{cl}}) = \mu_0'(1 + f)$ with $f$ in the maximal ideal. Note 35 of the research notes states the extension, and note 37 asks for the written proof. The result is not in Lean.

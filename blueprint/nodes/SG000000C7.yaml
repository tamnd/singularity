tag: SG000000C7
kind: counterexample
title: 'The dimension 2 step of the patching proofs fails at generic points of curves in dimension 4'
statement: 'In dimension 3 the patching proofs of Cutkosky and of Cossart and Piltant use, at the generic point $\xi$ of a curve in the fundamental locus that maps onto a curve, that a regular local ring of dimension 2 that birationally dominates another one is an iterated quadratic transform of it. In dimension 4 the corresponding local rings have dimension 3 over the imperfect field $\kappa(\xi)$, and both forms of the step fail. There are regular local rings $R \subset S$ of dimension 3, essentially of finite type over $k(t)$, with $S$ birationally dominating $R$, such that $S$ is not an iterated monoidal transform of $R$. Already for one monoidal transform $S = R[y/x]_{(x, y/x, z)}$ of $R = k(t)[x,y,z]_{(x,y,z)}$ the ideal $\mathfrak{m}_R S = (x, z) S$ is not principal. For toric pairs a local strong factorization exists in each characteristic.'

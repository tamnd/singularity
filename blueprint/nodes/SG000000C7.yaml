notes: 'Section 83.7 of research note 83. Take $R = k(t)[x,y,z]_{(x,y,z)}$ and $S = S_0$ of SG000000C2 over $k(t)$ (SG000000C3). Cutkosky needs direct factorization at $\xi$, and SG000000C5 shows that it fails also in a global configuration. Cossart and Piltant need that $\mathfrak{m}_R S$ becomes principal, in Step 2 of the proof of their Proposition 4.6, condition (4.7); this reading of their proof is from note 83 and is not a theorem. Local strong factorization (a ring that is an iterated monoidal transform of both $R$ and $S$) holds for toric pairs in each characteristic [Kar03, Theorem 0.2] and in characteristic 0 in general [Kar03, Theorem 0.1]. In characteristic $p$ it is open. New in note 83; a second referee has not read it yet. Handbook Volume 9, Section 3.24. The result is not in Lean.'

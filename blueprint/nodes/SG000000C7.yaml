notes: 'Section 83.7 of research note 83, with Fixes 10 and 11 of the referee report in note 87. For Cutkosky, take $R = k(t)[x,y,z]_{(x,y,z)}$ and $S = S_0$ of SG000000C2 over $k(t)$ (SG000000C3): Cutkosky needs direct factorization at $\xi$, and SG000000C5 shows that it fails also in a global configuration. For Cossart and Piltant, the numbering is that of arXiv 1412.0868v2 (8 January 2019): Proposition 4.2 is the theorem of Abhyankar, 4.3 is the result of Cossart, Jannsen and Saito, 4.4 is principalization, then Lemma 4.5 and Proposition 4.6 with the displays (4.6) and (4.7). In v1 (2 December 2014) the numbers are 4.1 (Abhyankar), 4.2, 4.3 (principalization) and 4.4 (the main proposition). In Step 2 of the proof of Proposition 4.6 they use Proposition 4.2 to make $I(Z_i) \mathcal{O}$ invertible above $\xi_i$, which gives the sentence just before (4.7), that the preliminary principalization is unchanged away from finitely many closed points; Proposition 4.2 is used again in Step 3. Note 87 confirms this reading of their proof against the text. The statement in dimension 4 that this step needs, that $\mathfrak{m}_R S$ is principal when $S \ne R$, fails already for one monoidal transform along a curve, so the step of Cossart and Piltant fails for a reason that does not depend on $S_0$; $S_0$ is needed only for the step of Cutkosky. Local strong factorization (a ring that is an iterated monoidal transform of both $R$ and $S$) holds for toric pairs in each characteristic [Kar03, Theorem 0.2], in characteristic 0 in general [Kar03, Theorem 0.1], and in each characteristic along valuations of rank 1 and rational rank 3 (SG000000CN). In characteristic $p$ it is open in general. The local input that patching along curves needs is the relative form SG000000CG. Handbook Volume 9, Sections 3.24 and 3.25. The result is not in Lean.'

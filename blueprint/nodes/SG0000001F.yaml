notes: The Lean statement of tamnd/singularity-lean#69 and tamnd/singularity-lean#70 uses the affine form of local uniformization (Singularity.HasLocalUniformization). For each finite subset of the valuation ring, there is a finitely generated k-subalgebra A of K with fraction field K that contains the set and is contained in the valuation ring, such that the localization of A at the center is a regular local ring. Volume 3, Proposition 4.1.6 of the handbook proves that this form is equivalent to the form with proper birational morphisms. The statement is not proved. The statement is for each prime p and each field of characteristic p. tamnd/singularity-lean#73 proves the statement in transcendence degree 0 and 1 for each p (Singularity.localUniformizationInDim_zero and Singularity.localUniformizationInDim_one). The model is the integral closure of an affine model that contains the finite set. This is Proposition 4.1.7 of Volume 3 of the handbook.

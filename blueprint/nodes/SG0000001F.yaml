notes: The Lean statement of tamnd/singularity-lean#69 and tamnd/singularity-lean#70 uses the affine form of local uniformization (Singularity.HasLocalUniformization). For each finite subset of the valuation ring, there is a finitely generated k-subalgebra A of K with fraction field K that contains the set and is contained in the valuation ring, such that the localization of A at the center is a regular local ring. Volume 3, Proposition 4.1.6 of the handbook proves that this form is equivalent to the form with proper birational morphisms. The statement is not proved. The statement is for each prime p and each field of characteristic p. tamnd/singularity-lean#73 proves the statement in transcendence degree 0 and 1 for each p (Singularity.localUniformizationInDim_zero and Singularity.localUniformizationInDim_one). The model is the integral closure of an affine model that contains the finite set. This is Proposition 4.1.7 of Volume 3 of the handbook. The reduction of Cossart and Piltant [CP19, Proposition 4.10] reduces this statement to steps of degree p. tamnd/singularity-lean#105 proves facts on these steps, for example that a valuation of K has a unique extension to a purely inseparable extension (Singularity.existsUnique_valuationSubring_comap_eq). tamnd/singularity-lean#123 proves the induction on the degree in Steps 3 and 4 of the reduction, with the step of degree p as an explicit hypothesis (Singularity.LocalUniformizationInseparableStep and Singularity.LocalUniformizationGaloisStep). From these hypotheses it proves local uniformization for a purely inseparable extension (Singularity.hasLocalUniformization_of_isPurelyInseparable), for K over its separable closure in L (Singularity.hasLocalUniformization_of_separableClosure), and for a Galois extension of degree a power of p (Singularity.hasLocalUniformization_of_isGalois). It proves with no hypothesis that a Galois extension of degree p^r in characteristic p is a tower of Artin-Schreier steps (Singularity.exists_artinSchreier_tower). The step of degree p itself has no Lean proof. In transcendence degree 3 it follows from [CP19, Theorem 1.5] and the patching of [CP19, Section 4], and in transcendence degree 4 it is open. Steps 1 and 2 and the unramified and tame parts of Step 4 have no Lean proof.

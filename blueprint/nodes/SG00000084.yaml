tag: SG00000084
kind: example
title: The Hermitian 4-fold has no linear projection of local degree less than p
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$, let $q = p^m$ with $m \ge 1$, and let $X = V(F) \subset \mathbb{P}^5_k$ with $F = \sum_{i=0}^{5} x_i^{q+1}$. Then $X$ is smooth. For each point $P \notin X$, the linear projection $\pi_P \colon X \to \mathbb{P}^4_k$ from $P$ is finite and flat of degree $q + 1$, and its local degree is at least $q$ at each point of the 3-fold $R_P = X \cap V(\sum_i P_i x_i^q)$. If $P$ is projectively $\mathbb{F}_{q^2}$-rational, then the local degree is $q + 1$ at each point of $R_P$, and $\pi_P$ is tamely ramified along $R_P$ with ramification index $q + 1$. Otherwise the local degree is $q$ at the generic point of each component of $R_P$, and $\pi_P$ is wildly ramified along $R_P$.

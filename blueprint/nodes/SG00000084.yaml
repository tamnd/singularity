notes: Proposition 2.2 of research note 56, with the dichotomy of tame and wild projections of Proposition 1.2 of note 62 (Proposition 2.4 of note 56 after the corrections). The proof uses the identity $F(x + tu) = F(x) + t \sum_i x_i^q u_i + t^q \sum_i u_i^q x_i + t^{q+1} F(u)$. The example shows that the step \"local degrees are bounded by multiplicities\" of the sketch of research note 02, Theorem 2.12, fails, also for a smooth variety that needs no step of Albanese. So the hypothesis (TP) of SG00000085 fails for each linear projection of $X$, but some projections of $X$ are tame. It rests on the known non-reflexivity of Hermitian varieties. It is an example, not a theorem. Note 62 checked it numerically over $\mathbb{F}_{3^6}$, $\mathbb{F}_{5^4}$ and $\mathbb{F}_{3^8}$. Handbook Volume 9, Section 3.21. Planned for Lean.

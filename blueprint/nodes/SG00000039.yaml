tag: SG00000039
kind: example
title: One cycle of Hauser and Perlega
statement: Let $K$ be a field of characteristic 2. The equation $z^8 + x^4 y^4 w^6 (w^2 + x^3 u^{10})$ in the variables $x, y, u, v, w$ has residual order 2 along the divisor $xyuw = 0$. An explicit sequence of 20 point blowups, with one cleaning, keeps the order 8. After it, the equation has the starting shape with $d = 4$ in place of $d = 2$, and with $y$ and $u$ exchanged. The residual order along the divisor goes to 6, then to 5, and then to 4.
sources:

notes: This is the cycle of [HP19a, Section 4] for $d = 2$, $a = b = r = 0$, $s = 1$, $\lambda = 1$, $A = 1$ and $Q = 0$. Singularity.Examples.cycleF7_shape proves the final shape. The Lean proof does not cover the other parameters, and it does not prove that the residual order goes to infinity when the cycle is repeated. That claim is the node SG00000017.

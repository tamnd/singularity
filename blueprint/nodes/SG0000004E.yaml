notes: This is Volume 5, Proposition 1.4.5 and Corollary 1.4.6 of the handbook. The theorem of Zariski is [Zar40], and it came before [Hir64]. The step from resolution to local uniformization is not in the library. It needs a link between the models of Volume 3, Definition 4.1.1 and the affine form of `Singularity.HasLocalUniformization` (Volume 3, Proposition 4.1.6). No Lean statement yet.

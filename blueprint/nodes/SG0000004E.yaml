tag: SG0000004E
kind: theorem
title: Resolution implies local uniformization
statement: 'Let $K/k$ be a function field, let $v$ be a valuation of $K/k$, let $X$ be a model of $K/k$ on which $v$ has a center, and let $X'' \to X$ be a proper birational morphism with $X''$ regular. Then the center of $v$ on $X''$ is a regular point of $X''$. In particular, if each model of $K/k$ has a resolution, then each valuation of $K/k$ has local uniformization. With SG0000000D this gives the theorem of Zariski: each valuation of a function field over a field of characteristic 0 has local uniformization.'

tag: SG0000007X
kind: conjecture
title: Patching in dimension 4 from local uniformization without a finite set
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$. Suppose that for each function field $L$ of transcendence degree 4 over $k$ and each valuation ring $V$ of $L$ that contains $k$, there is a regular local ring $A$, essentially of finite type over $k$, with fraction field $L$ and dominated by $V$. Then each variety of dimension 4 over $k$ has a resolution.

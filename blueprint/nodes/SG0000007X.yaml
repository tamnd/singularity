notes: This is the hypothesis $\mathrm{Patch}_4^{\rm Z}$ of research note 56, Corollary 3.3, in the form of note 62. It is the form of patching of [Cut09, Section 16], where the premise has no finite set. The premise is weaker than the affine form of local uniformization of SG0000001H, which asks for a regular center that contains a given finite set. So this statement implies SG0000001J for 4-folds, and it is a priori a stronger assumption. In characteristic 0 the conclusion is true by SG0000001P, but no proof by patching is known for 4-folds, also in characteristic 0. For 3-folds, [Cut09] Theorems 16.1 and 16.2 prove the analogue from the quasi-compactness of the Zariski-Riemann space and principalization. By SG000000BS it follows from SG000000BQ, the fundamental theorem in dimension 4, and SG000000BT shows that resolution of 4-folds is equivalent to SG000000BR and SG000000BQ (Handbook Volume 9, Section 3.24). Handbook Volume 9, Section 3.21.

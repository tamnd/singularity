tag: SG00000067
kind: theorem
title: A corner run with free translations of a point of degree less than p in x has only a finite number of nonzero translations
statement: Let $n = 3$ and let $g \in K[[y, z]][x]$ be clean at $P_N$ with $\deg_x g < p$. Then each corner run with free translations from $P_N$ has only a finite number of nonzero translations. After the last one, at $P_{J+1}$, the run is a run of Theorem 3.13.20 in the coordinates of $P_{J+1}$, so Question 3.13.18 has a positive answer for it.

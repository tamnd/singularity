notes: 'This is Lemma 66.2 of research note 66, with Definition 66.1 of the flag. The referee report in note 72 checked it and added two sentences: in R1 one has $\delta = D < \sigma^*$, and the case $q > \omega$ is covered because $(\operatorname{in} c)^p \in k[X^p]$. Two prepared coordinates differ by $z \mapsto z + c$ with $\operatorname{ord} c \ge \delta$, and the new $F$ is $F + c^p$ plus rigid terms of order larger than $p \delta$. Outside R1 the rigid terms can reach the degree $p \delta$ of $F$, and the flag is then not intrinsic. Handbook Volume 7, Lemma 4.4.10. The result is not in Lean.'

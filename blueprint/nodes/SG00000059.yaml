tag: SG00000059
kind: lemma
title: The order of the tangent log-Jacobian ideal is the residual order
statement: In the setting of SG0000003F, let $F \ne 0$ be clean, with $F = x^r G$ and $d = \operatorname{ord} G$, and let $\widetilde\Theta_0(G)$ be the ideal generated by the elements $r_i G + x_i \partial_i G$ for $i \in \Delta$ and $x_m \partial_l G$ for $l \notin \Delta$ and all $m$. Then $\operatorname{ord} \widetilde\Theta_0(G) = d$. So the first case $\sigma = \rho$ is the type $0$, and the second case $\sigma = \rho + 1$ is the type $1$.
sources:

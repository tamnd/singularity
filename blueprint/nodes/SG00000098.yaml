notes: 'This is Corollary 3.3 of research note 68, which the referee report in note 70 checked. The step from (i) to (iii) is SG00000097 for $D = p$ and SG0000008S for $D > p$. The step from (iii) to (ii) is Theorem 5.2 of research note 55: a linear change moves $C$ into $\{x y = 0\}$, and then the compact faces of the cleaned form are its segment and its two end monomials, which have no torus critical point. The statement is for $g = h$. With terms of higher order only the step from (i) to (iii) is proved. The result is not in Lean.'

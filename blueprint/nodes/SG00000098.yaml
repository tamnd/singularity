tag: SG00000098
kind: theorem
title: 'Preparation of z^p + h for a binary form h'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, and let $h \in k[x, y]$ be a form of degree $D$ with $p \mid D$ and $\nabla h \ne 0$. Let $C \subset \mathbb{P}^1$ be the set of the zeros of $\nabla h$. Then the following are equivalent. (i) There are an automorphism $\Psi$ of $k[[x, y, z]]$ and a unit $u$ such that $u \cdot ((z^p + h) \circ \Psi)$ is Newton nondegenerate. (ii) There is a linear change of $(x, y)$ such that $z^p + h$, after the change and the cleaning, is Newton nondegenerate. (iii) $|C| \le 2$.'
sources:

notes: 'This is Theorem 7.1 of research note 68, which the referee report in note 70 checked. The terms of higher order of $g$ can be arbitrary. In the $x_1$-chart $f'' = z''^p + h(1, y) + t R(t, y)$, and at $P_v$ the part of $h(1, y_0 + s) - h(1, y_0)$ without $p$-th power monomials survives in the new $g$. If it has no monomial of degree at most $D - 1$, then $\partial_v h \equiv 0$. For $n = 2$ this would make $h$ a $p$-th power. It extends SG0000008X, where $g = h$, to terms of higher order. The exception is real: for $p = 5$ and $g = y^4 w + y w^4 + x^5$, $\nu(P_v) = 5$ at $v = e_1$. It is not proved that the exceptional set has high codimension. The theorem does not claim that $f''$ is Newton nondegenerate at $P_v$. The residual order is invariant under the changes of $x$ and under $z \mapsto z + q(x)$; nothing is claimed for the general changes of $(x, z)$. Random tests over finite fields found no exceptional point; this is numerical evidence only. The result is not in Lean.'

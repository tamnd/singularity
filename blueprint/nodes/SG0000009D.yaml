tag: SG0000009D
kind: theorem
title: 'One weighted blowup lowers the residual order of z^p + g'
statement: 'Let $k$ be an algebraically closed field of characteristic $p > 0$, let $n \ge 2$, let $g \in k[[x_1, \dots, x_n]]$ with $\operatorname{ord} g = D$ and $p \mid D$, and let $h$ be the form of degree $D$ of $g$ with $\nabla h \ne 0$. Let $f = z^p + g$, with residual order $\nu(f) = D$, the order of the part of $g$ without $p$-th power monomials. Let $\pi$ be the weighted blowup of the origin with the weights $(1, \dots, 1, D/p)$ and $f''$ the strict transform. Then $f''$ meets the exceptional divisor only in the $x_i$-charts. At a point of $f'' = 0$ over the origin, $f''$ is smooth unless the point lies over a direction $v \in C$, where $C \subset \mathbb{P}^{n-1}$ is the set of the zeros of $\nabla h$. At the point $P_v$ over $v \in C$, $\nu(P_v) \le D - 1$ unless $\partial_v h \equiv 0$. If $n = 2$, the exception does not occur, so $\nu$ drops at each point over the origin.'
sources:

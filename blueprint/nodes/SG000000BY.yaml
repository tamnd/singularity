tag: SG000000BY
kind: lemma
title: 'Each principalization is a local isomorphism over regular points of codimension 2'
statement: 'Let $U$ be a regular variety of dimension 4, $K \subseteq \mathcal{O}_U$ a nonzero ideal, $\alpha \colon Z \to U$ the normalized blowup of $K$, and $\sigma \colon W \to U$ a principalization of $K$ by blowups along regular centers in the locus where $K$ is not invertible. Let $\zeta \in Z$ with $\mathcal{O}_{Z,\zeta}$ regular of dimension 2 and $\mathcal{O}_{U,\alpha(\zeta)}$ of dimension 2. Then the induced morphism $\tau \colon W \to Z$ is a local isomorphism over $\zeta$.'
sources:
- paper: Abh56
  loc: 'Theorem 3'
- paper: CP19
  loc: 'Proposition 4.2 of arXiv 1412.0868v2'

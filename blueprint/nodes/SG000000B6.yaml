notes: 'This is the explicit member of Corollary 4.3 of research note 76, which the referee report in note 80 confirms with the repaired Lemma 3.1(c). The series $\sum t^{n!}$ is transcendental over $k(t)$ by a Liouville argument, $t^{\sqrt 2}$ is transcendental over $k((t))$, and $\vartheta_0$ is transcendental over the algebraically maximal field $C$ by SG000000B5. Case (i) of SG000000B4 applies, and $x_4 \notin C$ gives the last claim by SG000000AZ(c). Handbook Volume 9, Section 3.23. The result is not in Lean.'

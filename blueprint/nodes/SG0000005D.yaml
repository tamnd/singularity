notes: By SG0000005B, $\tau_\rho(P_0) \le \widetilde\tau(P_m)$, but $\tau_\rho(P_m) \le \widetilde\tau(P_m)$, so the conjecture does not follow. SG0000005C shows that $\tau_\rho$ can go down at the last step, back to its value at $P_0$. In random tests with $(p, n) = (2, 3), (2, 4), (3, 3)$ and $(5, 3)$, there were 249 comparisons on a kangaroo path and $\tau_\rho$ did not go down in any of them. At the 26 drops at the last step that a second test found, $\tau_\rho$ went down to exactly $\tau_\rho(P_0)$. If the conjecture holds, the only steps where the triple $(\rho, d, \tau_\rho)$ of SG0000005A can get worse are the steps from the first case to the first case with a leaving component, as in SG00000051. The hypothesis $m \ge 2$ is necessary because of SG00000051.

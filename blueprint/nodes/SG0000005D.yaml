tag: SG0000005D
kind: conjecture
title: The codimension of the directrix does not go down along a kangaroo path
statement: In the setting of SG0000005B, assume that $m \ge 2$ and that $P_0$ and $P_m$ are in the first case. Then $\tau_\rho(P_m) \ge \tau_\rho(P_0)$. This is open.

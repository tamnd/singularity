notes: This is Proposition 3.18.13 of Volume 7 of the handbook (Section 3.18). It is Proposition 5.2 of note 52 of the research notes, checked again in note 54, Part A. It is the case $\deg f = 1$ of SG0000008G, multiplied by $M_m$. The result is not in Lean.

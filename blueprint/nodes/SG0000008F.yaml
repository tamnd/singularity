tag: SG0000008F
kind: theorem
title: On a planar corner run a coefficient of degree one in the translations is eventually a monomial times a unit
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty = (\varphi_\infty, \psi_\infty)$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational, and the completion $\hat H$ of $K(y_N, z_N)$ in it. The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Assume that the run is planar, let $\alpha_1, \beta_1, \gamma_1 \in K[[y_N, z_N]]$ with $(\alpha_1, \beta_1) \ne (0, 0)$, and put $F_m = M_m (\alpha_1 \varphi_m + \beta_1 \psi_m + \gamma_1) + M_m^2 (\alpha_1 x_m + \beta_1 w_m)$. Then there are a Laurent monomial $\nu$, a constant $c \ne 0$ and an $m_0$ such that for $m \ge m_0$, $\nu$ has nonnegative exponents in $y_m, z_m$ and $F_m = c\, M_m \nu\, \varepsilon_m$ with $\varepsilon_m$ a unit of $K[[x_m, w_m, y_m, z_m]]$.

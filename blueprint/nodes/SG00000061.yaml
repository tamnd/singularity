notes: This is Example 3.14.9 of Volume 7 of the handbook, the Example 4.1 of note 31 of the research notes with the strengthened claim of note 32. The difference of the two exponent vectors is $(1, 1, 1, -2)$ with the sum $1$, so it does not change under a step with the letter $1$, $2$ or $3$, and $g_m = x^r G_m$ with the same $G_m$. Lemma 3.13.14 (SG0000005T) puts $x_4$ and two of $x_1, x_2, x_3$ in the prime ideal of each regular subvariety with $\nu^G \ge \rho$ when $p \ge 3$, and a direct check gives the case $p = 2$. So in four variables an origin run can use three charts an infinite number of times and keep $\rho$, and the corner curves are the only candidates of Question 3.13.18. Note 32 checks the data for $p = 2, 3, 5, 7$ at $114904$ points for each $p$, with no failure. The result is not in Lean. The Lean file Singularity/Invariant/OriginRunsCorner.lean (tamnd/singularity-lean#183) proves the claims on rho, d, G_m and the order of G along the corner curves, the surfaces V(x_4, x_s) and V(x_4), for each word in the letters 1, 2, 3 (Singularity.OriginRuns.example_3_14_9 and rhoStep_exPoly). The claim on all regular formal subvarieties of dimension 2 or 3 is not in Lean, so the node has no lean field.

tag: SG00000061
kind: example
title: An origin run in four variables that uses three charts and has no surface with the order of G at least rho
statement: Let $n = 4$, $\Delta = \{1, 2, 3\}$ and $g = x_1 x_4^p + x_1^2 x_2 x_3 x_4^{p-2}$. Each word in the letters $1, 2, 3$ is an origin run with $\rho = d = p$ at each point and $G_m = x_4^p + x_1 x_2 x_3 x_4^{p-2}$. At each point the three curves $V(x_4, x_s, x_t)$ have $\nu^G = p$, the surfaces $V(x_4, x_s)$ have $\nu^G = p - 1$, $V(x_4)$ has $\nu^G = p - 2$, and no regular formal subvariety of dimension $2$ or $3$ has $\nu^G \ge \rho$.
sources:

notes: This is the analogue for the log-Jacobian order of the theorem of Hironaka that the codimension of the directrix does not go down at the points where the order stays. The weak transform of each element $h$ of the definition of $T_\rho(g)$ has order $\rho$ by SG0000004X and lies in $\widetilde\Theta(G')$. After a linear change of the coordinates the vector of the chart is $e_1$, and the restriction of $\operatorname{in}(h')$ to $x_1 = 0$ is $\operatorname{in}(h)$, so $\dim T_\rho(g'_c) \le \dim T_\rho(g)$. The condition on the new point is necessary. For $p = 2$, $g = x y z^2 + y^2 z + x z^2$ and $E = \emptyset$, the point is in the second case with $\rho = 2$ and $\tau_\rho = 2$, and at the origin of the $x$-chart $\rho$ stays, the new point is in the first case and $\tau_\rho = 1$. A random test found no point where $\tau_\rho$ goes down in the cases from the first to the first, from the first to the second and from the second to the second. The case from the first to the first is SG00000050, if $|r| + \rho$ is not $0$ in $k$. The Lean proof is for polynomials. The definitions are `logJacobianDirectrix` and `logJacobianDirectrixCodim`, the dimension inequality for the weak transforms is `finrank_iInf_directrix_pointChart_le`, and the example is `tauRhoExample_finrank`.

tag: SG0000004Z
kind: theorem
title: The codimension of the directrix of the log-Jacobian order does not go down in the second case
statement: In the setting of SG0000004X, let $T_\rho(g)$ be the intersection of the directrices of $\operatorname{in}(h)$ for $h \in \widetilde\Theta_0(G)$ of order $\rho$ if $\sigma = \rho$, and for $h \in \widetilde\Theta(G)$ of order $\rho$ if $\sigma = \rho + 1$, and let $\tau_\rho(g) = n - \dim T_\rho(g)$. Assume that $\rho(g'_c) = \rho(g)$ and that the new point is in the second case, that is, $\operatorname{ord} \widetilde\Theta_0(G') = \rho + 1$. Then $\tau_\rho(g'_c) \ge \tau_\rho(g)$.
sources:

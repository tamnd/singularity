tag: SG000000C3
kind: theorem
title: 'The ring S_0 is not an iterated monoidal transform for any regular centers'
statement: 'Let $F$ be a field, $R = F[x,y,z]_{(x,y,z)}$, and $S_0$ the regular local ring of SG000000C2. Then there is no prime $P \subseteq \mathfrak{m}_R$ of height at least 2 with $R/P$ regular such that $P S_0$ is principal. Hence $S_0$ is not an iterated monoidal transform of $R$ for any choice of regular centers, and $\mathfrak{m}_R S_0$ is not principal.'
sources:

notes: This is Volume 2, Theorem 2.3.3 and Lemma 2.3.2 of the handbook, after [Kol07, Chapter 3], Section Maximal contact and going down. A blowup sequence of order $m$ blows up smooth centers $Z_i$ in the locus of order at least $m$, with simple normal crossings with the transform of a divisor $E$, while the maximal order is $m$ (Volume 2, Definition 2.2.3). The proof uses that a derivative lowers the order by exactly one, which fails in characteristic $p$ (SG00000018). No Lean statement yet.

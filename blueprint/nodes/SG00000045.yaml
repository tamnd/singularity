tag: SG00000045
kind: theorem
title: Maximal contact in characteristic 0
statement: Let $X$ be a smooth variety over a field of characteristic 0, let $I$ be an ideal sheaf of maximal order $m \ge 1$, and let $H \subseteq X$ be a hypersurface of maximal contact for $I$, that is, a smooth hypersurface whose ideal sheaf lies in $D^{m-1}(I)$, the ideal sheaf generated by the local sections of $I$ and their derivatives of order at most $m - 1$. Let $X_r \to \dots \to X_0 = X$ be a blowup sequence of order $m$ for $(I, m)$, with the transforms $I_{i+1} = \mathcal{O}_{X_{i+1}}(m F_i) \cdot \pi_i^* I_i$, and let $H_{i+1}$ be the birational transform of $H_i$, with $H_0 = H$. Then for each $i$ the set of the closed points where $I_i$ has order at least $m$ lies in $H_i$, so the center $Z_i$ lies in $H_i$. The hypersurface $H_{i+1}$ is smooth, and it is a hypersurface of maximal contact for $I_{i+1}$ when the maximal order of $I_{i+1}$ is $m$. Near each closed point where $I$ has order $m$ a hypersurface of maximal contact exists.

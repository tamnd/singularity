tag: SG0000008B
kind: lemma
title: The elements of finite type of the Hahn field form a field
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty = (\varphi_\infty, \psi_\infty)$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational, and the completion $\hat H$ of $K(y_N, z_N)$ in it. An element of $\mathbb{K}$ is of finite type if it has only a finite number of terms below each value. Then the elements of finite type form a subfield $\mathbb{F}$ of $\mathbb{K}$. It contains $\hat H$ and, for each $f \in \hat H[X, W]$ and each finite $m$, the element $f(\Phi_m)$.
sources:

notes: This is Lemma 3.18.8 of Volume 7 of the handbook (Section 3.18). It is Lemma 1.1 of note 54 of the research notes, refereed in note 63. The inclusion of $\hat H$ is Lemma 3.15.6, part 2. The inverse of $c \nu (1 + \varepsilon)$ is the geometric series in $-\varepsilon$. If the run has an infinite number of nonzero translations, then $\varphi_\infty$ or $\psi_\infty$ is not in $\mathbb{F}$. The result is not in Lean.

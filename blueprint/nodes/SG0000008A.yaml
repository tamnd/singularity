notes: This is Corollary 3.18.7 of Volume 7 of the handbook (Section 3.18). It is Corollary 5.1 of note 50 of the research notes, with the fixes of note 52. An origin run from some point on is SG0000005Z (Theorem 3.14.7), and a linear run with an infinite number of nonzero translations is SG00000089. The result is not in Lean.

notes: This is Theorem 3.16.9 of Volume 7 of the handbook. If the number is infinite, Lemma 3.16.3 (SG0000006A) gives $v(V_m) = \tilde\beta_0 < \lambda(v(M_m)) < W$, so the criterion of Proposition 3.15.5 fails only if $\tilde\beta_0 \ge v(\mu M_m)$, and in the limit $\tilde\beta_0 \ge W_1 > W$. This is Theorem B of note 34 of the research notes. Note 35 adds the case $\mu = 0$, and note 36 gives a second proof by the transcendence of $\varphi_\infty$. The result is not in Lean.

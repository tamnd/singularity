tag: SG0000006D
kind: theorem
title: If the linear index is not in the tie set then a corner run of mu x + F(x^p) has only a finite number of nonzero translations
statement: Let $n = 3$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations, with the notation of Section 3.15 of Volume 7 of the handbook. Let $g = \mu x + F(x^p)$ be clean at $P_N$, with $\mu$ zero or a nonzero constant times a monomial in $y, z$, and $F(Y) = \sum_k B_k Y^k$ with $B_k \in K[[y, z]]$. Assume that $F$ is not constant. If $\min_i W_{pi} < W_1$, with $W_1 = \infty$ if $\mu = 0$, then the run has only a finite number of nonzero translations. In particular this holds for each clean $g \in K[[y, z]][[x^p]]$ that is not in $K[[y, z]]$.

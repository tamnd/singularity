tag: SG0000000Z
kind: definition
title: Key polynomials
statement: MacLane's key polynomials and augmented valuations for a simple extension of a valued field.
sources:
- paper: Mac36
- paper: HMOS22
lean:
  statement: Singularity.KeyPolynomial
tier: T2
notes: The Lean definition of tamnd/singularity-lean#66 states the two conditions with the relation of μ-equivalence, μ(f - g) < μ(f) in the multiplicative notation of Mathlib, in place of the graded algebra of μ. The library also proves that the monomial valuation [v; y, γ] is a valuation (Singularity.monomialValuation), and that y is a key polynomial for it. Singularity.augmentedValuationFun is the augmented valuation as a function. tamnd/singularity-lean#68 proves parts 1 and 2 of the theorem of MacLane-Vaquié. For a key polynomial φ, the function is multiplicative (Singularity.KeyPolynomial.augmentedValuationFun_mul), so it is a valuation (Singularity.augmentedValuation), and μ ≤ μ' (Singularity.augmentedValuation_le). The proof uses the expansion criterion for μ-minimal polynomials (Singularity.isMuMinimal_iff). tamnd/singularity-lean#72 proves the first claim of part 3. The polynomial φ is a key polynomial for the augmented valuation (Singularity.KeyPolynomial.keyPolynomial_augmentedValuation), by the criterion for μ'-divisibility (Singularity.muDvd_iff_of_forall_eq). The claim on the graded algebra in part 3 and part 4 of the theorem have no Lean proof, so the node has no Lean proof.

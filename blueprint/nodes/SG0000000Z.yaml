tag: SG0000000Z
kind: definition
title: Key polynomials
statement: MacLane's key polynomials and augmented valuations for a simple extension of a valued field.
sources:
- paper: Mac36
- paper: HMOS22
lean:
  statement: Singularity.KeyPolynomial
tier: T2
notes: The Lean definition of tamnd/singularity-lean#66 states the two conditions with the relation of μ-equivalence, μ(f - g) < μ(f) in the multiplicative notation of Mathlib, in place of the graded algebra of μ. The library also proves that the monomial valuation [v; y, γ] is a valuation (Singularity.monomialValuation), and that y is a key polynomial for it. Singularity.augmentedValuationFun is the augmented valuation as a function. tamnd/singularity-lean#68 proves parts 1 and 2 of the theorem of MacLane-Vaquié. For a key polynomial φ, the function is multiplicative (Singularity.KeyPolynomial.augmentedValuationFun_mul), so it is a valuation (Singularity.augmentedValuation), and μ ≤ μ' (Singularity.augmentedValuation_le). The proof uses the expansion criterion for μ-minimal polynomials (Singularity.isMuMinimal_iff). tamnd/singularity-lean#72 proves the first claim of part 3. The polynomial φ is a key polynomial for the augmented valuation (Singularity.KeyPolynomial.keyPolynomial_augmentedValuation), by the criterion for μ'-divisibility (Singularity.muDvd_iff_of_forall_eq). tamnd/singularity-lean#75 proves the step of part 4. For valuations μ ≤ ν (additive) with μ ≠ ν, a monic φ of least degree with μ(φ) < ν(φ) is a key polynomial for μ, and μ ≤ [μ; φ, ν(φ)] ≤ ν (Singularity.exists_keyPolynomial_augmentedValuation). The first step [v; y, ν(y)] ≤ ν is Singularity.map_le_monomialValuation. tamnd/singularity-lean#77 builds the chain of MacLane (Singularity.macLaneChain) and proves part 4 when the values of ν are discrete. Then ν is the limit of the chain, with no limit augmentations (Singularity.macLaneChain_eventually_eq). The chain is finite when the degrees and the finite values of the key polynomials are bounded (Singularity.exists_macLaneChain_eq). A nonzero support alone does not give a finite chain. For ν(f) = v_p(f(s)) with s in the p-adic integers and not rational, the chain is infinite. tamnd/singularity-lean#80 proves the remaining claim of part 3 in the form of μ-equivalence. A polynomial is μ'-equivalent to the sum of its terms of least value (Singularity.KeyPolynomial.muEquiv_augmentedValuation_sum_filter), which is the form of the claim that the graded algebra is generated by the initial form of φ. It also proves the uniqueness in the step. All monic choices of least degree have the same degree and are the monic polynomials of that degree that are μ-equivalent to φ (Singularity.muEquiv_iff_map_lt). The augmentation does not depend on the choice when the values agree (Singularity.augmentedValuation_eq_of_map_eq). It can depend on the choice when the values differ, and Example 3.3.18 of Volume 3 of the handbook gives a counterexample over the rational numbers. tamnd/singularity-lean#84 builds the limit augmentation of Vaquié. A continuous family of augmentations of one degree d has a limit on the stable polynomials (Singularity.ContinuousFamily.stableValue_eq_of_isStable). If the family does not reach the target valuation, a monic unstable polynomial of least degree exists and is a limit key polynomial (Singularity.ContinuousFamily.exists_isLimitKeyPolynomial). The limit augmentation with this polynomial is a valuation that lies between the family and the target (Singularity.ContinuousFamily.limitAugmentedValuation, Singularity.ContinuousFamily.IsLimitKeyPolynomial.map_le_limitAugmentedValuationFun). The limit key polynomial is a key polynomial for the limit augmentation (Singularity.ContinuousFamily.IsLimitKeyPolynomial.keyPolynomial_limitAugmentedValuation, tamnd/singularity-lean#99). The limit augmentation [μ_∞; φ, ν(φ)] agrees with ν in degree at most deg φ if and only if φ has the largest ν-value among the monic polynomials of its degree (Singularity.ContinuousFamily.IsLimitKeyPolynomial.forall_limitAugmentedValuationFun_eq_iff). The library does not prove that this largest value is attained, and it has no full chain with limit steps. When the values of ν are discrete of rank 1 (the hypothesis hdisc), the limit augmentations add nothing (tamnd/singularity-lean#101). A continuous family below ν with values of ν has γᵢ → ∞ (Singularity.ContinuousFamily.eventually_value_lt), each f with ν(f) < ∞ is stable (Singularity.ContinuousFamily.isStable_of_map_ne_zero), and with support 0 there is no limit key polynomial (Singularity.ContinuousFamily.not_isLimitKeyPolynomial). So part 4 is complete for a discrete valuation of rank 1, with the theorem of MacLane of tamnd/singularity-lean#77. tamnd/singularity-lean#109 proves part 4 for each ν with nonzero support, with any value group. Finitely many steps of MacLane-Vaquié, each an ordinary step or a limit step, reach ν (Singularity.reflTransGen_macLaneVaquieStep_of_map_eq_zero, Singularity.reflTransGen_monomialValuation_of_map_eq_zero). For each ν it proves a weak form. There is a chain that agrees with ν in degree at most n for each n, or ν is the limit of a continuous family over a valuation that finitely many steps reach (Singularity.exists_macLaneVaquie_seq_or_forall_isStable). The library has no graded algebra, and part 4 for support 0 with values that are not discrete has no Lean proof, so the node has no Lean proof.

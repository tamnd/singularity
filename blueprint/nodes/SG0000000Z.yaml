tag: SG0000000Z
kind: definition
title: Key polynomials
statement: MacLane's key polynomials and augmented valuations for a simple extension of a valued field.
sources:
- paper: Mac36
- paper: HMOS22
lean:
  statement: Singularity.KeyPolynomial
tier: T2
notes: The Lean definition of tamnd/singularity-lean#66 states the two conditions with the relation of μ-equivalence, μ(f - g) < μ(f) in the multiplicative notation of Mathlib, in place of the graded algebra of μ. The library also proves that the monomial valuation [v; y, γ] is a valuation (Singularity.monomialValuation), and that y is a key polynomial for it. Singularity.augmentedValuationFun is the augmented valuation as a function. tamnd/singularity-lean#68 proves parts 1 and 2 of the theorem of MacLane-Vaquié. For a key polynomial φ, the function is multiplicative (Singularity.KeyPolynomial.augmentedValuationFun_mul), so it is a valuation (Singularity.augmentedValuation), and μ ≤ μ' (Singularity.augmentedValuation_le). The proof uses the expansion criterion for μ-minimal polynomials (Singularity.isMuMinimal_iff). tamnd/singularity-lean#72 proves the first claim of part 3. The polynomial φ is a key polynomial for the augmented valuation (Singularity.KeyPolynomial.keyPolynomial_augmentedValuation), by the criterion for μ'-divisibility (Singularity.muDvd_iff_of_forall_eq). tamnd/singularity-lean#75 proves the step of part 4. For valuations μ ≤ ν (additive) with μ ≠ ν, a monic φ of least degree with μ(φ) < ν(φ) is a key polynomial for μ, and μ ≤ [μ; φ, ν(φ)] ≤ ν (Singularity.exists_keyPolynomial_augmentedValuation). The first step [v; y, ν(y)] ≤ ν is Singularity.map_le_monomialValuation. tamnd/singularity-lean#77 builds the chain of MacLane (Singularity.macLaneChain) and proves part 4 when the values of ν are discrete. Then ν is the limit of the chain, with no limit augmentations (Singularity.macLaneChain_eventually_eq). The chain is finite when the degrees and the finite values of the key polynomials are bounded (Singularity.exists_macLaneChain_eq). A nonzero support alone does not give a finite chain. For ν(f) = v_p(f(s)) with s in the p-adic integers and not rational, the chain is infinite. tamnd/singularity-lean#80 proves the remaining claim of part 3 in the form of μ-equivalence. A polynomial is μ'-equivalent to the sum of its terms of least value (Singularity.KeyPolynomial.muEquiv_augmentedValuation_sum_filter), which is the form of the claim that the graded algebra is generated by the initial form of φ. It also proves the uniqueness in the step. All monic choices of least degree have the same degree and are the monic polynomials of that degree that are μ-equivalent to φ (Singularity.muEquiv_iff_map_lt). The augmentation does not depend on the choice when the values agree (Singularity.augmentedValuation_eq_of_map_eq). It can depend on the choice when the values differ, and Example 3.3.18 of Volume 3 of the handbook gives a counterexample over the rational numbers. The library has no graded algebra, and the limit augmentations of part 4 for other value groups have no Lean proof, so the node has no Lean proof.

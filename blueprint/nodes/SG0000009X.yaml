notes: 'This is Proposition 75.2 of research note 75, which the referee report in note 78 found correct. It is Proposition 5.1 of note 45, $\rho''_m \le \min_c (c + 2 \rho_{(c)} - \sigma)$, with $\sigma = d$ from SG0000009W. The input is the exact law of note 45, Theorem 4.1: $\Theta^{\le m}_{\Delta''}(g'') = x_1^{-q} \pi(\sum_c \mathfrak m^c \Theta_{(c)}) R''$ for each $1 \le m < q$. Its proof writes $\tau''(\pi(g)) = \psi(H)$ with $H = \sum \pi(\Phi_{\beta,\gamma}(g)) x_1^{|\gamma|} s^\beta s^\gamma$ and an automorphism $\psi$ of $R''[[s]]$ that maps $(s)$ into $(s'')$, and uses $(1 + s_1'')^{-q} = (1 + s_1''^q)^{-1}$. The factor $x_1^{|\gamma|}$ is the only place where the free order $c$ enters. Each $W_c$ has order at most $\rho_{(c)}$ by the argument of SG0000003A, and the piece with $\varepsilon_c = 0$ shows that the sum is not in $(x_1)$. Both terms in the definition of $\delta$ are at least $0$, so $\delta = 0$ exactly when some $c$ makes both zero, which is the balanced condition. For $e = m = 1$ the law is SG0000003M. Handbook Volume 7, Section 3.19. The result is not in Lean.'

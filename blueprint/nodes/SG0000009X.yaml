tag: SG0000009X
kind: theorem
title: The graded transformation law of the Hasse-Schmidt log-Jacobian ideal under a point blowup
statement: 'In the setting of SG0000009V, let $g$ be clean with $\operatorname{ord} g \ge q$, let $P \le m < q$, and blow up the origin. At a closed point of the $x_1$-chart, with the coordinates $x_1$ and $y_i = x_i'' - t_i$ for $i \ne 1$, let $\Delta'' = \{1\} \cup \{i \in \Delta \mid t_i = 0\}$ and $g'' = x_1^{-q} \pi(g)$, and write $\pi(x^{-r} \Theta_{(c)}) R'' = x_1^{\rho_{(c)}} W_c$. Then, up to a unit, $\Theta^{\le m}_{\Delta''}(g'') = x_1^{|r| + d - q} \bigl(\prod_{i \in \Delta'', i \ne 1} y_i^{r_i}\bigr) \sum_c x_1^{\varepsilon_c} W_c$, the ideal $\sum_c x_1^{\varepsilon_c} W_c$ is not contained in $(x_1)$, and $\rho''_m \le \min_c (\varepsilon_c + \rho_{(c)}) = \rho_m + \delta$. Moreover $\delta \ge 0$, and $\delta = 0$ if and only if $g$ is balanced at level $m$ in the given coordinates.'

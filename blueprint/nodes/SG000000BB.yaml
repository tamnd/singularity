tier: T2
route:
- R2
notes: 'This is Question T1 and Conjecture 7.3 of research note 76. It is open. The heuristic of note 76 for it is wrong (Section 7.2 of the referee report in note 80) and is not used. By SG000000BA it is enough that $\vartheta$ has the ball property over $K_2(\psi^p)^h$, and for the purely inseparable shape of key polynomial it is enough that $\nu(\vartheta - B) < 0$ for each $B \in K_2(\psi)^h$. Handbook Volume 9, Section 3.23. The result is not in Lean.'

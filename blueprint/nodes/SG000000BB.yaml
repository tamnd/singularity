tag: SG000000BB
kind: conjecture
title: 'Question T1: the swapped projection of family T has the ball property'
statement: 'In family T (SG000000B9) with a generic sequence $(c_m)$, $x_4$ has the ball property over $K_2(y_3)$. Then SG000000B3 applies to the projection $(x_1, x_2, y_3, x_4)$ and $K$ has local uniformization in the strong form.'
sources:
- paper: Kap42

tag: SG00000051
kind: counterexample
title: The codimension of the directrix of the log-Jacobian order can go down from the first case to the first case
statement: In the setting of SG00000050, the hypothesis that $|r| + d$ is not $0$ in the base field is necessary. Over $\mathbb{F}_2$ in the variables $x, y, z, w, u$, let $g = x z^2 w u^2 + x y z w u^2$ and $\Delta = \{x, y, z, w\}$, so $|r| + d = 6$. Then $\rho(g) = 3$, the point is in the first case, and $\tau_\rho(g) = 3$. At the point of the $w$-chart with $t_x = 1$ and the other $t_i = 0$, the new point is in the first case with $\rho(g'_c) = 3$, and $\tau_\rho(g'_c) = 2$.

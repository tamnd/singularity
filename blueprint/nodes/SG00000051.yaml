notes: Here $r = (1, 0, 1, 1, 0)$ and $G = (y + z) u^2$, with $d = 3$. The elements $e_i = r_i G + x_i \partial_i G$ are $e_x = e_w = G$ and $e_y = e_z = y u^2$, and $\partial_u G = 0$. So $T_\rho(g) = \{y = z = u = 0\}$. The chart gives $g' = w^4 (x + 1)(z^2 + y z) u^2$. The monomial $z^2 w^4 u^2$ is a square, so $g'_c = w^4 (x z^2 u^2 + (x + 1) y z u^2)$. The new divisor is $\{y, z, w\}$, with $G' = x z u^2 + (x + 1) y u^2$. The new elements are $e'_y = e'_z = (x + 1) y u^2$ and $e'_w = 0$, so the only new form is $y u^2$ and $T_\rho(g'_c) = \{y = u = 0\}$. The element $\partial_x G' = (y + z) u^2$ has order $3$, but it is not in $\widetilde\Theta_0(G')$, because $x$ is no longer a component of the divisor. The proof of SG00000050 fails at one place. The Euler element is $2 G = 0$, and $v_x = v_w = 1$, so no exact transport has the initial form $G$. If $\tau$ is defined with $\widetilde\Theta(G)$ also in the first case, a random test finds many points where it goes down from the first case to the first case, also if $|r| + d$ is not $0$. So the pair $(\rho, -\tau_\rho)$ is not a resolution invariant in the first case, and route R1 needs a different secondary invariant. The Lean proof works over $\mathbb{F}_2$ with the polynomials written out. The data of the example are `tauRhoDropExample_hyp`, the two cases are `tauRhoDropExample_cases`, and the dimensions $2$ and $3$ of the two directrices are `tauRhoDropExample_finrank`. A second example has four variables. It is $g = x y z^2 w^2 + x^3 y w^2 + x^3 y^2 z^3 w$ with $\Delta = \{x, y, w\}$, where $\tau_\rho$ goes from $2$ to $1$ in the $y$-chart at the point with $t_x = t_z = 1$.

tag: SG0000009A
kind: example
title: 'Forms of degree 5 in three variables that no change of coordinates prepares'
statement: 'Let $k$ be an algebraically closed field of characteristic $5$ and $h = x^4 y + y^4 w + w^4 x \in k[x, y, w]$. Then the surface $\{z^5 + h = 0\} \subset \mathbb{P}^3$ contains no line, and the critical set of $h$ in $\mathbb{P}^2$ has $13$ points. So for each $g \in k[[x, y, w]]$ with form of degree $5$ equal to $h$, no automorphism of $k[[x, y, w, z]]$ and no unit make $z^5 + g$ Newton nondegenerate. The same holds for the five forms of the lab table of research note 55 for $p = 5$, $n = 3$, the weight $(1, 1, 1)$ and $D = 5$ that note 55 left undecided.'

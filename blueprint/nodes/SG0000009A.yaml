notes: 'This is Example 4.4 and Computation 4.5 of research note 68, which the referee report in note 70 reproduced with independent code. The absence of a line is an exact Groebner basis computation over $\mathbb{F}_5$ in a cover of the dual plane, with the criterion of Lemma 4.2 of note 68 (SG00000099). The size of $C$ is a lower bound from the distinct roots of an eliminant. Note 70 used a second cover of the dual plane and all three charts, and found the same result. The five forms are in the data file of note 55 (rows 2, 3, 4, 5 and 7 of `cert_p5n3.jsonl`). Before note 68 they were open for the changes $(\varphi, q)$, because the splitting field was too large for the search. Now each of them resists all changes of all coordinates. The certified row 6 is strengthened in the same way. Row 1 has a line on $Q$, so SG00000099 does not apply to it. The decision depends on exact computer computations. The result is not in Lean.'

tag: SG00000048
kind: theorem
title: Order reduction for ideals
statement: 'Let $n \ge 1$. Assume order reduction for marked ideals in dimension $n - 1$, in the functorial form: for each $m \ge 1$ and each smooth $(X, I, E)$ with $\dim X = n - 1$ and $I$ nonzero on each irreducible component, there is a blowup sequence of order at least $m$ for $(I, m)$ with $\operatorname{cosupp}(I_r, m) = \emptyset$. Then order reduction for ideals in dimension $n$ holds, in the functorial form: for each $m \ge 1$ and each $(X, I, E)$ with $X$ smooth of dimension $n$ over a field of characteristic 0 and maximal order of $I$ at most $m$, there is a blowup sequence of order $m$ for $(I, m)$ after which the maximal order is less than $m$.'
sources:

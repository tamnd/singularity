notes: This is Volume 2, Theorem 3.3.6 of the handbook, after [Kol07, Chapter 3], Section Order reduction for ideals. The proof uses maximal contact SG00000045 and the coefficient ideal SG00000047 when there is a global hypersurface of maximal contact (Theorem 3.3.5). The handbook cites from [Kol07] the tuning of the ideal, the étale form of the uniqueness of maximal contact, and the globalization. The functorial form means that the sequences come from rules that commute with smooth morphisms and with change of fields. No Lean statement yet.

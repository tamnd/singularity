notes: In Lean, resonance is Singularity.IsResonant, the weighted corollary is Singularity.eval_eq_zero_of_isCriticalPoint_of_isWeightedHomogeneous, and the statement for a face that is not resonant is Singularity.eval_eq_zero_of_isCriticalPoint_of_not_isResonant. For an integral weight with the value $D$ on a face, the condition holds with $w = D^{-1} \omega$ when $p \nmid D$. So the failures of nondegeneracy that are special to characteristic $p$ occur only on resonant faces. Examples are $x^2 y + x y^2$ for $p = 3$ and $wx + wy + xy$ for $p = 2$.

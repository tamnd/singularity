tag: SG0000003H
kind: theorem
title: A mod p Euler identity
statement: Let $K$ be a field of characteristic $p > 0$, let $h \in K[x_1, \dots, x_n]$ and let $w \in K^n$. If $\sum_i w_i a_i = 1$ in $K$ for each exponent $a$ of a monomial of $h$, then $h = \sum_i w_i x_i \partial_i h$. In particular, each torus critical point of $h$ lies on the zero set of $h$. A face of the Newton polyhedron is resonant if no $w \in \mathbb{F}_p^n$ satisfies this condition for its initial form.
sources:

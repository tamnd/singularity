tag: SG000000AA
kind: theorem
title: The quotient by an invariant foliation of the maximal torus is a simplicial toric variety
statement: 'Let $\mathbb{G}_m^n$ act diagonally on $\mathbb{A}^n$ in the coordinates $x_1, \dots, x_n$, and let $V \subseteq \mathbb{F}_p^n$ and $\mathcal{F}_V$ be as in SG000000A8. Then $\mathbb{A}^n / \mathcal{F}_V = \operatorname{Spec} k[x^m : m \in \mathbb{N}^n, \ \bar{m} \in V^\perp]$, where $\bar{m}$ is $m$ modulo $p$ and $V^\perp$ is the orthogonal of $V$ for the dot product. This is the affine toric variety of the orthant in the lattice $\{m \in \mathbb{Z}^n : \bar{m} \in V^\perp\}$ of index $p^r$, which is simplicial, so it has a toric resolution.'
sources:

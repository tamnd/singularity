notes: 'This is Corollary 3.6 of research note 58, with the scope of the referee report in note 73: the torus acts diagonally in the given coordinates. For an arbitrary embedding of $\mathbb{G}_m^n$ in $\operatorname{Aut} \mathbb{A}^n$ one needs a linearization theorem in characteristic $p$, and note 73 did not check its hypotheses. With SG000000A9 this answers Problem 4.10 of note 04 for the diagonal maximal torus in both readings: resolve the foliation, and resolve the quotient. Handbook Volume 9, Section 3.22. Not in Lean.'

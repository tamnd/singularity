notes: The proof uses the identity $(z + c)^{p^e m_0} = (z^{p^e} + c^{p^e})^{m_0}$ in place of the theorem of Lucas. The Tschirnhausen translation kills $a_1$ when $p \nmid m$. When $p \mid m$, no translation changes $a_1$, and when $a_1 = \dots = a_{p^e - 1} = 0$ the translations change $a_{p^e}$ only by $m_0 c^{p^e}$. This is one reason why the multiplicities divisible by $p$ are hard. In Lean the formula for $a_{p^e}'$ is Singularity.coeff_taylor_sub_pow, and the Frobenius identity is Singularity.X_add_C_pow_pow_mul.

notes: 'Lemma 85.5 of research note 85. Step 3 needs only that $V_2''$ is normal, projective and birational over $V_1$, so that it is the normalized blowup of a coherent ideal on $V_1$. Step 4 needs that the centers of the valuations of $L$ are regular, which is the hypothesis on $\psi$. The final model dominates $V_0$ through $V_2$. The weak form of SG000000BV in SG000000CC is enough. In the toric case, star subdivisions at regular cones keep each regular chart regular, so the hypothesis holds. The lemma gives a way to remove a bad curve of the fundamental locus that note 83 did not consider: modify both $V_2$ and $W_1$ along the curve (SG000000C9). The result is new in note 85, and a referee has not read it yet. Handbook Volume 9, Section 3.25. The result is not in Lean.'

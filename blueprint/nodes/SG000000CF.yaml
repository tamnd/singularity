tag: SG000000CF
kind: lemma
title: 'Freedom in the choice of V_2 in the patching proof'
statement: 'Let $(V_0, V_1, N)$ be as in SG000000BQ, and let $V_2$ be as in Step 2 of the proof of SG000000C1. Let $\psi \colon V_2'' \to V_2$ be projective and birational, with $V_2''$ normal, such that each $v \in N$ whose center on $V_1$ is singular has a regular center on $V_2''$. Run Steps 3 to 6 with $V_2''$ and $\alpha \circ \psi$ in place of $V_2$ and $\alpha$. If the condition (A$^{\rm w}$) of SG000000C6 holds for $V_2''$, for some choice of the principalization in Step 3, then the conclusion of SG000000BQ holds for $(V_0, V_1, N)$.'

tag: SG0000008M
kind: theorem
title: Each corner run in four variables of degree less than p is linear and satisfies Hypothesis H1 and Conjectures L and L-circle
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Assume $\deg_{x, w} g < p$. Then the run is linear (Definition 3.17.5), $\operatorname{in} G_m \in K[x_m, w_m]$ and $d = \rho + 1$ for $m$ large, and the conjectures SG0000006Z and SG00000075 hold for the run. If the run has an infinite number of nonzero translations, then the corner surfaces of SG00000071 also have $\nu^G \ge \rho$ for $m$ large.

notes: This is Corollary 3.18.18 of Volume 7 of the handbook (Section 3.18). It is Corollary 5.2 of note 54 of the research notes, with the fix 5 of note 63, so it is a statement for $\deg_{x, w} g < p$ only. For $\deg_{x, w} g = 0$ there is no run by SG0000006M, and for $\deg_{x, w} g \ge 1$ the run is not planar by SG0000008K, so SG0000008A and SG00000089 apply. It proves SG0000007D, so SG0000007E holds without its hypothesis. For $\deg_{x, w} g \ge p$, Hypothesis H1 and the conjectures SG0000006Z and SG00000075 stay open. The result is not in Lean.

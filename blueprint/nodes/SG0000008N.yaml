notes: This is Theorem 3.18.19 of Volume 7 of the handbook (Section 3.18). It is Theorem 7.1 of note 54 of the research notes, with the fix 1 of note 63 in the proof of (3). So a run is planar in one free coordinate system if and only if it is planar in all of them, and SG0000006Z fails for a run if and only if the run is planar. SG0000006P is the case of a linear free coordinate. The proof writes the hypersurface as $x = F(w, y, z)$ and compares $F(\psi_\infty, y, z)$ with $\varphi_\infty$ below the limit of $v(M_m)$. The result is not in Lean.

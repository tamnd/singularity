notes: 'Proposition 7.2 of research note 56 in the corrected form of note 62, Section 4.3. With $z'' = z + B$ and $B = x^r + x^{p-r}$, one has $f = z''^2 - u x^p$ with $u = 2 + x^{p-2r}$ a unit and a square. The failure is a failure of the definition of maximal contact by an element of order 1 of $\Delta^{e-1}$, not of maximal contact in the classical sense. The standard renormalization of $p$-th powers removes it, and the frameworks of Kawanoue-Matsuki [KM10] and Benito-Villamayor [BenV13] treat it. It is not a genuine failure as in SG00000018. The degree is not invariant under a change of coordinates: after $z'' = z + B$ it is $2p - 2r > p$. So the example answers Problem 9.9 of research note 09 only in its literal form. Handbook Volume 9, Section 3.21. Planned for Lean.'

tag: SG00000088
kind: example
title: A disguised z^2 - x^p where the Hasse derivative test fails one level down
statement: Let $k$ be a field of characteristic $p \ge 5$, let $1 \le r \le (p-1)/2$, and let $f = z^2 + 2z(x^r + x^{p-r}) + x^{2r} \in k[[x, y, w, v, z]]$. Then $f$ has order 2 and degree $\max(2r, p - r + 1)$, and $f$ is a unit times $z''^2 - x^p$ for a regular parameter $z''$. For each hypersurface $H$ whose equation is an element of order 1 of $\Delta^1(f)$, the coefficient ideal of Kollár on $H$ is $C = (x^p)$. So $\Delta^{p-1}(C) = C$ has no element of order 1, also after an extension of $k$ and formally. The hypersurface $V(x) \subset H$ has maximal contact with $(C, p)$ in the sense of Hironaka, and the marked ideal $(C, p)$ is equivalent to $(x, 1)$.

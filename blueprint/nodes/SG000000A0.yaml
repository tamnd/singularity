tag: SG000000A0
kind: theorem
title: Each invariant that dominates the top Hasse-Schmidt residual order goes up infinitely often on the Hauser-Perlega sequences
statement: 'Let $p$, $n$ and $\mathcal G_{3,n}$ be as in SG0000009Z, and $P = p^2$. Let $\iota$ be an invariant on $\mathcal G_{3,n}$ with $\rho_P \le F_0(\iota)$ for a monotone function $F_0 : \Lambda \to \mathbb N$, where $\rho_P$ is the residual order of SG0000009V at the level $m = P$. Then along each sequence of point blowups of SG00000017, $\iota$ goes up at infinitely many steps. This holds for $\iota = \rho_P$ and for $\iota = \rho_m$ with $P \le m < q$.'

tag: SG0000006A
kind: lemma
title: The Kaplansky inequality for power series along the translations of a corner run
statement: Let $n = 3$, and let $P_N, P_{N+1}, \dots$ be a corner run with free translations, with the notation of Section 3.15 of Volume 7 of the handbook. Assume that an infinite number of the $t_j$ are not $0$. Let $G(Y) = C + \sum_{k \ge 1} b_k Y^k$ be a power series that is not constant, with $C \in H$ and $b_k \in K[[y_N, z_N]]$, and put $\Phi_m = \varphi_m^p$. Then $\beta^G_i = \lim v(G^{[i]}(\Phi_m))$ exists and is finite if $G^{[i]} \ne 0$. Put $\lambda_G(\gamma) = \min_{i \ge 1}(\beta^G_i + p i \gamma)$. Then $\lambda_G$ is strictly increasing, the minimum is at a unique $i$ for $\gamma < 1 + \theta$ near $1 + \theta$, $\beta^G_0 < \lambda_G(v(M_m)) \le v(G^{[i]}(\Phi_m)) + p i \, v(M_m)$ for each $i \ge 1$ and $m$ large, and $G(\varphi_\infty^p)$ has the value $\beta^G_0$ and the same leading term as $G(\Phi_m)$ for $m$ large.

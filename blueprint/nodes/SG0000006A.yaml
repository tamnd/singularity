notes: 'This is Lemma 3.16.3 of Volume 7 of the handbook, with Lemma 3.16.2. Lemma 3.16.2 gives the constant values: after a change of the variable, $f(\pi S)$ is in the Tate algebra $\hat H\langle S\rangle$, the Weierstrass preparation theorem [Bosch, Güntzer, Remmert, Non-Archimedean Analysis, Section 5.2.2, Theorem 1] writes it as a constant times a polynomial times a unit, and Proposition 3.15.7 (SG00000062) applies to the polynomial. The sums in the Hahn field are summable by the lemma of Neumann. The proof is Lemmas 1 and 2 of note 34 of the research notes, with the fixes of note 35. The result is not in Lean.'

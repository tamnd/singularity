tag: SG0000004P
kind: theorem
title: The transformation law of the log-Jacobian ideal under a blowup in a regular center
statement: Let $K$ be an algebraically closed field of characteristic $p > 0$, let $C = V(x_1, \dots, x_c)$ with $2 \le c \le n$, let $g \in (x_1, \dots, x_c)^p$, and let $\pi$ be the $x_1$-chart of the blowup of $C$ with the translations $t_2, \dots, t_c$. Put $g' = x_1^{-p} \pi(g)$ and $\Delta' = \{1\} \cup \{i \in \Delta \mid i \ne 1, \ i > c \text{ or } t_i = 0\}$. Then, in $K[[x]]$, the log-Jacobian ideal of $g'$ for $\Delta'$ is $x_1^{-p} \pi(\Theta_C(g))$, where $\Theta_C(g)$ is the image of $g$ under the log derivations that map $(x_1, \dots, x_c)$ into itself. Also, if $h \in (x_1, \dots, x_c)^s$ and $\operatorname{ord}_0 h = s$, then $x_1^{-s} \pi(h)$ has order at most $s$ at the origin.

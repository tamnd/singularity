tag: SG000000AT
kind: theorem
title: 'Rank 2 with a finitely generated residue field of the coarsening: the Knaf-Kuhlmann case'
statement: 'Let $\nu$ be as in SG000000AS with rank 2, so $\nu = v_1 \circ \bar v$ with $v_1$ discrete of rank 1 and $\bar v$ discrete of rank 1 on $\kappa = F v_1$, and let $d = \mathrm{trdeg}(\kappa/k) \in \{1, 2, 3\}$. Assume that $\kappa$ is finitely generated over $k$ (this holds if $d = 3$). Then there is a subfield $F_1 = k(z_1, \dots, z_d, \theta_0)$ of $F$ such that $v_1|_{F_1}$ is Abhyankar with value group $\mathbb{Z}$ and residue field $\kappa$, and $F$ lies in the $v_1$-completion of $F_1$. Hence (a) $v_1$ has local uniformization in the strong form, for each finite subset of $\mathcal{O}_{v_1}$. (b) If $d = 1$, then $\nu|_{F_1}$ is Abhyankar, $\nu$ is of KK type and $\nu$ has local uniformization in the strong form.'

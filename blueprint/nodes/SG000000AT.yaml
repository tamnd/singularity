notes: 'This is Proposition 2.1(a), (b) of research note 76 with Fix 1 of the referee report in note 80: the hypothesis that $\kappa$ is finitely generated is needed, and SG000000AX shows that (b) is false without it. The proof takes $\bar z$ a separating transcendence basis of $\kappa/k$ and $\bar\theta$ a primitive element, puts $t = \bar g(z, \theta_0)$ for the minimal polynomial $\bar g$, and arranges $v_1(t) = 1$ by a Taylor shift of $\theta_0$. Successive approximation in $t$ gives the density. For (b), the topology of $\nu$ is the topology of $v_1$. Handbook Volume 9, Section 3.23. The result is not in Lean.'

notes: This is Theorem 3.17.33 of Volume 7 of the handbook (Section 3.17). It was proved under the hypothesis SG0000007D. This hypothesis is now proved by SG0000008M, so the theorem holds without it, for $\deg_{x, w} g < p$. It answers the questions L' and H of note 38 in this class. The conjecture SG00000075 also holds in case 2, by SG0000008A. It is Theorem 4.3 of note 40 of the research notes, with the remark of note 42 that the hypothesis holds in case 1, and the removal of the hypothesis is Corollary 5.2 of note 54 with the fix 5 of note 63. The result is not in Lean.

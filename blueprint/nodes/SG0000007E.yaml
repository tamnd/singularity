tag: SG0000007E
kind: theorem
title: Each corner run in four variables of degree less than p is linear
statement: Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Assume $\deg_{x, w} g < p$, and let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Then one of the following holds. (1) The run is an origin run from some point on. Then SG0000006Z and SG00000075 hold for it, by Theorem 3.14.7. (2) There are a linear form $\ell$ and an $m_1$ with $\operatorname{in} G_m = c_m \ell(x_m, w_m)^d$ and $\ell(a_m, b_m) = 0$ for each $m \ge m_1$. Then the run lies on the strict transforms of $V(\ell(x_{m_1}, w_{m_1}))$, so SG0000006Z holds. In both cases the run is linear, so no planar run exists in this class.

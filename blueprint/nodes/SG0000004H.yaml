notes: De Jong takes these facts from [DM69] and [Knu83] in [dJ96, 2.24], with $\overline{M}$ the normalization of $\overline{\mathcal{M}}_{g,n}[1/\ell]$ in the function field of $M$. They follow from SG0000004G and the theory of the Jacobian. Volume 8 of the handbook uses them as the named Hypothesis 2.2.4, because the proofs are outside the handbook. Part (1) holds because $\operatorname{Pic}^0_{C/T}[\ell]$ is finite étale of rank $\ell^{2g}$ over $T$. No Lean statement yet.

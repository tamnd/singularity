tag: SG0000004H
kind: theorem
title: The level-ℓ moduli of stable pointed curves
statement: Let $g \ge 0$, $n \ge 3$, and let $\ell \ge 3$ be a prime. (1) For each smooth proper $n$-pointed curve $C \to T$ with geometrically connected fibres of genus $g$ over a $\mathbb{Z}[1/\ell]$-scheme $T$, the functor of level-$\ell$ structures on $C/T$ is represented by a $T$-scheme that is finite, étale and surjective over $T$. (2) There are a scheme $M$ over $\mathbb{Z}[1/\ell]$ and a smooth proper $n$-pointed curve of genus $g$ over $M$ with a level-$\ell$ structure that is a universal object. For each $T$ as in (1), each smooth proper $n$-pointed curve of genus $g$ over $T$ with a level-$\ell$ structure is the pullback of the universal object by a unique morphism $T \to M$, and the isomorphism of the pullback with the curve is unique. (3) There are a projective scheme $\overline{M}$ over $\mathbb{Z}[1/\ell]$, an open immersion $M \to \overline{M}$, and a stable $n$-pointed curve of genus $g$ over $\overline{M}$ whose restriction to $M$ is the universal curve.

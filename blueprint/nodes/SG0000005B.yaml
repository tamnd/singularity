lean:
  statement: Singularity.logJacobianDirectrixCodim_le_fullDirectrixCodim_of_reflTransGen
  proof: Singularity.logJacobianDirectrixCodim_le_fullDirectrixCodim_of_reflTransGen
tier: T2

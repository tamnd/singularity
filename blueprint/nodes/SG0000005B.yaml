notes: The proof of SG0000004Z uses only two hypotheses, that $\rho$ stays and that the new point is in the second case. It does not use the case of the old point, and it does not use the hypothesis that no component leaves. So it applies at each step into a point of the second case, and an induction gives the first inequalities. At the last step, the same transport lands in $\widetilde\Theta(G')$, and this gives $\tau_\rho(P_{m-1}) \le \widetilde\tau(P_m)$. The Lean proof is for polynomials. A step is `Singularity.RhoStep`, a point of the second case is `Singularity.IsLogJacobianCaseB`, and the run is the reflexive and transitive closure of the relation. The form without the last step is `logJacobianDirectrixCodim_le_of_reflTransGen`.

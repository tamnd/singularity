notes: 'This is Problem 6.4 of research note 58, with the corrections of the referee report in note 73: the coprimality is $\gcd(\alpha, b_1, b_2, b_3) = 1$, and $\alpha$ is defined only up to $\delta(g)/g$ for units $g$ (SG000000AM). For the $\mathbb{G}_m$ case of SG000000AF a solution must also be $\mu_{w_i}$-equivariant and glue across the charts. The case $\alpha = 0$ is SG000000AH. For $H = 0$, SG000000AM, SG000000AN and SG000000AP classify $\alpha$, untwist off an invariant divisor and untwist by one weighted blowup under a second torus symmetry. Open: the case $H = 0$ at the points of $Z(\delta) \cap V(s)$ when $\delta$ has no second torus symmetry, and the case $H \ne 0$. It is not known whether the statement is true. Handbook Volume 9, Section 3.22.'

tag: SG000000AJ
kind: conjecture
title: 'Problem 6.4: the twisted pair problem'
statement: Let $Y$ be a regular threefold over an algebraically closed field of characteristic $p$, let $\delta = \sum_j b_j \partial_{v_j}$ generate a rank one $p$-closed foliation with $\delta^p = H \delta$, and let $\alpha \in \mathcal{O}_Y$ with $\alpha^p + \delta^{p-1}(\alpha) = H \alpha$ and $\gcd(\alpha, b_1, b_2, b_3) = 1$. Then there are proper birational modifications of $Y$, together with weighted blowups of $Y \times \mathbb{A}^1_u$ along centers over $\{u = 0\}$, from a regular tame Deligne-Mumford stack (a regular variety if $p = 2$), that make the pullback of $\alpha u \partial_u + \delta$ regular.

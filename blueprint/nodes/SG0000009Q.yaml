tag: SG0000009Q
kind: theorem
title: 'No invariant of the form omega minus a constant times the low flag is monotone under Rule 61.9'''
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. Let $p = 3$ and $c \in \mathbb{R}$. Let $\lambda = 1$ at a low point and $\lambda = 0$ otherwise, and let $\lambda_{R1} = 1$ at a low point of R1 and $\lambda_{R1} = 0$ otherwise. Then neither $\omega - c \lambda$ nor $\omega - c \lambda_{R1}$ is non-increasing along the steps of Rule 61.9''.'

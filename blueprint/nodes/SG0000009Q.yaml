notes: 'This is Proposition 66.5 of research note 66, which the referee report in note 72 confirmed. SG0000009M forces $c \ge \frac13$: there $\omega$ goes from $1$ to $\frac43$ and the flag goes from $0$ to $1$. SG0000009P forces $c \le 0$ for $\lambda_{R1}$. For $\lambda$, a second germ with $E = \{1, 2\}$, $a_3 = 2 x_0 x_1^2 x_2^3 + x_0^2 x_2^2$ and $a_6 = x_0^2 x_1^4 x_2^6 + x_0^3 x_1^2 x_2^5 + 2 x_0^3 x_1^5 x_2^2 + x_0^4 x_2^4$ has a low point with $\omega = 1$ over which the rule gives a point that is not low with $\omega = \frac56$, which forces $c \le \frac16$. Only points of R1 are used, where the flag is intrinsic by SG0000009N. The second germ uses particular base coordinates, which the strong form of Conjecture 65.2 (SG0000009T) allows. A replacement of $\omega$ must carry a second number. Handbook Volume 7, Proposition 4.4.12. The result is not in Lean.'

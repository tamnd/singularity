notes: 'This is Lemma 3.19.1 of Volume 7 of the handbook (Section 3.19). It is Lemma 2.1 of note 69 of the research notes, refereed in note 71, which checked part 3 by the matrices of the steps and found it correct, and in note 74. The degree in part 1 is from note 74: the part of top degree $D$ of the substitution is $M_m^D$ times that of $g$, and the cleaning does not remove it, since a coefficient of $x^k w^l$ with $p \mid k$ and $p \mid l$ has only terms of nonzero class and $M_m^D$ is then a $p$-th power. For part 3 the cones of the matrices of the steps from $P_m$ shrink to one ray, as in the proof of SG0000005R, and the positivity on all later $y_j, z_j$ fixes the linear form up to a positive factor. The number $\theta^{(m)}$ is irrational, since the matrices are unimodular. The result is not in Lean.'

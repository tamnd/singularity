tag: SG0000009F
kind: lemma
title: A corner run in four variables starts again at each of its points, with the valuation scaled by the value of y at that point
statement: 'Let $n = 4$ with the coordinates $(x, w, y, z)$ and $\Delta = V(y) \cup V(z)$, and let $g \in K[[y, z]][x, w]$ be clean at $P_N$. Let $P_N, P_{N+1}, \dots$ be a corner run in four variables (each step is the $y$-chart or the $z$-chart followed by a translation $(a_m, b_m) \in K^2$ of $(x, w)$, each chart occurs an infinite number of times, and $\rho \ge 1$ is the same at each point). Put $M_N = 1$, $M_{m+1} = M_m L_m$ with $L_m$ the chart variable, $\varphi_m = \sum_{N \le j < m} a_j M_{j+1}$, $\psi_m = \sum_{N \le j < m} b_j M_{j+1}$, $\Phi_m = (\varphi_m, \psi_m)$, and let $\Phi_\infty$ be the limit in the Hahn field $\mathbb{K}$ of Lemma 3.15.6, with the valuation $v(y_N^a z_N^b) = a + \theta b$, $\theta$ irrational. Put $\delta_m = v(y_m z_m)$ and $\Delta_m = \Phi_\infty - \Phi_m = (\Delta\varphi_m, \Delta\psi_m)$. For $m \ge N$ let $g^{(m)} = M_m^{-p} \operatorname{cl} g(\varphi_m + M_m x_m, \psi_m + M_m w_m)$ be the function of $P_m$ (Lemma 3.17.1), where $\operatorname{cl}$ removes the monomials $x_m^k w_m^l y_m^a z_m^b$ with all four exponents divisible by $p$. The run is planar if there is no $(\alpha, \beta) \ne (0, 0)$ in $K^2$ with $\alpha a_j + \beta b_j = 0$ for $j$ large, and linear otherwise (Definition 3.17.5). Then for each $m \ge N$: (1) $g^{(m)}$ is clean in $K[[y_m, z_m]][x_m, w_m]$ and $\deg_{x_m, w_m} g^{(m)} = \deg_{x, w} g$; (2) $P_m, P_{m+1}, \dots$ is a corner run in four variables of $g^{(m)}$ with the same charts and translations, the monomials $M_j / M_m$, the sums $(\Phi_n - \Phi_m) / M_m$ and the limit $\Phi^{(m)}_\infty = \Delta_m / M_m$, and it is planar if and only if the run from $P_N$ is planar; (3) the valuation of the run from $P_m$, normalized by the value $1$ on $y_m$, is $v / v(y_m)$ on the Laurent monomials, its irrational number is $\theta^{(m)} = v(z_m) / v(y_m)$, and $v(y_m) (1 + \theta^{(m)}) = \delta_m$. So each statement on a corner run that is homogeneous of degree $1$ in the valuation holds for the run from $P_m$ in the units of $v$, with $g^{(m)}$, $\Phi^{(m)}_\infty$ and $\delta_m$ in place of $g$, $\Phi_\infty$ and $1 + \theta$.'

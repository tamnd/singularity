notes: 'This is Theorem 5.1 of research note 68, with the scope that the referee report in note 70 corrected, and Proposition 5.2 of note 68 (Proposition 3.1 of note 70) for the terms of higher order. $F_1$ is Example 5.5 of research note 05 and note 55, and $F_2$ is Counterexample 5.4a of note 55 (SG0000008T). The first part uses a structure result (Corollary 2.2 of note 68): if an irreducible germ of order at least $2$ in three variables becomes Newton nondegenerate after a change of coordinates and a unit, then its singular locus is the image of at most three coordinate axes, so its branches are smooth with independent tangent lines. The singular locus of $F_1$ has a cusp $(t^2, t^3, t^4)$, and that of $F_2$ has two branches with the same tangent line. The first part is only for $F_1$ and $F_2$ without terms of higher order. The second part covers terms of higher order, but not all changes. The case of terms of higher order and changes whose linear part does not respect the weight order is open. The result is not in Lean.'

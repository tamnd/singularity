tag: SG0000009B
kind: theorem
title: 'Two weighted forms in characteristic 3 that no change of coordinates prepares'
statement: 'Let $k$ be an algebraically closed field of characteristic $3$, and let $F_1 = z^3 + x^3 y^2 + y^4$ and $F_2 = z^3 + x^4 y^4 + x^2 y^5$. Then for each automorphism $\Psi$ of $k[[x, y, z]]$ and each unit $u$, the series $u \cdot (F_1 \circ \Psi)$ and $u \cdot (F_2 \circ \Psi)$ are Newton degenerate. Let $W = (2, 3, 4)$ for $F_1$ and $W = (1, 2, 4)$ for $F_2$, and add to $F_1$ or $F_2$ any series of $W$-weight greater than $12$. Then the same holds for each automorphism $\Psi$ whose linear part sends each variable into the span of the variables of weight at least its own.'

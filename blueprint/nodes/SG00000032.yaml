tag: SG00000032
kind: theorem
title: The Hilbert-Samuel polynomial
statement: Let $R$ be a Noetherian ring, let $I$ be an ideal with $r$ generators and let $M$ be a finite $R$-module such that $M/IM$ has finite length. Then there is a polynomial $P \in \mathbb{Q}[X]$ of degree at most $r$ such that $\ell(M/I^n M) = P(n)$ for large $n$.

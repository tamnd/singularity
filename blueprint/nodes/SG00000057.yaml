tag: SG00000057
kind: theorem
title: The full codimension of the directrix does not go down from the second case
statement: In the setting of SG0000004Z, let $\widetilde H(g)$ be the set of the elements of $\widetilde\Theta(G)$ of order $\rho$, in both cases. Let $\widetilde T(g)$ be the intersection of the subspaces $T(\operatorname{in}(h))$ for $h \in \widetilde H(g)$, and let $\widetilde\tau(g) = n - \dim \widetilde T(g)$. Assume that $\rho(g'_c) = \rho(g)$ and that the old point is in the second case. Then $\widetilde\tau(g'_c) \ge \widetilde\tau(g) = \tau_\rho(g)$. There is no hypothesis on the case of the new point.
sources:
- paper: Hir67
uses:

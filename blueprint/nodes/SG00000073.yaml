notes: This is Example 3.17.22 of Volume 7 of the handbook (Section 3.17). For $X$ with linear part not proportional to $x$, SG00000070 gives $\nu^G \le 1$. For $X$ with linear part proportional to $x$, part 1 of SG00000070 with $D = \partial_w$ and $D G = 3 y z w^2$ gives $\nu^G \le 2$. So the condition of SG00000074 is not sufficient. It is Example 3.1 of note 42 of the research notes, the referee report on note 40. The result is not in Lean.

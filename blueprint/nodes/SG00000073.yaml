tag: SG00000073
kind: counterexample
title: A corner run with a power of a line as initial form and no corner surface of order at least rho
statement: Let $p \ge 5$, $n = 4$, $\Delta = V(y) \cup V(z)$ and $g = y^{p-4} z^{p-4} (x^4 + y z w^3)$. Then $G = x^4 + y z w^3$, $d = 4$ and $\rho = 3$. Both charts at the origin send $g$ to $g$, so each word in the two charts with each chart an infinite number of times is a corner run in four variables. Each corner surface $V(X, y)$ or $V(X, z)$ through the run has $\nu^G \le 2 < \rho$, although $\operatorname{in} G = x^4$. The corner curves $V(x, w, y)$ and $V(x, w, z)$ have $\nu^G = 4 \ge \rho$.
sources:
- paper: CJS20

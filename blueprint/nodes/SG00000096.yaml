notes: This is Conjecture 3.18.39 of Volume 7 of the handbook (Section 3.18). It is Conjecture P of note 64 of the research notes, with the open statement 1 of note 67. By SG0000008N it is equivalent to SG0000006Z for all clean $g \in K[[y, z]][x, w]$. It holds for $\deg_{x, w} g < p$ (SG0000008K), under the condition (C) and so for $\deg_{x, w} g = p$ (SG00000092), and for $g \in K[[y, z]][x^p, w^p]$ (SG00000094). The open case is $\deg_{x, w} g > p$ with (C) false and $g \notin K[[y, z]][x^p, w^p]$. There a planar run must have $\Lambda_0 \ge \Lambda_+$, a least term of class $0$ for each $e \ge 1$ with $\Lambda_e = \Lambda$, and $v(\operatorname{cl} g(\Phi_\infty)) \ge \Lambda$. The first open case is $p = 2$, $\deg_{x, w} g = 3$ and $g = Y x^2 w + Y' x w^2 + B_1 x^2 + B_2 w^2 + \alpha x + \beta w + B_0$. It is not known if the statement is true. The evidence is numerical only. The depth first searches of note 64 over six finite fields and the random dives with controls of note 67 over $\mathbb{F}_2$, $\mathbb{F}_4$ and $\mathbb{F}_3$, also in classes outside (C) and outside $K[[y, z]][x^p, w^p]$, found no planar run that keeps $\rho$, while the controls found many. The dives are finite and the fields are finite, so this is not a proof.

tag: SG0000005A
kind: theorem
title: The residual order and the codimension of the directrix do not get worse if no component of the divisor leaves
statement: In the setting of SG0000004Z, assume that $\rho(g'_c) = \rho(g)$ and that no component of $\Delta$ leaves. Let $d$ and $d'$ be the residual orders of $g$ and $g'_c$. Then $d' \le d$. If $d' = d$, then $\tau_\rho(g'_c) \ge \tau_\rho(g)$. So the triple $(\rho, d, \tau_\rho)$, ordered by a smaller $\rho$, then a smaller $d$, then a larger $\tau_\rho$, does not get worse at such a step.

tag: SG000000CB
kind: theorem
title: 'Thirty-six more regular cones are not reachable with regular centers'
statement: 'Let $F$ be a field and $R = F[x,y,z]_{(x,y,z)}$. For each of the 36 regular cones $\sigma$ in the six classes, up to permutation of the coordinates, of $\langle (0,1,3), (1,2,2), (3,4,1) \rangle$, $\langle (0,1,3), (2,3,2), (3,4,1) \rangle$, $\langle (0,1,4), (1,2,2), (2,3,1) \rangle$, $\langle (0,1,4), (1,2,3), (2,3,1) \rangle$, $\langle (1,3,3), (2,2,3), (4,1,4) \rangle$ and $\langle (1,3,3), (3,2,4), (4,1,4) \rangle$, the ring $S_\sigma$ of SG000000C8 is not an iterated monoidal transform of $R$ for any regular centers.'
sources:
- paper: Ful93
uses:

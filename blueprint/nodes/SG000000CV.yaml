notes: 'This is Theorem 86.9 of research note 86, with Lemma 86.8. By SG000000CT a generic step that keeps $\omega$ has the bottom face $\{\omega e_l\}$, which the map $T_N$ fixes, so the bottom face still never shrinks. If the bottom face is not an axis vertex, there is no generic step that keeps $\omega$. In the stage $\omega_2 > 0$ of the proof of SG000000BE a generic step sends the projected polyhedron to an orthant, so it ends the stage. In the orthant regime the generic moves are $N_k$, the point blowup in the chart of $x_k$ at the point with $\lambda$ nonzero at the other index $\bar k$. They need $h > 2$ and no candidate curve, and they send $c_k$ to $h - 1$, $c_{\bar k}$ to $0$ and $\mu_k$ to $\sigma + \beta - 1$ modulo $1$, and make $\bar k$ free. With $\varepsilon = 1 - \beta$, a state is low if $\mu_a, \mu_c < \varepsilon$. From a low state the run ends within $B = \operatorname{lcm}(1, \dots, 2p)$ steps, since $\sigma = \mu_a + \mu_c$ drops by at least $\frac1B$. Outside low states, the moves $C$ and $P$ do not raise $H = \max(c_a, c_c)$, the moves $N$ lower it, and $H$ stays constant only for finitely many steps. The lab of note 86 followed all $81$ cut nodes of note 72 in this model ($2721$ nodes, $1114$ steps that keep $\omega$, $706$ distinct states, no violation), and enumerated the reduced orthant system with the moves $C$, $P$ and $N$ on three grids ($192141$, $1117190$ and $421740$ states) with no cycle and no failure of the steps of the proof. The result is new in research note 86, the referee report on note 81, and a referee has not read it yet. Handbook Volume 7, Theorem 4.5.28. The result is not in Lean.'

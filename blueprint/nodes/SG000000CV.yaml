tag: SG000000CV
kind: theorem
title: 'The extended model of Rule 61.9'' with the generic steps terminates'
statement: 'Let $p$ be an odd prime, $k$ a perfect field of characteristic $p$, $R = k[[x_0, x_1, x_2]]$ and $f = z^{2p} + a_1 z^{2p-1} + \dots + a_{2p}$ with $a_i \in R$ and $\operatorname{ord} a_i \ge i$, with a boundary $E \subseteq \{0, 1, 2\}$. For a weight $w$ let $\delta(w) = \sup_z \min_i v_w(a_i)/i$ be the slope of Hironaka, and put $\delta = \delta(1, 1, 1)$, $\mu_k = \delta(e_k)$ and $\omega = \delta - \sum_{k \in E} \mu_k$, the residual slope of research note 61. The extended model acts on the pairs $(U, E)$ of SG000000CR, for each boundary $E$. Its moves are the divisorial steps, the steps at chart origins of SG000000CR, and, at each point with $K \ne \emptyset$ in each chart of the centre of the rule, the generic step of SG000000CS, which replaces $U$ by $\pi(U)$ and $E$ by $\{j\} \cup (E \setminus K)$. In the extended model $\omega$ never increases, and each run with $\omega$ constant is finite. So each branch of the extended model is finite: it reaches $\omega = 0$, after which SG0000009R applies, or a state with no move to a point of multiplicity $2p$.'

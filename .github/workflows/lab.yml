name: lab

# Run the tests of the lab simulator in lab/sim. The job runs on each push and pull request that changes the lab.
on:
  push:
    branches: [main]
    paths: ["lab/sim/**", ".github/workflows/lab.yml"]
  pull_request:
    paths: ["lab/sim/**", ".github/workflows/lab.yml"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tests
        working-directory: lab/sim
        run: python3 -m unittest discover -s tests -t . -v
